/* Layout: uma coluna de celular; no topo, o cronograma do ano (12 marcos, um por mês) e os medidores; embaixo, uma cena por vez. Identidade: credencial de staff de evento, violeta com fita amarela. */
:root{
  --papel:#EFEDF4; --cartao:#FBFAFE; --tinta:#1B1822; --tinta2:#585369; --linha:#CFCBDC;
  --placa:#4B2A8F; --sobre-placa:#FFFFFF; --marca:#F2C230; --sobre-marca:#1B1822;
  --bom:#2B7647; --ruim:#B3261E; --trilho:#DAD6E6;
  --f-tit:"Overpass","Arial Narrow",system-ui,sans-serif;
  --f-txt:"Source Sans 3",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-mono:"Overpass Mono",ui-monospace,"SFMono-Regular",Menlo,monospace;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --papel:#14111C; --cartao:#1E1A29; --tinta:#EEEAF6; --tinta2:#A9A3BC; --linha:#38324A;
  --placa:#B79BFF; --sobre-placa:#14111C; --marca:#F2C230; --sobre-marca:#1B1822;
  --bom:#6CD198; --ruim:#FF8A80; --trilho:#2A2539; color-scheme:dark } }
:root[data-theme="dark"]{
  --papel:#14111C; --cartao:#1E1A29; --tinta:#EEEAF6; --tinta2:#A9A3BC; --linha:#38324A;
  --placa:#B79BFF; --sobre-placa:#14111C; --marca:#F2C230; --sobre-marca:#1B1822;
  --bom:#6CD198; --ruim:#FF8A80; --trilho:#2A2539; color-scheme:dark }

*{box-sizing:border-box}
body{background:var(--papel);color:var(--tinta);font-family:var(--f-txt);font-size:17px;line-height:1.5;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0 40px}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--papel)}
.col{max-width:520px;margin:0 auto;display:flex;flex-direction:column;gap:16px}
h1,h2,h3{font-family:var(--f-tit);text-wrap:balance;margin:0;line-height:1.02;letter-spacing:-.015em}
p{margin:0}
button{font:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:3px solid var(--marca);outline-offset:2px}
.rot{font-family:var(--f-mono);font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--tinta2)}

/* ---------- estrada do ano (HUD) ---------- */
.hud{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--papel);padding-block:10px 8px;
  display:flex;flex-direction:column;gap:8px;border-bottom:1px solid var(--linha)}
.ponto{display:grid;grid-template-columns:repeat(12,1fr);position:relative}
.ponto::before{content:"";position:absolute;left:4%;right:4%;top:7px;height:3px;background:repeating-linear-gradient(90deg,var(--linha) 0 6px,transparent 6px 10px)}
.furo{position:relative;display:flex;flex-direction:column;align-items:center;gap:3px;font-family:var(--f-mono);font-size:10px;color:var(--tinta2)}
.furo i{width:13px;height:13px;border-radius:50%;border:2px solid var(--linha);background:var(--papel);display:block}
.furo.foi i{background:var(--placa);border-color:var(--placa)}
.furo.agora i{background:var(--marca);border-color:var(--tinta);transform:scale(1.15)}
.furo.agora{color:var(--tinta);font-weight:600}
.medidores{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
.med{display:flex;flex-direction:column;gap:3px;min-width:0}
.med b{font-family:var(--f-mono);font-weight:500;font-size:10px;letter-spacing:.03em;text-transform:uppercase;color:var(--tinta2);display:flex;justify-content:space-between;gap:4px}
.med b span{color:var(--tinta);font-variant-numeric:tabular-nums}
.barra{height:6px;background:var(--trilho);border-radius:1px;overflow:hidden}
.barra u{display:block;height:100%;background:var(--placa);transition:width .5s ease}
.med.baixo .barra u{background:var(--ruim)}
.med.baixo b span{color:var(--ruim)}
.grana{display:flex;flex-wrap:wrap;gap:4px 14px;align-items:baseline;font-family:var(--f-mono);font-size:12px;color:var(--tinta2);font-variant-numeric:tabular-nums}
.grana strong{color:var(--tinta);font-weight:600}
.grana .deve strong{color:var(--ruim)}
.grana button{margin-left:auto;background:none;border:0;padding:2px 0;font-family:var(--f-mono);font-size:11px;color:var(--tinta2);text-decoration:underline;text-underline-offset:3px}

/* ---------- cena ---------- */
.cena{display:flex;flex-direction:column;gap:14px;padding-top:6px;animation:entra .28s ease both}
@keyframes entra{from{opacity:.4;transform:translateY(6px)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion:reduce){.cena{animation:none}.barra u{transition:none}}
.cena h2{font-size:clamp(28px,8vw,36px);font-weight:900}
.cena .texto{display:flex;flex-direction:column;gap:10px;max-width:60ch}
.ops{display:flex;flex-direction:column;gap:8px;margin-top:4px}
.op{display:grid;grid-template-columns:auto 1fr;gap:12px;align-items:start;text-align:left;width:100%;
  background:var(--cartao);border:1.5px solid var(--linha);border-radius:6px;padding:13px 14px;font-weight:500;line-height:1.35}
.op kbd{font-family:var(--f-mono);font-size:12px;font-weight:600;color:var(--placa);padding-top:2px}
.op small{display:block;font-weight:400;font-size:14px;color:var(--tinta2);margin-top:2px}
a.op{color:inherit;text-decoration:none}
.op:hover{border-color:var(--placa)}
.op:active{transform:translateY(1px)}
.op.ir{background:var(--placa);border-color:var(--placa);color:var(--sobre-placa);font-weight:600;grid-template-columns:1fr;text-align:center}
.fichas{display:flex;flex-wrap:wrap;gap:6px}
.ficha{font-family:var(--f-mono);font-size:12px;padding:3px 8px;border:1px solid var(--linha);border-radius:3px;font-variant-numeric:tabular-nums}
.ficha.mais{color:var(--bom);border-color:currentColor}
.ficha.menos{color:var(--ruim);border-color:currentColor}
.lei{border-top:1px dashed var(--linha);padding-top:12px;display:flex;flex-direction:column;gap:6px;font-size:15.5px}
.lei em{font-style:normal;align-self:flex-start;background:var(--marca);color:var(--sobre-marca);font-family:var(--f-mono);font-size:11px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;padding:1px 6px}
/* credencial de staff, com o filete por dentro e o furo da fita */
.placa{align-self:flex-start;font-family:var(--f-tit);font-weight:800;font-size:16px;letter-spacing:.05em;text-transform:uppercase;
  background:var(--placa);color:var(--sobre-placa);padding:8px 14px 6px;border-radius:10px;box-shadow:inset 0 0 0 3px var(--placa),inset 0 0 0 5px var(--sobre-placa)}
.placa::before{content:"";display:inline-block;width:20px;height:6px;border-radius:3px;background:var(--papel);margin-right:10px;vertical-align:middle;opacity:.9}
.placa.mal{background:var(--ruim);box-shadow:inset 0 0 0 3px var(--ruim),inset 0 0 0 5px var(--sobre-placa)}
.placa.peq{font-size:12.5px;padding:6px 11px 4px}

.hol{background:var(--cartao);border:1.5px solid var(--linha);border-radius:6px;padding:14px;font-family:var(--f-mono);font-size:13px;display:flex;flex-direction:column;gap:5px;font-variant-numeric:tabular-nums}
.hol .cab{font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--tinta2);padding-bottom:4px}
.hol .l{display:flex;justify-content:space-between;gap:10px}
.hol .l span:first-child{min-width:0}
.hol .l span:last-child{white-space:nowrap}
.hol .tot{border-top:1.5px solid var(--tinta);padding-top:6px;margin-top:3px;font-weight:600}
.hol .obs{color:var(--tinta2);font-size:13.5px;padding-top:4px;font-family:var(--f-txt)}
.neg{color:var(--ruim)}
.ficha-p{display:grid;grid-template-columns:auto 1fr;gap:7px 14px;font-size:16px;margin:0}
.ficha-p dt{font-family:var(--f-mono);font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--tinta2);padding-top:4px}
.ficha-p dd{margin:0}
.cracha{background:var(--cartao);border:1.5px solid var(--linha);border-radius:8px;overflow:hidden;display:flex;flex-direction:column}
.cracha .topo{background:var(--placa);color:var(--sobre-placa);padding:9px 14px;font-family:var(--f-mono);font-size:11px;letter-spacing:.08em;text-transform:uppercase;display:flex;justify-content:space-between;gap:8px}
.cracha .corpo{padding:14px}
ul.plano{margin:0;padding-left:18px;display:flex;flex-direction:column;gap:5px}
textarea,input[type=text]{font:inherit;color:var(--tinta);background:var(--cartao);border:1.5px solid var(--linha);border-radius:6px;padding:11px 12px;width:100%}
textarea{min-height:110px;resize:vertical}
.col2{display:flex;flex-direction:column;gap:10px}
.colega{border-top:1px dashed var(--linha);padding-top:10px;display:flex;flex-direction:column;gap:2px;font-size:15.5px}
.colega b{font-family:var(--f-tit);font-size:18px}
blockquote{margin:0;padding:0 0 0 12px;border-left:3px solid var(--marca);font-size:16px}
blockquote cite{display:block;font-style:normal;font-size:13px;color:var(--tinta2)}
.temp{display:inline-block;font-family:var(--f-mono);font-size:11px;letter-spacing:.06em;text-transform:uppercase;border:1.5px solid currentColor;border-radius:3px;padding:1px 6px;align-self:flex-start}
.temp.alta{color:var(--bom)} .temp.media{color:var(--tinta2)} .temp.baixa{color:var(--ruim)}

.capa{padding-top:28px;display:flex;flex-direction:column;gap:18px}
.capa h1{font-size:clamp(54px,17vw,92px);font-weight:900;line-height:.88;letter-spacing:-.035em}
.capa h1 span{background:var(--placa);color:var(--sobre-placa);padding:0 .1em;border-radius:.08em;box-decoration-break:clone;-webkit-box-decoration-break:clone}
.capa .lead{font-size:19px;max-width:34ch}
details{border-top:1px dashed var(--linha);padding-top:12px;font-size:15.5px}
details summary{cursor:pointer;font-weight:600}
details .dentro{display:flex;flex-direction:column;gap:10px;padding-top:10px;color:var(--tinta2)}
details .dentro strong{color:var(--tinta)}
label{font-weight:600;font-size:15px;display:flex;flex-direction:column;gap:6px}
.nota{font-family:var(--f-tit);font-weight:900;font-size:84px;line-height:.9;letter-spacing:-.03em;font-variant-numeric:tabular-nums}
.nota small{font-family:var(--f-mono);font-weight:500;font-size:13px;letter-spacing:.06em;text-transform:uppercase;color:var(--tinta2)}
.selos{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.selo{border:1.5px dashed var(--linha);border-radius:6px;padding:9px 10px;font-size:13.5px;line-height:1.35;color:var(--tinta2);min-width:0}
.selo b{display:block;font-family:var(--f-tit);font-size:16px;line-height:1.15;margin-bottom:3px}
.selo.tem{border-style:solid;border-color:var(--placa);background:var(--cartao);color:var(--tinta)}
.selo.tem b{color:var(--placa)}

/* créditos e bloqueio */
.rod{margin-top:36px;padding-top:14px;border-top:1.5px dashed var(--linha);font-family:var(--f-mono);font-size:11.5px;line-height:1.55;color:var(--tinta2)}
.rod b,.rod a{color:var(--placa)}
.bloq{padding-top:40px;display:flex;flex-direction:column;gap:14px}
.bloq a{color:var(--placa);font-weight:700;word-break:break-all}
.acesso{display:flex;gap:10px;align-items:center;justify-content:space-between;flex-wrap:wrap;border:1.5px dashed var(--linha);border-radius:6px;padding:12px 14px}
.acesso p{font-size:15px;min-width:0;flex:1 1 220px}

.p.esp],FIXOS=[{t:"Antes do primeiro dia",c:[1],x:a=>clt(a)?"Uma produtora da região, que trabalha com "+ESP[a.p.esp].h+', te contratou. O gerente diz: "Pode começar amanhã na montagem do evento de sábado. A papelada a gente resolve na semana que vem."':"Uma produtora da região, que trabalha com "+ESP[a.p.esp].h+', chama você para uma diária de montagem no sábado. A coordenadora manda mensagem: "R$ 250, a gente acerta depois do evento. Combinado?"',lei:a=>clt(a)?"Todo empregado deve ser registrado desde o primeiro dia, e a carteira de trabalho é digital (CLT, arts. 29 e 41). O contrato de experiência dura no máximo 90 dias (CLT, art. 445, parágrafo único). Trabalhar sem registro deixa você sem FGTS, sem INSS e sem proteção se houver um acidente.":"Quem presta serviço como autônomo ou MEI deve combinar por escrito o serviço, a função, o valor e a data de pagamento (Código Civil, arts. 593 a 609). Sem isso, fica difícil cobrar. E montagem de evento tem risco de acidente: pergunte quem responde.",o:[{l:a=>clt(a)?"Começar amanhã e deixar o registro para depois":"Aceitar o combinado por mensagem e ir",f:a=>clt(a)?{c:-3,e:-6,r:"Na quinta-feira, uma peça caiu de um andaime e atingiu seu pé. Sem registro, o atendimento virou uma discussão sobre quem pagava."}:{s:-2,e:-3,r:"A montagem foi bem, mas o pagamento atrasou 40 dias, e você precisou cobrar três vezes pelo celular."}},{l:a=>clt(a)?"Só começar depois de assinar o contrato e ter a carteira registrada":"Aceitar, mas pedir uma ordem de serviço com função, horário, valor e data de pagamento",f:a=>clt(a)?{c:3,a:2,r:"A produtora assinou no mesmo dia, com contrato de experiência de 90 dias e registro feito no sistema. Você começou na sexta, com tudo no papel."}:{c:4,s:3,a:2,r:"A coordenadora mandou a ordem de serviço em dez minutos, e o pagamento caiu na data combinada. Ela comentou que gosta de quem pergunta."}},{l:a=>clt(a)?"Perguntar aos colegas se a empresa costuma registrar e, se for assim mesmo, aceitar":"Recusar a diária: só aceita com contrato formal",f:a=>clt(a)?{c:-3,e:-2,r:'Os colegas disseram que "é assim mesmo". Dois estavam sem registro havia meses, sem FGTS e sem direito a nada.'}:{s:-3,e:2,r:"A coordenadora chamou outra pessoa. Você ficou sem trabalho nesta semana, mas deixou claro que trabalha com contrato."}}]},{t:"O orçamento não cabe",d:1,x:a=>S3(a,"Uma noiva quer casamento para 120 pessoas, com buffet, DJ e flores.","Uma indústria da cidade quer uma convenção de vendas para 150 pessoas, com hotel, palco e coffee break.","A prefeitura de uma cidade vizinha quer um festival de um dia, com três atrações e 3 mil pessoas.")+" A verba aprovada cobre só 70% do que o projeto custaria.",nota:"Um bom orçamento separa custos fixos e variáveis, inclui uma margem para imprevistos e oferece alternativas. O cliente decide melhor quando vê o que cada escolha custa.",o:[o("Apresentar três cenários com preço e deixar o cliente decidir",{c:4,a:3,e:-5},"Você montou três planilhas em duas noites. O cliente escolheu o cenário do meio e agradeceu a clareza."),o("Cortar o que o público menos vê e manter a lista",{a:2,c:1,e:-1},'O evento coube no orçamento. Ninguém sentiu falta do que saiu, mas o cliente comentou que ficou "mais simples".'),o("Reduzir o número de convidados e manter a qualidade",{c:1,s:-2,e:1},"A lista caiu, e o cliente reclamou de ter que cortar nomes. O evento, porém, ficou bem feito.")]},{t:"O espaço",c:[0],tag:"seg",x:a=>S3(a,"Uma chácara linda perto da cidade para um casamento de 200 pessoas.","Um salão novo para uma convenção de 250 pessoas.","Uma quadra coberta para um show com 800 pessoas.")+' O dono do espaço garante: "Já fiz muita festa aqui, nunca precisou de nada."',lei:"Locais de reunião de público precisam cumprir as regras de prevenção de incêndio: licença do Corpo de Bombeiros, lotação máxima, saídas de emergência desobstruídas, extintores e sinalização (Lei 13.425/2017 e, em São Paulo, Decreto Estadual 63.911/2018). A lotação do espaço é um limite de segurança, não uma sugestão.",o:[o("Pedir o auto de vistoria do Corpo de Bombeiros, a lotação aprovada e conferir saídas e extintores antes de fechar",{a:5,c:4,e:-3},"O espaço tinha lotação aprovada menor que a lista do cliente. Você ajustou o número de convidados e pediu mais uma saída sinalizada. O cliente reclamou do corte e confiou na sua explicação."),{l:"Confiar no dono: ele conhece o lugar",f:a=>Object.assign({c:-8,e:-4,r:"Na vistoria do evento, o bombeiro viu que o auto de vistoria do espaço estava vencido. O evento ficou suspenso até regularizar, e a produtora devolveu parte do valor."},FL(a,{d:-250}))},o('Aceitar a lotação do dono e colocar 40 pessoas a mais: "é só um pouquinho"',{grave:1,c:-10},"No meio do evento, a fiscalização conferiu a lista e a lotação: acima do limite. O evento foi interrompido, e o episódio ficou registrado como incidente grave no seu nome.")]},{t:"Rampa e banheiro",c:[0],tag:"acess",x:a=>S3(a,"Casamento em um salão com degraus na entrada. A avó da noiva usa cadeira de rodas, e um convidado usa muletas.","Congresso em um hotel antigo. Uma palestrante e três participantes usam cadeira de rodas. O auditório fica no segundo andar, e o único elevador é de serviço.","Show ao ar livre em terreno de terra batida, com arquibancada de dois lances de escada. Sete pessoas com deficiência compraram ingresso."),lei:"A pessoa com deficiência tem direito à cultura, ao lazer e ao acesso em igualdade com os demais. Locais de eventos e espetáculos devem reservar espaços e assentos livres, com lugar para acompanhante, em locais de boa visibilidade e com rotas de fuga e saídas de emergência acessíveis (Lei Brasileira de Inclusão, Lei 13.146/2015, arts. 42 e 44). A norma ABNT NBR 9050 traz as medidas: uma rampa, por exemplo, tem inclinação máxima de 8,33%, o que dá 1 metro de subida a cada 12 de comprimento.",o:[o("Visitar o local antes, definir uma rota acessível, reservar lugares e banheiro adaptado e avisar os convidados como chegar",{a:5,c:5,e:-3},"Você visitou o espaço, achou o acesso por rampa nos fundos, reservou lugares bem posicionados e avisou os convidados. Ninguém ficou separado do resto."),o('Carregar as pessoas pelos degraus quando chegarem: "a equipe é forte"',{c:-8,e:-3},"A cadeira quase caiu no segundo degrau. A família ficou assustada, e a equipe passou o resto do evento com medo de repetir."),o('Avisar que o espaço "tem algumas limitações"',{c:-6,s:-2},'A mensagem foi lida como um "não" educado. Duas pessoas deixaram de ir, e a notícia circulou.')]},{t:"A trilha sonora",c:[1],x:a=>S3(a,'Festa de 15 anos em um salão, com DJ e música ao vivo. O DJ avisa: "Eu levo meu pendrive, está tudo certo."',"Confraternização de empresa em um salão alugado, com banda e playlist de fundo no celular.","Festival de bairro com cinco bandas e telão com clipes."),lei:"Tocar música em local de frequência coletiva (salão, bar, clube, festival, loja) é execução pública e exige autorização prévia dos autores, cobrada pelo Ecad. Antes do evento é preciso comprovar o pagamento, e depois entregar a lista das obras tocadas (Lei dos Direitos Autorais, Lei 9.610/1998, art. 68).",o:[o("Contar com a licença do DJ e do salão: eles cuidam disso",{c:-4,a:-1},"O salão não tinha licença para o seu evento. O Ecad cobrou a produtora depois, com atraso e valor maior."),o("Perguntar quem é o responsável, consultar o Ecad e pagar antes, guardando o comprovante",{a:4,c:3},"O valor entrou no orçamento desde o início. No dia, o comprovante estava na pasta, e o evento seguiu sem susto."),o("Usar só playlists do celular: é uso pessoal",{c:-4,a:-2},'Tocar música para o público de um evento é execução pública, mesmo com playlist do celular. O Ecad não aceitou o argumento do "uso pessoal".')]},{t:"O palco mais barato",c:[1],tag:"seg",x:a=>S3(a,"Formatura com palco e estrutura de treliça para o telão.","Convenção em tenda, com palco e treliça de iluminação.","Festa junina da cidade, com palco, torres de som e iluminação.")+" A montadora mais barata tem um preço 30% abaixo das outras e nunca mostrou nenhum documento.",lei:"Trabalho a mais de 2 metros de altura, com risco de queda, é trabalho em altura: exige treinamento, atestado de saúde, equipamento de proteção (como cinto e trava-quedas) e procedimentos, conforme a Norma Regulamentadora 35 (NR-35). Estruturas temporárias como palco e treliça costumam exigir também laudo ou ART de profissional habilitado, pedido pelo Corpo de Bombeiros.",o:[o("Contratar a mais barata: eles garantem que já montaram mil palcos",{c:-8,e:-5},"Na hora de içar a treliça, um montador sem cinto escorregou. Não caiu por sorte. O Corpo de Bombeiros barrou o palco por falta de laudo, e o show atrasou três horas."),o("Exigir certificados de NR-35, laudo e ART da estrutura e equipamentos de proteção, mesmo que o preço suba",{a:5,c:4,e:-2},"A montadora apresentou os documentos, e a estrutura passou na vistoria. O orçamento subiu, mas o cliente aceitou depois que você explicou o risco."),o('Pedir que a equipe "tome cuidado" e acompanhar a montagem pessoalmente',{c:-5,e:-6},"Você passou o dia ao lado da montagem, mas cuidado não substitui treinamento nem equipamento. O laudo faltou na vistoria.")]},{t:"Meia-entrada",c:[0],x:a=>S3(a,"Uma festa aberta, com venda de ingressos, vai ocorrer em um clube.","Um congresso aberto ao público tem inscrição paga.","Um show de inverno vende ingressos pelo site e na bilheteria.")+" A produtora quer vender tudo pelo valor inteiro. Estudantes, idosos e pessoas com deficiência já perguntam pela meia-entrada.",lei:"A meia-entrada em eventos culturais, esportivos e de lazer é direito de estudantes (com carteira de identificação estudantil), de pessoas com deficiência (e acompanhante, se necessário) e de jovens de 15 a 29 anos de baixa renda inscritos no CadÚnico. O benefício é assegurado em 40% do total de ingressos de cada evento, e as regras devem estar claras na venda (Lei 12.933/2013, art. 1º). Para idosos, o Estatuto da Pessoa Idosa garante desconto de pelo menos 50% (Lei 10.741/2003, art. 23).",o:[o("Aplicar a meia-entrada, divulgar as regras na venda e conferir os documentos na portaria",{c:4,a:3},"Na portaria, o controle ficou claro. A fila andou, e ninguém discutiu: a regra estava no site e no cartaz."),o("Negar a meia-entrada: o evento é particular e o preço é inteiro",{c:-7},"Uma estudante procurou o Procon, e a produtora foi notificada. Os ingressos tiveram que ser devolvidos com a diferença."),o("Dar meia a quem pedir, sem conferir documento, para não criar fila",{c:-5,a:-2},'A "meia" virou regra. Com tantos descontos, a bilheteria fechou abaixo do previsto, e a produtora cobrou uma explicação.')]},{t:"O pagamento da equipe",c:[0],x:a=>clt(a)?'Você coordena a operação de um evento de sábado, com 10 auxiliares de credenciamento, bar e montagem. Sua chefe avisa que o cliente pagou só 50% e pede: "Segura a equipe até o cliente completar." A equipe cobra o cachê de hoje: "Pagamento é no fim do evento, como combinado."':'Você tem contrato com um cliente e contratou 10 auxiliares de credenciamento, bar e montagem para o evento de sábado. O cliente pagou só 50% e prometeu o resto "na semana que vem". A equipe cobra o cachê de hoje: "Pagamento é no fim do evento, como combinado."',lei:'Quem contrata pessoas para trabalhar por conta própria deve pagar na data combinada e formalizar: por recibo de pagamento a autônomo (RPA) ou por nota fiscal de MEI ou empresa. Pagar "por fora", sem registro, não protege ninguém. Trabalho com horário, ordens e rotina fixos, de forma pessoal e habitual, pode ser reconhecido como vínculo de emprego (CLT, art. 3º). O cliente que atrasa responde pelo atraso conforme o contrato.',o:[{l:"Pagar a equipe na data combinada, com recibo, e cobrar a diferença do cliente pelo contrato",f:a=>clt(a)?{c:4,s:3,r:"Você explicou à sua chefe que equipe não espera, e ela liberou o caixa. A equipe recebeu no mesmo dia, com recibo."}:{c:4,s:3,d:-300,r:"Você adiantou a diferença do seu caixa, pagou todo mundo com recibo e cobrou o cliente pelo contrato. O cliente pagou na semana seguinte, com multa por atraso, mas você ficou no aperto por uns dias."}},o('Pagar a equipe em dinheiro, sem recibo, "para ficar mais rápido"',{c:-4,e:-3},"Dois auxiliares pediram comprovante para o INSS e para comprovar renda. Sem recibo, você não tinha como provar o valor quando um deles contestou."),o("Pedir à equipe para esperar o cliente pagar",{s:-7,c:-3},"Seis dos dez disseram que não voltam mais. A equipe boa que você tinha formado se desfez.")]},{t:"Cerveja para quem?",c:[0],tag:"seg",x:a=>S3(a,'Festa de 15 anos com open bar para os adultos e 80 adolescentes. O barman pergunta: "Posso servir cerveja para os de 16 e 17? Os pais deixaram."',"Confraternização de uma empresa que tem aprendizes e estagiários de 16 e 17 anos, com open bar de cerveja e caipirinha.","Show com público de todas as idades. O bar terceirizado quer vender cerveja sem conferir idade."),lei:"É crime vender, fornecer ou servir bebida alcoólica a menor de 18 anos, mesmo que os pais deixem e mesmo de graça (ECA, art. 243, com a redação da Lei 13.106/2015). Eventos precisam de controle de idade, como conferência de documento e pulseira para os maiores de 18.",o:[o("Definir o controle: conferir documento, pulseira para os maiores de 18 e barman instruído a recusar os demais",{c:5,a:3,e:-2},"A pulseira funcionou: uma fila só para quem tinha. Os adolescentes tiveram refrigerante e drinks sem álcool, e os pais agradeceram."),o("Liberar para os de 16 e 17 anos com autorização dos pais",{grave:1,c:-10},"A autorização dos pais não vale: servir álcool a menor é crime. Uma mãe denunciou ao Conselho Tutelar. O barman e a produtora foram chamados a explicar, e o caso ficou registrado como incidente grave no seu nome."),o("Deixar o barman decidir: ele é adulto",{c:-6},'O barman serviu "no olho", e dois adolescentes foram servidos. Alguém postou fotos nas redes.')]},{t:"O DJ que desistiu",c:[0],x:a=>S3(a,'Casamento de duas noivas. Na véspera, o DJ contratado manda mensagem: "Desculpa, não faço esse tipo de evento. Pode me tirar da lista."','Convenção de uma empresa que vai premiar uma funcionária trans. O mestre de cerimônias contratado diz que "não vai falar o nome social".','Festival com a participação de um coletivo LGBTQIA+. O técnico de som contratado diz que "não trabalha com esse público".'),lei:"Recusar um serviço já contratado por causa da orientação sexual ou da identidade de gênero do cliente é discriminação. O Código de Defesa do Consumidor proíbe recusar a prestação de serviços a quem se dispõe a pagar (art. 39, IX), e o Supremo Tribunal Federal enquadrou a homofobia e a transfobia na lei do racismo (ADO 26 e MI 4733, 2019). Além disso, um contrato assinado deve ser cumprido.",o:[o("Falar com o profissional, lembrar o contrato e a lei e, se ele mantiver a recusa, contratar outro sem expor o cliente",{c:5,s:3,e:-4},"O profissional manteve a recusa. Você chamou um substituto da sua rede e contou ao cliente só o necessário. O evento foi lindo, e o contrato do primeiro foi rescindido por escrito."),o("Contar tudo ao cliente na véspera e deixar que ele resolva",{c:-3,s:1,e:-3},"Foi uma noite difícil, e você deixou o problema na mão do cliente. Ele agradeceu a honestidade, mas passou a véspera trocando mensagens com fornecedores."),o('Aceitar a recusa e dizer que o profissional "teve um problema de agenda"',{c:-7},"O cliente descobriu pelo grupo de fornecedores. Além da dor da recusa, pesou a mentira.")]},{t:"A vistoria",c:[0],tag:"seg",x:a=>S3(a,"Formatura com 600 convidados em um clube.","Feira de negócios com 40 estandes e 900 visitantes.","Show com 3 mil pessoas em um parque da cidade.")+" Uma hora antes do início, o Corpo de Bombeiros faz a vistoria e aponta: duas portas de emergência estão bloqueadas por mesas e pela decoração, e faltam duas placas de saída.",lei:"As saídas de emergência devem ficar livres, sinalizadas e com largura suficiente para a lotação. Decoração, estandes e mesas não podem bloqueá-las. O evento só começa com a liberação do Corpo de Bombeiros. Oferecer vantagem a agente público é crime de corrupção ativa (Código Penal, art. 333).",o:[o("Tirar mesas e decoração das saídas, colocar as placas e pedir nova vistoria, mesmo atrasando o início",{c:4,a:4,e:-6},"O evento começou 50 minutos depois, e o cliente ficou nervoso. Mas o plano de emergência ficou impecável, e o chefe da vistoria elogiou a equipe."),o('Pedir ao bombeiro um "tempinho" e resolver só depois que ele sair',{c:-9,e:-6},"O bombeiro voltou na metade do evento e interrompeu tudo. Centenas de pessoas esperaram do lado de fora."),o("Oferecer um agrado para a vistoria seguir",{grave:1,c:-12},"Oferecer vantagem a agente público é corrupção ativa. O bombeiro registrou a ocorrência, o evento foi suspenso e o caso ficou registrado como incidente grave no seu nome.")]},{t:"Três pedidos para a mesma noite",d:1,x:a=>"Dezembro: confraternizações, formaturas e Réveillon. Você recebeu três pedidos para a mesma noite e a sua equipe já está no limite.",o:[{l:"Aceitar os três e dar um jeito",f:a=>({s:3,c:-3,e:-11,d:clt(a)?300:600,r:"Você fechou os três. A equipe errou o horário de um deles, e o cliente reclamou. Mas a conta fechou o ano no azul."})},{l:"Aceitar um e indicar os outros dois para colegas de confiança",f:a=>({s:6,c:3,e:-3,d:clt(a)?100:250,flag:"indica",r:"Os colegas retribuíram: em janeiro, dois deles indicaram você para eventos novos."})},o("Recusar todos e descansar de verdade",{e:14,s:-3},"Você desligou o celular de trabalho e voltou com outra disposição. Duas produtoras fecharam o calendário com quem respondeu primeiro.")]}],ALEA={mei:{t:"Só com nota fiscal",d:1,q:a=>!clt(a)&&!a.p.mei,x:a=>"Uma produtora da região quer fechar cinco diárias com você, mas só contrata quem emite nota fiscal. Hoje você trabalha só com o CPF.",nota:"O MEI formaliza o trabalho por conta própria: paga todo mês um valor fixo (DAS, de R$ 86,05 em 2026 para serviços), emite nota fiscal, contribui para o INSS e pode ter um empregado. O limite de faturamento é de R$ 81 mil por ano. Confira no Portal do Empreendedor se a sua atividade está na lista de ocupações permitidas ao MEI.",o:[{l:"Abrir o MEI esta semana",f:a=>(a.p.mei=1,{s:6,c:2,e:-3,r:"O cadastro levou uma tarde no gov.br. A partir de agora, R$ 86,05 saem todo mês, com trabalho ou sem. Em troca, mais produtoras podem te contratar."})},o("Continuar com CPF e procurar clientes que aceitem recibo",{e:2,s:-3},"Sem custo fixo, mas com menos portas abertas. Algumas empresas nem respondem quando você diz que não emite nota."),o("Emitir a nota pelo CNPJ de um amigo",{c:-6,s:-2},"Funcionou uma vez. Na segunda, o contador da produtora estranhou um técnico de eventos emitindo nota por uma empresa de reformas, e você perdeu o cliente. Emitir nota em nome de terceiro é fraude.")]},chuva:{t:"Previsão de temporal",c:[0],x:a=>S3(a,"Casamento ao ar livre com 200 convidados.","Lançamento de produto em um pátio aberto, com 300 pessoas.","Festival em um parque, com 2 mil pessoas.")+" Às 14h, a previsão muda: temporal à noite.",nota:"Evento ao ar livre sem plano B é risco. Instalações elétricas provisórias exigem profissional habilitado e proteção contra chuva (NR-10, que trata de segurança com eletricidade).",o:[o("Ativar o plano B: tenda reserva, rota alternativa e aviso ao público, com a aprovação do cliente",{a:5,c:4,e:-4},"A tenda reserva chegou às 17h. Quando a chuva veio, o evento já estava coberto, e a música não parou."),o("Esperar para ver: pode não chover",{c:-7,e:-4},"Choveu às 19h. Convidados correndo, equipamento elétrico molhado e o gerador desarmou. O evento atrasou quarenta minutos."),o("Cancelar o evento por conta própria",{c:-8,s:-3},"Você cancelou sem falar com o cliente. A chuva não veio. O cliente não perdoou a decisão.")]},alergia:{t:"Sem amendoim",c:[0],tag:"seg",x:a=>'Na prova do cardápio, uma convidada com alergia grave a amendoim avisa a organização. O buffet usa óleo e molhos com amendoim em três pratos e diz que "contaminação cruzada não existe".',nota:"Alérgenos precisam ser informados, e a contaminação cruzada é um risco real, que pode causar reação grave. Em eventos, o buffet deve informar os ingredientes de cada prato e separar utensílios e preparo.",o:[o("Exigir a lista de ingredientes de cada prato, separar utensílios e preparo para a convidada e avisar a equipe de salão",{a:5,c:4,e:-2},"O buffet preparou um prato separado, com utensílios próprios e um cartão de identificação. A convidada comeu em paz."),o("Dizer à convidada que evite os pratos com molho",{c:-9,e:-4},"Um garçom serviu o prato errado, e a convidada precisou de atendimento médico. A recepção chamou o SAMU."),o("Confiar no buffet: eles sabem o que fazem",{c:-6},"No coquetel, um canapé com pasta de amendoim foi servido sem identificação. Por sorte, a convidada percebeu pelo cheiro.")]},libras:{t:"Intérprete de Libras",c:[0],tag:"acess",x:a=>"Um participante surdo se inscreveu em uma palestra do seu evento e pergunta como vai acompanhar. A organização não previu intérprete.",lei:"A Libras é reconhecida como meio legal de comunicação (Lei 10.436/2002), e a Lei Brasileira de Inclusão garante acesso à informação e à comunicação em eventos (Lei 13.146/2015). Em palestras longas, o ideal é contratar dois intérpretes em revezamento, posicionados em um lugar bem iluminado e visível.",o:[o("Contratar intérprete (ou dupla) a tempo, definir o lugar e a iluminação e reservar um assento com boa visão",{a:4,c:5,e:-3},"O intérprete chegou uma hora antes e ensaiou os termos da palestra. O participante teve um lugar na frente e agradeceu a organização."),o('Dizer que a palestra tem slides com texto e que ele "acompanha" por eles',{c:-7},"Os slides tinham pouco texto. Ele saiu na metade e escreveu para a organização."),o("Pedir que ele traga um acompanhante que saiba Libras",{c:-6,s:-1},"Ele ficou incomodado: a acessibilidade é responsabilidade de quem organiza, não de quem participa.")]},lgpd:{t:"A lista de inscritos",c:[1],x:a=>'O patrocinador pede a lista de inscritos do evento, com nome, e-mail e telefone, para "mandar propostas". A inscrição não perguntou se o participante aceitava isso.',lei:"Dados pessoais só podem ser usados para a finalidade informada à pessoa, e compartilhá-los com terceiros exige uma base legal, como o consentimento (Lei Geral de Proteção de Dados, Lei 13.709/2018, arts. 6º e 7º).",o:[o("Mandar a lista completa: o patrocinador ajudou a pagar o evento",{c:-6},"Três inscritos reclamaram de mensagens comerciais e pediram explicação de como o contato foi parar lá."),o("Recusar o compartilhamento e oferecer ao patrocinador um sorteio no estande, para captar contatos de quem aceitar",{c:3,s:2,a:2},"O patrocinador gostou da ideia e captou 120 contatos de quem consentiu."),o("Mandar só os nomes, sem e-mail nem telefone",{c:-3},"Nome também é dado pessoal. Um inscrito reclamou, e você teve que se explicar.")]},crianca:{t:"Criança perdida",c:[0],tag:"seg",x:a=>"No meio do evento, uma criança de 5 anos aparece chorando na portaria dizendo que perdeu a mãe. Há 1.500 pessoas lá dentro.",nota:"Ter protocolo para criança perdida faz parte do plano de segurança: ponto de atendimento, pulseira de identificação com telefone dos pais, aviso discreto à equipe e à segurança. A criança só é entregue a quem for confirmado como responsável.",o:[o("Levar a criança ao ponto de atendimento, acionar o protocolo, avisar a equipe e só entregá-la ao responsável confirmado",{c:5,a:3},"A mãe foi localizada em dez minutos pelo rádio da equipe. Ela apresentou o documento e uma foto da criança antes de a levar."),o("Anunciar o nome da criança no microfone e esperar quem aparecer",{c:-4},"Dois adultos vieram buscar a criança. Um deles não era da família. Felizmente, a segurança conferiu."),o("Pedir a um funcionário que a leve pelo evento até achar a mãe",{c:-4,e:-3},"Ela só foi encontrada uma hora depois. Mãe e criança em pânico.")]},seguranca:{t:"O segurança do primo",c:[1],x:a=>'O cliente quer economizar e propõe que o "segurança" do evento seja o primo dele, que "já foi segurança de balada". Você sabe que vão estar presentes 400 pessoas.',lei:"Vigilância e segurança privada, quando contratadas como serviço, só podem ser prestadas por empresas autorizadas pela Polícia Federal, com vigilantes que fizeram curso e têm registro (Estatuto da Segurança Privada, Lei 14.967/2024). Para eventos maiores, contrate empresa regularizada e, para o controle de fluxo, equipe treinada.",o:[o("Aceitar o primo: o cliente manda",{c:-7},"Na saída, o primo se excedeu numa discussão, e a confusão foi parar na delegacia. O nome da produtora apareceu no boletim."),o("Explicar o risco e contratar empresa de segurança autorizada, ajustando o orçamento",{c:4,a:3},"O cliente topou depois de ver o custo de um problema. A equipe de segurança agiu rápido numa briga no estacionamento."),o("Aceitar o primo e completar com dois amigos seus",{c:-4,s:1},"Sem preparo, os três tiveram a mesma dificuldade na hora da confusão. Dois convidados saíram reclamando.")]},horas:{t:"Madrugada",c:[1],q:clt,x:a=>"O evento terminou às 3h. Às 8h, sua chefe pergunta se você consegue abrir a operação do evento do dia seguinte.",lei:"A jornada normal é de 8 horas por dia e 44 por semana. As horas extras são pagas com adicional de pelo menos 50%, ou compensadas em banco de horas. O trabalho entre 22h e 5h tem adicional noturno de pelo menos 20%, e entre uma jornada e a outra é preciso um descanso de 11 horas (Constituição, art. 7º; CLT, arts. 59, 66 e 73).",o:[o("Aceitar sem registrar: o evento é prioridade",{e:-9,c:1},"Você abriu às 8h com cinco horas de sono. As horas extras não foram anotadas, e ninguém pagou."),o("Cumprir o descanso de 11 horas, registrar as horas extras no ponto e combinar com a chefe um horário de início",{e:-2,c:2,s:1,a:1},"A chefe reorganizou a abertura, e as horas apareceram na folha, com o adicional."),o("Faltar e dizer que passou mal",{c:-7},"A chefe soube que você estava bem. Pesou mais a mentira do que o cansaço.")]},cliente:{t:"O cliente que sumiu",d:1,q:a=>!clt(a),x:a=>'Uma empresa deve R$ 1.800 do evento de maio. O financeiro responde só "estamos analisando" há 45 dias, e o diretor pede um orçamento novo para dezembro.',nota:"Contrato assinado e nota fiscal emitida dão base para cobrar, inclusive com protesto e ação judicial. Combinar sinal antecipado reduz o risco de ficar sem receber.",o:[{l:"Enviar notificação por escrito e só aceitar o novo trabalho com 50% de sinal antecipado",f:a=>rng(a)<.6?{c:2,s:-2,d:1800,r:"A empresa pagou o atrasado em uma semana e topou o sinal de 50%. Ficou um clima frio, mas agora tudo está no papel."}:{s:-4,a:2,r:"A empresa não respondeu à notificação e o diretor desistiu do orçamento. Você segue com o valor a receber e vai ter de cobrar na Justiça."}},{l:"Fazer o novo orçamento e esperar o pagamento antigo sair",f:a=>rng(a)<.4?{s:2,d:1800,e:-3,r:"Depois de uma conversa difícil, a empresa pagou tudo junto, com o novo contrato assinado."}:{s:2,e:-5,r:"A empresa pediu mais 30 dias, depois mais 30. Os R$ 1.800 viraram uma conversa sem fim, e você ainda gastou noites no orçamento novo."}},o("Cobrar publicamente nas redes",{s:-5,c:-4},"Outras empresas leram o post e ficaram com receio de contratar alguém que expõe clientes. A cobrança, aliás, nem foi paga.")]},fornecedor:{t:"O fornecedor sumiu",d:1,x:a=>"Dois dias antes do evento, o fornecedor de som e luz para de responder. Você já tinha pago 50% de sinal.",nota:"Contrato por escrito, com sinal e multa por descumprimento, é o que permite cobrar a devolução do sinal quando o fornecedor não cumpre (Código Civil, arts. 417 a 420).",o:[o("Acionar o contrato, procurar um substituto na sua rede e avisar o cliente com transparência",{c:2,s:2,e:-6},"Um colega emprestou o equipamento por um preço bom. O cliente soube do problema e da solução no mesmo dia."),{l:"Esconder o problema do cliente e tentar resolver sozinho",f:a=>rng(a)<.45?{e:-8,s:1,r:"Você achou outro fornecedor na véspera, no sufoco, e o cliente nem soube. Mas passou duas noites sem dormir."}:{e:-8,c:-6,r:"Você não achou ninguém a tempo. O som falhou na abertura, e o cliente soube só quando já era tarde."}},o("Cancelar o evento e devolver o dinheiro ao cliente",{c:-8,e:-2},'O cliente ficou sem evento e sem confiança. A produtora entrou na lista de "não contratar".')]},golpe:{t:"Aluguel pela metade do preço",c:[1],x:a=>'Um anúncio oferece som e iluminação para locação por metade do preço do mercado. O "vendedor" pede R$ 600 de sinal por Pix hoje, "porque tem outra pessoa interessada".',nota:"Sinais de golpe: preço muito abaixo do mercado, pressa, pagamento só por Pix para pessoa física, sem endereço e sem contrato. Consulte o CNPJ, peça referências e visite o estoque antes de pagar sinal.",o:[{l:"Pagar o sinal: o preço é excelente",f:a=>clt(a)?{c:-6,r:"Depois do Pix, o perfil sumiu. A produtora perdeu o sinal, e o prejuízo foi parar na sua avaliação."}:{d:-600,c:-2,r:"Depois do Pix, o perfil sumiu e o anúncio saiu do ar na semana seguinte."}},o("Consultar o CNPJ, pedir contrato, endereço e referências antes de pagar",{a:2,c:2},"O CNPJ não existia, e o endereço era de um terreno vazio. Você avisou o grupo de colegas, e duas pessoas já tinham recebido a mesma mensagem.")]},post:{t:"As fotos do evento",c:[1,2],x:a=>"O evento foi lindo, e você quer postar as fotos dos convidados e do público para divulgar o seu trabalho.",lei:"Para usar a imagem de alguém na divulgação do seu trabalho, é preciso autorização (Constituição, art. 5º, X, e LGPD, Lei 13.709/2018). Eventos costumam prever isso no contrato e em um aviso na entrada.",o:[o("Postar as fotos com o rosto de todo mundo",{c:-5,s:1},"Uma convidada pediu para tirar a foto do ar: não queria que ninguém soubesse onde passou o fim de semana."),o("Pedir autorização e postar só quem aceitou, ou incluir a cláusula no contrato dos próximos eventos",{s:4,c:2},"Metade do público autorizou e ainda marcou você. Três pessoas pediram orçamento."),o("Postar só decoração e estrutura, sem ninguém",{s:1},"Fotos bonitas e pouco alcance, mas ninguém teve do que reclamar.")]},barulho:{t:"Vizinhos e decibéis",c:[0],x:a=>"Evento em um salão com banda até as 2h. Às 23h30, a vizinhança liga para a polícia, e uma viatura para na porta.",lei:"Cada município define os limites de ruído e os horários por lei. Perturbar o sossego alheio com gritaria, algazarra ou som excessivo é contravenção penal (Decreto-Lei 3.688/1941, art. 42). A organização deve conhecer o limite do local antes do evento e controlar o som.",o:[o("Reduzir o volume, fechar portas e janelas, conversar com o policial e combinar o encerramento do som",{c:3,e:-3},"O policial conferiu a licença do salão, e você ajustou o volume. O evento terminou às 2h, com o som mais baixo."),o("Ignorar: é um evento privado",{c:-7},"O policial voltou duas vezes e, na segunda, encerrou o som."),o("Pedir ao cliente que converse com o policial e ficar de fora",{c:-3,a:-1},"O cliente discutiu com o policial, e a vizinhança ficou ainda mais irritada.")]},residuos:{t:"Depois da festa",c:[0],x:a=>'O evento terminou. São 300 kg de lixo, óleo de cozinha usado do buffet, vidro e papelão. O responsável pela limpeza diz: "Eu jogo tudo na caçamba da rua."',nota:"A Política Nacional de Resíduos Sólidos prevê responsabilidade compartilhada: quem gera o resíduo responde pelo destino correto (Lei 12.305/2010). Óleo e vidro têm destino próprio, e a coleta seletiva pode fazer parte do contrato.",o:[o("Contratar coleta seletiva e destinação do óleo e do vidro, com comprovante",{a:3,c:3,e:-3},"O vidro e o papelão seguiram para cooperativas, e o óleo foi retirado por uma empresa. O cliente recebeu o comprovante e pediu o mesmo para o próximo evento."),o("Deixar na caçamba: é o que sempre se faz",{c:-4},"A fiscalização do município viu o descarte irregular e notificou a produtora."),o("Descartar o óleo no ralo do salão",{c:-6,e:-2},"O ralo entupiu, e o dono do salão cobrou o conserto. O óleo vai poluir o esgoto e o rio.")]},cancela:{t:"Cancelamento de última hora",d:1,x:a=>"O cliente cancela o evento três dias antes. O contrato prevê multa de 30% do valor, e vários fornecedores já foram contratados e pagos.",lei:"Cláusulas de cancelamento precisam ser claras e proporcionais. Multa exagerada pode ser considerada abusiva pelo Código de Defesa do Consumidor (art. 51, IV), quando o cliente é consumidor.",o:[{l:"Cobrar a multa integral do contrato",f:a=>Object.assign({s:-3,c:-2,r:"O cliente pagou a multa, mas disse que não volta mais."},FL(a,{d:600}))},{l:"Negociar: cobrar os custos já assumidos e remarcar a data sem multa",f:a=>Object.assign({c:4,s:3,r:"Você mostrou os custos já pagos, e o cliente aceitou remarcar para o mês seguinte. Ficou um laço de confiança."},FL(a,{d:250}))},o("Perdoar a multa para manter o cliente",{s:2,e:2},"Você não cobrou nada. O cliente agradeceu, mas os fornecedores que você pagou ficaram com você.")]},agenda:{t:"Duas agendas",d:1,x:a=>"Dois eventos no mesmo sábado: um casamento que paga bem e uma convenção de um cliente fixo.",o:[{l:"Escolher o que paga mais e indicar um colega para o outro",f:a=>Object.assign({s:3,c:-1,r:"O colega fez a convenção, e o cliente fixo ficou desconfiado. O casamento, porém, rendeu bem."},FL(a,{d:250}))},o("Dividir o dia: montar um e supervisionar o outro por celular",{c:-4,e:-8},"Você correu entre os dois eventos. Dois detalhes escaparam, e os dois clientes perceberam."),o("Recusar o novo e manter o cliente fixo",{c:3,s:2},"O cliente fixo valorizou a escolha e fechou mais três datas.")]},seguro:{t:"O seguro",d:1,q:a=>!clt(a),x:a=>"Um corretor oferece seguro de responsabilidade civil para profissionais de eventos: R$ 60 por mês. Cobre danos a terceiros causados por falha sua.",o:[{l:"Contratar",f:a=>(a.p.seg=60,{e:2,r:"Mais um custo fixo: R$ 60 por mês daqui para a frente. Em troca, você dorme mais tranquilo antes de eventos grandes."})},o("Não contratar agora",{}," ue fazer com o que sobrou?":"Quanto vai para a sua meta?")+"</p>"+botoes(e)}case"ev1":case"ev2":{const a="ev1"===G.f?FIXOS[G.m]:ALEA[G.ev2];return'<span class="rot">'+o+" · "+("ev1"===G.f?"No evento":"Enquanto isso")+"</span><h2>"+esc(a.t)+"</h2>"+ps(a.x(G))+(a.d?'<p class="rot">Dilema · Toda opção tem um custo</p>':"")+botoes(e)}case"res1":case"res2":{const a=G.res;return'<span class="rot">'+o+" · O que aconteceu</span><h2>"+esc(a.t)+"</h2>"+ps(a.r)+(!0===a.certa?'<div class="placa peq">Resposta certa</div>':!1===a.certa?'<div class="placa peq mal">Havia opção melhor</div>':"")+(a.d.length?fichas(a.d):"")+(a.lei?'<div class="lei"><em>Na lei</em><span>'+esc(a.lei)+"</span></div>":"")+(a.nota?'<div class="lei"><em>Vale saber</em><span>'+esc(a.nota)+"</span></div>":"")+botoes(e)}case"pausa":return'<span class="rot">'+o+" · Uma pausa</span><h2>Intervalo</h2>"+ps(PAUSAS[G.m])+'<label for="reflexao">Sua resposta (fica só neste aparelho)<textarea id="reflexao" maxlength="600" placeholder="Escreva uma linha, se quiser."></textarea></label>'+botoes(e,!0);case"fecha":{const r=G.fech;return'<span class="rot">'+o+" · Fechamento</span><h2>Fim de "+o.toLowerCase()+"</h2>"+ps("O mês cobrou o preço de sempre: "+(G.mdias?G.mdias+(1===G.mdias?" dia":" dias")+" de evento":"dias sem evento e a cabeça nas contas")+(2===a.fase?", o seu filho em casa":"")+" e contatos que esfriam quando você não aparece.")+fichas(r.d)+(r.N.length?'<ul class="plano">'+r.N.map(a=>"<li>"+esc(a)+"</li>").join("")+"</ul>":"")+botoes(e)}case"vida":{const a=G.vd;return'<span class="rot">'+o+" · A vida acontece</span><h2>"+esc(a.t)+"</h2>"+ps(a.r)+(a.d.length?fichas(a.d):"")+(a.lei?'<div class="lei"><em>Na lei</em><span>'+esc(a.lei)+"</span></div>":"")+'<p class="rot">Aqui não havia escolha</p>'+botoes(e)}case"conv":{const a=G.cv,r=G.prazo;return'<span class="rot">'+o+' · Conversa de mentoria</span><h2>Um café com a Regina</h2><div class="placa mal">Sinal de alerta</div>'+ps({c:'A Regina, produtora há 25 anos e sua professora no curso, te chama para um café. "Ouvi de dois clientes que você anda escorregando na entrega. Reputação demora para fazer e pouco para perder."',s:'A Regina, produtora há 25 anos e sua professora no curso, te chama para um café. "Faz semanas que ninguém me pergunta de você. Profissional de eventos que some da praça é esquecido."',a:'A Regina, produtora há 25 anos e sua professora no curso, te chama para um café. "Um colega foi cobrir um evento seu e achou o checklist incompleto. Evento vive de planejamento e de técnica."'}[a]+"\n"+(r?"Ela te ajuda a montar um plano. "+NOMES_ST[a]+" volta para 20, e o combinado é terminar "+MES[r.ate].toLowerCase()+" com esse medidor em 20 ou mais. Se não der, talvez seja hora de dar uma pausa na carreira.":"O ano está acabando. Ela pede que você leve a conversa para o planejamento do ano que vem."))+'<div class="lei"><em>Vale saber</em><span>'+(clt(G)?"Mesmo com chefe, quem trabalha em eventos precisa de mentores de fora da empresa: colegas experientes, associações e professores ajudam a ver o que o dia a dia esconde.":"Freelancer não tem chefe para avisar quando algo vai mal. Colegas experientes, associações e professores da área fazem esse papel.")+"</span></div>"+botoes(e)}case"fim":return fim()}return""}function capa(){const a=carregar();return'<div class="capa"><span class="rot">Jogo de simulação · Técnico em Eventos</span><h1>Um ano de <span>eventos</span></h1><p class="lead">Você acaba de receber o diploma de técnico em eventos e vive o primeiro ano de trabalho, em uma cidade do estado de São Paulo. Vínculo, tipo de cliente, especialidade, capital e experiência são sorteados. As escolhas são suas.</p><div class="ponto" aria-hidden="true">'+MES.map(a=>'<span class="furo"><i></i>'+a[0]+"</span>").join("")+'</div><label for="apelido">Seu apelido no jogo (opcional)<input type="text" id="apelido" maxlength="20" autocomplete="off" placeholder="Apelido"></label><div class="ops"><button class="op ir" data-x="novo">Sortear minha vida</button>'+(a&&"fim"!==a.f?'<button class="op" data-x="continuar"><kbd></kbd><span>Continuar de onde parei<small>'+esc(MES[a.m])+", mês "+(a.m+1)+" de 12</small></span></button>":"")+'</div><ul class="plano"><li>Dura de 20 a 30 minutos.</li><li>Você pode cair como empregado de uma produtora, com carteira assinada, ou como freelancer, cobrando por diária. As regras, as contas e os riscos mudam de um para o outro.</li><li>Todo mês você decide onde colocar a sua força, vê quantos dias de evento teve com a temporada daquele mês e escolhe o que fazer com o que sobrou.</li><li>Algumas situações têm resposta certa, pela lei ou pela segurança do público e da equipe. Outras são dilemas, em que toda opção tem um custo.</li><li>Entre uma escolha e outra, a vida acontece: imprevistos e boas surpresas que você não controla.</li><li>No fim você recebe uma nota de 0 a 100 e os selos que conquistou.</li></ul>'+(CFG.form?'<div class="acesso"><p><strong>Docente:</strong> registre aqui cada turma em que aplicou o jogo.</p><a class="op" style="width:auto;text-decoration:none" href="'+esc(CFG.form)+'" target="_blank" rel="noopener"><span>Registrar aplicação</span></a></div>':"")+'<details><summary>Para quem está dando a aula</summary><div class="dentro"><p><strong>Registro de aplicações.</strong> A cada turma em que aplicar o jogo, use o botão “Registrar aplicação” desta capa: informe data, unidade, curso, turma e número de estudantes. Nenhum dado dos estudantes é coletado. Compartilhe sempre o link oficial; não copie nem hospede o jogo em outro endereço.</p><p><strong>Como usar.</strong> Cada estudante joga no próprio celular. As vidas são diferentes de propósito: quem tirou um filho pequeno, cliente pequeno e só R$ 200 na conta joga um ano mais apertado do que quem mora com a família, atende clientes grandes e começa com R$ 2.500. No fim, peçam que comparem o resultado, quanto receberam, o que guardaram e o que escreveram nas quatro pausas.</p><p><strong>Para a conversa depois.</strong> O que dependia de escolha e o que dependia do sorteio? O que mudou entre o empregado e o freelancer, nas contas e nos riscos? Qual regra de segurança, acessibilidade ou legislação você não conhecia? Que situação do jogo apareceu num evento que você viu de perto? A opção de cada situação aparece com uma letra, para facilitar perguntas como "quem escolheu B?".</p><p><strong>Base legal.</strong> CLT (arts. 3º, 29, 41, 59, 66, 73 e 445) e Constituição (arts. 5º e 7º); Código Civil (arts. 417 a 420 e 593 a 609); Lei 9.610/1998, art. 68 (execução pública de música); Lei 12.933/2013 (meia-entrada) e Lei 10.741/2003, art. 23; Lei 13.146/2015, arts. 42 e 44, e ABNT NBR 9050 (acessibilidade); Lei 10.436/2002 (Libras); Lei 13.425/2017 e Decreto Estadual 63.911/2018 (prevenção de incêndio); NR-35 (trabalho em altura) e NR-10 (eletricidade); ECA, art. 243, e Lei 13.106/2015 (bebida alcoólica a menores); CDC, arts. 39 e 51; STF, ADO 26 e MI 4733 (2019); Lei 13.709/2018 (LGPD); Lei 14.967/2024 (segurança privada); Lei 12.305/2010 (resíduos); Decreto-Lei 3.688/1941, art. 42; Código Penal, art. 333; Lei 8.137/1990; LC 123/2006 e LC 238/2026 (MEI). As regras refletem a legislação consultada em 2026. Confira sempre a versão vigente e as normas do município e do Corpo de Bombeiros do seu estado.</p><p><strong>Simplificações do jogo.</strong> Salários, diárias e custos são valores ilustrativos, porque variam muito por cidade, função e cliente. O salário do empregado é líquido; o 13º foi dividido em duas parcelas iguais, em novembro e dezembro. Para o freelancer, a diária base é de R$ 300, com acréscimo para boa reputação. O DAS do MEI usa o valor de 2026 para serviços (R$ 86,05). A reserva rende 0,5% ao mês e a dívida cresce 8% ao mês. As sanções reais dependem de processo e de fiscalização; no jogo, o primeiro incidente grave registrado funciona como advertência e o segundo encerra a carreira.</p><p><strong>Escolhas e recompensas.</strong> Situações de lei e de segurança têm resposta certa, e o jogo carimba o acerto ou o erro. Situações de dinheiro, mercado e convivência são dilemas, marcados como tal. A nota soma Técnica (20), Reputação (20), Rede (10), Energia (10), regras e segurança (15), meta de dinheiro (15) e conduta (10).</p></div></details>'+credito()+"</div>"}function fim(){const a=G.fim,e=TIPOS[a.tipo],o=G.p,r=!!G.over;clt(G);G.col||(G.col=turma(G));let s='<span class="rot">'+(r?MES[G.m]+" · O ano terminou antes":"Dezembro · Fim do primeiro ano")+"</span><h2>"+(G.nome?esc(G.nome)+", ":"")+(r?"sua carreira parou em "+MES[G.m].toLowerCase():"você completou o primeiro ano")+'</h2><div class="placa'+(RUINS.includes(a.tipo)?" mal":"")+'">'+e[0]+"</div>"+ps(e[1])+'<div class="hol"><div class="cab">Balanço do ano</div>'+linhas(a.L)+'<div class="l"><span>Na conta</span><span>'+brl(G.conta)+'</span></div><div class="l"><span>Guardado</span><span>'+brl(G.reserva)+"</span></div>"+(G.divida>0?'<div class="l"><span>Dívida</span><span class="neg">'+brl(-G.divida)+"</span></div>":"")+(a.parc?'<div class="l"><span>Parcelas que ainda vão vencer</span><span class="neg">'+brl(-a.parc)+"</span></div>":"")+'<div class="l tot"><span>Você fecha o ano com</span><span'+(a.total<0?' class="neg"':"")+">"+brl(a.total)+'</span></div><div class="obs">'+esc(a.obs)+"</div></div>";s+='<div class="col2"><h3 style="font-size:22px">Sua meta: '+esc(G.meta.n.toLowerCase())+"</h3>"+ps("ok"===a.meta?"Você guardou "+brl(G.reserva)+" ao longo do ano. A meta de "+brl(G.meta.v)+" foi alcançada.":"A meta era "+brl(G.meta.v)+" e você guardou "+brl(G.reserva)+". "+(2===o.fase?"Com um filho pequeno e custo de vida alto, a conta era apertada desde o sorteio.":"Vale olhar como a baixa temporada pesou nos meses em que não sobrou nada."))+"</div>";const i=a.nota,t=a.selos.filter(a=>a).length;return s+='<div class="col2"><h3 style="font-size:22px">Nota do ano</h3><div class="nota">'+i.v+'<small> de 100</small></div><div class="hol"><div class="cab">Como a nota foi calcu
