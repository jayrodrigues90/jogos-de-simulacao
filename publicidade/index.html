<style>
/* Layout: uma coluna de celular; no topo, a tira de contato do ano (12 quadros, um por mês) e os medidores; embaixo, uma cena por vez. Identidade: mesa de criação, papel off-white, tinta preta, rosa de marcador e amarelo-limão de marca-texto. */
:root{
  --papel:#F3F0E8; --cartao:#FFFDF8; --tinta:#16151A; --tinta2:#5B5750; --linha:#D6D0C2;
  --placa:#C8205F; --sobre-placa:#FFFFFF; --marca:#E3F34B; --sobre-marca:#16151A;
  --bom:#1F7A4D; --ruim:#B3261E; --trilho:#E2DDCF;
  --f-tit:"Bricolage Grotesque","Arial Narrow",system-ui,sans-serif;
  --f-txt:"Instrument Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-mono:"DM Mono",ui-monospace,"SFMono-Regular",Menlo,monospace;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --papel:#141217; --cartao:#1E1B22; --tinta:#F1EEF3; --tinta2:#B0AAB8; --linha:#38333F;
  --placa:#FF7DAE; --sobre-placa:#141217; --marca:#E3F34B; --sobre-marca:#16151A;
  --bom:#6CD198; --ruim:#FF8A80; --trilho:#2B2731; color-scheme:dark } }
:root[data-theme="dark"]{
  --papel:#141217; --cartao:#1E1B22; --tinta:#F1EEF3; --tinta2:#B0AAB8; --linha:#38333F;
  --placa:#FF7DAE; --sobre-placa:#141217; --marca:#E3F34B; --sobre-marca:#16151A;
  --bom:#6CD198; --ruim:#FF8A80; --trilho:#2B2731; color-scheme:dark }

*{box-sizing:border-box}
body{background:var(--papel);color:var(--tinta);font-family:var(--f-txt);font-size:17px;line-height:1.5;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0 40px}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--papel)}
.col{max-width:520px;margin:0 auto;display:flex;flex-direction:column;gap:16px}
h1,h2,h3{font-family:var(--f-tit);text-wrap:balance;margin:0;line-height:1.02;letter-spacing:-.015em}
p{margin:0}
button{font:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:3px solid var(--marca);outline-offset:2px}
.rot{font-family:var(--f-mono);font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--tinta2)}

/* ---------- estrada do ano (HUD) ---------- */
.hud{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--papel);padding-block:10px 8px;
  display:flex;flex-direction:column;gap:8px;border-bottom:1px solid var(--linha)}
.ponto{display:grid;grid-template-columns:repeat(12,1fr);position:relative}
.ponto::before{content:"";position:absolute;left:4%;right:4%;top:7px;height:3px;background:repeating-linear-gradient(90deg,var(--linha) 0 6px,transparent 6px 10px)}
.furo{position:relative;display:flex;flex-direction:column;align-items:center;gap:3px;font-family:var(--f-mono);font-size:10px;color:var(--tinta2)}
.furo i{width:13px;height:13px;border-radius:2px;border:2px solid var(--linha);background:var(--papel);display:block}
.furo.foi i{background:var(--placa);border-color:var(--placa)}
.furo.agora i{background:var(--marca);border-color:var(--tinta);transform:scale(1.2) rotate(-6deg)}
.furo.agora{color:var(--tinta);font-weight:600}
.medidores{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
.med{display:flex;flex-direction:column;gap:3px;min-width:0}
.med b{font-family:var(--f-mono);font-weight:500;font-size:10px;letter-spacing:.03em;text-transform:uppercase;color:var(--tinta2);display:flex;justify-content:space-between;gap:4px}
.med b span{color:var(--tinta);font-variant-numeric:tabular-nums}
.barra{height:6px;background:var(--trilho);border-radius:1px;overflow:hidden}
.barra u{display:block;height:100%;background:var(--placa);transition:width .5s ease}
.med.baixo .barra u{background:var(--ruim)}
.med.baixo b span{color:var(--ruim)}
.grana{display:flex;flex-wrap:wrap;gap:4px 14px;align-items:baseline;font-family:var(--f-mono);font-size:12px;color:var(--tinta2);font-variant-numeric:tabular-nums}
.grana strong{color:var(--tinta);font-weight:600}
.grana .deve strong{color:var(--ruim)}
.grana button{margin-left:auto;background:none;border:0;padding:2px 0;font-family:var(--f-mono);font-size:11px;color:var(--tinta2);text-decoration:underline;text-underline-offset:3px}

/* ---------- cena ---------- */
.cena{display:flex;flex-direction:column;gap:14px;padding-top:6px;animation:entra .28s ease both}
@keyframes entra{from{opacity:.4;transform:translateY(6px)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion:reduce){.cena{animation:none}.barra u{transition:none}}
.cena h2{font-size:clamp(28px,8vw,36px);font-weight:900}
.cena .texto{display:flex;flex-direction:column;gap:10px;max-width:60ch}
.ops{display:flex;flex-direction:column;gap:8px;margin-top:4px}
.op{display:grid;grid-template-columns:auto 1fr;gap:12px;align-items:start;text-align:left;width:100%;
  background:var(--cartao);border:1.5px solid var(--linha);border-radius:4px;padding:13px 14px;font-weight:500;line-height:1.35}
.op kbd{font-family:var(--f-mono);font-size:12px;font-weight:600;color:var(--placa);padding-top:2px}
.op small{display:block;font-weight:400;font-size:14px;color:var(--tinta2);margin-top:2px}
a.op{color:inherit;text-decoration:none}
.op:hover{border-color:var(--placa)}
.op:active{transform:translateY(1px)}
.op.ir{background:var(--placa);border-color:var(--placa);color:var(--sobre-placa);font-weight:600;grid-template-columns:1fr;text-align:center}
.fichas{display:flex;flex-wrap:wrap;gap:6px}
.ficha{font-family:var(--f-mono);font-size:12px;padding:3px 8px;border:1px solid var(--linha);border-radius:3px;font-variant-numeric:tabular-nums}
.ficha.mais{color:var(--bom);border-color:currentColor}
.ficha.menos{color:var(--ruim);border-color:currentColor}
.lei{border-top:1px dashed var(--linha);padding-top:12px;display:flex;flex-direction:column;gap:6px;font-size:15.5px}
.lei em{font-style:normal;align-self:flex-start;background:var(--marca);color:var(--sobre-marca);font-family:var(--f-mono);font-size:11px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;padding:1px 6px}
/* etiqueta de briefing: carimbo levemente torto, com sombra dura de impressão */
.placa{align-self:flex-start;font-family:var(--f-tit);font-weight:800;font-size:16px;letter-spacing:.04em;text-transform:uppercase;
  background:var(--placa);color:var(--sobre-placa);padding:8px 14px 6px;border-radius:3px;transform:rotate(-1.4deg);box-shadow:3px 3px 0 var(--tinta)}
.placa::before{content:"";display:inline-block;width:9px;height:9px;border-radius:50%;background:var(--marca);margin-right:10px;vertical-align:1px}
.placa.mal{background:var(--ruim)}
.placa.peq{font-size:12.5px;padding:6px 11px 4px;box-shadow:2px 2px 0 var(--tinta)}
.placa.peq::before{width:7px;height:7px;margin-right:8px}

.hol{background:var(--cartao);border:1.5px solid var(--linha);border-radius:6px;padding:14px;font-family:var(--f-mono);font-size:13px;display:flex;flex-direction:column;gap:5px;font-variant-numeric:tabular-nums}
.hol .cab{font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--tinta2);padding-bottom:4px}
.hol .l{display:flex;justify-content:space-between;gap:10px}
.hol .l span:first-child{min-width:0}
.hol .l span:last-child{white-space:nowrap}
.hol .tot{border-top:1.5px solid var(--tinta);padding-top:6px;margin-top:3px;font-weight:600}
.hol .obs{color:var(--tinta2);font-size:13.5px;padding-top:4px;font-family:var(--f-txt)}
.neg{color:var(--ruim)}
.ficha-p{display:grid;grid-template-columns:auto 1fr;gap:7px 14px;font-size:16px;margin:0}
.ficha-p dt{font-family:var(--f-mono);font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--tinta2);padding-top:4px}
.ficha-p dd{margin:0}
.cracha{background:var(--cartao);border:1.5px solid var(--tinta);border-radius:4px;overflow:hidden;display:flex;flex-direction:column;box-shadow:4px 4px 0 var(--linha)}
.cracha .topo{background:var(--placa);color:var(--sobre-placa);padding:9px 14px;font-family:var(--f-mono);font-size:11px;letter-spacing:.08em;text-transform:uppercase;display:flex;justify-content:space-between;gap:8px}
.cracha .corpo{padding:14px}
ul.plano{margin:0;padding-left:18px;display:flex;flex-direction:column;gap:5px}
textarea,input[type=text]{font:inherit;color:var(--tinta);background:var(--cartao);border:1.5px solid var(--linha);border-radius:6px;padding:11px 12px;width:100%}
textarea{min-height:110px;resize:vertical}
.col2{display:flex;flex-direction:column;gap:10px}
.colega{border-top:1px dashed var(--linha);padding-top:10px;display:flex;flex-direction:column;gap:2px;font-size:15.5px}
.colega b{font-family:var(--f-tit);font-size:18px}
blockquote{margin:0;padding:0 0 0 12px;border-left:3px solid var(--marca);font-size:16px}
blockquote cite{display:block;font-style:normal;font-size:13px;color:var(--tinta2)}
.peca{display:flex;gap:10px;align-items:baseline;border-top:1px dashed var(--linha);padding:8px 0;font-size:16px}
.peca i{font-style:normal;font-family:var(--f-mono);font-size:11px;color:var(--placa);min-width:2.2em}
.temp{display:inline-block;font-family:var(--f-mono);font-size:11px;letter-spacing:.06em;text-transform:uppercase;border:1.5px solid currentColor;border-radius:3px;padding:1px 6px;align-self:flex-start}
.temp.alta{color:var(--bom)} .temp.media{color:var(--tinta2)} .temp.baixa{color:var(--ruim)}

.capa{padding-top:28px;display:flex;flex-direction:column;gap:18px}
.capa h1{font-size:clamp(50px,15.5vw,84px);font-weight:800;line-height:1.02;letter-spacing:-.035em}
.capa h1 span{background:var(--marca);color:var(--sobre-marca);padding:0 .1em;border-radius:.04em;box-decoration-break:clone;-webkit-box-decoration-break:clone}
.capa .lead{font-size:19px;max-width:34ch}
details{border-top:1px dashed var(--linha);padding-top:12px;font-size:15.5px}
details summary{cursor:pointer;font-weight:600}
details .dentro{display:flex;flex-direction:column;gap:10px;padding-top:10px;color:var(--tinta2)}
details .dentro strong{color:var(--tinta)}
label{font-weight:600;font-size:15px;display:flex;flex-direction:column;gap:6px}
.nota{font-family:var(--f-tit);font-weight:900;font-size:84px;line-height:.9;letter-spacing:-.03em;font-variant-numeric:tabular-nums}
.nota small{font-family:var(--f-mono);font-weight:500;font-size:13px;letter-spacing:.06em;text-transform:uppercase;color:var(--tinta2)}
.selos{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.selo{border:1.5px dashed var(--linha);border-radius:6px;padding:9px 10px;font-size:13.5px;line-height:1.35;color:var(--tinta2);min-width:0}
.selo b{display:block;font-family:var(--f-tit);font-size:16px;line-height:1.15;margin-bottom:3px}
.selo.tem{border-style:solid;border-color:var(--placa);background:var(--cartao);color:var(--tinta)}
.selo.tem b{color:var(--placa)}

.rod{margin-top:36px;padding-top:14px;border-top:1.5px dashed var(--linha);font-family:var(--f-mono);font-size:11.5px;line-height:1.55;color:var(--tinta2)}
.rod b,.rod a{color:var(--placa)}
.bloq{padding-top:40px;display:flex;flex-direction:column;gap:14px}
.bloq a{color:var(--placa);font-weight:700;word-break:break-all}
.acesso{display:flex;gap:10px;align-items:center;justify-content:space-between;flex-wrap:wrap;border:1.5px dashed var(--linha);border-radius:6px;padding:12px 14px}
.acesso p{font-size:15px;min-width:0;flex:1 1 220px}

,e.peca&&(a.pecas.includes(e.peca)||a.pecas.push(e.peca),o.push({k:"pc",v:e.peca})),e.grave&&(a.grave++,o.push({k:"g",v:1})),e.flag&&(a.flags[e.flag]=1),verificar(a),o}const o=(a,e,o,r)=>({l:a,f:()=>Object.assign({r:o},e,r||{})}),S3=(a,e,o,r)=>[e,o,r][a.p.esp],FIXOS=[{t:"Antes do primeiro dia",c:[1],x:a=>clt(a)?"Uma agência de publicidade da região te chamou para trabalhar com "+ESP[a.p.esp].h+'. O diretor diz: "Comece segunda-feira, em período de teste de duas semanas. Se der certo, a gente registra a sua carteira."':'O dono de uma padaria, indicado por um professor, quer uma identidade visual completa: logotipo, cardápio e fachada. Ele diz: "Pago R$ 900, e a gente acerta quando eu gostar do resultado. Fechado?"',lei:a=>clt(a)?'Todo empregado deve ser registrado desde o primeiro dia, e a carteira de trabalho é digital (CLT, arts. 29 e 41). Um "teste" de duas semanas, sem registro, é trabalho sem direitos: o período de experiência existe, mas é um contrato registrado, de no máximo 90 dias (CLT, art. 445, parágrafo único). Sem registro, você fica sem FGTS, sem INSS e sem proteção.':'Quem presta serviço por conta própria deve combinar por escrito o serviço, o valor, o prazo e a data de pagamento (Código Civil, arts. 593 a 609). Em criação, vale também combinar o uso: a cessão de direitos autorais deve ser feita por escrito e se presume onerosa (Lei 9.610/1998, art. 50). Sem isso, "quando eu gostar" vira cobrança sem prova.',o:[{l:a=>clt(a)?"Fazer as duas semanas de teste e esperar o registro":"Aceitar o combinado verbal e começar",f:a=>clt(a)?{c:-3,e:-6,r:'Na terceira semana, o diretor disse que "o orçamento do cliente caiu" e adiou o registro. Você trabalhou 20 dias sem carteira, sem FGTS e sem nenhum direito.'}:{s:-2,e:-5,r:'Você fez três versões do logotipo. O dono "não gostou do vermelho" e só pagou R$ 400, dois meses depois. Sem nada por escrito, você não tinha o que cobrar.'}},{l:a=>clt(a)?"Só começar depois de assinar o contrato e ter a carteira registrada":"Aceitar, mas fechar por escrito: escopo, número de revisões, valor, prazo de pagamento e o que o cliente pode fazer com a arte",f:a=>clt(a)?{c:3,a:2,r:"A agência registrou na hora, com contrato de experiência de 90 dias. Você começou na segunda com tudo no papel, e o diretor comentou que gosta de quem pergunta."}:{c:4,s:3,a:2,peca:"Identidade visual de uma padaria",r:"O dono assinou um contrato de uma página. O pagamento caiu na data combinada, e a identidade visual foi parar no seu portfólio, com autorização."}},{l:a=>clt(a)?"Perguntar aos colegas se a agência costuma registrar e, se for assim mesmo, aceitar":"Recusar o trabalho: você só aceita com contrato formal",f:a=>clt(a)?{c:-3,e:-2,r:'Os colegas disseram que "é assim mesmo". Dois estavam havia meses sem registro, sem FGTS e sem direito a nada.'}:{s:-3,e:2,r:"O dono procurou outra pessoa. Você ficou sem o trabalho, mas deixou claro que trabalha com contrato."}}]},{t:"O briefing de uma linha",d:1,x:a=>S3(a,'Uma rede de farmácias da região pede uma campanha de Carnaval. O briefing tem uma linha: "Quero vender mais." Prazo: dez dias, e você é quem conversa com o cliente.','Uma loja de móveis pede um filme de 30 segundos e quatro posts. O briefing tem uma linha: "Quero algo que viralize." Prazo: dez dias, e é você quem vai criar.',"Um shopping pede um plano de mídia para o Carnaval, com R$ 20 mil de verba e sem dizer qual é o objetivo da campanha. Prazo: dez dias, e o plano é seu."),nota:"Um bom briefing responde a seis perguntas: qual é o problema do cliente, quem queremos atingir, o que a campanha precisa conseguir (a meta), qual é a verba, qual é o prazo e o que não pode aparecer. Sem isso, a agência chuta, e o cliente reprova no fim.",o:[o("Parar e fazer ao cliente as perguntas do briefing, mesmo que isso atrase o começo em um dia",{c:3,a:4,e:-3},"Você mandou oito perguntas e marcou uma conversa de 20 minutos. O cliente percebeu que nem ele sabia a meta e agradeceu. A campanha começou com o rumo certo.",{peca:"Campanha de Carnaval"}),o("Começar com o que você supõe e apresentar no prazo",{a:-1,c:-3,e:-5},"Na apresentação, o cliente disse que não era aquilo e pediu tudo de novo. Você refez em duas noites."),o("Pesquisar o mercado sozinho e preencher o briefing por conta própria, sem consultar o cliente",{a:3,e:-4,c:1},"O levantamento ficou bom, mas o cliente discordou do público definido e pediu ajustes. Você ganhou repertório e perdeu tempo.")]},{t:"O anúncio que ataca o concorrente",c:[2],tag:"cons",x:a=>S3(a,"Você é quem recebe o pedido do cliente e leva à criação. ","Você é quem vai escrever e desenhar o anúncio. ","Você é quem vai planejar a veiculação nos jornais e nas rádios. ")+'O cliente, uma rede de supermercados da cidade, quer um anúncio que diga: "O concorrente é o mais caro da cidade. Aqui você paga menos em tudo." A pesquisa dele comparou só 12 produtos.',lei:"A publicidade comparativa não é proibida, mas precisa ser verdadeira, objetiva e comprovável, e não pode denegrir o concorrente (Código Brasileiro de Autorregulamentação Publicitária, do CONAR, art. 32). O Código de Defesa do Consumidor proíbe a publicidade enganosa, que induz o consumidor a erro, inclusive por omissão (CDC, art. 37, §§ 1º e 3º). O anúncio é avaliado como um todo, não só pela letra miúda.",o:[o("Fazer o anúncio como o cliente pediu: a pesquisa é dele",{c:-6,e:-3},"O concorrente notificou o cliente e pediu a retirada. O CONAR abriu uma representação, e o anúncio saiu do ar em uma semana. O desgaste ficou com a agência."),o("Fazer o anúncio e deixar a ressalva em letras miúdas, no rodapé",{c:-5,e:-2},'A mensagem principal continuou sendo "o concorrente é o mais caro". Para o consumidor e para o CONAR, o que vale é o que o anúncio comunica no conjunto, e o rodapé não desfez a afirmação.'),o('Propor comparar só o que dá para provar, com a fonte e a data da pesquisa no anúncio, sem chamar ninguém de "o mais caro"',{a:4,c:4,e:-3},'O anúncio ficou menos agressivo e mais confiável: "12 produtos básicos, em março, a média foi 8% menor aqui". O cliente reclamou no começo e depois viu as vendas subirem.')]},{t:"A foto do Google",c:[0],tag:"autor",x:a=>S3(a,"Você está montando a apresentação de uma campanha de turismo para um hotel.","Você está criando o cartaz e o post de uma campanha de turismo para um hotel.","Você está montando o plano de mídia de uma campanha de turismo para um hotel e o layout do anúncio de revista.")+' A foto perfeita da piscina está no site de um fotógrafo. O diretor de arte diz: "Tá na internet, é de todo mundo. Baixa e usa."',lei:"Foto, texto, ilustração, música e vídeo são obras protegidas, mesmo sem aviso de copyright, e usá-las em anúncio exige autorização do autor, em geral por licença (Lei 9.610/1998, arts. 7º, 22 e 29). Estar na internet não significa ser de domínio público. Bancos de imagens vendem licenças, e as gratuitas costumam ter regras de uso e de crédito.",o:[o("Comprar a licença em um banco de imagens (ou pedir autorização ao fotógrafo) e guardar o comprovante, com o tipo de uso e o prazo",{a:4,c:4,e:-2},"A licença custou R$ 90 e cobriu anúncio impresso e digital por um ano. O comprovante ficou na pasta do job, e ninguém precisou se preocupar depois.",{peca:"Campanha de turismo de um hotel"}),{l:"Baixar a foto e usar na peça final",f:a=>Object.assign({c:-8,e:-4,r:"Seis semanas depois do anúncio, o fotógrafo mandou uma notificação pedindo R$ 4 mil pelo uso sem autorização. A agência negociou e pagou, e o episódio ficou na memória do cliente."},FL(a,{d:-400}))},o('Usar a foto e escrever "Foto: reprodução" no canto',{c:-5},'Crédito não substitui autorização. "Reprodução" só avisa que a foto não é sua; não dá a você o direito de usá-la.')]},{t:"O filme sem papel assinado",c:[2],tag:"autor",x:a=>S3(a,"Você acompanha o cliente na aprovação do roteiro do filme de Dia das Mães de uma loja de departamentos.","Você está produzindo o filme de Dia das Mães de uma loja de departamentos.","Você planeja a veiculação do filme de Dia das Mães de uma loja de departamentos.")+' Na gravação, a produtora usou uma mãe e uma menina de 8 anos, vizinhas do diretor. Ninguém assinou nada: "Foi na boa, elas toparam rindo." O filme vai para a TV aberta, a internet e a mídia exterior.',lei:"A imagem de uma pessoa é um direito dela: usar o rosto ou a voz em publicidade exige autorização, de preferência por escrito, com prazo, mídias, território e valor (Constituição, art. 5º, X; Código Civil, art. 20). Para criança, a autorização é dada pelos responsáveis, e o trabalho artístico de menor pode depender de autorização da Justiça da Infância e da Juventude. Usar a imagem de alguém com fins comerciais, sem autorização, gera indenização sem que a pessoa precise provar prejuízo (Súmula 403 do Superior Tribunal de Justiça).",o:[o("Veicular o filme agora e pedir a assinatura depois, se alguém reclamar",{c:-8,e:-4},"A avó da menina viu o filme na TV e pediu a retirada. Sem documento, o cliente suspendeu a campanha, e a produtora refilmou com outra atriz, em cima da hora."),o("Pedir só uma autorização falada, por mensagem de áudio",{c:-3,e:-2},"O áudio ajuda, mas não diz por quanto tempo, em quais mídias e por qual valor. Quando a avó contestou, a conversa virou uma discussão sobre o que cada um entendeu."),o("Segurar a veiculação até ter o termo de autorização de uso de imagem, assinado pela mãe e pelos responsáveis da menina, com prazo, mídias e pagamento",{c:4,a:4,e:-4},"O termo atrasou o filme em dois dias. A produtora pagou um cachê às duas, e a menina ainda ganhou uma agenda de gravação respeitando os horários da escola. O filme foi ao ar sem nenhuma pendência.",{peca:"Filme de Dia das Mães"})]},{t:"A planilha do cliente",c:[0],tag:"dados",x:a=>S3(a,"Você recebe a planilha do cliente e vai coordenar a campanha. ","Você vai escrever o e-mail e a mensagem de WhatsApp. ","Você vai configurar o disparo e a segmentação. ")+'O cliente, uma rede de academias, entrega 12 mil nomes, CPFs, telefones e e-mails de ex-alunos e pede: "Dispara a promoção de Dia dos Namorados para todo mundo." A planilha tem até uma coluna com problemas de saúde, que os alunos informaram na matrícula.',lei:"A Lei Geral de Proteção de Dados (Lei 13.709/2018) exige que o uso de dados pessoais tenha uma finalidade e uma base legal, e que seja compatível com o motivo pelo qual o dado foi coletado (arts. 6º e 7º). Em marketing, a base mais comum é o consentimento, mas outras, como o legítimo interesse, pedem avaliação e registro. Dado de saúde é sensível e tem regras ainda mais rígidas (art. 11). O titular pode pedir para sair da lista a qualquer momento (art. 18), e quem compartilha dados também responde por eles (art. 42).",o:[o("Pedir ao cliente a base legal e a finalidade, usar só contatos que aceitaram receber ofertas, deixar a coluna de saúde de fora e incluir um jeito de sair da lista em toda mensagem",{a:5,c:4,e:-3},"A lista caiu para 7 mil contatos, mas as mensagens foram abertas com mais frequência. O cliente passou a pedir o parecer da agência antes de usar qualquer base."),o("Disparar para todos: o cliente é o dono da lista",{c:-6,a:-1,e:-2},'Vários destinatários responderam: "De onde vocês tiraram o meu número?". Um deles registrou reclamação na ANPD, e o cliente culpou a agência.'),o("Disparar só por e-mail, que é menos invasivo que o WhatsApp",{c:-3,a:1},"Houve menos queixas, mas o problema ficou onde estava: sem base legal e sem finalidade, o canal pouco muda. E a coluna de saúde continuou no seu computador.")]},{t:"A trilha do filme",c:[1],tag:"autor",x:a=>S3(a,"O cliente, uma marca de sorvetes, aprovou o roteiro do filme de verão.","Você está editando o filme de verão de uma marca de sorvetes.","O filme de verão de uma marca de sorvetes entra no plano de mídia de TV, internet e cinema.")+' O editor colocou como trilha um sucesso internacional: "Ficou perfeito, o cliente já aprovou assim." Ninguém falou em licença.',lei:'Usar música em filme publicitário exige duas autorizações: a da obra (compositor e editora) e a da gravação (intérprete e gravadora), cobradas por prazo, território e mídia. A Lei dos Direitos Autorais exige autorização prévia e expressa para incluir a obra em produção audiovisual (Lei 9.610/1998, art. 29). Não existe regra de "até 30 segundos pode". Há alternativas: bibliotecas de trilhas com licença comercial, música original sob encomenda e obras cuja proteção já acabou (em regra, 70 anos depois da morte do autor, art. 41; a gravação tem prazo próprio).',o:[{l:"Manter a música: o cliente aprovou",f:a=>Object.assign({c:-8,e:-4,r:"Dias depois da estreia, a editora musical notificou a agência. O filme saiu do ar no auge do verão, e a licença cobrada depois, com multa, saiu muito mais cara que a original."},FL(a,{d:-500}))},o("Trocar por uma trilha de biblioteca com licença comercial (ou por música original) e guardar o contrato na pasta do job",{a:4,c:4,e:-3},"A troca custou uma tarde e R$ 380 do orçamento de produção. O cliente ficou aliviado ao ver o contrato de licença anexado à pasta do projeto.",{peca:"Filme de verão de uma marca de sorvetes"}),o('Cortar só 15 segundos da música: "até 30 segundos pode"',{c:-6,a:-1},"O mito não existe na lei: qualquer trecho precisa de autorização. A editora cobrou o uso do mesmo jeito, e o cliente perguntou de onde você tirou essa regra.")]},{t:"Mensagem às 23h",c:[1],x:a=>clt(a)?'Dia dos Pais. Na véspera da entrega, o diretor manda no grupo da agência, às 23h: "Pessoal, o cliente pediu ajustes de última hora. Preciso de tudo até as 8h." Nos últimos três dias, você ficou até as 22h e ninguém falou em pagamento ou compensação.':'Dia dos Pais. Um cliente fixo manda mensagem às 23h: "Preciso de mais uma versão até as 8h. O contrato diz duas rodadas de ajuste, mas essa é rapidinha." Já é a quinta versão da semana.',lei:a=>clt(a)?"A jornada é de até 8 horas por dia e 44 por semana, e as horas extras são limitadas a 2 por dia e devem ser pagas com adicional de pelo menos 50% ou compensadas conforme acordo (Constituição, art. 7º, XIII e XVI; CLT, art. 59). Empresas com mais de 20 empregados devem controlar a jornada (CLT, art. 74, § 2º). Mensagem do chefe pelo celular também é ordem de trabalho: os meios eletrônicos de comando equivalem aos pessoais (CLT, art. 6º, parágrafo único).":"Quem presta serviço por conta própria define no contrato o que entra no preço: escopo, número de rodadas de ajuste, prazo e valor da hora extra. O que não está escrito costuma virar trabalho de graça. Se o cliente passa a mandar ordens, controlar horário e exigir exclusividade como num emprego, o contrato pode ser reconhecido como vínculo de emprego (CLT, art. 3º).",o:[{l:a=>clt(a)?'Fazer e não registrar as horas: "é só desta vez"':"Fazer de graça para manter o cliente",f:a=>clt(a)?{c:-2,e:-8,r:"Você terminou à 1h. Sem registro no ponto, as horas não existiram: na hora de pedir a compensação, não havia como provar nada. E o diretor passou a contar com isso."}:{c:-1,e:-8,s:1,r:'O cliente agradeceu e, na semana seguinte, mandou mais duas versões "rapidinhas", também de graça. Você aprendeu que o preço do que fica de fora do contrato é o seu tempo.'}},{l:a=>clt(a)?"Fazer, registrar as horas no controle de ponto e combinar por escrito se serão pagas ou compensadas":"Responder que a rodada extra entra no orçamento pela tabela do contrato e entregar às 12h",f:a=>clt(a)?{c:3,a:1,e:-5,r:'Você fez o ajuste, registrou o horário e mandou uma mensagem ao diretor: "Anotei 3 horas extras, prefere banco de horas ou pagamento?". Ele escolheu o banco de horas, e ficou tudo no papel.'}:{c:3,a:2,e:-3,d:120,r:"O cliente reclamou um pouco, mas pagou R$ 120 pela rodada extra e entendeu que o contrato vale para os dois lados."}},o("Não responder e entregar só de manhã, sem avisar",{c:-6,s:-2,e:2},"O diretor (ou o cliente) leu o silêncio como abandono. Você dormiu melhor, mas a confiança caiu.")]},{t:'O "publi" que ninguém marcou',c:[0],tag:"cons",x:a=>S3(a,"Você atende o cliente e as influenciadoras. ","Você roteiriza os vídeos. ","Você acompanha o impulsionamento dos vídeos. ")+'Para o lançamento de uma linha de tênis, o cliente contratou duas influenciadoras. Os vídeos ficaram ótimos, mas elas dizem que não vão avisar que é publicidade: "A audiência foge." O cliente pede que a agência "dê um jeito".',lei:'A publicidade deve ser identificada como tal, de forma fácil e imediata (CDC, art. 36). O Código do CONAR e o Guia de Publicidade por Influenciadores pedem que a identificação seja clara e visível, como "publicidade" ou "#publi", no início do conteúdo, em cada postagem, e não escondida no meio de uma lista de hashtags. Anunciante, influenciador e agência podem ser chamados a responder.',o:[o("Exigir uma identificação clara de publicidade, no começo do vídeo e na legenda, e explicar ao cliente que isso protege a marca",{c:4,a:3,e:-2},"As influenciadoras reclamaram, mas aceitaram. O engajamento caiu pouco, e a campanha terminou sem nenhuma denúncia.",{peca:"Lançamento com influenciadoras"}),o("Publicar sem identificação: o cliente pediu",{c:-6,e:-2},"A postagem foi denunciada ao CONAR, que recomendou a correção. O cliente e as influenciadoras tiveram que refazer as legendas, e a agência perdeu credibilidade."),o("Pedir que a hashtag fique no fim da legenda, no meio de outras vinte",{c:-4,a:-1},"Escondida entre vinte hashtags, a indicação não é clara nem imediata. O CONAR entende que isso não identifica a publicidade.")]},{t:"O filme do Dia das Crianças",c:[2],tag:"cons",x:a=>S3(a,"Você é quem defende o conceito diante do cliente. ","Você é quem vai criar o filme e o brinde. ","Você é quem vai planejar onde o filme vai passar. ")+'Para o Dia das Crianças, uma rede de brinquedos quer um filme em que um personagem de desenho diz às crianças: "Peça pra sua mãe comprar!". Dentro da embalagem, um brinde colecionável. E um canal de "unboxing" com crianças, impulsionado em vídeos infantis.',lei:"O Código de Defesa do Consumidor proíbe a publicidade abusiva, que se aproveita da deficiência de julgamento e de experiência da criança (CDC, art. 37, § 2º). A Resolução 163/2014 do Conanda considera abusiva a publicidade dirigida à criança para persuadi-la ao consumo, e cita, por exemplo, linguagem infantil, personagens e desenhos animados, representação de criança e brindes colecionáveis. Quem decide a compra é o adulto: a comunicação que fala com o adulto é a saída mais segura.",o:[o("Fazer como o cliente quer: toda a concorrência faz assim",{c:-6,e:-2},"Uma entidade de defesa da criança denunciou o filme ao CONAR e ao Ministério Público. O cliente pediu à agência que explicasse por que não alertou."),o('Colocar a frase "Peça para um adulto" no rodapé',{c:-3,a:-1},"A frase no rodapé não muda o que o filme faz: o personagem continua falando direto com as crianças, e o brinde continua sendo o atrativo."),o("Mudar o foco: falar com os pais, mostrar o produto e o preço com clareza, sem personagem infantil, sem apelo direto à criança e sem brinde colecionável",{a:4,c:4,e:-3},'O filme ficou menos "fofinho" e mais informativo. O cliente reclamou nos primeiros dias, mas as vendas bateram a meta e o filme passou em todos os canais sem nenhuma queixa.',{peca:"Campanha de Dia das Crianças"})]},{t:"O 70% que não existe",c:[1],tag:"cons",x:a=>S3(a,"Você atende o cliente e leva o pedido à criação. ","Você vai montar o banner e o vídeo. ","Você vai programar o impulsionamento nas redes e no buscador. ")+'Black Friday. A loja de eletrônicos quer um anúncio com "70% OFF". A diretoria conta, sem rodeios: "Na quinta a gente sobe o preço em 40% e na sexta baixa em 30%. O desconto vai aparecer no site."',lei:"Anunciar desconto sobre um preço artificialmente inflado é publicidade enganosa (CDC, art. 37, § 1º). Fazer ou promover publicidade que se sabe enganosa é crime (CDC, art. 67). A oferta feita em publicidade obriga o anunciante (CDC, art. 30), e preço e condições devem ser informados com clareza (CDC, art. 31). No comércio eletrônico, as condições da oferta devem estar claras e em destaque (Decreto 7.962/2013, art. 2º).",o:[o("Fazer o anúncio como pedido: o preço é decisão do cliente",{grave:1,c:-12},"O Procon notificou a loja, que apresentou o histórico de preços. A agência, que sabia da manobra, foi chamada a explicar. Fazer ou promover publicidade que se sabe enganosa é crime, e o caso ficou registrado como incidente grave no seu nome."),o('Recusar o "70% OFF" falso, propor um desconto verdadeiro sobre o preço dos 30 dias anteriores e criar uma oferta forte de verdade, como frete grátis ou brinde',{a:5,c:4,e:-4},'Você mostrou o histórico de preços e propôs "até 25% off, preço mais baixo do ano". O desconto era menor, mas verdadeiro. A loja vendeu menos que o prometido, mas sem denúncia, e o diretor pediu uma reunião de planejamento para o ano seguinte.',{peca:"Campanha de Black Friday"}),o('Fazer o anúncio com "até 70% OFF", só em um produto, com estoque pequeno',{c:-5,a:-1},"Um item com 4 unidades virou a chamada principal. Vários consumidores reclamaram da propaganda, porque o desconto não estava ao alcance de ninguém.")]},{t:"O pitch de dezembro",d:1,x:a=>clt(a)?"Uma rede de clínicas convida a agência para um pitch: três agências apresentam ideias de campanha, e o cliente escolhe uma. Quem perde não recebe nada. O diretor quer que você prepare a apresentação completa (conceito, peças finais e plano de mídia) na semana do Natal. O prazo é de cinco dias.":"Uma rede de clínicas convida você para um pitch: três profissionais apresentam ideias de campanha, e o cliente escolhe uma. Quem perde não recebe nada. Você precisaria preparar a apresentação completa (conceito, peças finais e plano de mídia) na semana do Natal. O prazo é de cinco dias.",nota:"Pitch é a concorrência entre agências por uma conta. Ideias, em si, não são protegidas por direito autoral: o que a lei protege é a forma como a ideia foi expressa, como o texto, o layout ou o filme (Lei 9.610/1998, art. 8º, I). Por isso, apresentações de pitch costumam mostrar o conceito e o caminho, e deixar as peças finais, que são a parte cara, para depois do contrato.",o:[{l:"Entregar a campanha completa, com todas as peças finais",f:a=>rng(a)<.4?{s:5,c:3,a:4,e:-12,d:clt(a)?100:400,peca:"Campanha de pitch das clínicas",r:"Vocês ganharam a conta. O cliente elogiou a entrega impecável, e a agência começou o ano com um contrato novo. A semana do Natal, porém, foi inteira de trabalho."}:{a:4,e:-12,s:1,r:"Vocês perderam. Um mês depois, você viu uma peça muito parecida com uma das suas em um anúncio da rede, feito por outra agência. Ideia não tem proteção, e você não tinha um contrato que dissesse o contrário."}},{l:"Apresentar conceito, estratégia e dois exemplos de peça, deixar o restante para depois do contrato e registrar por escrito que o material é da agência",f:a=>({c:3,a:3,e:-5,r:"Você apresentou um caminho claro, mostrou dois exemplos e anexou uma nota: o material era um estudo da agência, sem cessão de uso. O cliente respeitou a postura. Ganhando ou perdendo, a sua ideia continuou sendo sua."})},o("Recusar o pitch: sem remuneração, você não participa",{e:6,s:-2},"Você passou o Natal em paz. A agência participou com outra pessoa, e o diretor registrou que você prefere trabalhar com contrato.")]}],ALEA={mei:{t:"Só com nota fiscal",d:1,q:a=>!clt(a)&&!a.p.mei,x:a=>"Uma agência da região quer fechar um pacote de seis jobs por mês com você, mas só contrata quem emite nota fiscal. Hoje você trabalha só com o CPF.",nota:'O MEI formaliza o trabalho por conta própria: paga todo mês um valor fixo (DAS, de R$ 86,05 em 2026 para serviços), emite nota fiscal, contribui para o INSS e pode ter um empregado. O limite de faturamento é de R$ 81 mil por ano. Nem toda atividade de publicidade e design está na lista de ocupações do MEI: "fotógrafo independente" e "editor de vídeo independente", por exemplo, constam. Confira no Portal do Empreendedor antes de abrir. Se a sua atividade não constar, é preciso outro enquadramento.',o:[{l:"Abrir o MEI esta semana, depois de conferir se a sua atividade está na lista",f:a=>(a.p.mei=1,{s:6,c:2,e:-3,r:"O cadastro levou uma tarde no portal gov.br. A partir de agora, R$ 86,05 saem todo mês, com trabalho ou sem. Em troca, mais agências podem te contratar."})},o("Continuar com CPF e procurar clientes que aceitem recibo",{e:2,s:-3},"Sem custo fixo, mas com menos portas abertas. Algumas agências nem respondem quando você diz que não emite nota."),o("Emitir a nota pelo CNPJ de um amigo",{c:-6,s:-2},"Funcionou uma vez. Na segunda, o financeiro da agência estranhou um designer emitindo nota por uma loja de peças, e você perdeu o cliente. Emitir nota em nome de terceiro é fraude.")]},pj:{t:"Contrato de PJ com horário",c:[2],q:a=>!clt(a),x:a=>'Uma agência quer te contratar como PJ para um "trabalho fixo": entrar às 9h, sair às 18h, seguir a chefia direta do diretor de criação e não atender mais ninguém. O pagamento é de R$ 2.400 por mês, sem 13º, sem férias e sem FGTS.',lei:'A contratação de autônomo é legítima quando cumpridas as formalidades legais, mesmo com exclusividade (CLT, art. 442-B). Mas só vale se houver autonomia de fato: com horário fixo, chefia direta, ordens pessoais e habitualidade, o contrato pode ser reconhecido como emprego, mesmo que o papel diga "PJ" (CLT, arts. 3º e 9º). A orientação dos tribunais sobre esse tema muda com frequência: confira sempre a versão vigente.',o:[o('Aceitar: o valor parece bom, e os direitos você "resolve depois"',{d:300,e:-5,c:-2},"O valor parecia bom no primeiro mês, mas na conta não entram 13º, férias nem FGTS, e a agência pode encerrar o contrato a qualquer momento, sem direito a nada. Você ficou sem folga, sem reserva e sem cobertura."),o("Recusar na hora e encerrar a conversa",{e:2,s:-2},"Sem reunião, sem proposta e sem relação. A agência procurou outra pessoa, e você ficou sem a oportunidade e sem saber como ela podia ter sido ajustada."),o("Propor duas saídas: ser registrado como empregado ou fechar um contrato de serviço por entrega, com escopo, prazo e liberdade de horário",{c:3,a:2,e:-2},"A agência preferiu o contrato por entrega, com prazo e liberdade de horário. Ficou claro o que cada um devia, e você manteve o direito de atender outros clientes.")]},home:{t:"Home office, com o seu notebook",c:[1],q:clt,x:a=>'A agência adotou o home office às quartas e sextas. O diretor avisa: "Cada um usa o próprio notebook e a própria internet. O resto a gente combina depois."',lei:'O trabalho remoto é permitido (CLT, arts. 75-A a 75-F), mas a responsabilidade por equipamentos, infraestrutura e reembolso de despesas deve estar prevista em contrato escrito (CLT, art. 75-D). Combinar "depois" costuma significar que o custo fica com o empregado.',o:[o("Aceitar sem perguntar: é a regra de todo mundo",{e:-2,d:-250},"Você passou a pagar uma internet mais cara e, em três meses, o notebook pifou. Sem nada escrito, a agência disse que o equipamento era seu."),o("Pedir que o home office, os equipamentos e o reembolso de despesas sejam combinados por escrito, num aditivo ao contrato",{c:2,a:1,e:3},"O diretor concordou: a agência passou a emprestar um notebook e a pagar uma ajuda para a internet. Todo mundo ganhou clareza."),o("Recusar o home office e ir todo dia à agência",{e:-2,s:1,c:-1},"Você economizou a discussão, mas perdeu duas horas por dia no trânsito e a flexibilidade que os colegas passaram a ter.")]},assedio:{t:"A reunião de aprovação",c:[1],x:a=>'Na reunião de aprovação, o diretor de criação ridiculariza em voz alta uma estagiária: "Isso é trabalho de quem nunca viu um anúncio na vida." Ela sai da sala chorando. Os colegas olham para baixo.',lei:"Humilhações repetidas no trabalho podem configurar assédio moral, que dá direito a indenização por dano moral (Constituição, art. 5º, V e X; Código Civil, arts. 186 e 927; CLT, art. 223-B). Quem presencia pode apoiar a vítima, registrar o que viu e usar os canais da empresa, como RH, ouvidoria e sindicato, ou procurar o Ministério Público do Trabalho. Criticar o trabalho é legítimo; humilhar a pessoa, não.",o:[o("Ficar quieto: não é com você, e o diretor decide a sua renovação",{e:-3,c:-2},"Você saiu da reunião com um nó no estômago. Dois dias depois, a estagiária pediu demissão sem explicar o motivo."),o("Procurar a estagiária, perguntar como ela está e oferecer ajuda para registrar o ocorrido, com datas e testemunhas, no RH ou na ouvidoria",{c:3,s:2,e:-3},"Ela agradeceu e registrou a queixa. O RH conversou com o diretor, e a agência passou a ter um canal de denúncia. Você ficou conhecido como alguém em quem se pode confiar."),o("Responder na hora, na frente de todos, defendendo a estagiária e criticando o diretor",{c:-3,e:-2,s:1},"Você disse o que sentia, mas a reunião virou uma discussão entre vocês dois, e o problema da estagiária ficou em segundo plano.")]},vazou:{t:"O e-mail para a pessoa errada",c:[0],tag:"dados",x:a=>"Você mandou, por engano, a planilha de um cliente, com nome, CPF e telefone de 2 mil clientes, para o e-mail de um fornecedor que não deveria recebê-la. Você percebeu 20 minutos depois.",lei:"A LGPD exige medidas de segurança para proteger dados pessoais (art. 46). Em caso de incidente que possa causar risco ou dano relevante às pessoas, o responsável pelos dados (o controlador, em geral o cliente) deve comunicar a ANPD e os titulares em prazo razoável (art. 48), e a agência, quando atua em nome do cliente, deve avisá-lo para que ele possa agir. Esconder o incidente piora o problema.",o:[o("Avisar na hora o gestor da agência e o cliente, pedir ao fornecedor que apague e confirme por escrito e registrar o que aconteceu",{c:4,a:3,e:-4},"O cliente avaliou o risco e decidiu comunicar. A agência mostrou o registro, o fornecedor confirmou a exclusão, e o cliente passou a exigir senha em toda planilha. Foi desconfortável, mas dentro das regras."),o("Apagar o e-mail enviado e torcer para ninguém ter aberto",{c:-6,e:-4},"O fornecedor tinha aberto e baixado o arquivo. Dias depois, o cliente soube pelo próprio fornecedor, e a agência perdeu a confiança dele."),o("Mandar uma mensagem ao fornecedor pedindo que apague, sem contar a ninguém",{c:-3,a:1,e:-3},"O fornecedor apagou, mas ninguém na agência nem no cliente sabia do incidente. Se tivesse havido vazamento, ninguém teria agido a tempo.")]},form:{t:"O formulário que pede tudo",c:[1],tag:"dados",x:a=>'A página de uma promoção, em que o cliente sorteia uma geladeira, pede CPF, data de nascimento, renda, endereço completo e foto do documento só para participar. O cliente diz: "Quanto mais dados, melhor. Depois a gente usa em outras campanhas."',lei:"A LGPD manda coletar só o que é necessário para a finalidade informada (princípios da finalidade, da adequação e da necessidade, art. 6º, I a III) e informar com clareza para que os dados serão usados (art. 9º). Usar depois para outra finalidade, que o titular não esperava, exige nova base legal. Dado desnecessário também é risco: se vazar, a responsabilidade é de quem o coletou.",o:[o("Manter todos os campos: o cliente pediu",{c:-5,a:-1},'Duas semanas depois, o formulário apareceu em uma reclamação: "Por que pedem foto do meu documento para participar de um sorteio?". A agência teve que justificar campos que nunca precisou usar.'),o("Pedir só o necessário (nome, e-mail, aceite do regulamento e da política de privacidade), explicar para que serão usados e definir por quanto tempo serão guardados",{a:4,c:3,e:-2},"A página ficou mais curta, e as inscrições subiram 35%. O cliente se convenceu de que dado a mais é risco a mais, e não vantagem."),o("Manter os campos, mas guardar tudo em uma pasta protegida por senha forte",{c:-2,a:1},"A senha ajuda a proteger, mas não resolve o excesso: coletar o que não precisa continua errado, e a coleta já tinha sido feita.")]},iadados:{t:"O briefing no chat",c:[2],tag:"dados",x:a=>"Para ganhar tempo, você pensa em colar, no chat de uma ferramenta pública de inteligência artificial, o briefing completo do cliente, com a estratégia de lançamento ainda sigilosa e a lista de clientes dele, com nomes e telefones.",lei:"O que você cola em uma ferramenta de IA pode ser armazenado e processado fora do seu controle. Informações confidenciais do cliente costumam estar protegidas por contrato de sigilo, e dados pessoais seguem a LGPD: só se compartilham com base legal e finalidade, e com medidas de segurança (Lei 13.709/2018, arts. 6º, 7º e 46). Use ferramentas autorizadas pela agência, dados anonimizados e revise sempre o resultado: a responsabilidade pelo conteúdo é sua.",o:[o("Colar tudo: é só um chat",{c:-6,e:-2},"Semanas depois, uma peça da concorrência trouxe uma ideia muito parecida com a estratégia sigilosa do cliente. Não houve prova de vazamento, mas o cliente quis rever o contrato com a agência."),o("Não usar IA: é arriscado demais",{a:-2,e:-4},"Você fez tudo na mão e entregou no último minuto. Segurança é importante, mas o risco se resolve com regras de uso, não com a recusa da ferramenta."),o("Usar a ferramenta autorizada pela agência (ou dados anonimizados, sem informação confidencial) e revisar tudo o que a IA devolver",{a:4,c:3,e:-1},"Você economizou três horas sem expor o cliente, e ainda corrigiu dois números errados que a IA tinha inventado.")]},iaimg:{t:"A imagem que lembra demais",c:[2],tag:"autor",x:a=>'Você usou uma ferramenta de IA para gerar a mascote de uma campanha. O resultado ficou ótimo, mas lembra muito um personagem famoso de um desenho animado. O diretor diz: "Foi a IA que gerou, então é livre."',lei:"Personagens e obras protegidos continuam protegidos mesmo quando a imagem é gerada por IA: reproduzir ou imitar elementos de uma obra existente pode violar direitos autorais (Lei 9.610/1998, arts. 7º e 29). Além disso, os termos de uso da ferramenta definem se a imagem pode ser usada comercialmente, e o cliente deve ser informado de que a peça foi criada com apoio de IA.",o:[o("Usar a imagem: foi a IA que gerou",{c:-7,e:-3},'A empresa dona do desenho notificou o cliente. A campanha saiu do ar, e o diretor passou a pedir que "tudo o que a IA fizer seja conferido".'),o("Usar a imagem e não contar que foi feita por IA",{c:-5,a:-1},"Quando a notificação chegou, o cliente soube pela imprensa que a mascote tinha sido gerada por IA e passou a desconfiar do resto do trabalho."),o("Descartar a imagem, criar de novo com referências originais, conferir se lembra obras protegidas e avisar o cliente de que a peça foi feita com apoio de IA",{a:4,c:4,e:-3,peca:"Mascote criada com apoio de IA"},"A segunda mascote ficou original e passou na conferência. O cliente gostou da transparência e passou a pedir que a agência sempre informasse o uso de IA.")]},rosto:{t:"Os rostos da fila",c:[1],tag:"autor",x:a=>'Para o post de uma cafeteria, você fotografou a fila na calçada, com clientes sorrindo. Dá para reconhecer três rostos. O cliente quer impulsionar a foto: "É lugar público, não precisa de autorização."',lei:"Mesmo em lugar público, usar o rosto de uma pessoa identificável em publicidade exige autorização dela (Constituição, art. 5º, X; Código Civil, art. 20). Se alguém reclamar, a indenização independe de prova de prejuízo (Súmula 403 do STJ). Em ação de rua, quem posa para a foto assina um termo. Fotos de multidão, sem destaque para um rosto específico, têm tratamento diferente.",o:[o("Postar: é lugar público",{c:-5,e:-2},"Um dos clientes viu a foto impulsionada e pediu a remoção, citando o uso comercial da imagem. A cafeteria apagou o post e pagou uma compensação."),o("Pedir autorização por escrito a quem aparece de forma identificável, ou usar outra foto, sem rostos reconhecíveis, ou de modelos contratados",{c:4,a:3,e:-2},"Duas das três pessoas assinaram na hora; a terceira preferiu ficar de fora, e você cortou a foto. O post foi ao ar sem nenhum risco."),o("Desfocar só os olhos e impulsionar assim mesmo",{c:-3,a:-1},"Desfocar os olhos não impede que a pessoa seja reconhecida pela roupa, pelo cabelo e pelo lugar. A reclamação veio do mesmo jeito.")]},licenca:{t:"O programa pirata",c:[2],x:a=>clt(a)?'A licença do programa de edição de vídeo da agência venceu. O diretor diz: "Usa uma versão liberada, baixada de um fórum, até o orçamento da renovação sair. Ninguém vai saber." Você precisa entregar um filme na sexta.':'O programa de edição de vídeo custa R$ 160 por mês. Um colega indica uma versão "liberada", baixada de um fórum, que "funciona igualzinho". Você precisa entregar um filme na sexta.',lei:'Usar programa de computador sem licença viola os direitos do autor e é crime (Lei 9.609/1998, art. 12). Versões "crackeadas" também costumam trazer vírus que roubam senhas e arquivos de clientes. Há alternativas legítimas: assinaturas mensais, planos para estudantes, versões gratuitas e programas livres. O mesmo vale para fontes tipográficas, que têm licença própria.',o:[{l:"Baixar a versão liberada: é só até resolver",f:a=>({grave:1,c:-6,e:-4,r:"No terceiro dia, o computador ficou lento, e o antivírus encontrou um programa espião. Pior: uma fiscalização de licenças bateu na agência dias depois. Usar programa sem licença é crime, e o caso ficou registrado como incidente grave no seu nome."})},o("Usar a versão de teste de 7 dias e reinstalar a cada semana",{c:-2,e:-3},"O teste expira, e a cada reinstalação você perde as configurações. Quando o cliente pediu a licença do programa, você não tinha como comprovar."),{l:a=>clt(a)?"Avisar que não vai usar programa sem licença e propor renovar a assinatura, usar um programa livre ou pedir uma licença de estudante":"Assinar o plano mensal (ou usar um programa gratuito de licença livre) e repassar o custo da ferramenta no orçamento",f:a=>clt(a)?{a:3,c:3,e:-2,r:"O diretor resmungou, mas aprovou a renovação no mesmo dia. Você entregou o filme na sexta, sem risco para a agência."}:{a:3,c:2,e:-1,d:-160,r:"O custo apareceu no orçamento do job, e o cliente não reclamou. Você trabalha tranquilo e com os arquivos seguros."}}]},portfolio:{t:"O trabalho dele, o seu portfólio",c:[1],tag:"autor",x:a=>'Você quer mostrar no portfólio o site de um cliente, uma clínica, mas o contrato tem uma cláusula de confidencialidade e fala em "cessão dos direitos de uso" à clínica. Um recrutador pediu seu portfólio até sexta.',lei:"Quem cria uma obra tem o direito de ser reconhecido como autor (Lei 9.610/1998, art. 24, II), mas o que se pode fazer com o trabalho depende do que foi combinado: contratos de criação costumam ceder os direitos de uso ao cliente e prever confidencialidade. Em regra, o caminho é pedir ao cliente uma autorização por escrito, dizendo o que vai aparecer, ou mostrar apenas a parte pública.",o:[o("Colocar no portfólio: você é o autor, e o recrutador espera",{c:-5,s:1},'O cliente viu o seu portfólio e escreveu: "Isso está coberto pelo sigilo. Por favor, retire." Você teve que explicar ao recrutador por que tirou o principal projeto.'),o("Pedir ao cliente uma autorização por escrito, dizendo o que vai aparecer (ou mostrar só o que já é público)",{c:3,s:4,a:1,peca:"Site de uma clínica, com autorização"},'O cliente respondeu em um dia: "Pode mostrar, só tira os dados dos pacientes." O portfólio ficou com o trabalho e com a autorização anexada.'),o("Trocar o nome da clínica por um fictício e mostrar o mesmo site",{c:-3,s:1},"O layout continuava igual e reconhecível. O cliente notou, e a mentira sobre o nome pesou mais do que o uso em si.")]},sorteio:{t:"A moto do sorteio",c:[0],tag:"cons",x:a=>'A rede de lojas quer sortear uma moto entre quem compartilhar o post. "Começa na sexta. A gente só faz um regulamento simples e pronto."',lei:"A promoção em que se distribuem prêmios por sorteio, vale-brinde ou concurso, a título de propaganda, depende de autorização prévia do governo federal (Lei 5.768/1971; hoje, a Secretaria de Prêmios e Apostas do Ministério da Fazenda, pelo Sistema de Controle de Promoção Comercial, o SCPC). A análise leva em média cerca de 15 dias. Fazer a promoção sem autorização pode gerar multa e a suspensão da ação.",o:[o("Avisar que sorteio com prêmio exige autorização prévia, pedir a autorização com antecedência e ajustar o calendário da campanha",{c:4,a:3,e:-3},"A campanha começou duas semanas depois, com o número da autorização no regulamento. O cliente se queixou do atraso e depois agradeceu a segurança."),o("Começar na sexta e regularizar depois",{c:-6,e:-2},"A fiscalização notificou o cliente por promoção sem autorização, e a ação foi suspensa no meio. Os participantes ficaram sem resposta, e a agência ficou com o desgaste."),o('Chamar de "escolha aleatória" em vez de "sorteio"',{c:-4,a:-1},"Mudar o nome não muda a natureza da promoção. A fiscalização olha para o que a ação é, não para como é chamada.")]},reviews:{t:"Trinta avaliações de cinco estrelas",c:[2],tag:"cons",x:a=>'Um restaurante recém-aberto pede que a agência escreva 30 avaliações de cinco estrelas em perfis diferentes, "para a nota subir logo". "Todo mundo faz."',lei:"Avaliações falsas induzem o consumidor a erro e são publicidade enganosa (CDC, art. 37, § 1º). Fazer afirmação falsa ou enganosa sobre as características de um serviço é crime (CDC, art. 66). A plataforma também pode remover as avaliações e punir o perfil. O caminho honesto é pedir a clientes reais que avaliem.",o:[o("Escrever as 30 avaliações, com nomes diferentes",{grave:1,c:-10},"A plataforma detectou o padrão e removeu todas as avaliações, e um concorrente denunciou o restaurante. Fazer afirmação falsa sobre a qualidade de um serviço é crime, e o caso ficou registrado como incidente grave no seu nome."),o('Escrever só cinco, "para começar"',{c:-5,a:-1},"Cinco avaliações falsas também são falsas. A plataforma notou a repetição da linguagem e cortou o alcance do perfil."),o("Recusar e propor ações para gerar avaliações reais: QR code na mesa, convite depois da visita e resposta a todos os comentários",{c:4,a:3,e:-2,peca:"Plano de avaliações de um restaurante"},"Em um mês, o restaurante tinha 80 avaliações reais, nota 4,7 e três clientes que disseram ter chegado pelo QR code do guardanapo.")]},milagre:{t:"Dez quilos em sete dias",c:[0],tag:"cons",x:a=>'O cliente, uma loja de chás, quer o slogan: "Emagreça 10 kg em 7 dias, sem esforço. Aprovado por nutricionistas." Ele não tem estudo nem laudo.',lei:'Quem anuncia deve manter dados técnicos, fáticos e científicos que sustentem o que a publicidade afirma (CDC, art. 36, parágrafo único). Promessa de saúde e de emagrecimento sem comprovação é publicidade enganosa (CDC, art. 37, § 1º), e produtos ligados à saúde têm regras da Anvisa e do código do CONAR. Dizer "aprovado por nutricionistas" sem que exista essa aprovação é afirmação falsa.',o:[o("Explicar que promessa de saúde exige comprovação, pedir ao cliente os estudos e a regularização do produto e trocar o slogan por algo que ele possa provar",{a:4,c:4,e:-3},'O cliente não tinha estudo. O novo slogan, "Chá de ervas para a sua rotina", vendeu menos no primeiro mês, mas não gerou nenhuma denúncia, e o cliente passou a consultar a agência antes de prometer algo.'),o('Usar o slogan com um "resultados podem variar" no rodapé',{c:-5,a:-1},"O aviso não desfaz a promessa principal. Duas clientes reclamaram no Procon, e o anúncio foi retirado depois de uma notificação."),o("Tirar só a menção aos nutricionistas e manter a promessa de dez quilos",{c:-3},'A parte mais grave saiu, mas a promessa de "10 kg em 7 dias" continuou sem prova. A notificação veio do mesmo jeito.')]},acessivel:{t:"A página que ninguém consegue ler",c:[0],tag:"acess",x:a=>'A página da campanha usa texto cinza claro sobre fundo branco, tem um vídeo sem legenda e imagens sem descrição. Uma usuária cega escreve ao cliente: "Não consigo saber o que vocês estão oferecendo."',lei:"A Lei Brasileira de Inclusão exige que os sites mantidos por empresas com sede ou representação comercial no país sejam acessíveis à pessoa com deficiência (Lei 13.146/2015, art. 63). Na prática: contraste suficiente, legenda e transcrição de vídeos, texto alternativo nas imagens e navegação pelo teclado. Acessibilidade também ajuda quem está no celular, ao sol, sem som ou com conexão ruim.",o:[o("Corrigir: aumentar o contraste, legendar o vídeo, descrever as imagens e testar com leitor de tela e só com o teclado",{a:4,c:4,e:-3,peca:"Página de campanha acessível"},"A página ficou melhor para todo mundo. A usuária respondeu agradecendo e contou que ia indicar a loja."),o("Responder que a próxima campanha será acessível",{c:-4},"A usuária compartilhou a resposta nas redes. O cliente perdeu a confiança dela e de outros, e a agência foi cobrada na reunião."),o('Colocar só um botão de "alto contraste" no topo',{c:-1,a:1},"O botão ajudou um pouco, mas o vídeo continuou sem legenda e as imagens, sem descrição. Acessibilidade vai além do contraste.")]},conar:{t:"A carta do CONAR",c:[2],tag:"cons",x:a=>'O CONAR avisou a agência de que abriu uma representação contra um anúncio: um consumidor reclamou que o "frete grátis" só valia para compras acima de R$ 300, o que o anúncio não dizia. Prazo para a defesa: cinco dias.',lei:"O CONAR é uma entidade de autorregulamentação: analisa denúncias e pode recomendar a alteração ou a suspensão do anúncio, sem substituir a Justiça nem o Procon. A defesa deve ser enviada no prazo. As condições de uma oferta devem estar claras no anúncio (CDC, arts. 30, 31 e 37), e anunciante, agência e veículo podem ser chamados a responder.",o:[o("Ignorar: é só uma carta",{c:-6,e:-2},"Sem defesa, o conselho decidiu pela sustação do anúncio e registrou a decisão no site. O cliente soube pela imprensa."),o("Tirar o anúncio do ar e dizer que ele nunca existiu",{c:-7,e:-3},"Havia capturas de tela, e o consumidor tinha guardado a página. A tentativa de negar piorou a situação."),o("Responder no prazo, com uma defesa organizada, e ajustar o anúncio para informar a condição do frete já no texto principal",{c:4,a:3,e:-3},"O CONAR recomendou apenas a correção do anúncio, que você já tinha feito. O cliente viu que a agência assume a responsabilidade.")]},slogan:{t:"O nome que já tem dono",c:[0],tag:"autor",x:a=>'A equipe de criação escolheu o nome da campanha de lançamento de um cliente: "Sabor Aurora". Todo mundo adorou. Ninguém pesquisou se já existe.',lei:"O nome, o logotipo e o slogan de um produto podem ser registrados como marca no INPI, e o titular tem direito de uso exclusivo no seu ramo de atividade (Lei 9.279/1996, art. 129). Antes de apresentar um nome, a agência deve consultar a base de marcas do INPI e a internet. Usar marca já registrada pode gerar proibição de uso e indenização.",o:[o("Consultar a base de marcas do INPI e a internet antes de apresentar e trocar o nome se houver colisão no mesmo ramo",{a:3,c:3,e:-2},'A busca achou "Sabor Aurora" registrado por uma marca de doces. Vocês ajustaram o nome e apresentaram uma versão livre de problema. O cliente pediu que isso virasse etapa fixa.'),o("Apresentar e deixar o cliente pesquisar: é função dele",{c:-4,a:-1},"O cliente imprimiu o material e só depois descobriu a marca. Teve que refazer tudo e perguntou o que a agência faz, afinal."),o("Registrar o nome no INPI em nome da agência, antes de apresentar",{c:-5,s:-1},"Registrar em nome da agência um nome criado para o cliente gerou uma disputa, e a agência perdeu o contrato.")]},cliente:{t:"O cliente que sumiu",d:1,q:a=>!clt(a),x:a=>'Uma empresa deve R$ 1.800 do último job. O financeiro responde só "estamos organizando os pagamentos". Faz 45 dias.',lei:"Quem presta serviço tem direito de cobrar o que combinou, e o contrato (ou ao menos as mensagens, a ordem de serviço e a nota fiscal) é a sua prova. Antes de ir à Justiça, há caminhos mais simples: notificação por escrito, acordo de parcelamento e protesto.",o:[o("Mandar uma notificação por escrito, com valor, prazo e as provas do serviço, e oferecer parcelar",{s:2,c:2,d:900,e:-3},"Em dez dias, o financeiro respondeu e parcelou em duas vezes. Você recebeu R$ 900 neste mês."),o("Ligar todos os dias até pagarem",{e:-6,c:-2,d:300},'Pagaram R$ 300 para você parar de ligar e disseram que o resto "vem quando vier". O cliente nunca mais te chamou.'),o("Esquecer a dívida e procurar clientes novos",{e:2,s:-2},'Você perdeu R$ 1.800 e ganhou tempo. Meses depois, a empresa contou a conhecidos que "nem foi cobrada".')]},revisoes:{t:"A sexta revisão",d:1,q:a=>!clt(a),x:a=>'Um cliente pede a sexta revisão do mesmo cartaz, e o contrato prevê duas rodadas. Cada rodada nova toma uma tarde sua. Ele diz: "É só mudar a cor do botão."',nota:'Contratos de criação costumam definir o número de rodadas de ajuste e o valor das rodadas extras. Sem isso, o cliente não sabe quanto custa pedir "só mais uma", e o criador acaba trabalhando de graça.',o:[o("Fazer a sexta revisão sem cobrar, para manter o cliente",{e:-6,c:1,s:1},"O cliente adorou e mandou a sétima na semana seguinte."),o("Fazer a revisão e cobrar as rodadas extras, avisando que, daqui para a frente, vale a tabela do contrato",{d:200,c:2,s:-1,e:-3},"O cliente reclamou um pouco, pagou os R$ 200 e passou a ser mais objetivo nos pedidos."),o('Encerrar o contrato: "Já fiz todas as rodadas que combinamos"',{e:3,s:-3,c:-1},"Você ficou livre, mas o cliente falou mal de você para dois conhecidos.")]},sono:{t:"Meia-noite",d:1,x:a=>"Faz semanas que você responde mensagem de cliente até meia-noite, e o celular vibra em cima da mesa até quando você dorme. Às 7h, você tem uma reunião de briefing.",o:[o("Definir um horário de atendimento e avisar os clientes",{e:9,s:-2},"Nas primeiras semanas, você perdeu dois jobs para quem respondeu de madrugada. Depois, passou a acordar descansado e a pensar melhor."),o("Continuar respondendo na hora",{e:-8,s:3},"Ninguém espera resposta sua à meia-noite. Você, por outro lado, já não lembra a última noite inteira de sono.")]},curso:{t:"Curso de tráfego pago",d:1,x:a=>"Abriu uma turma de um curso de 40 horas sobre anúncios no Google e nas redes sociais, com certificação, por R$ 480 (ou 4 × R$ 120).",o:[o("Fazer o curso completo, parcelado",{a:6,c:2,e:-5,parcela:{n:"Curso de tráfego pago",v:120,q:4}},"Você passou cinco sábados aprendendo a montar campanhas e a ler relatórios. Na semana seguinte, usou uma ferramenta em um job e economizou duas horas."),o("Fazer só os módulos gratuitos da plataforma",{a:3,e:-2},"Mais barato e mais flexível, mas sem a certificação nem a prática com as ferramentas."),o("Deixar passar e descansar",{e:4},"Você dormiu melhor neste mês. A turma fechou as inscrições.")]},proprio:{t:"Seu próprio projeto",d:1,x:a=>"Você teve uma ideia: um estúdio de conteúdo para pequenos comércios do bairro, com pacote mensal de posts, fotos e vídeos curtos. Ninguém na região faz algo assim.",nota:"Quem monta um negócio próprio assume o risco: contrato, preço, captação de clientes, nota fiscal, impostos e meses de baixa. A vantagem é construir uma marca e uma carteira que são suas.",o:[{l:"Lançar este ano, com divulgação no bairro e nas redes",f:a=>rng(a)<.6?{flag:"proprio",s:6,a:4,e:-6,d:300,peca:"Pacote mensal para pequenos comércios",r:"Em dois meses, oito comércios fecharam pacote mensal. Uma associação de lojistas pediu uma proposta para o ano seguinte."}:{flag:"proprio",a:5,s:2,e:-6,d:-150,peca:"Pacote mensal para pequenos comércios",r:"Só dois comércios fecharam, e vários pediram preço menor. O prejuízo foi pequeno, mas você aprendeu muito sobre precificar, vender e dizer não a pedido de desconto."}},o("Propor a ideia à agência, como parceria",{s:4,a:3,d:150},"A agência topou e ficou com parte da receita. Menos risco, menos ganho, e a marca do estúdio é dela."),o("Guardar a ideia para quando tiver mais experiência",{e:3},"Você descansou. Em dezembro, viu um estúdio de outra cidade anunciando um pacote parecido.")]},agenda:{t:"Dois prazos para o mesmo dia",d:1,x:a=>"Duas entregas na sexta: a campanha de um cliente fixo, pequeno e parceiro, e o job de um cliente novo e grande, que paga bem.",o:[{l:"Priorizar o cliente novo e pedir mais dois dias ao cliente fixo",f:a=>Object.assign({s:3,c:-1,r:"O cliente novo go
