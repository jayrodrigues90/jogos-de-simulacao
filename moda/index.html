<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bodoni+Moda:ital,opsz,wght@0,6..96,500;0,6..96,700;0,6..96,800;1,6..96,500;1,6..96,700&family=Jost:wght@400;500;600;700&display=swap">
<style>
/* Layout: uma coluna de celular; no topo, a fita métrica do ano (12 alfinetes, um por mês) e os medidores em pontos de costura; embaixo, uma cena por vez. Identidade: ateliê. Linho claro, verde-garrafa de alfaiataria, coral de etiqueta, serifa de revista de moda. */
:root{
  --papel:#F3EEE5; --cartao:#FCFAF5; --tinta:#1C1A17; --tinta2:#5E574D; --linha:#D9D1C2;
  --placa:#14543F; --sobre-placa:#FFFFFF; --marca:#FF6B4A; --sobre-marca:#1C1A17;
  --bom:#2E7D32; --ruim:#B3261E; --trilho:#E4DCCB;
  --f-tit:"Bodoni Moda","Didot","Bodoni 72",Georgia,serif;
  --f-txt:"Jost","Futura","Avenir Next",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-mono:"Jost","Futura","Avenir Next",system-ui,sans-serif;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --papel:#111512; --cartao:#1A201C; --tinta:#EFEBE2; --tinta2:#A9B0A6; --linha:#333B36;
  --placa:#6FD0A5; --sobre-placa:#0F1512; --marca:#FF8265; --sobre-marca:#1C1A17;
  --bom:#7BD88F; --ruim:#FF8A80; --trilho:#28302B; color-scheme:dark } }
:root[data-theme="dark"]{
  --papel:#111512; --cartao:#1A201C; --tinta:#EFEBE2; --tinta2:#A9B0A6; --linha:#333B36;
  --placa:#6FD0A5; --sobre-placa:#0F1512; --marca:#FF8265; --sobre-marca:#1C1A17;
  --bom:#7BD88F; --ruim:#FF8A80; --trilho:#28302B; color-scheme:dark }

*{box-sizing:border-box}
body{background:var(--papel);color:var(--tinta);font-family:var(--f-txt);font-size:17px;line-height:1.5;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0 40px}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--papel)}
.col{max-width:520px;margin:0 auto;display:flex;flex-direction:column;gap:16px}
h1,h2,h3{font-family:var(--f-tit);text-wrap:balance;margin:0;line-height:1.04;letter-spacing:-.01em}
p{margin:0}
button{font:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:3px solid var(--marca);outline-offset:2px}
.rot{font-family:var(--f-mono);font-size:11.5px;font-weight:600;letter-spacing:.14em;text-transform:uppercase;color:var(--tinta2)}

/* ---------- fita métrica do ano (HUD) ---------- */
.hud{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--papel);padding-block:10px 8px;
  display:flex;flex-direction:column;gap:9px;border-bottom:1px solid var(--linha)}
.ponto{display:grid;grid-template-columns:repeat(12,1fr);position:relative;padding-top:2px}
.ponto::before{content:"";position:absolute;left:0;right:0;top:0;height:10px;border-radius:2px;background:var(--trilho);
  background-image:repeating-linear-gradient(90deg,var(--tinta2) 0 1px,transparent 1px 8px);background-size:100% 5px;background-repeat:no-repeat;background-position:bottom}
.furo{position:relative;display:flex;flex-direction:column;align-items:center;gap:3px;font-family:var(--f-mono);font-size:10.5px;font-weight:500;color:var(--tinta2);padding-top:9px}
.furo i{width:11px;height:11px;border-radius:50%;border:2px solid var(--tinta2);background:var(--papel);display:block}
.furo.foi i{background:var(--placa);border-color:var(--placa)}
.furo.agora i{background:var(--marca);border-color:var(--tinta);transform:scale(1.35)}
.furo.agora{color:var(--tinta);font-weight:700}
.medidores{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
.med{display:flex;flex-direction:column;gap:3px;min-width:0}
.med b{font-family:var(--f-mono);font-weight:600;font-size:10px;letter-spacing:.04em;text-transform:uppercase;color:var(--tinta2);display:flex;justify-content:space-between;gap:3px}
.med b span{color:var(--tinta);font-variant-numeric:tabular-nums;letter-spacing:0}
.barra{height:4px;background:transparent;border-bottom:1.5px dashed var(--linha);position:relative}
.barra u{display:block;height:4px;background:repeating-linear-gradient(90deg,var(--placa) 0 6px,transparent 6px 9px);transition:width .5s ease}
.med.baixo .barra u{background:repeating-linear-gradient(90deg,var(--ruim) 0 6px,transparent 6px 9px)}
.med.baixo b span{color:var(--ruim)}
.grana{display:flex;flex-wrap:wrap;gap:4px 14px;align-items:baseline;font-family:var(--f-mono);font-size:13px;color:var(--tinta2);font-variant-numeric:tabular-nums}
.grana strong{color:var(--tinta);font-weight:700}
.grana .deve strong{color:var(--ruim)}
.grana button{margin-left:auto;background:none;border:0;padding:2px 0;font-family:var(--f-mono);font-size:12px;color:var(--tinta2);text-decoration:underline;text-underline-offset:3px}

/* ---------- cena ---------- */
.cena{display:flex;flex-direction:column;gap:14px;padding-top:6px;animation:entra .28s ease both}
@keyframes entra{from{opacity:.4;transform:translateY(6px)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion:reduce){.cena{animation:none}.barra u{transition:none}}
.cena h2{font-size:clamp(28px,8vw,36px);font-weight:700;font-style:italic}
.cena .texto{display:flex;flex-direction:column;gap:10px;max-width:60ch}
.ops{display:flex;flex-direction:column;gap:8px;margin-top:4px}
.op{display:grid;grid-template-columns:auto 1fr;gap:12px;align-items:start;text-align:left;width:100%;
  background:var(--cartao);border:1.5px solid var(--linha);border-radius:3px;padding:13px 14px;font-weight:500;line-height:1.35}
.op kbd{font-family:var(--f-tit);font-style:italic;font-size:22px;font-weight:700;line-height:1;color:var(--marca);padding-top:0}
.op small{display:block;font-weight:400;font-size:14px;color:var(--tinta2);margin-top:2px}
a.op{color:inherit;text-decoration:none}
.op:hover{border-color:var(--placa)}
.op:active{transform:translateY(1px)}
.op.ir{background:var(--placa);border-color:var(--placa);color:var(--sobre-placa);font-weight:600;grid-template-columns:1fr;text-align:center;letter-spacing:.02em}
.fichas{display:flex;flex-wrap:wrap;gap:6px}
.ficha{font-family:var(--f-mono);font-size:12.5px;font-weight:500;padding:3px 9px;border:1px solid var(--linha);border-radius:99px;font-variant-numeric:tabular-nums}
.ficha.mais{color:var(--bom);border-color:currentColor}
.ficha.menos{color:var(--ruim);border-color:currentColor}
.lei{border-top:2px dashed var(--linha);padding-top:12px;display:flex;flex-direction:column;gap:6px;font-size:15.5px}
.lei em{font-style:normal;align-self:flex-start;background:var(--marca);color:var(--sobre-marca);font-family:var(--f-mono);font-size:11px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;padding:2px 8px;border-radius:2px}
/* etiqueta de roupa: furo para o cordão, cantos arredondados, sombra dura */
.placa{align-self:flex-start;position:relative;font-family:var(--f-tit);font-weight:700;font-size:16px;letter-spacing:.06em;text-transform:uppercase;
  background:var(--placa);color:var(--sobre-placa);padding:9px 16px 7px 34px;border-radius:3px 14px 14px 3px;transform:rotate(-1.4deg);box-shadow:3px 3px 0 var(--tinta)}
.placa::before{content:"";position:absolute;left:11px;top:50%;width:10px;height:10px;margin-top:-5px;border-radius:50%;background:var(--papel);box-shadow:inset 0 0 0 2px color-mix(in srgb,var(--tinta) 35%,transparent)}
.placa.mal{background:var(--ruim);color:#fff}
.placa.peq{font-size:12.5px;padding:6px 12px 4px 27px;box-shadow:2px 2px 0 var(--tinta)}
.placa.peq::before{left:9px;width:8px;height:8px;margin-top:-4px}

.hol{background:var(--cartao);border:1.5px solid var(--linha);border-radius:3px;padding:14px;font-family:var(--f-mono);font-size:14px;display:flex;flex-direction:column;gap:5px;font-variant-numeric:tabular-nums}
.hol .cab{font-size:11.5px;font-weight:600;letter-spacing:.14em;text-transform:uppercase;color:var(--tinta2);padding-bottom:4px}
.hol .l{display:flex;justify-content:space-between;gap:10px}
.hol .l span:first-child{min-width:0}
.hol .l span:last-child{white-space:nowrap}
.hol .tot{border-top:1.5px solid var(--tinta);padding-top:6px;margin-top:3px;font-weight:700}
.hol .obs{color:var(--tinta2);font-size:14px;padding-top:4px;font-family:var(--f-txt)}
.neg{color:var(--ruim)}
.ficha-p{display:grid;grid-template-columns:auto 1fr;gap:7px 14px;font-size:16px;margin:0}
.ficha-p dt{font-family:var(--f-mono);font-size:11.5px;font-weight:600;letter-spacing:.14em;text-transform:uppercase;color:var(--tinta2);padding-top:4px}
.ficha-p dd{margin:0}
.cracha{background:var(--cartao);border:1.5px solid var(--tinta);border-radius:6px;overflow:hidden;display:flex;flex-direction:column;box-shadow:4px 4px 0 var(--linha)}
.cracha .topo{background:var(--placa);color:var(--sobre-placa);padding:9px 14px;font-family:var(--f-mono);font-size:11.5px;font-weight:600;letter-spacing:.14em;text-transform:uppercase;display:flex;justify-content:space-between;gap:8px;border-bottom:2px dashed color-mix(in srgb,var(--sobre-placa) 55%,transparent)}
.cracha .corpo{padding:14px}
ul.plano{margin:0;padding-left:18px;display:flex;flex-direction:column;gap:5px}
textarea,input[type=text]{font:inherit;color:var(--tinta);background:var(--cartao);border:1.5px solid var(--linha);border-radius:4px;padding:11px 12px;width:100%}
textarea{min-height:110px;resize:vertical}
.col2{display:flex;flex-direction:column;gap:10px}
.colega{border-top:2px dashed var(--linha);padding-top:10px;display:flex;flex-direction:column;gap:2px;font-size:15.5px}
.colega b{font-family:var(--f-tit);font-style:italic;font-size:19px}
blockquote{margin:0;padding:0 0 0 12px;border-left:3px solid var(--marca);font-size:16px}
blockquote cite{display:block;font-style:normal;font-size:13px;color:var(--tinta2)}
.peca{display:flex;gap:10px;align-items:baseline;border-top:2px dashed var(--linha);padding:8px 0;font-size:16px}
.peca i{font-style:normal;font-family:var(--f-tit);font-weight:700;font-size:13px;color:var(--marca);min-width:2.4em}
.temp{display:inline-block;font-family:var(--f-mono);font-size:11px;font-weight:600;letter-spacing:.12em;text-transform:uppercase;border:1.5px solid currentColor;border-radius:99px;padding:1px 9px;align-self:flex-start}
.temp.alta{color:var(--bom)} .temp.media{color:var(--tinta2)} .temp.baixa{color:var(--ruim)}

.capa{padding-top:28px;display:flex;flex-direction:column;gap:18px}
.capa h1{font-size:clamp(46px,14.5vw,80px);font-weight:800;line-height:1;letter-spacing:-.025em}
.capa h1 span{color:var(--marca);font-style:italic;text-decoration:underline dashed;text-decoration-thickness:.05em;text-underline-offset:.14em}
.capa .lead{font-size:19px;max-width:34ch}
.fita{position:relative;height:34px;border:1.5px solid var(--tinta);border-radius:3px;background:var(--cartao);overflow:hidden;
  background-image:repeating-linear-gradient(90deg,var(--tinta) 0 1px,transparent 1px 10px),repeating-linear-gradient(90deg,var(--tinta) 0 2px,transparent 2px 50px);
  background-size:100% 6px,100% 10px;background-repeat:no-repeat;background-position:bottom,bottom}
.fita span{position:absolute;top:4px;left:8px;font-family:var(--f-mono);font-size:11px;font-weight:600;letter-spacing:.34em;color:var(--tinta2);white-space:nowrap}
details{border-top:2px dashed var(--linha);padding-top:12px;font-size:15.5px}
details summary{cursor:pointer;font-weight:600}
details .dentro{display:flex;flex-direction:column;gap:10px;padding-top:10px;color:var(--tinta2)}
details .dentro strong{color:var(--tinta)}
label{font-weight:600;font-size:15px;display:flex;flex-direction:column;gap:6px}
.nota{font-family:var(--f-tit);font-weight:800;font-style:italic;font-size:88px;line-height:.9;letter-spacing:-.03em;font-variant-numeric:lining-nums tabular-nums}
.nota small{font-family:var(--f-mono);font-style:normal;font-weight:600;font-size:13px;letter-spacing:.12em;text-transform:uppercase;color:var(--tinta2)}
.selos{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.selo{border:1.5px dashed var(--linha);border-radius:4px;padding:9px 10px;font-size:13.5px;line-height:1.35;color:var(--tinta2);min-width:0}
.selo b{display:block;font-family:var(--f-tit);font-style:italic;font-size:16px;line-height:1.15;margin-bottom:3px}
.selo.tem{border-style:solid;border-color:var(--placa);background:var(--cartao);color:var(--tinta)}
.selo.tem b{color:var(--placa)}

/* créditos e bloqueio */
.rod{margin-top:36px;padding-top:14px;border-top:2px dashed var(--linha);font-family:var(--f-mono);font-size:12px;line-height:1.55;color:var(--tinta2)}
.rod b,.rod a{color:var(--placa)}
.bloq{padding-top:40px;display:flex;flex-direction:column;gap:14px}
.bloq a{color:var(--placa);font-weight:700;word-break:break-all}
.acesso{display:flex;gap:10px;align-items:center;justify-content:space-between;flex-wrap:wrap;border:1.5px dashed var(--linha);border-radius:4px;padding:12px 14px}
.acesso p{font-size:15px;min-width:0;flex:1 1 220px}
</style></head><body>

ias têxteis e redes regionais",m:1.18,d:.92,sal:2200}],CAPITAIS=[200,1e3,2500],METAS=[{n:"Equipamento de trabalho",v:1500,h:"Câmera, iluminação, steamer e araras de produção"},{n:"Reserva de emergência",v:3e3,h:"Para os meses vazios não virarem dívida"},{n:"Cursos e certificações",v:2400,h:"Visual merchandising, styling, fotografia e inglês"},{n:"Estúdio próprio",v:6e3,h:"Espaço, araras, acervo de peças e meses de fôlego para abrir o seu estúdio de styling. A meta mais alta"}],FOCOS=[{l:"Pesquisar tendências, montar moodboards e ampliar o repertório",h:"Sobe o Repertório",fx:{s:8,c:2,e:-3},m:1},{l:"Praticar styling, ajuste de peças e montagem de looks",h:"Sobe a Técnica",fx:{a:8,c:1,e:-2},m:.9},{l:"Aceitar toda produção que aparecer",h:"Mais produções, menos energia",fx:{e:-8,c:-1},m:1.35},{l:"Descansar e cuidar de você",h:"Sobe a Energia, menos produções",fx:{e:16},m:.75}],INTRO=["Janeiro. Liquidações de verão e as peças de outono-inverno a caminho. Os clientes estão de férias, e dá tempo de pesquisar.","Fevereiro. Carnaval e vitrines de volta às aulas. As semanas de moda já mostram o que vem aí.","Março. Chegam as peças de outono e as lojas pedem vitrines novas.","Abril. O frio chega, e a coleção de inverno vai para o estúdio. As campanhas de Dia das Mães começam.","Maio. Dia das Mães, a segunda maior data do varejo de moda. Vitrines novas toda semana.","Junho. Dia dos Namorados, festas juninas e liquidação de inverno.","Julho. Férias e liquidação. As confecções já desenham a coleção de primavera-verão.","Agosto. Dia dos Pais e a chegada da primavera-verão: lookbooks e ensaios por toda parte.","Setembro. Primavera. Desfiles de lançamento da coleção de verão e vitrines floridas.","Outubro. Dia das Crianças, estoque de Black Friday e as primeiras vitrines de fim de ano.","Novembro. Black Friday. Vitrines de promoção, montagem em dobro e pouca gente dormindo.","Dezembro. Natal, festas e réveillon. Desfiles de fim de ano e vitrines de gala até o dia 24."];function r2(a){return Math.round(100*a)/100}function brl(a){const e=a<0;let o=Math.round(100*Math.abs(a));return(e?"−":"")+"R$ "+String(Math.floor(o/100)).replace(/\B(?=(\d{3})+(?!\d))/g,".")+","+String(o%100).padStart(2,"0")}function rng(a){a.r=a.r+1831565813|0;let e=a.r;return e=Math.imul(e^e>>>15,1|e),e^=e+Math.imul(e^e>>>7,61|e),((e^e>>>14)>>>0)/4294967296}function F(a){return FASES[a.p.fase]}const clt=a=>0===a.p.v,FL=(a,e)=>clt(a)?{}:e,E=(a,e,o)=>clt(a)?e:o;function novo(a,e){const o={seed:0|a,r:0|a,nome:e||"",m:0,f:"perfil",st:{},conta:0,reserva:0,divida:0,parc:[],meta:null,grave:0,flags:{},reflex:[],over:null,hist:[],lei:{ok:0,n:0},poup:0,avis:{},prazo:null,conv:null,fat:0,das:0,dias:0,mdias:0,pecas:[]};for(let a=0;a<5;a++)rng(o);const r=Math.floor(4*rng(o)),s=FASES[r],i=s.ida[0]+Math.floor(rng(o)*(s.ida[1]-s.ida[0]+1)),d=rng(o)<.5?0:1,n=rng(o),t=n<.35?0:n<.8?1:2,c=Math.floor(3*rng(o)),m=rng(o),u=CAPITAIS[m<.4?0:m<.8?1:2];o.p={fase:r,idade:i,v:d,porte:t,esp:c,cap:u,casa:s.casa,mei:0,desc:0,seg:0,niver:1+Math.floor(10*rng(o))},o.conta=u,o.st={a:30+Math.floor(11*rng(o)),c:28+Math.floor(11*rng(o)),e:62+Math.floor(13*rng(o)),s:24+Math.floor(11*rng(o))};for(const a in s.st)o.st[a]=Math.max(5,Math.min(100,o.st[a]+s.st[a]));const l=Object.keys(ALEA);for(let a=l.length-1;a>0;a--){const e=Math.floor(rng(o)*(a+1));[l[a],l[e]]=[l[e],l[a]]}d&&(l.splice(l.indexOf("mei"),1),l.splice(1,0,"mei")),o.pool=l;const p=Object.keys(VIDA);for(let a=p.length-1;a>0;a--){const e=Math.floor(rng(o)*(a+1));[p[a],p[e]]=[p[e],p[a]]}return o.vp=p,o}function pagar(a,e){if(a.conta=r2(a.conta-e),a.conta<0){const e=-a.conta;a.conta=0;const o=Math.min(e,a.reserva);a.reserva=r2(a.reserva-o);const r=r2(e-o);r>0&&(a.divida=r2(a.divida+r),a.flags.deveu=1)}}function verificar(a){if(!a.over)if(a.grave>=2)a.over="cancelado";else if(a.divida>4e3)a.over="divida";else for(const e of["c","s","a"])if(a.st[e]<=0){if(a.avis[e]||a.prazo)return void(a.over="parou");a.avis[e]=1,a.st[e]=20,a.prazo=a.m<11?{k:e,ate:a.m+1}:null,a.conv=e}}function aplicar(a,e){const o=[];for(const r of["a","c","e","s"])e[r]&&(a.st[r]=Math.max(0,Math.min(100,a.st[r]+e[r])),o.push({k:r,v:e[r]}));return e.d&&(e.d<0?pagar(a,-e.d):a.conta=r2(a.conta+e.d),o.push({k:"d",v:e.d})),e.res&&(a.reserva=r2(a.reserva+e.res),o.push({k:"r",v:e.res})),e.parcela&&(a.flags.parcelou=1,a.parc.push({n:e.parcela.n,v:e.parcela.v,q:e.parcela.q}),o.push({k:"p",v:e.parcela.v,q:e.parcela.q})),e.peca&&(a.pecas.includes(e.peca)||a.pecas.push(e.peca),o.push({k:"pc",v:e.peca})),e.grave&&(a.grave++,o.push({k:"g",v:1})),e.flag&&(a.flags[e.flag]=1),verificar(a),o}const o=(a,e,o,r)=>({l:a,f:()=>Object.assign({r:o},e,r||{})}),S3=(a,e,o,r)=>[e,o,r][a.p.esp],FIXOS=[{t:"Antes do primeiro dia",c:[1],x:a=>clt(a)?"Uma confecção da região te chamou para ser assistente de produção, com foco em "+ESP[a.p.esp].h+'. A gerente diz: "Comece segunda-feira, em período de teste de duas semanas. Se der certo, a gente registra a sua carteira."':'A dona de uma boutique, indicada por uma professora, quer um lookbook com 12 looks e a vitrine de lançamento. Ela diz: "Pago R$ 900, e a gente acerta quando eu gostar do resultado. Fechado?"',lei:a=>clt(a)?'Todo empregado deve ser registrado desde o primeiro dia, e a carteira de trabalho é digital (CLT, arts. 29 e 41). Um "teste" de duas semanas, sem registro, é trabalho sem direitos: o período de experiência existe, mas é um contrato registrado, de no máximo 90 dias (CLT, art. 445, parágrafo único). Sem registro, você fica sem FGTS, sem INSS e sem proteção.':'Quem presta serviço por conta própria deve combinar por escrito o serviço, o valor, o prazo e a data de pagamento (Código Civil, arts. 593 a 609). Em trabalho criativo, vale combinar também o uso: a cessão de direitos autorais deve ser feita por escrito e se presume onerosa (Lei 9.610/1998, art. 50). Sem isso, "quando eu gostar" vira cobrança sem prova.',o:[{l:a=>clt(a)?"Fazer as duas semanas de teste e esperar o registro":"Aceitar o combinado verbal e começar",f:a=>clt(a)?{c:-3,e:-6,r:'Na terceira semana, a gerente disse que "o pedido do cliente caiu" e adiou o registro. Você trabalhou 20 dias sem carteira, sem FGTS e sem nenhum direito.'}:{s:-2,e:-5,r:'Você montou três versões do lookbook. A dona "não gostou da paleta" e só pagou R$ 400, dois meses depois. Sem nada por escrito, você não tinha o que cobrar.'}},{l:a=>clt(a)?"Só começar depois de assinar o contrato e ter a carteira registrada":"Aceitar, mas fechar por escrito: número de looks, número de revisões, valor, prazo de pagamento e o que a loja pode fazer com as fotos",f:a=>clt(a)?{c:3,a:2,r:"A confecção registrou na hora, com contrato de experiência de 90 dias. Você começou na segunda com tudo no papel, e a gerente comentou que gosta de quem pergunta."}:{c:4,s:3,a:2,peca:"Lookbook de uma boutique",r:"A dona assinou um contrato de uma página. O pagamento caiu na data combinada, e o lookbook foi parar no seu book, com autorização."}},{l:a=>clt(a)?"Perguntar às colegas se a confecção costuma registrar e, se for assim mesmo, aceitar":"Recusar o trabalho: você só aceita com contrato formal",f:a=>clt(a)?{c:-3,e:-2,r:'As colegas disseram que "é assim mesmo". Duas estavam havia meses sem registro, sem FGTS e sem direito a nada.'}:{s:-3,e:2,r:"A dona procurou outra pessoa. Você ficou sem o trabalho, mas deixou claro que trabalha com contrato."}}]},{t:"O briefing de uma linha",d:1,x:a=>S3(a,"Você é quem conversa com o cliente e organiza as fotos. ","Você é quem vai montar a vitrine. ","Você é quem vai coordenar o desfile. ")+'Uma loja de roupas pede uma ação de Carnaval. O pedido veio em uma linha: "Quero algo que chame atenção." A verba não foi dita. Prazo: dez dias.',nota:"Um bom briefing de produção de moda responde: qual é a marca e o público, qual é o objetivo (vender, lançar, divulgar), qual é a verba, qual é o prazo, onde e como a ação vai aparecer e o que não pode aparecer. A produção se organiza em um cronograma e em uma planilha de custos, com uma reserva de cerca de 10% para imprevistos.",o:[o("Fazer as perguntas do briefing, montar um cronograma e uma planilha de custos com reserva para imprevistos e combinar a verba antes de começar",{c:3,a:4,e:-3},"Você descobriu que a verba era de R$ 2.500 e que o cliente queria vender o estoque de verão. O plano coube no orçamento, e a ação saiu no prazo.",{peca:"Ação de Carnaval de uma loja"}),o("Começar pela ideia mais ousada e ajustar o custo depois",{a:1,c:-3,e:-5},"A ideia era linda e custava o triplo da verba. Você refez tudo em duas noites."),o("Pesquisar referências e montar um moodboard completo antes de falar com o cliente",{a:3,e:-4,c:1},"O moodboard ficou lindo, mas o cliente queria algo mais comercial e pediu ajustes. Você ganhou repertório e perdeu tempo.")]},{t:"A modelo de 15 anos",c:[2],tag:"autor",x:a=>'Para o ensaio da coleção de outono de uma loja de departamentos, a produtora chamou uma menina de 15 anos, vizinha do diretor de arte, e a mãe dela. Ninguém assinou nada: "Foi na boa, elas toparam rindo." As fotos vão para o catálogo, as redes sociais e a mídia exterior. O ensaio paga R$ 200 de cachê.',lei:"A imagem de uma pessoa é um direito dela: usar o rosto em publicidade exige autorização, de preferência por escrito, com prazo, mídias, território e valor (Constituição, art. 5º, X; Código Civil, art. 20). Para menor de 18 anos, a autorização é dada pelos responsáveis, e a participação de adolescente em espetáculos, ensaios e desfiles pode depender de alvará da Justiça da Infância e da Juventude (ECA, art. 149), além de respeitar a escola e a proibição de trabalho antes dos 16 anos, salvo como aprendiz a partir dos 14 (Constituição, art. 7º, XXXIII). Usar a imagem de alguém com fins comerciais, sem autorização, gera indenização sem que a pessoa precise provar prejuízo (Súmula 403 do STJ).",o:[o("Publicar agora e pedir a assinatura depois, se alguém reclamar",{grave:1,c:-10,e:-4},"A avó da menina viu o catálogo e pediu a retirada. Sem documento nem alvará, a loja recolheu o material, e a produtora refez o ensaio com outra modelo, em cima da hora. Usar a imagem de uma adolescente sem autorização dos responsáveis é um erro sério, e o caso ficou registrado como incidente grave no seu nome."),o("Pedir só uma autorização falada, por mensagem de áudio",{c:-3,e:-2},"O áudio ajuda, mas não diz por quanto tempo, em quais mídias e por qual valor, e não resolve a questão da idade. Quando a avó contestou, a conversa virou uma discussão sobre o que cada um entendeu."),o("Segurar a publicação até ter o termo de autorização de uso de imagem assinado pela mãe, verificar a necessidade de alvará, combinar o cachê e horários compatíveis com a escola",{c:4,a:4,e:-4},"O termo atrasou o catálogo em dois dias. A produtora pagou o cachê, e o advogado da loja confirmou o que faltava para o alvará. O ensaio foi publicado sem nenhuma pendência.",{peca:"Ensaio da coleção de outono, com autorização"})]},{t:'A coleção "100% sustentável"',c:[1],tag:"cons",x:a=>S3(a,"Você escreve o texto do lookbook. ",'Você monta a vitrine com um selo "eco". ',"Você escreve o discurso de abertura do desfile. ")+'A marca de uma loja vai lançar uma coleção de inverno e quer o slogan "100% sustentável, zero impacto". Parte das peças usa algodão reciclado, mas o poliéster é virgem, e não há estudo nem certificação.',lei:'Apelos de sustentabilidade na publicidade devem ser verdadeiros, precisos e comprováveis, e o anunciante deve manter as informações que sustentam o que diz (CDC, arts. 36, parágrafo único, e 37, § 1º). O Código do CONAR tem regras específicas para apelos de sustentabilidade. Afirmações genéricas e absolutas, como "100% sustentável" ou "zero impacto", sem prova, são conhecidas como greenwashing. O caminho seguro é dizer exatamente o que é verdade, com a fonte: "30% de algodão reciclado, certificado pelo fornecedor".',o:[o("Usar o slogan: é só marketing",{c:-6,e:-2},'Uma consumidora e um perfil de moda consciente denunciaram a coleção ao CONAR e ao Procon. A loja precisou retirar o slogan e explicar o que tinha de "sustentável".'),o('Trocar por uma comunicação específica e comprovável ("30% de algodão reciclado, com certificado do fornecedor") e guardar os documentos',{a:4,c:4,e:-3},"A comunicação ficou menos bonita e mais crível. A loja guardou o certificado do fornecedor e usou a mesma lógica nas próximas coleções.",{peca:"Coleção de inverno com comunicação verdadeira"}),o('Manter "100% sustentável" e colocar um asterisco: "conforme critérios da marca"',{c:-4,a:-1},"O asterisco não corrige a mensagem principal. Quem lê a vitrine não vê o rodapé, e a ressalva não desfaz a afirmação.")]},{t:"A oficina da coleção",c:[2],x:a=>'A confecção de uma loja grande, para quem você produz as vitrines, entrega a coleção de Dia das Mães por um preço muito abaixo do normal. Ao buscar as peças, você entra na oficina terceirizada: quinze pessoas costurando em um galpão sem janelas, jornada das 6h às 22h e dois quartos nos fundos onde os costureiros dormem. Ninguém tem carteira assinada. O dono diz: "Aqui é assim, e a loja sabe."',lei:"Submeter alguém a trabalho forçado, a jornada exaustiva ou a condições degradantes de trabalho é crime, chamado de redução a condição análoga à de escravo (Código Penal, art. 149). Na cadeia da moda, a terceirização não afasta a cobrança sobre as marcas e lojas que contratam e definem preço e prazo: elas podem ser responsabilizadas pela Justiça do Trabalho e pelo Ministério Público do Trabalho. Quem presencia pode denunciar à fiscalização do trabalho ou ao Ministério Público do Trabalho, inclusive de forma anônima.",o:[o("Pegar as peças e montar a vitrine: o que o fornecedor faz não é com você",{c:-5,e:-3},"Meses depois, uma fiscalização encontrou a mesma oficina, e a loja apareceu em uma reportagem. A vitrine que você montou estava na foto. Você sabia, e não disse."),o("Perguntar ao dono da oficina se é assim mesmo e seguir como se nada tivesse acontecido",{c:-3,a:-1},"Ele repetiu que a loja sabia. Você saiu com a mesma dúvida e sem ter feito nada com ela."),o("Registrar o que viu (data, local, quem responde), avisar a diretoria da loja por escrito e, se nada mudar, denunciar à fiscalização do trabalho ou ao Ministério Público do Trabalho",{a:3,c:4,e:-6},"A diretoria suspendeu o pedido e abriu uma auditoria nos fornecedores. A coleção atrasou, mas a loja trocou de oficina. Você ficou conhecido como alguém que enxerga o que há por trás da etiqueta.",{peca:"Relatório de visita a fornecedor"})]},{t:"A lista das clientes",c:[0],tag:"dados",x:a=>S3(a,"Você coordena o convite e a produção das fotos do evento. ","Você vai montar a vitrine do evento. ","Você produz o desfile de lançamento. ")+'A loja entrega uma planilha com 4 mil clientes: nome, telefone, data de nascimento, medidas, histórico de compras e uma coluna de "renda estimada". E pede: "Manda o convite do desfile para todo mundo no WhatsApp e passa a lista também para a marca parceira, que vai patrocinar."',lei:"A LGPD exige que o uso de dados pessoais tenha uma finalidade e uma base legal compatíveis com o motivo da coleta (Lei 13.709/2018, arts. 6º e 7º) e que o titular seja informado (art. 9º). Compartilhar a lista com outra empresa é um novo tratamento, que precisa de base legal e de transparência, e quem compartilha também responde (art. 42). O titular pode pedir para sair da lista a qualquer momento (art. 18). Usar só o necessário (art. 6º, III) significa deixar de fora colunas como renda estimada e medidas, que o convite não pede.",o:[o("Pedir à loja a base legal e a finalidade, convidar só quem aceitou receber comunicações, deixar de fora renda e medidas, não passar a lista à marca e incluir um jeito de sair da lista em toda mensagem",{a:5,c:4,e:-3},"A lista caiu para 2.300 contatos, mas a presença no desfile foi maior do que a do ano anterior. A loja passou a registrar o aceite no cadastro das clientes.",{peca:"Convite do desfile de lançamento"}),o("Disparar para todos e passar a lista à marca: a lista é da loja",{c:-6,a:-1,e:-2},'Várias clientes responderam: "Como vocês conseguiram o meu número?". Uma delas registrou reclamação na ANPD, e a loja culpou a produção.'),o("Disparar só por e-mail e passar a lista à marca sem as medidas",{c:-3,a:1},"Reduzir os dados e mudar de canal ajuda, mas compartilhar a lista com a marca continua sem base legal e sem aviso às clientes.")]},{t:"A montagem de 14 horas",c:[1],x:a=>clt(a)?'Véspera do desfile de lançamento de primavera. A gerente avisa no grupo: "Montagem hoje: chegada às 7h, sem hora para sair. O almoço a gente pede aqui, não precisa parar. Amanhã tem ensaio às 8h." Você terminaria perto da meia-noite.':'O produtor do desfile fecha a sua diária: "Vai das 7h à meia-noite, o almoço você come em pé, e amanhã o ensaio é às 8h." A diária é a mesma de sempre.',lei:a=>clt(a)?"A jornada normal é de até 8 horas por dia, e as horas extras são limitadas a 2 por dia, com adicional de pelo menos 50% (Constituição, art. 7º, XIII e XVI; CLT, art. 59). Quem trabalha mais de 6 horas tem direito a pelo menos 1 hora de intervalo para refeição (CLT, art. 71), e entre o fim de uma jornada e o começo da seguinte devem passar pelo menos 11 horas (CLT, art. 66).":"Quem presta serviço por conta própria define no contrato a duração da diária, o que acontece nas horas excedentes, a alimentação e o descanso. Se o contratante manda horário, cobra presença e exige exclusividade como num emprego, o contrato pode ser reconhecido como vínculo de emprego (CLT, art. 3º). Em eventos, o descanso e a segurança de quem monta estruturas também dependem de quem organiza.",o:[{l:a=>clt(a)?"Aceitar sem questionar: é o dia do desfile":"Aceitar sem mudar nada",f:a=>clt(a)?{c:-1,e:-9,r:"Você saiu à 0h30, dormiu quatro horas e passou o ensaio da manhã com a cabeça pesada. As horas extras não entraram no ponto, e ninguém falou em intervalo."}:{c:-1,e:-9,r:"Você terminou à meia-noite, sem ter parado para almoçar. O ensaio da manhã seguinte foi um sacrifício, e, na próxima, o produtor já contava com isso."}},{l:a=>clt(a)?"Aceitar o esforço, mas pedir que o intervalo seja respeitado, que as horas extras sejam registradas e que o ensaio de amanhã considere as 11 horas de descanso":"Aceitar, mas combinar por escrito o intervalo para refeição, o valor da hora excedente e o ensaio de amanhã mais tarde",f:a=>clt(a)?{c:3,a:1,e:-5,r:"A gerente concordou com o intervalo e registrou as horas. O ensaio de amanhã ficou para as 10h, e a equipe agradeceu."}:{c:3,a:2,e:-5,d:150,r:"O produtor concordou em pagar R$ 150 pelas horas excedentes e em empurrar o ensaio para as 10h. O combinado ficou em uma mensagem, e você passou a usar a mesma cláusula nas próximas diárias."}},{l:a=>clt(a)?'Recusar a montagem inteira: "não faço mais que 8 horas"':"Recusar a diária",f:a=>clt(a)?{c:-4,e:3,r:"No dia do desfile, a equipe ficou desfalcada, e a gerente anotou a sua recusa como falta de espírito de equipe. Faltou conversa sobre o que fazer."}:{s:-2,e:3,c:-1,r:"O produtor chamou outra pessoa. Você descansou, mas perdeu um desfile no currículo."}}]},{t:"A caixa de presentes",c:[0],tag:"cons",x:a=>'Você produz um editorial de moda para uma revista local. Uma marca de roupas masculinas manda uma caixa de presentes com R$ 800 em dinheiro e um recado: "Inclui as nossas peças no editorial de Dia dos Pais e escreve que foi escolha da redação. Fica entre nós."',lei:'A publicidade deve ser identificada como tal, de forma fácil e imediata (CDC, art. 36). Receber dinheiro ou presentes para promover um produto e apresentá-lo como escolha editorial é publicidade disfarçada, e fere também o Código do CONAR e o dever de informar o leitor. Parcerias e "recebidos" podem ser mostrados, desde que o leitor saiba que existe uma relação comercial. Sempre que houver pagamento ou presente, diga.',o:[o("Recusar o dinheiro e propor uma parceria identificada: a marca paga um espaço publicitário, e o editorial continua independente",{c:4,a:3,e:-2},"A marca aceitou pagar um anúncio. O editorial manteve a assinatura da redação, e a parceria foi marcada como publicidade. O leitor soube o que era o quê.",{peca:"Editorial de Dia dos Pais, com parceria identificada"}),o('Aceitar e escrever "escolha da redação": todo mundo faz',{c:-6,e:-2},'Uma leitora perguntou nos comentários se era publicidade, e a revista recebeu uma denúncia ao CONAR. Você ficou com a fama de "vender" editorial.'),o('Aceitar o dinheiro e colocar "#publi" no fim dos comentários, no meio de outras hashtags',{c:-4,a:-1},"Escondida entre vinte hashtags, a indicação não é clara nem imediata. A identificação de publicidade precisa estar visível desde o começo.")]},{t:"A estampa de outra marca",c:[2],tag:"autor",x:a=>S3(a,"Você escolhe as referências e conduz a produção das fotos. ","Você monta a vitrine de lançamento. ","Você coordena o desfile e a comunicação da coleção. ")+'Uma confecção da região quer lançar uma estampa que é praticamente igual à de uma marca famosa, "só trocando as cores". O dono diz: "Ninguém vai notar, e a gente vende pela metade do preço." O seu nome vai em toda a divulgação.',lei:"Estampas, desenhos e ilustrações são obras protegidas (Lei 9.610/1998, art. 7º), e a forma ornamental de um produto pode ser registrada como desenho industrial (Lei 9.279/1996, art. 95). Copiar o essencial de uma estampa protegida, mudando só as cores, pode caracterizar violação de direitos autorais e concorrência desleal (Lei 9.279/1996, art. 195), com indenização e retirada dos produtos. Inspiração é diferente de cópia: pesquisar referências, tendências e silhuetas é livre; reproduzir a obra, não.",o:[o("Apresentar a coleção como está: a decisão é do dono",{grave:1,c:-10},"A marca notificou a confecção e a loja, e uma ação por cópia pediu a retirada das peças. O seu nome estava em toda a divulgação, e o caso ficou registrado como incidente grave no seu nome."),o("Sugerir mudar o formato e alguns elementos da estampa, mas manter a ideia geral",{c:-3,a:1},"A estampa ficou diferente por fora, mas continuava claramente derivada da original. A marca notificou do mesmo jeito, e a confecção teve de recolher parte do estoque."),o("Propor uma estampa própria a partir da mesma tendência (cores, temas, escala), com um desenho original de uma ilustradora contratada, com contrato de cessão",{a:5,c:4,e:-4},'A ilustradora criou uma estampa nova a partir do mesmo tema. A coleção ficou com cara própria, e o contrato de cessão foi anexado à pasta da coleção. O dono resmungou do custo, mas passou a pedir "estampa nossa".',{peca:"Estampa original para a coleção de primavera"})]},{t:"A vitrine que filma quem passa",c:[2],tag:"dados",x:a=>S3(a,"Você planeja o conteúdo da vitrine. ","Você monta a vitrine. ","Você coordena a ação de lançamento. ")+'Uma loja de shopping quer uma vitrine interativa para o Dia das Crianças: uma câmera na janela filma quem passa, "lê" as emoções dos rostos e guarda as imagens para "entender o público e vender para parceiros". Crianças passam o dia todo por ali. Não há aviso na vitrine.',lei:"A imagem do rosto de uma pessoa identificável é dado pessoal e, quando serve para identificá-la (biometria), é dado pessoal sensível, com regras mais rígidas (Lei 13.709/2018, arts. 5º, II, e 11). O tratamento exige finalidade, necessidade e transparência: quem passa deve ser informado, e o que não é necessário não deve ser coletado nem vendido (arts. 6º e 9º). Para dados de crianças, vale o melhor interesse da criança (art. 14). Contar pessoas sem guardar rostos é muito mais seguro do que gravar e analisar emoções.",o:[o("Fazer como a loja pediu",{c:-6,e:-2},"Um pai fotografou a vitrine e denunciou à ANPD. A loja precisou desligar a câmera, apagar as imagens e se explicar. A ação de Dia das Crianças perdeu a atração principal."),o('Colocar um aviso pequeno na porta: "ambiente filmado"',{c:-3,a:-1},"O aviso ajuda na transparência, mas não resolve a coleta: os rostos e as emoções continuaram sendo guardados e vendidos, sem necessidade."),o("Trocar por uma interação sem rostos (um contador de pessoas que não guarda imagem, ou um painel que reage ao toque), com aviso claro e sem vender dados",{a:5,c:4,e:-4},"A vitrine reagiu ao toque, e as crianças formaram fila para brincar. A loja contou as visitas sem guardar rosto, e a diretoria usou o caso como exemplo.",{peca:"Vitrine interativa sem coleta de rostos"})]},{t:"A peça-isca da Black Friday",c:[1],tag:"cons",x:a=>S3(a,"Você fotografa os produtos da campanha. ","Você monta a vitrine. ","Você coordena a ação de rua. ")+'A loja quer na vitrine e nos anúncios da Black Friday: "Jaqueta de couro, R$ 99". Só há 5 unidades, e a gerente diz: "O objetivo é encher a loja. Quando acabar, acabou, e a gente oferece outra." A quantidade não será divulgada.',lei:'A oferta divulgada obriga o fornecedor, que deve cumpri-la nos termos anunciados (CDC, arts. 30 e 35). Anunciar um preço sem ter estoque razoável para atender à procura, ou omitir um dado essencial como a quantidade limitada, pode ser publicidade enganosa por omissão (CDC, art. 37, §§ 1º e 3º). Se a quantidade é limitada, o anúncio deve dizer: "apenas 5 unidades".',o:[o("Montar a vitrine como pedido: é estratégia de loja",{c:-5,e:-2},"Às 9h havia fila e, às 9h05, as 5 jaquetas estavam vendidas. Os demais clientes se sentiram enganados, e a loja recebeu reclamações no Procon."),o('Propor informar a quantidade na vitrine e nos anúncios ("apenas 5 unidades") e criar uma oferta forte para todos, como desconto em uma linha inteira',{a:4,c:4,e:-4},'A vitrine mostrava "5 unidades" e uma oferta para a linha toda. Menos fila, mais vendas ao longo do dia e nenhuma reclamação.',{peca:"Vitrine de Black Friday com oferta honesta"}),o('Colocar "enquanto durarem os estoques" em letras pequenas, no chão da vitrine',{c:-3,a:-1},"A expressão genérica não informa a quantidade. O anúncio continuava prometendo o que a loja não ia entregar.")]},{t:"O orçamento do desfile de Natal",d:1,x:a=>E(a,"A diretora da loja","O cliente")+' quer um desfile de Natal para 150 convidados. O orçamento aprovado é de R$ 8 mil, mas a planilha que você montou chega a R$ 11 mil: modelos pagas, som, iluminação, locação do espaço, maquiagem e coffee. Ele diz: "Dá o seu jeito. Corta o que for preciso." Faltam 10 dias.',nota:"Um orçamento de produção separa custos fixos (espaço, som, luz), custos variáveis (modelos, maquiagem, alimentação) e uma reserva para imprevistos, de cerca de 10%. Cortar sem critério costuma sair mais caro: o ensaio, a segurança e o pagamento justo são o que mais pesa no dia do desfile. Há três caminhos honestos: reduzir o escopo, trocar fornecedores e negociar prazos ou permutas combinadas por escrito.",o:[o("Cortar o ensaio e a reserva de imprevistos para caber em R$ 8 mil",{c:2,a:-1,e:-8},"O desfile coube no orçamento. No dia, a trilha falhou, três modelos chegaram sem ensaio e não havia verba para o plano B. Saiu, mas cada imprevisto custou a sua energia."),o("Reduzir o escopo (menos looks, espaço menor, mesma qualidade), manter o ensaio e a reserva e levar a proposta por escrito",{c:4,a:3,e:-4},"A diretoria aprovou o desfile enxuto, com 18 looks em vez de 30. O ensaio e a reserva ficaram, e o imprevisto de última hora foi resolvido sem drama."),{l:"Negociar permutas com fornecedores (som, maquiagem e coffee), combinadas por escrito, mantendo o escopo",f:a=>rng(a)<.5?{s:5,c:3,e:-8,r:"Dois fornecedores toparam e um desistiu em cima da hora. Você correu, mas o desfile aconteceu com o escopo planejado."}:{s:1,c:-1,e:-10,r:"Quatro dos cinco fornecedores recusaram a permuta, e você gastou a semana negociando. O escopo foi cortado no último dia."}}]}],ALEA={mei:{t:"Só com nota fiscal",d:1,q:a=>!clt(a)&&!a.p.mei,x:a=>"Uma rede de lojas quer fechar com você um pacote de quatro vitrines por mês, mas só contrata fornecedor que emite nota fiscal. Hoje você trabalha só com o CPF.",nota:'Quem presta serviço por conta própria e quer emitir nota precisa de CNPJ. O MEI, que paga um valor fixo por mês, só vale para as ocupações da lista oficial: costureiro, customizador e estampador constam nela, mas confira a sua atividade (produtor de moda, stylist, visual merchandiser) no Portal do Empreendedor antes de abrir. Se ela não constar, o caminho usual é uma microempresa (ME) no Simples Nacional, que exige contador, paga imposto sobre o faturamento (a alíquota depende do anexo e do "fator R"; no jogo, usamos 6%) e o INSS do pró-labore. Em troca, você emite nota, atende lojas e redes e contribui para a aposentadoria.',o:[{l:"Abrir uma ME no Simples Nacional, com contador, esta semana",f:a=>(a.p.mei=1,{s:6,c:2,e:-3,r:"Com a ajuda de um contador, a empresa saiu em poucos dias. A partir de agora, saem todo mês o contador, o INSS do pró-labore e o imposto sobre o que você fatura, com trabalho ou sem. Em troca, mais lojas podem te contratar."})},o("Continuar com CPF e procurar clientes que aceitem recibo",{e:2,s:-3},"Sem custo fixo, mas com menos portas abertas. Algumas redes nem respondem quando você diz que não emite nota."),o("Abrir como MEI de costureira, só para emitir nota",{c:-6,s:-2},"Registrar uma atividade diferente da que você de fato exerce não resolve: a nota saiu com uma descrição que não bate com o serviço, a rede estranhou e desistiu. Quem exerce atividade fora da lista corre o risco de ser desenquadrado do MEI.")]},pj:{t:"Contrato de PJ com horário",c:[2],q:a=>!clt(a),x:a=>'Uma rede de lojas quer te contratar como PJ para um "trabalho fixo" de visual merchandiser: entrar às 9h, sair às 18h, seguir a chefia direta da gerente regional e não atender mais ninguém. O pagamento é de R$ 2.800 por mês, sem 13º, sem férias e sem FGTS. Você precisaria abrir uma empresa para emitir a nota.',lei:'A contratação de autônomo é legítima quando cumpridas as formalidades legais, mesmo com exclusividade (CLT, art. 442-B). Mas só vale se houver autonomia de fato: com horário fixo, chefia direta, ordens pessoais e habitualidade, o contrato pode ser reconhecido como emprego, mesmo que o papel diga "PJ" (CLT, arts. 3º e 9º). A orientação dos tribunais sobre esse tema muda com frequência: confira sempre a versão vigente.',o:[o('Aceitar: o valor parece bom, e os direitos você "resolve depois"',{d:300,e:-5,c:-2},"O valor parecia bom no primeiro mês, mas na conta não entram 13º, férias nem FGTS, e a rede pode encerrar o contrato a qualquer momento, sem direito a nada. Você ficou sem folga, sem reserva e sem cobertura."),o("Recusar na hora e encerrar a conversa",{e:2,s:-2},"Sem reunião, sem proposta e sem relação. A rede procurou outra pessoa, e você ficou sem a oportunidade e sem saber como ela podia ter sido ajustada."),o("Propor duas saídas: ser registrada como empregada ou fechar um contrato de serviço por projeto de vitrine, com escopo, prazo e liberdade de horário",{c:3,a:2,e:-2},"A rede preferiu o contrato por projeto, com prazo e liberdade de horário. Ficou claro o que cada um devia, e você manteve o direito de atender outros clientes.")]},domingo:{t:"Domingo e feriado na loja",c:[1],q:clt,x:a=>'A loja do shopping vai abrir aos domingos e feriados na temporada de festas. A gerente avisa: "Quem for escalada vem sem problema, o dia é pago normal e a folga a gente vê depois."',lei:"O trabalho aos domingos é permitido no comércio em geral, observada a lei municipal (Lei 10.101/2000, art. 6º), e o trabalho em feriados depende de autorização em convenção coletiva (art. 6º-A). Domingo ou feriado trabalhado e não compensado com outra folga deve ser pago em dobro (Súmula 146 do TST). A escala e a folga devem ficar registradas, e as regras da categoria estão na convenção coletiva. As regras sobre domingos e feriados no comércio mudaram várias vezes em 2026, e o fim da escala 6x1 (emenda constitucional promulgada em outubro de 2026) estabelece dois dias de descanso por semana, com transição: confira sempre a norma e a convenção vigentes.",o:[o('Aceitar: "a gente vê depois" e pronto',{c:-1,e:-6,d:-80},"Você trabalhou quatro domingos e dois feriados. A folga prometida não saiu na data, e o pagamento veio como dia comum, sem o dobro. Ninguém tinha registrado nada."),o("Perguntar quando será a folga compensatória, conferir na convenção coletiva a regra do domingo e do feriado e pedir que a escala e a folga fiquem registradas",{c:3,a:1,e:-3,d:120},"A gerente mostrou a convenção, marcou as folgas em um quadro e pagou o dobro nos dias sem compensação. A equipe passou a usar a mesma planilha."),o("Recusar todos os domingos e feriados",{c:-4,e:3},"A escala foi montada sem você, e a gerente entendeu como falta de disposição. Faltou conversar sobre como compensar, e não recusar tudo.")]},porfora:{t:'O salário "por fora"',c:[1],q:clt,x:a=>'A gerente propõe: "Registro o seu salário em R$ 1.500 e pago o resto no Pix, por fora. Você leva o mesmo dinheiro, e a loja paga menos imposto."',lei:'O salário é tudo o que o empregador paga pelo trabalho, e todas essas parcelas integram a remuneração (CLT, art. 457). Pagar parte "por fora" reduz o FGTS, o INSS, as férias, o 13º, a rescisão e a aposentadoria, e pode ser fiscalizado. Quem sai perdendo é o empregado, que depois não consegue provar o que ganhava.',o:[o("Aceitar: o dinheiro no mês é o mesmo",{c:-3,e:-2,d:-60},"Meses depois, precisou de um comprovante de renda para alugar um apartamento e só tinha R$ 1.500 no papel. Na rescisão, o FGTS e as férias saíram calculados sobre o valor registrado."),o('Pedir que todo o valor seja registrado em carteira, explicando que o "por fora" reduz o FGTS, o INSS, as férias e a aposentadoria, e procurar o sindicato se a loja insistir',{c:4,a:1,e:-3},"A gerente resistiu, mas regularizou. O FGTS e o INSS passaram a ser recolhidos sobre o valor real, e a proposta não voltou a ser feita para a equipe."),o('Aceitar, mas guardar prints das conversas "por precaução"',{c:-2,a:1},"Os prints ajudam a provar, mas a perda existe do mesmo jeito: a contribuição ao INSS e ao FGTS continua sendo menor do que devia.")]},estagio:{t:"A estagiária que abre a loja",c:[2],x:a=>'Na loja onde você monta as vitrines, a estagiária de 17 anos, aluna de um curso técnico, trabalha oito horas por dia, de segunda a sábado, abre e fecha a loja sozinha e não tem ninguém que a oriente. Ela comenta com você: "Não sei se isso é normal."',lei:"O estágio é um ato educativo, e não um emprego barato: exige termo de compromisso, supervisor, seguro contra acidentes, jornada compatível com a escola, de no máximo 6 horas por dia e 30 por semana para a educação profissional de nível médio e o ensino superior, e recesso (Lei 11.788/2008, arts. 3º, 9º, 10 e 13). Quando as regras não são cumpridas, o estágio pode ser reconhecido como emprego (art. 15). Para quem tem menos de 18 anos, valem também as regras de proteção ao adolescente (Constituição, art. 7º, XXXIII).",o:[o("Dizer que é assim mesmo na moda: todo mundo começou assim",{c:-3,e:-1},"Ela continuou na mesma rotina até o fim do semestre. Faltou à prova final por cansaço e perdeu o semestre."),o("Não se meter: não é problema seu",{c:-1,e:1},"Você evitou o desconforto, e ela continuou sozinha na loja. Em novembro, desistiu do estágio e da moda."),o("Mostrar a ela as regras do estágio e sugerir que converse com a escola e com a gerência, e dizer à gerente o que as regras exigem de jornada, supervisão e termo de compromisso",{a:2,c:4,e:-3},"A gerente se assustou, ajustou a jornada para 6 horas e designou uma supervisora. A estagiária passou a aprender de verdade, e a loja evitou uma ação trabalhista.")]},assedio:{t:"A conversa no camarim",c:[1],x:a=>'Nos bastidores do desfile, o diretor de arte olha para uma assistente de produção e diz, na frente da equipe: "Com esse corpo, você não veste nem o menor. Fica fora do desfile." Ela sorri sem graça e sai. Ninguém diz nada.',lei:"Humilhações repetidas no trabalho podem configurar assédio moral, que dá direito a indenização por dano moral (Constituição, art. 5º, V e X; Código Civil, arts. 186 e 927; CLT, art. 223-B). Quem presencia pode apoiar a vítima, registrar o que viu e usar os canais da empresa, como RH, ouvidoria e sindicato, ou procurar o Ministério Público do Trabalho. Criticar o trabalho é legítimo; humilhar a pessoa pelo corpo, não.",o:[o("Ficar quieta: não é com você, e o diretor decide as próximas produções",{e:-3,c:-2},"Você saiu do camarim com um nó no estômago. Dois dias depois, a assistente avisou que não voltaria à equipe."),o("Procurar a assistente depois do desfile, perguntar como ela está e oferecer ajuda para registrar o ocorrido, com datas e testemunhas, no RH, na ouvidoria ou no sindicato",{c:3,s:2,e:-3},"Ela agradeceu e registrou a queixa. O RH conversou com o diretor, e a produtora criou um canal de denúncia. Você ficou conhecida como alguém em quem se pode confiar."),o("Responder na hora, na frente de todos, defendendo a assistente e criticando o diretor",{c:-3,e:-2,s:1},"Você disse o que sentia, mas o camarim virou uma discussão entre vocês dois, e o problema da assistente ficou em segundo plano.")]},noturna:{t:"Vitrine só depois do fechamento",c:[1],x:a=>'O shopping só permite trocar as vitrines depois que as lojas fecham: das 23h às 5h. A gerente avisa: "Você vai montar a vitrine toda de madrugada, e depois volta às 14h para abrir a loja."',lei:a=>clt(a)?"O trabalho noturno urbano é o realizado entre 22h e 5h, e tem adicional de pelo menos 20% sobre a hora diurna (CLT, art. 73), e a hora noturna é computada como 52 minutos e 30 segundos. Entre o fim de uma jornada e o começo da seguinte, devem passar pelo menos 11 horas (CLT, art. 66), e o horário precisa ser registrado.":"Quem presta serviço por conta própria deve combinar no contrato o horário, o valor do trabalho noturno e o descanso. Se o contratante determina o horário, cobra presença e exige como se fosse emprego, o contrato pode ser reconhecido como vínculo (CLT, art. 3º).",o:[{l:"Aceitar sem questionar: é o horário do shopping",f:a=>clt(a)?{c:-1,e:-8,r:"Você montou até as 5h e voltou às 14h, com nove horas de intervalo. O adicional noturno não foi pago, e ninguém falou em descanso."}:{c:-1,e:-8,r:"Você montou até as 5h e voltou às 14h para abrir a loja. Nada do valor extra foi combinado, e a loja passou a contar com a madrugada como se fosse parte do pacote."}},{l:a=>clt(a)?"Pedir o adicional noturno, o registro do horário e o descanso de 11 horas, deixando a abertura da loja para o turno seguinte":"Combinar por escrito o valor da madrugada e o descanso depois, deixando a abertura da loja para outra pessoa",f:a=>clt(a)?{c:3,a:1,e:-3,d:90,r:"A gerente concordou: o adicional noturno entrou na folha, e você abriu a loja só no dia seguinte, às 14h. A escala passou a ser feita com antecedência."}:{c:3,a:2,e:-3,d:150,r:"A loja pagou R$ 150 pela madrugada, e você deixou claro que a abertura da loja era outro trabalho. O combinado ficou em uma mensagem, e virou regra."}},{l:"Recusar a montagem noturna",f:a=>({c:-3,e:3,s:-1,r:"O shopping recusou a vitrine fora do horário, e a loja ficou com a vitrine velha por mais uma semana. Faltou propor como fazer."})}]},vazou:{t:"A planilha das modelos",c:[0],tag:"dados",x:a=>'Ao abrir o drive da produtora, você nota que a planilha do elenco está compartilhada com "qualquer pessoa com o link". Nela há nome, CPF, RG, telefone, endereço, medidas e fotos de 80 modelos, incluindo 6 menores de idade e os dados dos pais.',lei:"A LGPD exige medidas de segurança para proteger os dados pessoais (art. 46) e, se houve acesso indevido que possa causar risco ou dano relevante aos titulares, o controlador deve avaliar a comunicação à ANPD e aos titulares (art. 48; Resolução CD/ANPD 15/2024). Dados de crianças e adolescentes devem ser tratados no melhor interesse deles (art. 14). Para fechar a brecha, restrinja quem acessa, mude o link, confira o histórico de acessos e avise o responsável.",o:[o("Restringir o acesso na hora, conferir quem abriu o arquivo, avisar a responsável pela produtora por escrito e separar os dados dos menores em outro arquivo com acesso restrito",{a:4,c:4,e:-4},"O histórico mostrou que ninguém de fora tinha aberto o arquivo, mas a produtora passou a usar contas com acesso por pessoa e a guardar os documentos dos menores à parte. A correção levou uma tarde.",{peca:"Planilha do elenco com acesso protegido"}),o("Mudar o nome do arquivo para ninguém achar e não contar a ninguém",{c:-5,a:-1,e:-2},"O link continuou aberto, e o arquivo foi encontrado por uma busca meses depois. A produtora teve de avisar às famílias de um problema que poderia ter sido evitado."),o("Avisar a produtora por mensagem e deixar que ela resolva quando puder",{c:-2,a:1},"O aviso ajuda, mas a brecha ficou aberta por mais duas semanas, sem ninguém conferir quem tinha acessado.")]},iadados:{t:"A lista no chat",c:[2],tag:"dados",x:a=>"Para ganhar tempo, você pensa em colar, no chat de uma ferramenta pública de inteligência artificial, uma planilha de 800 clientes da loja (nome, telefone, compras e tamanhos) e pedir mensagens personalizadas para o convite do desfile.",lei:"O que você cola em uma ferramenta de IA pode ser armazenado e processado fora do seu controle. Dados de clientes seguem a LGPD: só se compartilham com base legal, finalidade e medidas de segurança (Lei 13.709/2018, arts. 6º, 7º e 46). Use ferramentas autorizadas pela loja, tire os dados pessoais (ou use um modelo de mensagem com campos que o sistema preenche) e revise sempre o texto: a responsabilidade pelo que sai é sua.",o:[o("Colar tudo: é só um chat",{c:-6,e:-2},"Semanas depois, a loja descobriu que as informações de clientes tinham sido enviadas a uma ferramenta pública. Não houve prova de vazamento, mas a diretoria quis rever o contrato com a produção."),o("Não usar IA: é arriscado demais",{a:-2,e:-4},"Você escreveu as 800 mensagens à mão, e o convite saiu no último minuto. Segurança é importante, mas o risco se resolve com regras de uso, não com a recusa da ferramenta."),o("Pedir à IA só um modelo de mensagem com campos em branco (nome, data), deixar que o sistema da loja preencha e revisar o texto",{a:4,c:3,e:-1},"O texto ficou pronto em vinte minutos, sem expor nenhuma cliente. Você ainda corrigiu uma frase da IA que prometia um desconto que a loja não tinha.")]},celularcli:{t:"O celular cheio de clientes",c:[1],tag:"dados",x:a=>'Você guarda, no celular, as conversas, as fotos e as medidas de 300 clientes de consultoria de imagem, sem senha na tela e sem cópia de segurança. Uma colega diz: "Manda tudo para o seu e-mail pessoal para não perder."',lei:"Dados pessoais devem ser guardados com medidas de segurança proporcionais (LGPD, art. 46) e apenas pelo tempo necessário para a finalidade (art. 6º). Ter o celular roubado, com fotos e medidas de clientes, é um risco para elas, e quem tinha o dado responde pelo cuidado. Boas práticas: bloqueio de tela, cópia de segurança em local protegido, apagar o que não é mais necessário e avisar as clientes se houver perda ou acesso indevido (art. 48).",o:[o("Mandar tudo para o e-mail pessoal e continuar como está",{c:-4,e:-1},"Meses depois, o e-mail foi invadido, e as fotos de várias clientes apareceram em um grupo. Você precisou avisar uma por uma."),o("Colocar senha e biometria, guardar uma cópia protegida, apagar as fotos e as medidas de quem já terminou a consultoria e combinar com as clientes o que você guarda e por quanto tempo",{a:4,c:4,e:-3},"Levou uma tarde, e as clientes gostaram de saber o que você guardava. Dois meses depois, o celular foi roubado, mas os dados estavam protegidos e quase nada foi perdido.",{peca:"Rotina de guarda de dados de clientes"}),o("Deixar como está: nunca deu problema",{c:-2,a:-1},"O celular caiu na calçada e a tela travou. Você ficou três dias sem acesso às conversas e às medidas de quem esperava a entrega.")]},cadastro:{t:"O cadastro que pede tudo",c:[1],tag:"dados",x:a=>'O clube de descontos de uma loja pede CPF, data de nascimento, estado civil, renda, endereço completo e foto do documento só para a cliente ganhar 10% de desconto. A gerente diz: "Quanto mais dados, melhor. Depois a gente usa em outras campanhas."',lei:"A LGPD manda coletar só o que é necessário para a finalidade informada (princípios da finalidade, da adequação e da necessidade, art. 6º, I a III) e informar com clareza para que os dados serão usados (art. 9º). Usar depois para outra finalidade, que a cliente não esperava, exige nova base legal. Dado desnecessário também é risco: se vazar, a responsabilidade é de quem o coletou.",o:[o("Manter todos os campos: a gerente pediu",{c:-5,a:-1},'Duas semanas depois, o cadastro apareceu em uma reclamação: "Por que pedem foto do meu documento só para ganhar 10%?". A loja teve de justificar campos que nunca precisou usar.'),o("Pedir só o necessário (nome, e-mail ou telefone e aceite dos termos e da política de privacidade), explicar para que serão usados e por quanto tempo serão guardados",{a:4,c:3,e:-2},"O cadastro ficou mais curto, e as adesões ao clube subiram 40%. A gerente se convenceu de que dado a mais é risco a mais, e não vantagem.",{peca:"Clube de descontos com o mínimo de dados"}),o("Manter os campos, mas guardar tudo em uma planilha com senha",{c:-2,a:1},"A senha ajuda a proteger, mas não resolve o excesso: coletar o que não precisa continua errado, e a coleta já tinha sido feita.")]},carteira:{t:"A carteira da loja anterior",c:[2],tag:"dados",x:a=>'A dona de um ateliê novo, onde você começa a trabalhar, pede: "Você veio da loja da avenida, certo? Traz os contatos das clientes VIP de lá, que a gente manda o convite da nossa inauguração."',lei:"A lista de clientes da loja anterior pertence a ela, e os dados pessoais das clientes só podem ser usados para a finalidade informada quando foram coletados (LGPD, arts. 6º e 7º). Levar ou usar essa carteira pode caracterizar concorrência desleal, pelo uso de informações confidenciais obtidas na relação de trabalho ou pelo desvio de clientela (Lei 9.279/1996, art. 195, III e XI). O caminho é construir a própria lista: divulgar o ateliê, convidar quem quiser e pedir o consentimento.",o:[o("Passar os contatos: as clientes gostam de você, e não de uma loja",{c:-6,e:-2},'A loja anterior descobriu e enviou uma notificação ao ateliê. Várias clientes perguntaram como tinham conseguido o número delas, e a inauguração começou com a fama de "roubar clientela".'),o("Mandar só para as clientes que têm o seu número pessoal",{c:-3,a:1},"Reduzir o alcance ajuda, mas os números continuam vindo da relação de trabalho, e a finalidade original era outra."),o("Recusar e propor convidar quem quiser: um formulário com aceite na inauguração, divulgação nas redes e convite pessoal a quem já pediu para ser avisada",{a:4,c:4,e:-3},"A lista nova foi menor e muito mais engajada. Na inauguração, as clientes que vieram queriam estar ali, e a dona viu que podia confiar em você.")]},trilha:{t:"A trilha do desfile",c:[1],tag:"autor",x:a=>"No desfile de lançamento, para 150 convidados, a produtora diz que a trilha é a playlist do aplicativo de streaming que ela assina. Os vídeos do desfile também vão para as redes da marca, com a mesma música.",lei:"As músicas têm autores e produtores protegidos (Lei 9.610/1998), e a execução pública (um desfile, uma loja, um evento) exige autorização prévia dos titulares, normalmente por meio do ECAD, que arrecada e distribui os direitos (arts. 68 e 99). A assinatura de streaming vale para uso pessoal, e não para evento. Nos vídeos para as redes, as plataformas oferecem bibliotecas de músicas licenciadas, e músicas comerciais podem gerar bloqueio ou remoção do vídeo.",o:[o("Usar a playlist: é só música",{c:-4,e:-2},"O espaço do evento cobrou a taxa dos direitos autorais, que não estava no orçamento, e o vídeo do desfile foi bloqueado na rede social por uso de música sem licença."),o("Combinar com o espaço como os direitos de execução pública serão pagos (ECAD), usar um repertório autorizado (DJ ou banda com repertório regularizado) e, para os vídeos, usar músicas de biblioteca licenciada",{a:4,c:3,e:-3},"O custo dos direitos entrou no orçamento, o DJ levou um repertório autorizado, e o vídeo ficou no ar sem bloqueio. A produtora passou a pedir o item em todo orçamento.",{peca:"Desfile com trilha licenciada"}),o("Abaixar o volume da música para ninguém notar",{c:-2,a:-1},"O volume não muda o fato da execução pública. O espaço cobrou do mesmo jeito.")]},mural:{t:"O mural das clientes",c:[1],tag:"autor",x:a=>'A loja quer repostar, no perfil e em uma parede da vitrine, fotos de clientes com as roupas, tiradas dos stories delas, sem perguntar. "Elas marcaram a loja, então autorizaram."',lei:"Mesmo quando a foto foi publicada pela própria pessoa, usá-la em publicidade exige autorização dela (Constituição, art. 5º, X; Código Civil, art. 20). Se alguém reclamar, a indenização independe de prova de prejuízo (Súmula 403 do STJ). A LGPD também se aplica a foto e nome (arts. 6º e 7º). O caminho é pedir autorização por escrito para esse uso, com prazo e um jeito de pedir a retirada.",o:[o("Montar o mural: elas marcaram a loja",{c:-5,e:-2},"Duas clientes reclamaram, e uma delas pediu indenização pelo uso da imagem na parede da loja. A loja retirou o mural."),o("Pedir autorização por escrito a cada cliente, com prazo de uso e como pedir a retirada, e montar o mural só com quem aceitou",{c:4,a:3,e:-2},"Quinze clientes aceitaram, e um cartão de retirada ficou no balcão. O mural saiu com menos rostos, mas sem nenhum risco.",{peca:"Mural de clientes, com autorização"}),o("Cortar o rosto das fotos e deixar só a roupa",{c:-2,a:1},"A roupa, o fundo e a marcação ainda identificam a cliente, e a foto continua sendo dela.")]},pinterest:{t:"As fotos achadas na internet",c:[1],tag:"autor",x:a=>'A cliente quer que o lookbook e a vitrine usem as fotos de campanhas de grandes marcas, achadas em um site de inspiração, "porque são lindas e todo mundo usa".',lei:"Fotografias são obras protegidas (Lei 9.610/1998, art. 7º, VII), e reproduzi-las exige autorização do fotógrafo ou de quem detém os direitos, com o crédito (arts. 29 e 79). Usar uma imagem como referência (cores, composição, clima) é livre, mas copiar a foto não é. A foto de uma modelo pode exigir ainda a autorização dela para o uso comercial. Bancos de imagem pagos ou gratuitos informam a licença.",o:[o("Usar as fotos: estão na internet",{c:-5,e:-2},"Duas semanas depois, uma das marcas notificou a cliente. A vitrine foi desmontada em cima do prazo, e o lookbook teve de ser refeito."),o("Usar as fotos só como referência, fotografar o seu próprio material ou escolher imagens de banco com licença comercial e guardar o comprovante",{a:4,c:3,e:-3},"O lookbook ficou com cara própria, e a cliente guardou as licenças da campanha. A vitrine se inspirou nas cores e na composição, sem copiar nada.",{peca:"Lookbook com imagens licenciadas"}),o('Usar as fotos e escrever "fonte: internet" no rodapé',{c:-3,a:-1},"Citar a fonte não substitui a autorização. A notificação veio do mesmo jeito.")]},book:{t:"O book do ensaio",c:[2],tag:"autor",x:a=>"Você quer pôr no seu book, no portfólio on-line, as fotos de um ensaio de moda que produziu para uma marca, com fotógrafa e modelo. Ninguém combinou o uso no seu portfólio, e a marca tem contrato de cessão com a fotógrafa.",lei:"A foto é obra da fotógrafa (Lei 9.610/1998, art. 7º, VII), e o direito de reproduzi-la depende do contrato e do crédito (arts. 29 e 79). A imagem da modelo só pode ser usada nos limites do que ela autorizou (Constituição, art. 5º, X; Código Civil, art. 20). A marca pode ter cláusulas de confidencialidade e de exclusividade. O caminho é pedir uma autorização por escrito de cada um e dar o crédito de todos.",o:[o("Publicar tudo: foi você que produziu",{c:-5,s:1},'A fotógrafa e a marca escreveram, quase ao mesmo tempo: "Retire, por favor." A modelo também se queixou, porque o uso em portfólio não estava no contrato.'),o("Publicar só as fotos em que você aparece trabalhando, sem avisar",{c:-3,s:1},"O uso continuou sem autorização da fotógrafa, e a marca percebeu. Mostrar o trabalho não dispensa o consentimento de quem fez e de quem aparece."),o("Pedir à fotógrafa, à modelo e à marca autorização por escrito para usar as fotos no seu book, com crédito de todos, e publicar só as autorizadas",{c:4,s:4,a:1},'Em três dias, os três responderam: "Pode usar, com o crédito." O book ficou com o ensaio e com as autorizações anexadas.',{peca:"Book com ensaio autorizado e creditado"})]},iamodelo:{t:"A modelo que quase não existe",c:[2],tag:"autor",x:a=>'A loja quer uma campanha com imagens geradas por IA de uma modelo muito parecida com a do ensaio do ano passado, "assim a gente não paga cachê de novo". A modelo não será avisada, e o material não dirá que é imagem gerada.',lei:"A imagem e a voz de uma pessoa são direitos dela (Constituição, art. 5º, X; Código Civil, art. 20): reproduzir o rosto ou o corpo de uma modelo real, mesmo por IA, em publicidade sem a sua autorização pode gerar indenização. A publicidade deve ser identificável e não pode induzir o consumidor a erro (CDC, arts. 36 e 37). Se a imagem for gerada, vale informar isso; se imitar uma pessoa real, é preciso contrato e remuneração.",o:[o("Gerar a imagem parecida e publicar sem avisar",{c:-6,e:-2},"A modelo viu a campanha, reconheceu o próprio rosto e procurou a agência. A loja suspendeu a campanha e teve de negociar uma indenização."),o("Mudar o cabelo e a cor dos olhos da imagem gerada para disfarçar",{c:-3,a:-1},"Disfarçar não adianta se o rosto continua reconhecível. O problema é o uso da imagem de alguém, e não os detalhes."),o("Propor duas saídas: contratar a modelo com contrato e cachê para o uso da imagem, ou criar uma personagem gerada sem semelhança com ninguém, e avisar no material que a imagem é gerada por IA",{a:4,c:4,e:-3},"A loja escolheu a personagem gerada, sem semelhança com ninguém, e colocou o aviso no rodapé da campanha. As clientes elogiaram a transparência.",{peca:"Campanha com imagem gerada, identificada"})]},sorteio:{t:"Concorra a um look completo",c:[0],tag:"cons",x:a=>'A loja quer um sorteio no Instagram: "comente, marque três amigas e concorra a R$ 2 mil em compras". Começa na sexta, e a gerente diz que o regulamento será "simples".',lei:"A promoção em que se distribuem prêmios por sorteio, vale-brinde ou concurso, a título de propaganda, depende de autorização prévia do governo federal (Lei 5.768/1971; hoje, pela Secretaria de Prêmios e Apostas do Ministério da Fazenda, no Sistema de Controle de Promoção Comercial, o SCPC). A análise leva em média cerca de 15 dias. Fazer a promoção sem autorização pode gerar multa e a suspensão da ação. Quem planeja a ação precisa saber disso, porque o calendário depende da autorização.",o:[o("Avisar que sorteio com prêmio exige autorização prévia, ajudar a pedi-la com antecedência e ajustar o calendário da ação",{c:4,a:3,e:-3},"O sorteio entrou no ar duas semanas depois, com o número da autorização no regulamento. A gerente se queixou do atraso e depois agradeceu a segurança."),o("Subir na sexta e regularizar depois",{c:-6,e:-2},"A fiscalização notificou a loja por promoção sem autorização, e a ação foi suspensa no meio. As participantes ficaram sem resposta, e a produção ficou com o desgaste."),o('Chamar de "escolha aleatória" em vez de "sorteio"',{c:-4,a:-1},"Mudar o nome não muda a natureza da promoção. A fiscalização olha para o que a ação é, não para como é chamada.")]},depoimentos:{t:"Depoimentos que ninguém deu",c:[2],tag:"cons",x:a=>'Para a página da campanha, a loja pede que você escreva depoimentos de clientes, com nome e foto de banco de imagens: "Mariana, 34 anos: perdi 4 números em um mês com a linha nova." "Todo mundo faz."',lei:"Depoimentos inventados induzem o consumidor a erro e são publicidade enganosa (CDC, art. 37, § 1º). Fazer afirmação falsa ou enganosa sobre as características de um produto é crime (CDC, art. 66). A plataforma também pode retirar a página e punir a conta. O caminho honesto é pedir o depoimento a clientes reais, com autorização para usar o nome e a foto.",o:[o("Escrever os depoimentos e escolher as fotos",{grave:1,c:-10},'Uma cliente reconheceu a foto de banco usada como "Mariana" em outro site, e a denúncia chegou ao Procon. Afirmar algo falso sobre um produto é crime, e o caso ficou registrado como incidente grave no seu nome.'),o('Escrever só três, "para começar"',{c:-5,a:-1},"Três depoimentos falsos também são falsos. A página foi denunciada e perdeu a credibilidade."),o("Recusar e propor pedir o depoimento a clientes reais depois de uma compra, com autorização para o uso do nome e da foto, e responder a todos os comentários",{c:4,a:3,e:-2},"Com o pedido no momento certo, em um mês a loja tinha quarenta depoimentos reais. Eram menos bonitos, mas ninguém duvidou deles.",{peca:"Página de depoimentos reais"})]},modeladora:{t:"A cinta que emagrece",c:[1],tag:"cons",x:a=>'A marca de uma linha de peças modeladoras quer a legenda: "Perca 3 números em uma semana só usando a cinta, sem dieta!". As fotos do "depois" têm o corpo retocado.',lei:"O anunciante deve manter os dados que sustentam o que afirma (CDC, art. 36, parágrafo único), e a publicidade que induz o consumidor a erro, inclusive por afirmações sobre resultados, é enganosa (art. 37, § 1º). Promessas de emagrecimento e de resultado de saúde sem prova podem violar também o Código do CONAR. A peça modeladora modela a silhueta enquanto usada, e o texto deve dizer o que ela faz.",o:[o("Publicar a legenda: é o que vende",{c:-5,e:-2},"Uma consumidora comprou, não perdeu nenhum número e denunciou a campanha ao CONAR e ao Procon. A marca tirou o anúncio e respondeu a uma reclamação."),o('Trocar por uma legenda verdadeira ("modela a silhueta enquanto usada, com compressão média"), usar fotos sem retoque enganoso e guardar a ficha técnica da peça',{a:4,c:4,e:-3},"A legenda ficou menos mágica e mais honesta, e as vendas se mantiveram. A marca arquivou a ficha técnica e usou a mesma lógica nas outras peças.",{peca:"Campanha de peças modeladoras com texto verdadeiro"}),o('Manter a promessa e colocar "resultados podem variar" em letras pequenas',{c:-3,a:-1},"A ressalva não desfaz a promessa principal. Quem lê o anúncio vê só a frase em destaque.")]},liquida:{t:"A liquidação de fachada",c:[2],tag:"cons",x:a=>'Para a liquidação de inverno, a loja sobe os preços em 40% duas semanas antes e depois anuncia na vitrine: "De R$ 200 por R$ 120! Tudo com 40% de desconto". Pede que você monte a vitrine "bem chamativa".',lei:"Anunciar desconto sobre um preço artificialmente aumentado é publicidade enganosa (CDC, art. 37, § 1º) e pode configurar prática abusiva, como elevar o preço sem justa causa (art. 39, X). O anúncio deve ser claro sobre o preço de verdade e o preço da oferta (art. 31). Mostrar o histórico do preço e informar o prazo da liquidação ajuda a comprovar a oferta.",o:[o("Montar a vitrine como pedido: é prática do mercado",{c:-5,e:-2},"Uma cliente tinha tirado print do preço antigo e denunciou ao Procon. A loja teve de retirar a vitrine e responder a uma reclamação coletiva."),o('Montar a vitrine só com o preço de agora, sem o "de" inventado',{c:-1,a:1},"A vitrine ficou honesta, mas a loja não conseguiu mostrar o desconto. A gerente reclamou do resultado, e a conversa sobre preços não foi resolvida."),o("Sugerir uma liquidação real: manter o preço de antes, dar o desconto verdadeiro em uma linha selecionada e informar o prazo na vitrine",{a:4,c:4,e:-3},"A liquidação teve desconto verdadeiro em uma linha e prazo na vitrine. A fila foi menor, mas o ticket médio subiu, e a loja não recebeu nenhuma reclamação.",{peca:"Vitrine de liquidação com preço verdadeiro"})]},etiqueta:{t:"Viscose com cara de linho",c:[1],tag:"cons",x:a=>'A confecção quer etiquetar uma blusa de viscose como "100% linho" e a de poliéster como "algodão", "porque o cliente paga mais". Ela pede que a vitrine e o lookbook usem os mesmos nomes.',lei:"O produto têxtil deve ser vendido com informação correta sobre a composição, com o nome certo das fibras, e sobre os tratamentos de cuidado para a conservação, nos termos da regulamentação do Inmetro (Portaria Inmetro 118/2021) e do CDC (art. 31, sobre a informação clara e precisa nas ofertas). Afirmar uma composição falsa no produto e na publicidade é enganoso (art. 37, § 1º).",o:[o("Usar os nomes pedidos: a confecção é quem responde",{c:-5,e:-2},"Uma cliente lavou a blusa, que encolheu duas numerações, e mostrou a etiqueta ao Procon. A confecção teve de recolher o lote, e a vitrine apareceu na reclamação."),o("Usar a composição real em toda a comunicação e sugerir ressaltar os pontos fortes de cada tecido (caimento, toque, praticidade), com as instruções de lavagem",{a:4,c:4,e:-3},"A viscose foi vendida como viscose, com ênfase no caimento. A confecção viu que não precisava mentir para vender, e as devoluções diminuíram.",{peca:"Lookbook com composição real e cuidados de lavagem"}),o("Usar os nomes pedidos na vitrine e a composição real só na etiqueta interna",{c:-3,a:-1},"A vitrine continuou prometendo o que a peça não era. A clientela leu a vitrine, não a etiqueta interna.")]},acessivel:{t:"O provador e o desfile sem acesso",c:[0],tag:"acess",x:a=>'Uma cliente cadeirante escreve: "Não consigo entrar no provador da sua vitrine nova, e o desfile será em um espaço só com escada. Ainda por cima, uma amiga surda quer ir, mas não há intérprete." A loja pergunta se "dá para ignorar".',lei:"A Lei Brasileira de Inclusão trata da acessibilidade em edificações e espaços de uso coletivo (Lei 13.146/2015, art. 53 e seguintes) e, para os espaços de uso público, as normas técnicas, como a NBR 9050 da ABNT, indicam medidas, como rampas, portas largas e banheiros adaptados. Em eventos, é possível prever rota acessível, lugares reservados, intérprete de Libras e legendas. Acessibilidade também ajuda gestantes, idosos e pessoas com carrinho ou com a perna machucada.",o:[o("Adaptar o que for possível: um provador com porta larga e espaço para giro, uma rota acessível até o desfile, lugares reservados e um intérprete de Libras, divulgados no convite",{a:4,c:4,e:-3},"A cliente e a amiga foram ao desfile, e a loja ganhou uma fila de clientes que antes não se sentiam bem-vindas. A diretoria passou a prever acessibilidade em todo projeto.",{peca:"Provador e desfile acessíveis"}),o("Responder que a próxima loja será acessível",{c:-4},"A cliente compartilhou a resposta nas redes. A loja perdeu a confiança dela e de outras, e a equipe foi cobrada na reunião."),o('Colocar só um aviso: "pedimos desculpas, espaço não adaptado"',{c:-1,a:1},"O aviso é honesto, mas não resolve nada. A cliente continuou sem poder entrar.")]},cliente:{t:"A loja que não paga",d:1,q:a=>!clt(a),x:a=>'Uma loja deve R$ 1.500 do último projeto de vitrine. A dona responde só "estamos organizando os pagamentos". Faz 45 dias.',lei:"Quem presta serviço tem direito de cobrar o que combinou, e o contrato (ou ao menos as mensagens, a ordem de serviço e a nota fiscal) é a sua prova. Antes de ir à Justiça, há caminhos mais simples: notificação por escrito, acordo de parcelamento e protesto.",o:[o("Mandar uma notificação por escrito, com valor, prazo e as provas do serviço, e oferecer parcelar",{s:2,c:2,d:750,e:-3},"Em dez dias, a dona respondeu e parcelou em duas vezes. Você recebeu R$ 750 neste mês."),o("Ir à loja todos os dias até pagarem",{e:-6,c:-2,d:250},'Pagaram R$ 250 para você parar de aparecer e disseram que o resto "vem quando vier". A loja nunca mais te chamou.'),o("Esquecer a dívida e procurar clientes novos",{e:2,s:-2},'Você perdeu R$ 1.500 e ganhou tempo. Meses depois, a loja contou a conhecidos que "nem foi cobrada".')]},revisoes:{t:"Só mais um look",d:1,q:a=>!clt(a),x:a=>'O contrato do lookbook previa 12 looks. A cliente pede o 13º e depois o 14º, "só mais um". Cada look novo toma uma tarde sua, entre montar, fotografar e ajustar. Ela diz: "É só um look, igual aos outros."',nota:'Contratos de produção devem delimitar o escopo e prever como entram as mudanças (o chamado controle de mudanças), com valor para o que sai do combinado. Sem isso, a cliente não sabe quanto custa pedir "só mais um", e a produtora acaba trabalhando de graça.',o:[o("Fazer o look sem cobrar, para manter a cliente",{e:-6,c:1,s:1},"A cliente adorou e pediu o 15º na semana seguinte."),o("Fazer o look e cobrar o extra, avisando que, daqui para a frente, vale a tabela de mudanças do contrato",{d:200,c:2,s:-1,e:-3},"A cliente reclamou um pouco, pagou os R$ 200 e passou a ser mais objetiva nos pedidos."),o('Encerrar o contrato: "Já fiz tudo o que combinamos"',{e:3,s:-3,c:-1},"Você ficou livre, mas a cliente falou mal de você para duas conhecidas.")]},curso:{t:"Curso de visual merchandising",d:1,x:a=>"Abriu uma turma de 40 horas sobre visual merchandising e composição de vitrines, com certificado, por R$ 480 (ou 4 × R$ 120).",o:[o("Fazer o curso completo, parcelado",{a:6,s:2,c:2,e:-5,parcela:{n:"Curso de visual merchandising",v:120,q:4}},"Você passou cinco sábados aprendendo a ler o fluxo de uma loja, a usar a iluminação e a montar pontos de venda. Na semana seguinte, usou isso em um projeto e aumentou a venda da vitrine."),o("Fazer só os módulos gratuitos da plataforma",{a:3,e:-2},"Mais barato e mais flexível, mas sem o certificado nem a prática com os materiais."),o("Deixar passar e descansar",{e:4},"Você dormiu melhor neste mês. A turma fechou as inscrições.")]},proprio:{t:"Sua própria coleção-cápsula",d:1,x:a=>"Você teve uma ideia: uma coleção-cápsula de 12 peças customizadas (camisas e bolsas) para vender em feiras de bairro e no Instagram. Ninguém na região faz algo assim.",nota:"Quem monta um produto próprio assume o risco: custo de matéria-prima, etiquetas e informações obrigatórias, preço, nota fiscal, trocas e, na venda pela internet, o direito de arrependimento em 7 dias (CDC, art. 49), além do cuidado com os dados das clientes (a LGPD vale desde o primeiro cadastro). A vantagem é construir uma marca e uma base de clientes que são suas.",o:[{l:"Lançar este ano, testando em três feir "dentro"><p><strong>Registro de aplicações.</strong> A cada turma em que aplicar o jogo, use o botão “Registrar aplicação” desta capa: informe data, unidade, curso, turma e número de estudantes. Nenhum dado dos estudantes é coletado. Compartilhe sempre o link oficial; não copie nem hospede o jogo em outro endereço.</p><p><strong>Como usar.</strong> Cada estudante joga no próprio celular. As vidas são diferentes de propósito: quem tirou um filho pequeno, clientes pequenos e só R$ 200 na conta joga um ano mais apertado do que quem mora com a família, atende clientes grandes e começa com R$ 2.500. No fim, peçam que comparem o resultado, quanto receberam, as produções do book e o que escreveram nas quatro pausas.</p><p><strong>Para a conversa depois.</strong> O que dependia de escolha e o que dependia do sorteio? O que mudou entre o empregado e o freelancer, nas contas e nos riscos? Quais ocupações da moda cabem no MEI e quais não cabem, e o que isso muda para quem trabalha por conta própria? Quem responde pelas condições de trabalho em uma oficina terceirizada? Qual regra sobre imagem, música, estampa, publicidade ou dados das clientes você não conhecia? Que situação do jogo apareceu em um estágio, em um desfile ou em um trabalho do curso? A opção de cada situação aparece com uma letra, para facilitar perguntas como "quem escolheu B?".</p><p><strong>Base legal.</strong> CLT (arts. 3º, 9º, 29, 41, 59, 66, 71, 73, 223-B, 442-B, 445 e 457), Constituição (arts. 5º e 7º), Lei 10.101/2000 (trabalho no comércio aos domingos e feriados) e Súmula 146 do TST; Lei 11.788/2008 (estágio); Código Civil (arts. 20, 186, 593 a 609 e 927); Código Penal, arts. 149 (condição análoga à de escravo) e 216-A; ECA, art. 149 (participação de crianças e adolescentes em espetáculos); Lei 9.610/1998, direitos autorais (arts. 7º, 29, 50, 68, 79 e 99); Lei 9.279/1996 (desenho industrial e concorrência desleal); Súmula 403 do STJ (uso indevido de imagem); Código de Defesa do Consumidor (arts. 30, 31,
