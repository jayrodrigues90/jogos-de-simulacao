/* Layout: uma coluna de celular; no topo, a estrada do ano (12 paradas, uma por mês) e os medidores; embaixo, uma cena por vez. Identidade: placa marrom de atrativo turístico. */
:root{
  --papel:#ECEEE8; --cartao:#FAFBF7; --tinta:#1D1A16; --tinta2:#5A554D; --linha:#CBCDC4;
  --placa:#6B3B1F; --sobre-placa:#FFFFFF; --marca:#F0B12E; --sobre-marca:#1D1A16;
  --bom:#2B7647; --ruim:#B3261E; --trilho:#D9DCD3;
  --f-tit:"Overpass","Arial Narrow",system-ui,sans-serif;
  --f-txt:"Source Sans 3",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-mono:"Overpass Mono",ui-monospace,"SFMono-Regular",Menlo,monospace;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --papel:#14120F; --cartao:#1E1B17; --tinta:#EEEAE2; --tinta2:#A8A095; --linha:#39342C;
  --placa:#D4915C; --sobre-placa:#14120F; --marca:#F0B12E; --sobre-marca:#1D1A16;
  --bom:#6CD198; --ruim:#FF8A80; --trilho:#2B2720; color-scheme:dark } }
:root[data-theme="dark"]{
  --papel:#14120F; --cartao:#1E1B17; --tinta:#EEEAE2; --tinta2:#A8A095; --linha:#39342C;
  --placa:#D4915C; --sobre-placa:#14120F; --marca:#F0B12E; --sobre-marca:#1D1A16;
  --bom:#6CD198; --ruim:#FF8A80; --trilho:#2B2720; color-scheme:dark }

*{box-sizing:border-box}
body{background:var(--papel);color:var(--tinta);font-family:var(--f-txt);font-size:17px;line-height:1.5;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0 40px}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--papel)}
.col{max-width:520px;margin:0 auto;display:flex;flex-direction:column;gap:16px}
h1,h2,h3{font-family:var(--f-tit);text-wrap:balance;margin:0;line-height:1.02;letter-spacing:-.015em}
p{margin:0}
button{font:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:3px solid var(--marca);outline-offset:2px}
.rot{font-family:var(--f-mono);font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--tinta2)}

/* ---------- estrada do ano (HUD) ---------- */
.hud{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--papel);padding-block:10px 8px;
  display:flex;flex-direction:column;gap:8px;border-bottom:1px solid var(--linha)}
.ponto{display:grid;grid-template-columns:repeat(12,1fr);position:relative}
.ponto::before{content:"";position:absolute;left:4%;right:4%;top:7px;height:3px;background:repeating-linear-gradient(90deg,var(--linha) 0 6px,transparent 6px 10px)}
.furo{position:relative;display:flex;flex-direction:column;align-items:center;gap:3px;font-family:var(--f-mono);font-size:10px;color:var(--tinta2)}
.furo i{width:13px;height:13px;border-radius:50%;border:2px solid var(--linha);background:var(--papel);display:block}
.furo.foi i{background:var(--placa);border-color:var(--placa)}
.furo.agora i{background:var(--marca);border-color:var(--tinta);transform:scale(1.15)}
.furo.agora{color:var(--tinta);font-weight:600}
.medidores{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
.med{display:flex;flex-direction:column;gap:3px;min-width:0}
.med b{font-family:var(--f-mono);font-weight:500;font-size:10px;letter-spacing:.03em;text-transform:uppercase;color:var(--tinta2);display:flex;justify-content:space-between;gap:4px}
.med b span{color:var(--tinta);font-variant-numeric:tabular-nums}
.barra{height:6px;background:var(--trilho);border-radius:1px;overflow:hidden}
.barra u{display:block;height:100%;background:var(--placa);transition:width .5s ease}
.med.baixo .barra u{background:var(--ruim)}
.med.baixo b span{color:var(--ruim)}
.grana{display:flex;flex-wrap:wrap;gap:4px 14px;align-items:baseline;font-family:var(--f-mono);font-size:12px;color:var(--tinta2);font-variant-numeric:tabular-nums}
.grana strong{color:var(--tinta);font-weight:600}
.grana .deve strong{color:var(--ruim)}
.grana button{margin-left:auto;background:none;border:0;padding:2px 0;font-family:var(--f-mono);font-size:11px;color:var(--tinta2);text-decoration:underline;text-underline-offset:3px}

/* ---------- cena ---------- */
.cena{display:flex;flex-direction:column;gap:14px;padding-top:6px;animation:entra .28s ease both}
@keyframes entra{from{opacity:.4;transform:translateY(6px)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion:reduce){.cena{animation:none}.barra u{transition:none}}
.cena h2{font-size:clamp(28px,8vw,36px);font-weight:900}
.cena .texto{display:flex;flex-direction:column;gap:10px;max-width:60ch}
.ops{display:flex;flex-direction:column;gap:8px;margin-top:4px}
.op{display:grid;grid-template-columns:auto 1fr;gap:12px;align-items:start;text-align:left;width:100%;
  background:var(--cartao);border:1.5px solid var(--linha);border-radius:6px;padding:13px 14px;font-weight:500;line-height:1.35}
.op kbd{font-family:var(--f-mono);font-size:12px;font-weight:600;color:var(--placa);padding-top:2px}
.op small{display:block;font-weight:400;font-size:14px;color:var(--tinta2);margin-top:2px}
a.op{color:inherit;text-decoration:none}
.op:hover{border-color:var(--placa)}
.op:active{transform:translateY(1px)}
.op.ir{background:var(--placa);border-color:var(--placa);color:var(--sobre-placa);font-weight:600;grid-template-columns:1fr;text-align:center}
.fichas{display:flex;flex-wrap:wrap;gap:6px}
.ficha{font-family:var(--f-mono);font-size:12px;padding:3px 8px;border:1px solid var(--linha);border-radius:3px;font-variant-numeric:tabular-nums}
.ficha.mais{color:var(--bom);border-color:currentColor}
.ficha.menos{color:var(--ruim);border-color:currentColor}
.lei{border-top:1px dashed var(--linha);padding-top:12px;display:flex;flex-direction:column;gap:6px;font-size:15.5px}
.lei em{font-style:normal;align-self:flex-start;background:var(--marca);color:var(--sobre-marca);font-family:var(--f-mono);font-size:11px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;padding:1px 6px}
/* placa marrom de atrativo turístico, com o filete branco por dentro */
.placa{align-self:flex-start;font-family:var(--f-tit);font-weight:800;font-size:16px;letter-spacing:.05em;text-transform:uppercase;
  background:var(--placa);color:var(--sobre-placa);padding:8px 14px 6px;border-radius:7px;box-shadow:inset 0 0 0 3px var(--placa),inset 0 0 0 5px var(--sobre-placa)}
.placa.mal{background:var(--ruim);box-shadow:inset 0 0 0 3px var(--ruim),inset 0 0 0 5px var(--sobre-placa)}
.placa.peq{font-size:12.5px;padding:6px 11px 4px}

.hol{background:var(--cartao);border:1.5px solid var(--linha);border-radius:6px;padding:14px;font-family:var(--f-mono);font-size:13px;display:flex;flex-direction:column;gap:5px;font-variant-numeric:tabular-nums}
.hol .cab{font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--tinta2);padding-bottom:4px}
.hol .l{display:flex;justify-content:space-between;gap:10px}
.hol .l span:first-child{min-width:0}
.hol .l span:last-child{white-space:nowrap}
.hol .tot{border-top:1.5px solid var(--tinta);padding-top:6px;margin-top:3px;font-weight:600}
.hol .obs{color:var(--tinta2);font-size:13.5px;padding-top:4px;font-family:var(--f-txt)}
.neg{color:var(--ruim)}
.ficha-p{display:grid;grid-template-columns:auto 1fr;gap:7px 14px;font-size:16px;margin:0}
.ficha-p dt{font-family:var(--f-mono);font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--tinta2);padding-top:4px}
.ficha-p dd{margin:0}
.cracha{background:var(--cartao);border:1.5px solid var(--linha);border-radius:8px;overflow:hidden;display:flex;flex-direction:column}
.cracha .topo{background:var(--placa);color:var(--sobre-placa);padding:9px 14px;font-family:var(--f-mono);font-size:11px;letter-spacing:.08em;text-transform:uppercase;display:flex;justify-content:space-between;gap:8px}
.cracha .corpo{padding:14px}
ul.plano{margin:0;padding-left:18px;display:flex;flex-direction:column;gap:5px}
textarea,input[type=text]{font:inherit;color:var(--tinta);background:var(--cartao);border:1.5px solid var(--linha);border-radius:6px;padding:11px 12px;width:100%}
textarea{min-height:110px;resize:vertical}
.col2{display:flex;flex-direction:column;gap:10px}
.colega{border-top:1px dashed var(--linha);padding-top:10px;display:flex;flex-direction:column;gap:2px;font-size:15.5px}
.colega b{font-family:var(--f-tit);font-size:18px}
blockquote{margin:0;padding:0 0 0 12px;border-left:3px solid var(--marca);font-size:16px}
blockquote cite{display:block;font-style:normal;font-size:13px;color:var(--tinta2)}
.temp{display:inline-block;font-family:var(--f-mono);font-size:11px;letter-spacing:.06em;text-transform:uppercase;border:1.5px solid currentColor;border-radius:3px;padding:1px 6px;align-self:flex-start}
.temp.alta{color:var(--bom)} .temp.media{color:var(--tinta2)} .temp.baixa{color:var(--ruim)}

.capa{padding-top:28px;display:flex;flex-direction:column;gap:18px}
.capa h1{font-size:clamp(54px,17vw,92px);font-weight:900;line-height:.88;letter-spacing:-.035em}
.capa h1 span{background:var(--placa);color:var(--sobre-placa);padding:0 .1em;border-radius:.08em;box-decoration-break:clone;-webkit-box-decoration-break:clone}
.capa .lead{font-size:19px;max-width:34ch}
details{border-top:1px dashed var(--linha);padding-top:12px;font-size:15.5px}
details summary{cursor:pointer;font-weight:600}
details .dentro{display:flex;flex-direction:column;gap:10px;padding-top:10px;color:var(--tinta2)}
details .dentro strong{color:var(--tinta)}
label{font-weight:600;font-size:15px;display:flex;flex-direction:column;gap:6px}
.nota{font-family:var(--f-tit);font-weight:900;font-size:84px;line-height:.9;letter-spacing:-.03em;font-variant-numeric:tabular-nums}
.nota small{font-family:var(--f-mono);font-weight:500;font-size:13px;letter-spacing:.06em;text-transform:uppercase;color:var(--tinta2)}
.selos{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.selo{border:1.5px dashed var(--linha);border-radius:6px;padding:9px 10px;font-size:13.5px;line-height:1.35;color:var(--tinta2);min-width:0}
.selo b{display:block;font-family:var(--f-tit);font-size:16px;line-height:1.15;margin-bottom:3px}
.selo.tem{border-style:solid;border-color:var(--placa);background:var(--cartao);color:var(--tinta)}
.selo.tem b{color:var(--placa)}

/* escolha da região */
.regs{display:flex;flex-direction:column;gap:8px}
.regs .grade{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.reg{display:flex;flex-direction:column;gap:2px;text-align:left;background:var(--cartao);border:1.5px solid var(--linha);border-radius:6px;padding:10px 11px;min-width:0}
.reg b{font-family:var(--f-tit);font-size:16px;line-height:1.15}
.reg small{font-size:13px;line-height:1.3;color:var(--tinta2)}
.reg:hover{border-color:var(--placa)}
.reg[aria-pressed="true"]{border-color:var(--placa);background:var(--placa);color:var(--sobre-placa);box-shadow:inset 0 0 0 2px var(--placa),inset 0 0 0 3.5px var(--sobre-placa)}
.reg[aria-pressed="true"] small{color:var(--sobre-placa);opacity:.9}
@media (max-width:340px){.regs .grade{grid-template-columns:1fr}}

/* créditos e bloqueio */
.rod{margin-top:36px;padding-top:14px;border-top:1.5px dashed var(--linha);font-family:var(--f-mono);font-size:11.5px;line-height:1.55;color:var(--tinta2)}
.rod b,.rod a{color:var(--placa)}
.bloq{padding-top:40px;display:flex;flex-direction:column;gap:14px}
.bloq a{color:var(--placa);font-weight:700;word-break:break-all}
.acesso{display:flex;gap:10px;align-items:center;justify-content:space-between;flex-wrap:wrap;border:1.5px dashed var(--linha);border-radius:6px;padding:12px 14px}
.acesso p{font-size:15px;min-width:0;flex:1 1 220px}

r o crachá físico chegar",{s:-4,e:3},"A agência chamou outra pessoa. Seu primeiro trabalho ficou para fevereiro."),o("Ir sem identificação. É só um passeio pela cidade",{c:-6},"A recepção do museu pediu sua identificação de guia e você não tinha nada para mostrar. O grupo esperou do lado de fora enquanto a agência resolvia por telefone.")]},{t:"A nota fiscal",d:1,x:a=>"Uma agência da região quer você nas excursões de Carnaval, mas só contrata quem emite nota fiscal. Hoje você trabalha só com o CPF.",nota:"O Cadastur aceita o guia como pessoa física (CPF) ou como microempreendedor individual (Portaria MTur 37/2021, art. 14). O MEI paga todo mês um valor fixo, o DAS: em 2026, R$ 86,05 para quem presta serviço. Em troca, emite nota e contribui para o INSS.",o:[{l:"Abrir o MEI esta semana",f:a=>(a.p.mei=1,{s:6,c:2,e:-3,r:"O cadastro levou uma tarde no gov.br. A partir de agora, R$ 86,05 saem todo mês, com trabalho ou sem. Em troca, mais agências podem te contratar."})},o("Continuar com CPF e procurar agências que paguem por recibo",{e:2,s:-3},"Sem custo fixo, mas com menos portas abertas. Algumas agências nem respondem quando você diz que não emite nota."),o("Emitir a nota pelo CNPJ de um amigo",{c:-6,s:-2},"Funcionou uma vez. Na segunda, o contador da agência estranhou um guia emitindo nota por uma empresa de reformas, e você perdeu o cliente.")]},{t:"O parque",c:[0],x:a=>'Um grupo de 30 pessoas quer fazer uma trilha em um parque estadual da região. A agência te manda o roteiro na véspera: "É só seguir a trilha principal."',lei:"Guia de turismo não é condutor de visitantes. Antes de levar um grupo a uma unidade de conservação, cabe ao guia verificar se o lugar exige condutor local e quais são as regras de visitação (Portaria MTur 37/2021, art. 8º).",o:[o("Ligar para o parque e confirmar regras, tamanho do grupo e se precisa de condutor",{a:5,c:4},"O parque exigia agendamento e limitava os grupos a 15 pessoas. Vocês dividiram o grupo em dois horários, cada um com um condutor do parque. A trilha foi um sucesso."),{l:"Conduzir a trilha você mesmo. Você é guia",f:a=>rng(a)<.5?{c:-8,r:"Na portaria, o grupo foi barrado: sem agendamento e sem condutor, ninguém entrava. Trinta pessoas voltaram para o ônibus."}:{c:-5,e:-4,r:"O grupo entrou, mas um funcionário do parque parou vocês no meio do caminho: aquele trecho exigia condutor. O passeio acabou pela metade."}},o("Trocar a trilha por um passeio na cidade, sem consultar a agência",{c:-5,s:-3},"O grupo tinha comprado a trilha. A agência recebeu reclamações e teve que devolver parte do dinheiro.")]},{t:"A comissão",c:[1],x:a=>"Uma loja de lembranças da cidade oferece 10% de tudo o que o seu grupo comprar, se você levar os turistas até lá.",lei:"O guia deve informar aos turistas os serviços que presta e quanto custam, e não pode cobrar comissão como condição para levar o grupo a uma loja ou restaurante (Portaria MTur 37/2021, art. 9º, VI). O Código de Defesa do Consumidor também exige informação clara.",o:[o("Aceitar e incluir a loja no roteiro sem contar ao grupo",{c:-6,d:180},"Entraram R$ 180. Na volta, uma turista viu a mesma sandália mais barata na loja ao lado e perguntou, na frente de todos, se você ganhava alguma coisa com aquilo."),o("Recusar a comissão e parar na loja só se fizer sentido para o grupo",{c:4,a:2},"O grupo queria levar uma lembrança da cidade. Você indicou três lojas, contou a história local e não ficou devendo nada a ninguém."),o("Pedir 15% para colocar a loja no roteiro",{grave:1,c:-8},"A loja aceitou, mas contou à agência. Cobrar comissão para levar o grupo é proibido. O caso foi comunicado e virou infração registrada no seu nome.")]},{t:"O idioma",c:a=>2===a.p.idi?[0,1]:[1],x:a=>"Uma agência precisa de guia em inglês para uma comitiva estrangeira que vem a uma feira de negócios no estado. O cachê é 50% maior. "+(2===a.p.idi?"Seu inglês é intermediário: você conversa bem, mas termos técnicos de agronomia são outra história.":1===a.p.idi?"Você fala espanhol, não inglês.":"Você não fala inglês."),lei:"O guia só pode declarar no Cadastur idiomas em que consiga conduzir um grupo, com boa compreensão e boa expressão oral (Portaria MTur 37/2021, art. 9º, §3º).",o:[{l:"Aceitar o trabalho",f:a=>2===a.p.idi?{d:450,a:4,e:-6,r:"Você passou duas noites estudando o vocabulário da feira. Tropeçou em alguns termos, mas a comitiva elogiou, e o cachê extra entrou na conta."}:{c:-10,d:150,r:"Na primeira hora, ficou claro que você não dava conta. A agência chamou outra guia às pressas e pagou só meia diária."}},o("Ser honesto sobre o seu nível e indicar um colega fluente",{s:5,c:3},"Seu colega fez o trabalho e, uma semana depois, te indicou para um grupo que você podia atender."),o("Aceitar e contar com o tradutor do celular",{c:-8},'O aplicativo traduziu "colheitadeira" de três jeitos diferentes. A comitiva desistiu de perguntar, e a agência não te chamou de novo.')]},{t:"A autorização",c:[1],x:a=>'Excursão escolar de uma cidade do interior para um museu na capital: 40 alunos de 12 e 13 anos e dois professores. Na hora do embarque, um aluno está sem autorização de viagem. A mãe manda mensagem: "Pode levar, eu deixo."',lei:"Criança ou adolescente com menos de 16 anos só viaja para fora da comarca onde mora, sem os pais ou responsáveis, com autorização. A autorização dos pais precisa ser por escrito, com firma reconhecida, ou por escritura pública (ECA, art. 83, e Resolução CNJ 295/2019).",o:[o("Embarcar o aluno. A mãe autorizou por mensagem",{c:-9},"Na parada da estrada, uma fiscalização de rotina conferiu a lista de passageiros e os documentos. O aluno não podia seguir viagem, e a escola teve que buscá-lo."),o("Não embarcar sem a autorização com firma reconhecida e avisar a escola",{c:5,a:3},"A mãe correu ao cartório perto da escola. O ônibus saiu com 40 minutos de atraso e com todos os documentos em ordem. A escola anotou seu nome para a próxima."),o("Escrever você mesmo uma autorização para a mãe assinar depois",{grave:1,c:-10},"Um papel feito por você, assinado depois e sem firma reconhecida, não vale como autorização e pode ser visto como fraude. A escola reclamou, e o caso virou infração registrada no seu nome.")]},{t:"Quatro horas de estrada",c:[1],x:a=>'Excursão de inverno para a Serra Gaúcha. Fora de São Paulo, você atua como guia de excursão nacional. O motorista dirige há quatro horas sem parar, e o grupo insiste: "Falta pouco, vamos direto pro hotel!"'+(2===a.p.fase?" Em casa, as crianças ficaram com quem mora com você por sete dias.":""),lei:"Motorista de ônibus de passageiros deve descansar 30 minutos a cada 4 horas de direção, e esse tempo pode ser dividido (Código de Trânsito Brasileiro, art. 67-C, com redação da Lei 13.103/2015). A regra protege todo mundo a bordo.",o:[{l:"Pedir ao motorista para seguir só mais um pouco",f:a=>({c:-6,e:viagem(a),r:"O motorista recusou e parou no posto seguinte, contrariado com você. No resto da viagem, ele falou com você só o necessário."})},{l:"Apoiar a parada e transformar o intervalo em pausa para café e banheiro",f:a=>({c:5,a:2,e:viagem(a),r:"Você explicou a regra ao microfone em um minuto. A parada virou o momento mais animado da viagem, com café e pão de queijo."})},{l:"Fazer uma votação no ônibus",f:a=>({c:-4,e:viagem(a),r:"A maioria votou por seguir, e o motorista teve que dizer não na frente de todo mundo. Regra de segurança não vai a votação."})}]},{t:"A agência que não paga",d:1,x:a=>'A agência que mais te chamou no semestre ainda não pagou R$ 1.200 de diárias de julho. Agora oferece mais uma excursão, para a Festa do Peão de Barretos, "e no fim do mês acerta tudo junto".',nota:"O guia pode trabalhar por contrato de prestação de serviço com agências e transportadoras cadastradas, ou direto com o turista (Portaria MTur 37/2021, art. 12). Contrato por escrito, com valor e prazo de pagamento, protege os dois lados.",o:[{l:"Aceitar. Não dá para perder a principal agência",f:a=>rng(a)<.55?{e:-5,s:2,r:"Deu certo: no fim do mês, a agência pagou tudo junto, com 50 dias de atraso."}:{d:-1200,e:-5,r:"A agência pediu mais 30 dias. Depois, mais 30. Os R$ 1.200 de julho viraram uma conversa sem fim."}},{l:"Cobrar por escrito e só aceitar o novo trabalho com contrato e data de pagamento",f:a=>rng(a)<.6?{c:2,a:3,s:-2,r:"A agência pagou em uma semana e assinou contrato para Barretos. Ficou um pouco fria com você, mas agora tudo está no papel."}:{s:-6,a:3,r:"A agência pagou julho e chamou outra pessoa para Barretos. Você recebeu o que era seu e perdeu o trabalho novo."}},o("Contar o caso no grupo de guias da região",{s:3,c:-4},"Três colegas disseram que passavam pelo mesmo. A agência viu o print e pagou, mas nunca mais te chamou. Outras agências ficaram sabendo do caso.")]},{t:"Do outro lado da divisa",c:[1],x:a=>'Excursão de feriado para uma cidade histórica de Minas Gerais. Você vai como guia de excursão nacional. Na véspera, a agência pede: "Faz você mesmo o city tour por lá. Assim a gente economiza o guia local."',lei:"Quem é guia de excursão nacional acompanha o grupo durante toda a viagem, mas não pode fazer, dentro de outro estado, o trabalho do guia regional de lá. Para passeios locais, a agência deve contratar um guia regional daquele estado (Portaria MTur 37/2021, art. 6º). Seu cadastro de guia regional vale só para São Paulo.",o:[{l:"Fazer o city tour. Você estudou a cidade",f:a=>rng(a)<.5?{grave:1,c:-8,r:"Uma guia regional da cidade viu o grupo e pediu seu crachá. O caso foi comunicado ao órgão de turismo e virou infração registrada no seu nome."}:{c:-4,e:-3,r:"Ninguém pediu seu crachá. Mas o grupo fez perguntas que você não sabia responder, e um guia local que passava te corrigiu na frente de todos."}},o("Explicar a regra e pedir que a agência contrate um guia regional de Minas",{c:4,s:4,a:3},"A agência contratou um guia da cidade. Enquanto ele conduzia, você cuidou do grupo, e vocês trocaram contatos. Ele te indicou para outra excursão."),o("Fazer o tour sem o crachá, para não chamar atenção",{grave:1,c:-10},"Sem crachá, você nem tinha como provar que era guia. A ocorrência foi registrada e chegou ao Ministério do Turismo como infração.")]},{t:"Para todos",c:[0],x:a=>"Romaria com um grupo de 40 pessoas. Na lista, uma senhora usa cadeira de rodas e dois idosos andam de bengala. O roteiro da agência inclui um mirante com uma escadaria longa.",lei:"A pessoa com deficiência tem direito ao turismo e ao lazer em igualdade de oportunidades com as demais pessoas (Lei Brasileira de Inclusão, Lei 13.146/2015, art. 42).",o:[o("Verificar a acessibilidade antes e adaptar o roteiro para que todos participem",{a:4,c:6,e:-3},"Você ligou para os atrativos, descobriu um acesso por rampa e um ponto de desembarque mais perto, e ajustou os horários. Todo mundo foi junto. A senhora mandou um áudio de agradecimento para a agência."),o("Manter o roteiro. Quem não conseguir subir espera no ônibus",{c:-9},"Três pessoas passaram uma hora no ônibus enquanto o grupo subia. Uma delas escreveu para a agência: tinha pagado o mesmo valor que todo mundo."),o("Pedir à família da senhora que resolva como ela vai subir",{c:-6},"A família improvisou, com esforço e risco. Você soube depois que ela quase caiu na escada.")]},{t:"Seu próprio roteiro",d:1,x:a=>"Você teve uma ideia: um passeio a pé pelo centro histórico da sua cidade, contando a história local, vendido direto ao público, aos sábados. Ninguém na cidade faz algo assim.",nota:"O guia pode vender o próprio serviço direto ao turista (Portaria MTur 37/2021, art. 12). Quem empreende assume o risco: divulgação, roteiro, preço e sábados sem público.",o:[{l:"Lançar este mês, com divulgação nas redes",f:a=>rng(a)<.6?{flag:"proprio",s:6,a:4,e:-6,d:300,r:"Primeiro sábado: 6 pessoas. Terceiro: 14. Um hotel da cidade pediu para indicar o passeio aos hóspedes."}:{flag:"proprio",a:5,s:2,e:-6,d:-150,r:"Dois sábados com três pessoas cada. O gasto com divulgação foi maior que o que entrou. Mas você testou o roteiro e sabe o que mudar."}},o("Propor o roteiro a uma agência, como parceria",{s:4,a:3,d:150},"A agência topou vender o passeio e ficou com parte do valor. Menos risco, menos ganho, e o nome no folheto é o dela."),o("Guardar a ideia para quando tiver mais experiência",{e:3},"Você descansou nos sábados. Em dezembro, viu outra guia anunciando um passeio parecido.")]},{t:"Balanço do ano",d:1,x:a=>"Dezembro: excursões de Natal, agenda cheia, e as agências já montando o calendário do ano que vem.",o:[o("Pedir depoimentos de clientes e montar um portfólio",{c:4,s:3,e:-5,flag:"portfolio"},"Você juntou vinte depoimentos e fotos autorizadas. Em janeiro, o portfólio vai chegar antes de você."),o("Fechar agora o calendário do ano que vem com as agências",{s:6,e:-4},"Três datas de alta temporada já estão garantidas. Em troca, você passou o Natal respondendo mensagem."),o("Tirar duas semanas de descanso de verdade",{e:14,s:-3},"Você desligou o celular de trabalho e voltou com outra disposição. Duas agências fecharam o calendário com quem respondeu primeiro.")]}],ALEA={atraso:{t:"O casal atrasado",d:1,x:a=>"Embarque às 6h. Às 6h40, um casal ainda não chegou e não atende o telefone. Os outros 38 passageiros reclamam.",o:[o("Esperar mais 20 minutos",{c:-2,e:-2},"O casal chegou às 6h55, pedindo desculpas. O roteiro do dia ficou apertado e o grupo resmungou até o almoço."),o("Partir no horário do contrato e avisar a agência",{c:2,a:2,s:-2},"Você registrou as ligações e avisou a agência. O casal reclamou depois, e a agência teve que explicar que o horário estava no contrato."),o("Ir buscar o casal em casa",{e:-6,c:-1},"Eles tinham perdido a hora. O grupo esperou 50 minutos no ônibus. Você ganhou dois fãs e trinta e oito críticos.")]},perdido:{t:"Um a menos",c:[0],x:a=>"Hora de voltar ao ônibus no centro histórico. Você conta o grupo: 29. Falta uma pessoa, que não atende o celular.",nota:"Antes de liberar tempo livre: ponto de encontro, horário de volta e telefone do guia anotado por todos.",o:[o("Pôr em prática o combinado: alguém fica com o grupo no ponto de encontro e você procura",{c:5,a:3},"No primeiro dia, você tinha combinado ponto de encontro e anotado o telefone de todos. Ela estava numa loja, sem sinal. Quinze minutos de susto e mais nada."),o("Esperar no ônibus. Ela aparece",{c:-5},"Ela apareceu quarenta minutos depois, assustada, e perguntou por que ninguém foi procurá-la."),o("Seguir viagem e pedir que ela vá de táxi",{c:-10},"Deixar uma turista para trás não estava em roteiro nenhum. A agência recebeu a reclamação antes de o ônibus chegar ao hotel.")]},malestar:{t:"Dor no peito",c:[0],x:a=>"No meio do passeio, um senhor fica pálido, sua frio e diz que está com dor no peito.",nota:"Dor no peito é emergência. Ligue para o SAMU (192), não ofereça remédio e não deixe a pessoa sozinha.",o:[o("Ligar para o SAMU, deixá-lo em repouso e seguir as orientações por telefone",{c:5,a:2},"O atendente orientou você até a ambulância chegar. No hospital, disseram que o atendimento rápido fez diferença."),o("Oferecer um remédio que você tem na bolsa",{c:-6},"Por sorte, ele não piorou. Mas dar remédio sem saber o que a pessoa tem pode agravar o quadro."),o("Colocá-lo no ônibus para descansar e seguir o roteiro",{c:-8,e:-4},"Ele piorou no ônibus. Vocês perderam meia hora até chegar a um pronto-socorro.")]},trilha:{t:"A foto perfeita",c:[0],x:a=>"Numa trilha ecológica, parte do grupo quer sair da trilha marcada para fotografar em cima de uma pedra, e uma turista começa a jogar pão para os macacos.",lei:"Sair da trilha, retirar plantas e alimentar animais silvestres costumam ser proibidos pelas regras das áreas naturais. Danificar vegetação protegida pode ser crime ambiental (Lei 9.605/1998).",o:[o("Explicar as regras, propor um ponto seguro para a foto e pedir que não alimentem os animais",{a:3,c:4},"Você explicou que comida humana faz mal aos macacos e os deixa agressivos. A foto do mirante ficou melhor que a da pedra."),o("Deixar. Cada um é responsável por si",{c:-6},"Um rapaz escorregou na pedra e torceu o pé. A volta, com muleta improvisada, levou duas horas."),o("Tirar a foto na pedra também, para agradar o grupo",{c:-4,e:-2},"O grupo adorou. A administração do lugar, que viu tudo, anotou o nome da agência.")]},cracha:{t:"Me empresta o crachá?",c:[1],x:a=>'Um colega de curso que ainda não fez o Cadastur pede para fazer um city tour "no seu nome". Você ficaria com metade do cachê sem sair de casa.',lei:"Facilitar o trabalho de quem não é cadastrado é infração disciplinar (Portaria MTur 37/2021, art. 19, VI). Quem trabalha como guia sem cadastro pode responder por exercício ilegal da profissão (Lei das Contravenções Penais, art. 47).",o:[o("Topar. É só desta vez",{grave:1,c:-10,d:150},'A agência descobriu quando o grupo elogiou o "guia" chamando-o pelo nome verdadeiro. O caso foi comunicado e virou infração registrada no seu nome.'),o("Recusar e ajudar o colega a fazer o cadastro",{s:4,c:2},"O cadastro dele saiu em poucos dias. Agora vocês trocam indicações.")]},post:{t:"O post",c:[1,2],x:a=>"O passeio foi lindo e você quer postar as fotos do grupo nas suas redes para divulgar seu trabalho.",lei:"Para usar a imagem de alguém na divulgação do seu trabalho, peça autorização (Constituição, art. 5º, X, e Lei Geral de Proteção de Dados, Lei 13.709/2018).",o:[o("Postar as fotos com o rosto de todo mundo",{c:-5,s:2},"Uma turista pediu para tirar a foto do ar: não queria que ninguém soubesse onde ela passou o fim de semana."),o("Pedir autorização antes e postar só quem aceitou",{s:4,c:2},"Metade do grupo autorizou e ainda marcou você. Três pessoas pediram orçamento."),o("Postar só paisagens, sem ninguém",{s:1},"Fotos bonitas, pouco alcance. Mas ninguém teve do que reclamar.")]},preco:{t:"Mais barato",d:1,x:a=>'Um guia novo na região está cobrando 30% menos que você. Uma agência pergunta se você "cobre o preço".',o:[{l:"Cobrir o preço para não perder a agência",f:a=>(a.p.desc+=30,{s:2,c:1,r:"Você manteve a agência. Daqui para a frente, cada diária rende R$ 30 a menos."})},o(" o do guia. O microfone é seu, e o clima do grupo também.",o:[o("Retomar o microfone com calma e dizer que ali não cabe piada que ofende ninguém",{c:4,e:-3},"Dois segundos de silêncio e você seguiu para a próxima parada. Na saída, os dois passageiros agradeceram baixinho."),o("Rir junto para não criar clima",{c:-6},"Os dois passageiros passaram o resto da viagem calados. Um deles escreveu para a agência."),o("Discutir com o passageiro na frente de todos",{c:-2,e:-5},"Você tinha razão, e o bate-boca durou dez minutos. Ninguém lembrou da paisagem.")]},cerveja:{t:"Só uma",c:[1],x:a=>'Noite de excursão. O grupo está no bar do hotel e insiste: "Senta aqui, toma uma com a gente!" Amanhã, a saída é às 6h.',nota:"Em excursão, o guia está trabalhando o tempo todo, inclusive à noite. Embriaguez habitual é conduta incompatível com a profissão (Portaria MTur 37/2021, art. 19).",o:[o("Tomar algumas. O grupo merece",{e:-8,c:-4},"Às 6h, você estava com sono e voz rouca. O grupo que pediu para você beber foi o primeiro a notar."),o("Sentar um pouco, tomar um refrigerante e se despedir cedo",{c:4,e:-1},"Você riu das histórias, confirmou a saída e foi dormir. Às 6h, era a pessoa mais disposta do ônibus."),o("Recusar seco e ir direto para o quarto",{c:-1,e:2},"Você descansou. O grupo achou você distante.")]},golpe:{t:"Perfil verificado",c:[1],x:a=>'Mensagem: "Plataforma oficial de guias. Pague R$ 120 para ter seu perfil verificado e receber turistas estrangeiros."',nota:"O cadastro oficial de guias é o Cadastur, do Ministério do Turismo, feito pelo site do governo. Sinais de golpe: pedem dinheiro antes, prometem muito e têm pressa.",o:[o("Pagar. Turista estrangeiro paga bem",{d:-120},'Depois do Pix, o "suporte" sumiu. O site saiu do ar na semana seguinte.'),o("Conferir no site do Cadastur e ignorar a mensagem",{a:2},"Nada daquilo existia no site oficial. Você avisou o grupo de colegas, e duas pessoas tinham recebido a mesma mensagem.")]},hotel:{t:"Sem quarto",c:[0],x:a=>"Chegada ao hotel às 23h, depois de dez horas de estrada. A recepção avisa que faltam quatro quartos para o grupo.",lei:"Quem vendeu o pacote responde perante o turista pelos serviços contratados, como a hospedagem (Código de Defesa do Consumidor, art. 14). O guia age em nome da agência para resolver.",o:[o("Acionar a agência na hora e negociar com o hotel uma solução para todos ainda hoje",{c:5,e:-6},"Depois de uma hora ao telefone, a agência garantiu quartos em um hotel a duas quadras, com traslado. À 0h30, todo mundo estava dormindo."),o("Sortear quem fica sem quarto",{c:-9},"Quatro famílias passaram a noite no saguão. As reclamações chegaram antes do café da manhã."),o("Ceder o seu quarto e deixar o resto para amanhã",{e:-8,c:-3},"Resolveu uma família. As outras três dormiram no saguão, e você no sofá da recepção.")]},vazia:{t:"Agenda vazia",d:1,x:a=>"Uma semana inteira sem nenhum trabalho marcado. O telefone não toca.",o:[o("Ligar para agências antigas e oferecer disponibilidade",{s:5,e:-3},"Duas não responderam. A terceira tinha um grupo sem guia para sábado."),o("Aproveitar para estudar um roteiro novo",{a:6,e:-1},"Você montou um roteiro novo, com fontes e horários. Ainda não vendeu, mas está pronto."),o("Fazer um bico fora do turismo",{d:250,e:-5},"R$ 250 por três dias de trabalho em uma loja. A conta respirou, e o corpo sentiu.")]},seguro:{t:"O seguro",d:1,x:a=>"Um corretor oferece seguro de responsabilidade civil para guias: R$ 45 por mês. Cobre danos que um turista sofra por uma falha sua durante o passeio.",o:[{l:"Contratar",f:a=>(a.p.seg=45,{e:2,r:"Mais um custo fixo: R$ 45 por mês daqui para a frente. Em troca, você dorme mais tranquilo antes de passeios de aventura."})},o("Não contratar agora",{},"Uma conta a menos. Se algo der errado num passeio, o prejuízo pode ser todo seu.")]},microfone:{t:"O microfone",d:1,x:a=>"Seu microfone portátil quebrou no meio de um passeio. Um novo, bom, custa R$ 390 à vista ou 6 × R$ 72 no cartão.",o:[o("Comprar à vista",{d:-390,a:1}," opie nem hospede o jogo em outro endereço.</p><p><strong>Como usar.</strong> Cada estudante joga no próprio celular. As vidas são diferentes de propósito: quem tirou dois filhos pequenos e só português joga um ano mais apertado do que quem mora com a família e fala inglês. No fim, peçam que comparem o resultado, quanto faturaram, o que guardaram e o que escreveram nas quatro pausas.</p><p><strong>Para a conversa depois.</strong> O que dependia de escolha e o que dependia do sorteio? Como a sazonalidade pesou nas contas? Qual regra da profissão você não conhecia? A opção de cada situação aparece com uma letra, para facilitar perguntas como "quem escolheu B?".</p><p><strong>Base legal.</strong> Lei 8.623/1993 e Decreto 946/1993 (profissão); Portaria MTur 37/2021 (categorias, art. 3º; excursão nacional em outro estado, art. 6º; condutor de visitantes, art. 8º; atribuições, comissão e idiomas, art. 9º; contratos, art. 12; cadastro e crachá, arts. 14 e 16; infrações e penalidades, arts. 19 a 25); Portaria MTur 38/2021 (validade de 5 anos); CTB, art. 67-C (descanso do motorista); ECA, art. 83, e Resolução CNJ 295/2019; Lei 13.146/2015, art. 42; Lei 9.605/1998; LGPD; CDC; LC 238/2026 (novo limite do MEI).</p><p><strong>Simplificações do jogo.</strong> Diária base de R$ 300, com acréscimo para boa reputação e idioma; são valores ilustrativos, porque cachês variam muito por roteiro, agência e cidade. O calendário de temporada é uma média para o estado de São Paulo. As diárias do mês dependem da temporada, da Reputação e da Rede. O DAS do MEI usa o valor de 2026 para serviços (R$ 86,05). A reserva rende 0,5% ao mês e a dívida cresce 8% ao mês. Na vida real, a penalidade de cancelamento depende de processo administrativo e pode vir já na primeira infração grave; no jogo, a primeira infração registrada funciona como advertência e a segunda cancela o cadastro.</p><p><strong>Escolhas e recompensas.</strong> Situações de lei e de segurança têm resposta certa, e o jogo carimba o ac
