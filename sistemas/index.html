 meta mais alta"}],FOCOS=[{l:"Refatorar, escrever testes e documentar",h:"Sobe a Qualidade",fx:{s:8,c:2,e:-3},m:1},{l:"Estudar a stack, ler documentação e fazer cursos",h:"Sobe a Técnica",fx:{a:8,c:1,e:-2},m:.9},{l:"Entregar o máximo de demandas, sem parar",h:"Mais entregas, menos energia e menos Qualidade",fx:{e:-8,c:-1,s:-3},m:1.35},{l:"Descansar e cuidar de você",h:"Sobe a Energia, menos entregas",fx:{e:16},m:.75}],INTRO=["Janeiro. Os clientes voltam de férias devagar, e os projetos do ano ainda estão no papel. Boa hora para arrumar o repositório e estudar.","Fevereiro. Carnaval e planejamento: as empresas definem o que vão automatizar neste ano, e os pedidos chegam, muitos mal descritos.","Março. Orçamentos aprovados e as primeiras entregas do ano. A fila de tarefas cresce.","Abril. Os sistemas das empresas pedem manutenção e novas versões antes do meio do ano.","Maio. Campanhas do Dia das Mães: as lojas virtuais ficam no limite e precisam de tudo funcionando.","Junho. Meio do ano: revisão de projetos, auditorias e muita atualização de segurança.","Julho. Férias escolares. Os clientes desaceleram, e as equipes aproveitam para arrumar a casa: documentação, testes e dívida técnica.","Agosto. As empresas voltam com pressa para fechar o segundo semestre, e surgem muitos projetos novos.","Setembro. Primavera e planejamento do fim do ano: o comércio prepara as lojas virtuais para a corrida de vendas.","Outubro. A corrida para a Black Friday começa: mais pedidos, mais carga nos sistemas e menos tolerância a erros.","Novembro. Black Friday. Servidores no limite, plantão acionado e todo mundo de olho nos painéis.","Dezembro. Congelamento de código, fechamento do ano e clientes querendo entregar tudo antes do recesso."];function r2(e){return Math.round(100*e)/100}function brl(e){const a=e<0;let o=Math.round(100*Math.abs(e));return(a?"−":"")+"R$ "+String(Math.floor(o/100)).replace(/\B(?=(\d{3})+(?!\d))/g,".")+","+String(o%100).padStart(2,"0")}function rng(e){e.r=e.r+1831565813|0;let a=e.r;return a=Math.imul(a^a>>>15,1|a),a^=a+Math.imul(a^a>>>7,61|a),((a^a>>>14)>>>0)/4294967296}function F(e){return FASES[e.p.fase]}const clt=e=>0===e.p.v,FL=(e,a)=>clt(e)?{}:a,E=(e,a,o)=>clt(e)?a:o;function novo(e,a){const o={seed:0|e,r:0|e,nome:a||"",m:0,f:"perfil",st:{},conta:0,reserva:0,divida:0,parc:[],meta:null,grave:0,flags:{},reflex:[],over:null,hist:[],lei:{ok:0,n:0},poup:0,avis:{},prazo:null,conv:null,fat:0,das:0,dias:0,mdias:0,pecas:[]};for(let e=0;e<5;e++)rng(o);const r=Math.floor(4*rng(o)),s=FASES[r],i=s.ida[0]+Math.floor(rng(o)*(s.ida[1]-s.ida[0]+1)),t=rng(o)<.5?0:1,n=rng(o),c=n<.35?0:n<.8?1:2,d=Math.floor(rng(o)*ESP.length),m=rng(o),u=CAPITAIS[m<.4?0:m<.8?1:2];o.p={fase:r,idade:i,v:t,porte:c,esp:d,cap:u,casa:s.casa,mei:0,desc:0,seg:0,niver:1+Math.floor(10*rng(o))},o.conta=u,o.st={a:30+Math.floor(11*rng(o)),c:28+Math.floor(11*rng(o)),e:62+Math.floor(13*rng(o)),s:24+Math.floor(11*rng(o))};for(const e in s.st)o.st[e]=Math.max(5,Math.min(100,o.st[e]+s.st[e]));const p=Object.keys(ALEA);for(let e=p.length-1;e>0;e--){const a=Math.floor(rng(o)*(e+1));[p[e],p[a]]=[p[a],p[e]]}t&&(p.splice(p.indexOf("mei"),1),p.splice(1,0,"mei")),o.pool=p;const l=Object.keys(VIDA);for(let e=l.length-1;e>0;e--){const a=Math.floor(rng(o)*(e+1));[l[e],l[a]]=[l[a],l[e]]}return o.vp=l,o}function pagar(e,a){if(e.conta=r2(e.conta-a),e.conta<0){const a=-e.conta;e.conta=0;const o=Math.min(a,e.reserva);e.reserva=r2(e.reserva-o);const r=r2(a-o);r>0&&(e.divida=r2(e.divida+r),e.flags.deveu=1)}}function verificar(e){if(!e.over)if(e.grave>=2)e.over="cancelado";else if(e.divida>4e3)e.over="divida";else for(const a of["c","s","a"])if(e.st[a]<=0){if(e.avis[a]||e.prazo)return void(e.over="parou");e.avis[a]=1,e.st[a]=20,e.prazo=e.m<11?{k:a,ate:e.m+1}:null,e.conv=a}}function aplicar(e,a){const o=[];for(const r of["a","c","e","s"])a[r]&&(e.st[r]=Math.max(0,Math.min(100,e.st[r]+a[r])),o.push({k:r,v:a[r]}));return a.d&&(a.d<0?pagar(e,-a.d):e.conta=r2(e.conta+a.d),o.push({k:"d",v:a.d})),a.res&&(e.reserva=r2(e.reserva+a.res),o.push({k:"r",v:a.res})),a.parcela&&(e.flags.parcelou=1,e.parc.push({n:a.parcela.n,v:a.parcela.v,q:a.parcela.q}),o.push({k:"p",v:a.parcela.v,q:a.parcela.q})),a.peca&&(e.pecas.includes(a.peca)||e.pecas.push(a.peca),o.push({k:"pc",v:a.peca})),a.grave&&(e.grave++,o.push({k:"g",v:1})),a.flag&&(e.flags[a.flag]=1),verificar(e),o}const o=(e,a,o,r)=>({l:e,f:()=>Object.assign({r:o},a,r||{})}),FIXOS=[{t:"Antes do primeiro dia",c:[1],x:e=>clt(e)?"Uma software house da região te chamou para trabalhar com "+ESP[e.p.esp].h+'. O gerente diz: "Comece segunda-feira, em período de teste de duas semanas, e já pode pegar tarefa de cliente. Se der certo, a gente registra a sua carteira."':'Uma clínica, indicada por um professor, quer um sistema de agendamento e cadastro de pacientes, com site e painel interno. A dona diz: "Pago R$ 3 mil, e a gente acerta quando ficar pronto. Pode começar hoje?"',lei:e=>clt(e)?'Todo empregado deve ser registrado desde o primeiro dia, e a carteira de trabalho é digital (CLT, arts. 29 e 41). Um "teste" de duas semanas, sem registro, é trabalho sem direitos: o período de experiência existe, mas é um contrato registrado, de no máximo 90 dias (CLT, art. 445, parágrafo único). Sem registro, você fica sem FGTS, sem INSS e sem proteção.':'Quem presta serviço por conta própria deve combinar por escrito o que será feito, o valor, o prazo e a forma de pagamento (Código Civil, arts. 593 a 609). Em software, vale combinar também de quem será o código-fonte: os direitos sobre o programa seguem o que o contrato disser (Lei 9.609/1998, art. 4º). Sem nada escrito, "quando ficar pronto" vira discussão sobre o que era "pronto".',o:[{l:e=>clt(e)?"Fazer as duas semanas de teste e esperar o registro":"Aceitar o combinado verbal e começar",f:e=>clt(e)?{c:-3,e:-6,r:'Na terceira semana, o gerente disse que "o orçamento do cliente caiu" e adiou o registro. Você trabalhou 20 dias sem carteira, sem FGTS e sem nenhum direito.'}:{s:-2,e:-5,r:'Você montou o cadastro, a agenda e o painel. A dona pediu "só mais uma tela", depois outra, e só pagou R$ 1.200, dois meses depois. Sem escopo escrito, não havia o que cobrar.'}},{l:e=>clt(e)?"Só começar depois de assinar o contrato e ter a carteira registrada":"Aceitar, mas fechar por escrito: telas e funções, número de revisões, valor, prazo, forma de pagamento e de quem é o código",f:e=>clt(e)?{c:3,a:2,r:"A empresa registrou na hora, com contrato de experiência de 90 dias. Você começou na segunda com tudo no papel, e o gerente comentou que gosta de quem pergunta."}:{c:4,s:3,a:2,peca:"Sistema de agendamento para uma clínica",r:"A dona assinou um contrato de duas páginas, com entregas em três etapas. O primeiro pagamento caiu na data combinada, e o sistema virou o primeiro item do seu repositório, com autorização para mostrar."}},{l:e=>clt(e)?"Perguntar aos colegas se a empresa costuma registrar e, se for assim mesmo, aceitar":"Recusar o trabalho: você só aceita com contrato formal",f:e=>clt(e)?{c:-3,e:-2,r:'Os colegas disseram que "é assim mesmo". Dois estavam havia meses sem registro, sem FGTS e sem direito a nada.'}:{s:-3,e:2,r:"A dona procurou outra pessoa. Você ficou sem o trabalho, mas deixou claro que trabalha com contrato."}}]},{t:"A tarefa de uma linha",d:1,x:e=>'Você é quem vai desenvolver a solução. Uma rede de farmácias da região pede um "sistema para controlar o estoque". O pedido veio em uma linha: "Quero tudo no celular, rápido e que não dê erro." Prazo: três semanas.',nota:"Um bom levantamento de requisitos responde: quem vai usar o sistema, o que ele precisa fazer (requisitos funcionais), com que desempenho, segurança e acessibilidade (requisitos não funcionais) e como saberemos que ficou pronto (critério de aceite). Sem isso, o escopo cresce a cada reunião e o prazo estoura.",o:[o("Marcar uma conversa de meia hora com quem vai usar o sistema, escrever as histórias de usuário e combinar o critério de aceite antes de programar",{c:3,a:4,e:-3},'Você descobriu que o estoque já vivia em três planilhas diferentes e que o "celular" era só para consultar. O cliente percebeu que nem ele sabia o que queria e agradeceu. A entrega saiu no prazo, com o rumo certo.',{peca:"Sistema de estoque para uma rede de farmácias"}),o("Começar a programar com o que você imagina e mostrar uma versão em uma semana",{a:1,c:-2,e:-5},"Mostrar cedo ajudou a descobrir o que ele queria, mas, sem conversa antes, metade do trabalho foi jogada fora. Você refez em duas noites."),o("Estudar sistemas parecidos e montar um protótipo de telas antes de qualquer conversa",{a:3,e:-4,c:1},"O protótipo ficou bonito, mas o cliente discordou do fluxo e pediu ajustes. Você ganhou repertório e perdeu tempo.")]},{t:"A senha em texto puro",c:[2],tag:"dados",x:e=>"Você está revisando o cadastro e o login do sistema de um cliente. As senhas dos usuários estão guardadas no banco exatamente como foram digitadas, e "+E(e,"o tech lead","o responsável pelo projeto")+' diz: "Assim a gente consegue enviar a senha por e-mail para quem esquece. É mais prático." O sistema tem 15 mil usuários cadastrados.',lei:"A LGPD exige medidas de segurança, técnicas e administrativas, para proteger os dados pessoais de acessos não autorizados (Lei 13.709/2018, arts. 6º, VII, e 46). Senha nunca deve ser guardada em texto puro nem poder ser recuperada: o padrão é guardar só o hash, gerado por um algoritmo próprio para senhas (como bcrypt, scrypt ou Argon2), com sal, e oferecer a redefinição por um link temporário. Se o banco vazar, quem usa a mesma senha em outros sites também é prejudicado, e o responsável pelo sistema responde.",o:[o("Manter como está: foi decisão de quem manda",{c:-6,e:-2},"Semanas depois, um vazamento expôs o banco inteiro. Como as senhas estavam legíveis, dezenas de usuários tiveram contas invadidas em outros sites. O nome do projeto, e o seu, ficou ligado ao problema."),o("Criptografar as senhas com uma chave guardada no servidor",{c:-3,a:1},"Criptografia reversível ainda permite descobrir a senha de todo mundo para quem pegar a chave. O correto é o hash, que não tem volta, e a redefinição por link."),o('Propor guardar só o hash com sal (bcrypt ou Argon2), trocar o "enviar senha" por um link de redefinição e migrar as senhas existentes no próximo login',{a:5,c:4,e:-3},"A mudança levou dois dias. O responsável reclamou do trabalho extra, mas viu o suporte parar de receber pedidos de senha por e-mail e passou a pedir revisão de segurança antes de cada versão.",{peca:"Login seguro com hash de senha"})]},{t:"O código do repositório",c:[0],tag:"autor",x:e=>'Você precisa de um módulo de exportação de relatórios para o sistema de um cliente. No GitHub, você acha um repositório perfeito, sem arquivo de licença, e outro com licença GPL. Um colega diz: "Está público, é só copiar a pasta e colar no projeto."',lei:'Código público não é código livre. Todo programa de computador é protegido como obra literária (Lei 9.609/1998, art. 2º), e usar, copiar ou modificar exige autorização do titular, em geral dada por uma licença. Licenças permissivas (MIT, Apache, BSD) deixam usar em projeto comercial, desde que se mantenha o aviso de autoria. Licenças de "copyleft", como a GPL, exigem que o trabalho derivado também seja aberto sob a mesma licença. Repositório sem licença quer dizer que, em regra, ninguém recebeu autorização para reutilizar. Violar direitos de autor de programa de computador gera indenização e pode ser crime (Lei 9.609/1998, art. 12).',o:[o("Ler as licenças: usar só o que permite uso comercial, manter o aviso de autoria, listar as dependências e, quando não houver licença, pedir autorização ao autor ou escolher outra biblioteca",{a:4,c:4,e:-2},"Você usou uma biblioteca com licença MIT, guardou o aviso no repositório e listou as dependências no arquivo do projeto. Meses depois, numa auditoria, o cliente pediu a lista, e você já tinha.",{peca:"Projeto com licenças de terceiros em dia"}),{l:'Copiar o código do repositório sem licença: "se está público, pode"',f:e=>Object.assign({c:-8,e:-4,r:"Semanas depois, o autor percebeu a cópia e escreveu ao cliente pedindo a retirada e uma compensação. Você teve de trocar o módulo às pressas e explicar o que aconteceu."},FL(e,{d:-300}))},o("Copiar o código e apagar o nome do autor dos comentários",{c:-8,e:-4},"Apagar a autoria piorou: além de usar sem autorização, você escondeu a origem do código. Quando o autor encontrou o trecho idêntico, a falta de crédito pesou contra você. A lei garante ao autor o direito de reivindicar a autoria do programa (Lei 9.609/1998, art. 2º, § 1º).")]},{t:"De quem é o programa?",c:[1],tag:"autor",x:e=>clt(e)?'Nos fins de semana, em casa e com o seu próprio notebook, você criou um aplicativo de lista de compras. A empresa descobriu pelo seu perfil em uma rede profissional, e o gerente diz: "Tudo o que um programador faz é da empresa. Esse app é nosso agora."':'Você terminou o sistema da clínica. O contrato diz só "desenvolvimento de sistema", sem falar do código. A dona pede o código-fonte e diz que agora é tudo dela. Você queria reaproveitar o módulo de agenda, que já usava em outros projetos, no seu próximo trabalho.',lei:e=>clt(e)?"Em regra, o programa criado no trabalho pertence ao empregador, mas o programa criado sem relação com o contrato de trabalho e sem usar recursos, informações tecnológicas ou segredos da empresa pertence ao empregado (Lei 9.609/1998, art. 4º, caput e § 2º). Por isso vale deixar tudo separado: horário, equipamento, repositório e conta. Se houver dúvida, um documento por escrito evita briga depois.":"Salvo estipulação em contrário, os direitos sobre o programa desenvolvido sob contrato pertencem ao contratante, quando a atividade contratada era justamente essa (Lei 9.609/1998, art. 4º). Por isso o contrato deve dizer o que é cedido (o sistema entregue) e o que continua seu (ferramentas, bibliotecas e códigos que você já tinha antes). O uso do programa por terceiros se dá por contrato de licença (art. 9º).",o:[{l:e=>clt(e)?"Aceitar: o gerente manda":"Entregar o código sem falar nada e abrir mão do módulo de agenda",f:e=>clt(e)?{c:-2,a:-1,e:-4,r:"Você entregou o código, e o app morreu numa gaveta da empresa, sem ninguém para mantê-lo. Você poderia ter garantido o que era seu."}:{c:-1,a:-1,e:-3,r:"A cliente ficou satisfeita, mas você perdeu a base que reaproveitava em outros projetos e teve de refazer a agenda do zero no trabalho seguinte."}},{l:e=>clt(e)?"Explicar com calma que o app foi feito fora do horário, sem recursos nem informações da empresa e sem relação com o seu trabalho, guardar as provas (datas dos commits, repositório pessoal) e pedir uma declaração por escrito":"Entregar o código do sistema e propor um aditivo: o sistema entregue é da cliente, e as bibliotecas e ferramentas que você já tinha continuam suas, licenciadas a ela para uso nesse sistema",f:e=>clt(e)?{c:3,a:3,e:-3,peca:"Aplicativo próprio, com a autoria documentada",r:"O RH leu a lei, conferiu as datas dos commits e confirmou por escrito que o app era seu. O gerente ficou sem graça, mas o clima ficou profissional."}:{c:3,a:3,e:-3,peca:"Sistema da clínica, com a titularidade do código definida",r:"A dona leu o aditivo e assinou. Ela ficou com o sistema, e você, com o direito de reaproveitar as suas ferramentas. Nos próximos contratos, essa cláusula já entra na proposta."}},{l:e=>clt(e)?"Apagar o repositório e o perfil para evitar problema":"Reter o código-fonte até receber um valor a mais",f:e=>clt(e)?{c:-2,s:-3,e:-4,r:"Você perdeu o histórico e as provas de que o app era seu, e a conversa não terminou: ficou o clima de desconfiança."}:{c:-5,s:-3,e:-3,r:"A cliente se sentiu refém. Ela pagou o que estava no contrato, mas passou a falar mal do seu trabalho na região. Cobrar além do combinado não é retenção, é pressão."}}]},{t:"O incidente de sábado",c:[0],tag:"dados",x:e=>"Sábado de manhã, o suporte avisa: um desconhecido mandou mensagem a uma loja virtual dizendo que tem a lista de clientes dela. Você olha o log e vê que o campo de busca do sistema aceitava comandos SQL digitados pelo usuário. Alguém exportou 8 mil cadastros, com nome, CPF e endereço. "+E(e,"O sistema é do projeto em que você trabalha.","O sistema é seu, e você é o contato do cliente."),lei:"Se o incidente de segurança puder causar risco ou dano relevante aos titulares, o controlador (em geral o dono do sistema, o cliente) deve comunicar a ANPD e os titulares (LGPD, art. 48). O regulamento da ANPD fixa o prazo de três dias úteis, contados do momento em que o controlador toma conhecimento de que o incidente afetou dados pessoais (Resolução CD/ANPD 15/2024, art. 6º). Quem desenvolve ou opera o sistema em nome do cliente deve avisá-lo imediatamente e colaborar. Esconder o incidente piora a situação e gera sanções (LGPD, art. 52). Prevenir é papel do desenvolvedor: consultas parametrizadas, validação de entrada e privilégio mínimo no banco.",o:[o("Avisar já o responsável pelo projeto e o cliente (que decide sobre a comunicação à ANPD e aos titulares), conter a falha, guardar os logs e preparar a correção",{c:4,a:4,e:-6},"Você corrigiu a consulta para usar parâmetros, registrou o horário de cada passo e entregou um relatório. O cliente comunicou a ANPD e os afetados dentro do prazo. Foi um fim de semana perdido, mas dentro das regras, e o cliente passou a exigir revisão de segurança antes de cada versão.",{peca:"Correção de falha de segurança e relatório do incidente"}),o('Corrigir a falha em silêncio e apagar os logs: "sem prova, sem problema"',{grave:1,c:-10},"O cliente descobriu pela reclamação de uma das pessoas afetadas. Apagar os logs foi lido como tentativa de esconder o incidente, e o caso ficou registrado como incidente grave no seu nome."),o("Corrigir a falha na segunda-feira e contar na reunião",{c:-5,a:1,e:-2},"Durante o fim de semana, o banco continuou exposto e houve novos acessos. O cliente soube só na segunda e reclamou: cada dia de atraso reduziu o tempo que ele tinha para comunicar o incidente.")]},{t:"O plantão de sábado",c:[1],x:e=>clt(e)?'A empresa criou um plantão: toda semana, um dev fica "de olho no celular" fora do expediente, e quem for chamado atende de qualquer lugar. O gerente diz: "Você entra na escala na próxima semana. Não tem pagamento extra, porque você não vai estar trabalhando, só disponível."':'O cliente da loja virtual pergunta se o seu contrato inclui "suporte 24 horas". O contrato diz só "manutenção do sistema". Ele quer que você atenda de madrugada e nos fins de semana, "porque a loja vende o tempo todo".',lei:e=>clt(e)?"O tempo em que o empregado fica à disposição do empregador, aguardando ou executando ordens, conta como serviço (CLT, art. 4º). No sobreaviso, em que o empregado fica em casa esperando ser chamado, a hora de escala é paga à razão de 1/3 do salário normal (CLT, art. 244, § 2º). O Tribunal Superior do Trabalho aplica essa regra ao plantão por celular quando o empregado fica, de fato, impedido de se desligar (Súmula 428): ter um celular da empresa, por si só, não basta. As horas efetivamente trabalhadas nas chamadas são horas extras. A escala e o pagamento devem ser combinados por escrito.":'O que o contrato não prevê, o cliente não pode exigir sem pagar. Atendimento fora do horário, tempo de resposta e disponibilidade se combinam em um acordo de nível de serviço (SLA), com valor próprio: suporte 24 horas custa mais que suporte em horário comercial. Sem isso, "suporte" vira trabalho de graça (Código Civil, arts. 593 a 609).',o:[{l:e=>clt(e)?"Aceitar: é só ficar com o celular":"Aceitar atender a qualquer hora, sem cobrar a mais",f:e=>clt(e)?{c:-1,e:-8,r:"No terceiro sábado, o sistema caiu às 2h, e você passou a madrugada resolvendo. Ninguém registrou o tempo, e na segunda você estava de volta às 9h, sem folga e sem nada pago."}:{c:-1,e:-8,s:1,r:"Nas primeiras semanas, o cliente agradeceu. Na terceira, passou a ligar às 23h para dúvidas simples, e a loja inteira passou a depender do seu celular."}},{l:e=>clt(e)?"Aceitar a escala só se o sobreaviso, as chamadas atendidas e os limites ficarem combinados por escrito":"Propor um acordo de nível de serviço: horário comercial incluso, plantão fora do horário com valor mensal, tempo de resposta por gravidade e limite de chamados",f:e=>clt(e)?{c:3,a:1,e:-4,r:"O RH fez um aditivo: sobreaviso pago pela hora de escala, chamadas registradas como horas extras e folga compensatória quando a chamada passava da meia-noite. O gerente comentou que gosta de quem pergunta."}:{c:3,a:2,e:-3,d:150,r:'O cliente topou pagar R$ 150 por mês pelo plantão, com tempos de resposta por gravidade. Você passou a ter uma regra para dizer "isso é no horário comercial".'}},{l:e=>clt(e)?'Recusar a escala na hora: "não faço plantão"':"Recusar qualquer atendimento fora do horário",f:e=>clt(e)?{c:-3,e:2,r:"O gerente anotou a recusa como falta de comprometimento. Você ficou fora da escala, mas perdeu pontos com a chefia sem ter discutido as condições."}:{c:-1,s:-2,e:3,r:"O cliente achou rígido e contratou outra pessoa para o plantão. Você manteve a rotina, mas deixou de ser a pessoa de confiança da loja."}}]},{t:"O jogo para crianças",c:[2],tag:"cons",x:e=>'Você faz parte da equipe que vai desenvolver o jogo. Uma empresa de brinquedos encomenda um jogo educativo para celular, voltado para crianças de 7 a 12 anos. O cliente pede caixas-surpresa pagas com dinheiro de verdade ("a criança abre e descobre o prêmio"), anúncios personalizados pelo que a criança joga e cadastro só com um "tenho mais de 18 anos" marcado pelo próprio usuário.',lei:"O ECA Digital (Lei 15.211/2025), em vigor desde março de 2026, vale para produtos e serviços digitais dirigidos a crianças e adolescentes ou de provável acesso por eles. Entre as regras: caixas de recompensa (loot boxes) são proibidas em jogos desse público; é vedado o perfilamento para direcionar publicidade comercial a crianças e adolescentes; produtos impróprios para menores de 18 anos exigem verificação de idade confiável, e a simples autodeclaração não basta; e as configurações padrão devem ser as mais protetivas de privacidade, com ferramentas de supervisão para os responsáveis. A ANPD fiscaliza, e as multas podem chegar a R$ 50 milhões. A LGPD também exige que o tratamento de dados de crianças seja feito em seu melhor interesse, com consentimento específico de um dos pais (art. 14), e o CDC considera abusiva a publicidade que se aproveita da falta de experiência da criança (art. 37, § 2º).",o:[o("Fazer como o cliente pediu: o jogo é dele",{c:-6,e:-2},"Pouco depois da publicação, uma entidade de defesa da criança denunciou o jogo à ANPD. A loja de aplicativos o retirou, e o cliente cobrou da equipe por não ter avisado."),o('Manter as caixas-surpresa, mas colocar um aviso: "peça permissão aos seus pais"',{c:-3,a:-1},"O aviso não muda o que o jogo faz: a criança continua comprando às cegas e recebendo anúncios sob medida. A regra é a proibição da prática, e não só um aviso."),o("Propor outro modelo: compra única ou assinatura clara, paga pelos responsáveis, sem caixa-surpresa, sem anúncio personalizado, com o mínimo de dados e com painel para os pais",{a:5,c:4,e:-4},"O cliente reclamou no começo, porque achava que perderia receita. O jogo saiu com um painel simples para os pais e uma descrição clara do que é coletado, e as avaliações dos pais foram boas.",{peca:"Jogo infantil com privacidade por padrão"})]},{t:"O botão de cancelar",c:[2],tag:"cons",x:e=>'Você vai implementar a assinatura e a cobrança do aplicativo. Uma academia vende planos pelo aplicativo. O dono pede: "Cancelar tem que ser difícil. Esconde o botão em Configurações, Ajuda, Outros, manda o cliente ligar em horário comercial e avisa na tela que a oferta acaba em 10 minutos." O contador de 10 minutos reinicia toda vez que a tela abre.',lei:'O Código de Defesa do Consumidor exige informação clara e adequada sobre produtos e serviços (art. 6º, III), proíbe a publicidade enganosa (art. 37), inclusive a que cria urgência falsa, e as práticas abusivas, como se prevalecer da fraqueza ou da ignorância do consumidor (art. 39, IV). Nas compras a distância, o consumidor tem sete dias para desistir sem justificar (art. 49), e o fornecedor deve informar de forma clara e ostensiva como exercer o arrependimento, que pode ser feito pela mesma ferramenta usada para contratar (Decreto 7.962/2013, art. 5º, caput e § 1º). Interfaces desenhadas para confundir ou dificultar o cancelamento são conhecidas como "padrões obscuros" (dark patterns).',o:[o("Fazer como o dono pediu: a regra de negócio é dele",{c:-6,e:-2},"Reclamações no Procon e na loja de aplicativos se acumularam em poucas semanas. A academia teve de refazer a tela e devolver cobranças, e a equipe foi chamada a explicar por que implementou."),o('Mostrar o botão, mas manter o contador falso: "é só uma tela de venda"',{c:-3,a:-1},"Tirar só o obstáculo mais visível não resolveu. A urgência inventada continuou sendo informação enganosa, e o contador que reinicia foi o primeiro item da reclamação."),o("Mostrar o cancelamento com a mesma facilidade da contratação, no mesmo aplicativo e em poucos toques, informar o preço e a renovação com clareza e usar prazos de oferta reais",{a:4,c:4,e:-3},"O dono achou que perderia clientes. Perdeu alguns no cancelamento, mas as reclamações caíram, as avaliações subiram e quem ficou, ficou por escolha.",{peca:"Fluxo de assinatura transparente"})]},{t:"O componente que ninguém pagou",c:[1],tag:"autor",x:e=>'Você precisa de uma ferramenta paga de testes e de componentes para o projeto de um cliente. A licença custa R$ 450 por ano. Um colega manda um link de uma versão "liberada" e diz: "Todo mundo usa. Ninguém nunca foi preso por isso."',lei:'Usar programa de computador sem licença viola os direitos do autor, gera indenização e é crime: "violar direitos de autor de programa de computador" tem pena de detenção de seis meses a dois anos ou multa, e a pena é maior quando o programa é reproduzido para fins de comércio (Lei 9.609/1998, art. 12). Versões "liberadas" também costumam trazer programas maliciosos, e, se infectarem o computador do trabalho, o prejuízo é seu. Há alternativas legais: versões gratuitas ou de código aberto, licenças educacionais (quando o uso é só de estudo) e planos de teste.',o:[o("Instalar a versão liberada só neste projeto",{c:-6,e:-3},'Semanas depois, o antivírus do cliente barrou um programa estranho vindo do seu computador. A versão "liberada" trazia um programa que roubava senhas. Você perdeu dois dias trocando todas as credenciais, e o cliente quis saber o que mais estava no seu computador.'),o("Pagar a licença (ou trocar por uma alternativa gratuita ou de código aberto, com licença que permita uso comercial) e guardar o comprovante",{a:4,c:4,e:-2},"Você achou uma alternativa de código aberto com licença permissiva e guardou o aviso de licença no repositório. O projeto ficou limpo, e o cliente não precisou se preocupar.",{peca:"Projeto com ferramentas licenciadas"}),o("Usar a licença de estudante, que é grátis, no trabalho do cliente",{c:-3,a:-1},"Licenças educacionais costumam proibir o uso comercial. Na renovação, a empresa da ferramenta pediu comprovação de matrícula, e você precisou migrar o projeto às pressas.")]},{t:"O preço com dois zeros a menos",c:[1],tag:"cons",x:e=>'Você importou a planilha de preços do fornecedor e publicou a atualização do sistema da loja. Quinta-feira, véspera da Black Friday, 20h. Um erro de importação cortou dois zeros de alguns produtos: uma TV de R$ 4.999,00 está custando R$ 49,99. Em duas horas, 300 pedidos já entraram. A diretora da loja diz: "Não mexe agora. Vamos ver o que acontece."',lei:"A oferta, quando suficientemente precisa, obriga o fornecedor que a divulgou (CDC, arts. 30 e 35). A Justiça costuma analisar erros de preço caso a caso: erro grosseiro e perceptível, corrigido assim que descoberto e com os consumidores avisados, tende a favorecer a loja; deixar o preço no ar e continuar vendendo pesa contra ela. No comércio eletrônico, o fornecedor deve informar o preço com clareza e confirmar de imediato o recebimento do pedido (Decreto 7.962/2013, arts. 2º e 4º). A comunicação e a decisão sobre os pedidos são do cliente; o desenvolvedor corrige a falha e registra o que aconteceu.",o:[o("Não mexer: a diretora mandou, e a Black Friday não pode parar",{c:-5,e:-3},"Na manhã seguinte, eram 2 mil pedidos da TV a R$ 49,99. A loja precisou cancelar, pedir desculpas e responder a reclamações no Procon. A diretora perguntou por que ninguém insistiu."),o("Insistir que é preciso tirar o preço do ar, corrigir a importação, avisar a diretoria e deixar que a loja comunique e trate os pedidos feitos com o preço errado",{a:5,c:4,e:-6},"Você corrigiu a carga em quinze minutos e preparou a lista dos 300 pedidos. A loja explicou o erro aos consumidores e ofereceu um cupom. Houve reclamação, mas o caso ficou controlado.",{peca:"Correção de erro de preço na Black Friday"}),o("Corrigir o preço em silêncio e cancelar os 300 pedidos sem avisar",{c:-6,a:1,e:-2},"Os consumidores só viram o cancelamento no e-mail da manhã, sem explicação. Dezenas reclamaram nas redes sociais e no Procon: cancelar sem avisar também fere o consumidor.")]},{t:"O congelamento de dezembro",d:1,x:e=>clt(e)?'Último sprint do ano. O maior cliente da empresa quer entregar o módulo de pedidos antes do recesso, em 5 dias, e pede para cortar os testes automatizados e a revisão de código: "A gente corrige depois, em janeiro." O gerente deixa a decisão com a sua equipe.':'O cliente quer o módulo de pedidos pronto antes do recesso, em 5 dias, e pede para pular os testes e a revisão: "Corrige depois, em janeiro." Ele oferece um bônus de R$ 600 pela entrega antecipada.',nota:"Dívida técnica é o custo futuro de uma solução rápida: cada atalho (sem testes, sem revisão, sem documentação) economiza hoje e cobra juros depois, em erros, retrabalho e lentidão. Nem toda dívida é erro: às vezes vale assumi-la de propósito, com registro e data para pagar. A dívida perigosa é a que ninguém viu.",o:[{l:"Cortar tudo para entregar no prazo",f:e=>Object.assign({c:2,s:-8,e:-8,r:"Você entregou em quatro dias. Em janeiro, três erros graves derrubaram o módulo, e você começou o ano apagando incêndio. O cliente sabia que tinha pedido para cortar, mas a conta da correção ficou com a equipe."},FL(e,{d:600}))},o("Entregar o essencial, manter os testes dos fluxos críticos (pedido e pagamento), registrar o que ficou de fora como dívida técnica e combinar uma data para pagá-la",{c:4,a:3,s:2,e:-4},"O cliente aceitou a lista curta. O módulo saiu com os testes mais importantes, e a dívida registrada virou a primeira tarefa de janeiro, com data. Nada quebrou no recesso."),o("Recusar o prazo: sem testes, não entrega",{c:-2,s:3,e:-1},"O cliente ficou irritado, e o módulo só saiu em janeiro. O seu código estava limpo, mas a confiança foi abalada, porque você não ofereceu alternativa.")]}],ALEA={mei:{t:"Só com nota fiscal",d:1,q:e=>!clt(e)&&!e.p.mei,x:e=>"Uma empresa da região quer fechar um pacote de seis demandas por mês com você, mas só contrata fornecedor que emite nota fiscal. Hoje você trabalha só com o CPF.",nota:'Quem programa por conta própria e quer emitir nota precisa de CNPJ. O MEI, que paga um valor fixo por mês, só vale para as ocupações da lista oficial, e desenvolver programas de computador não consta nela: confira no Portal do Empreendedor antes de abrir. O caminho usual é uma microempresa (ME) no Simples Nacional, que exige contador, paga imposto sobre o faturamento (a alíquota depende do anexo e do "fator R"; no jogo, usamos 6%) e o INSS do pró-labore. Em troca, você emite nota, pode atender empresas e contribui para a aposentadoria.',o:[{l:"Abrir uma ME no Simples Nacional, com contador, esta semana",f:e=>(e.p.mei=1,{s:6,c:2,e:-3,r:"Com a ajuda de um contador, a empresa saiu em poucos dias. A partir de agora, saem todo mês o contador, o INSS do pró-labore e o imposto sobre o que você fatura, com trabalho ou sem. Em troca, mais empresas podem te contratar."})},o("Continuar com CPF e procurar clientes que aceitem recibo",{e:2,s:-3},"Sem custo fixo, mas com menos portas abertas. Algumas empresas nem respondem quando você diz que não emite nota."),o("Abrir como MEI com outra atividade da lista, só para emitir nota",{c:-6,s:-2},"Registrar uma atividade diferente da que você de fato exerce não resolve: a nota saiu com uma descrição que não bate com o serviço, o cliente estranhou e desistiu. Quem exerce atividade fora da lista corre o risco de ser desenquadrado do MEI.")]},pj:{t:"Contrato de PJ com horário",c:[2],q:e=>!clt(e),x:e=>'Uma software house quer te contratar como PJ para um "trabalho fixo": entrar às 9h, sair às 18h, seguir a chefia direta do gerente de projetos e não atender mais ninguém. O pagamento é de R$ 3.200 por mês, sem 13º, sem férias e sem FGTS. Você precisaria abrir uma empresa para emitir a nota.',lei:'A contratação de autônomo é legítima quando cumpridas as formalidades legais, mesmo com exclusividade (CLT, art. 442-B). Mas só vale se houver autonomia de fato: com horário fixo, chefia direta, ordens pessoais e habitualidade, o contrato pode ser reconhecido como emprego, mesmo que o papel diga "PJ" (CLT, arts. 3º e 9º). A orientação dos tribunais sobre esse tema muda com frequência: confira sempre a versão vigente.',o:[o('Aceitar: o valor parece bom, e os direitos você "resolve depois"',{d:300,e:-5,c:-2},"O valor parecia bom no primeiro mês, mas na conta não entram 13º, férias nem FGTS, e a empresa pode encerrar o contrato a qualquer momento, sem direito a nada. Você ficou sem folga, sem reserva e sem cobertura."),o("Recusar na hora e encerrar a conversa",{e:2,s:-2},"Sem reunião, sem proposta e sem relação. A empresa procurou outra pessoa, e você ficou sem a oportunidade e sem saber como ela podia ter sido ajustada."),o("Propor duas saídas: ser registrado como empregado ou fechar um contrato de serviço por projeto, com escopo, prazo e liberdade de horário",{c:3,a:2,e:-2},"A empresa preferiu o contrato por projeto, com prazo e liberdade de horário. Ficou claro o que cada um devia, e você manteve o direito de atender outros clientes.")]},home:{t:"Home office, com o seu notebook",c:[1],q:clt,x:e=>'A software house adotou o home office às quartas e sextas. O gerente avisa: "Cada um usa o próprio notebook e a própria internet. O resto a gente combina depois."',lei:'O trabalho remoto é permitido (CLT, arts. 75-A a 75-F), mas a responsabilidade por equipamentos, infraestrutura e reembolso de despesas deve estar prevista em contrato escrito (CLT, art. 75-D). Combinar "depois" costuma significar que o custo fica com o empregado.',o:[o("Aceitar sem perguntar: é a regra de todo mundo",{e:-2,d:-250},"Você passou a pagar uma internet mais cara e, em três meses, o notebook pifou. Sem nada escrito, a empresa disse que o equipamento era seu."),o("Pedir que o home office, os equipamentos e o reembolso de despesas sejam combinados por escrito, num aditivo ao contrato",{c:2,a:1,e:3},"O gerente concordou: a empresa passou a emprestar um notebook e a pagar uma ajuda para a internet. Todo mundo ganhou clareza."),o("Recusar o home office e ir todo dia à empresa",{e:-2,s:1,c:-1},"Você economizou a discussão, mas perdeu duas horas por dia no trânsito e a flexibilidade que os colegas passaram a ter.")]},assedio:{t:"A revisão de código",c:[1],x:e=>'Na revisão de código aberta ao time, o líder técnico escreve sobre o trabalho de uma estagiária: "Isso é código de quem nunca abriu um livro. Alguém tira ela do projeto." Ela fecha o notebook, e os colegas olham para baixo.',lei:"Humilhações repetidas no trabalho podem configurar assédio moral, que dá direito a indenização por dano moral (Constituição, art. 5º, V e X; Código Civil, arts. 186 e 927; CLT, art. 223-B). Quem presencia pode apoiar a vítima, registrar o que viu e usar os canais da empresa, como RH, ouvidoria e sindicato, ou procurar o Ministério Público do Trabalho. Criticar o código é legítimo; humilhar a pessoa, não.",o:[o("Ficar quieto: não é com você, e o líder decide a sua renovação",{e:-3,c:-2},"Você saiu da reunião com um nó no estômago. Dois dias depois, a estagiária pediu demissão sem explicar o motivo."),o("Procurar a estagiária, perguntar como ela está e oferecer ajuda para registrar o ocorrido, com datas e testemunhas, no RH ou na ouvidoria",{c:3,s:2,e:-3},"Ela agradeceu e registrou a queixa. O RH conversou com o líder, e a empresa passou a ter um canal de denúncia. Você ficou conhecido como alguém em quem se pode confiar."),o("Responder na hora, na frente de todos, defendendo a estagiária e criticando o líder",{c:-3,e:-2,s:1},"Você disse o que sentia, mas a revisão virou uma discussão entre vocês dois, e o problema da estagiária ficou em segundo plano.")]},vazou:{t:"A chave no repositório público",c:[0],tag:"dados",x:e=>"Ao revisar o histórico do repositório do cliente, que é público, você percebe que, meses atrás, um commit incluiu o arquivo de configuração com a senha do banco de dados e a chave da API de pagamentos. O banco guarda dados de 3 mil clientes.",lei:"Credenciais expostas devem ser consideradas comprometidas: o primeiro passo é revogá-las e criar novas, porque apagar o arquivo não apaga o histórico do repositório. A LGPD exige medidas de segurança para proteger os dados pessoais (art. 46) e, se houve acesso indevido que possa causar risco ou dano relevante aos titulares, o controlador deve avaliar a comunicação à ANPD e aos titulares (art. 48; Resolução CD/ANPD 15/2024). Segredos não devem ir para o repositório: use variáveis de ambiente ou um cofre de segredos.",o:[o("Trocar a senha e a chave na hora, tirar os segredos do código e do histórico, avisar o responsável pelo projeto e o cliente e conferir nos logs se houve acesso indevido",{a:4,c:4,e:-4},"Os logs não mostraram acesso estranho, mas o cliente registrou o episódio e passou a usar um cofre de segredos. A troca levou uma tarde. Sem pressa, o risco poderia ter virado incidente.",{peca:"Revogação de credenciais e cofre de segredos"}),o('Apagar o arquivo do repositório e seguir: "agora sumiu"',{c:-5,a:-1,e:-2},"O arquivo sumiu da versão atual, mas continuava no histórico, e a senha antiga continuava valendo. Semanas depois, um acesso estranho ao banco levou o cliente a perguntar por que ninguém trocou as credenciais."),o("Trocar só a senha e não contar a ninguém, para não criar caso",{c:-3,a:1,e:-2},"A senha mudou, mas ninguém verificou se alguém tinha acessado o banco nesses meses. Se tivesse havido vazamento, nem o cliente nem os titulares seriam avisados a tempo.")]},form:{t:"O cadastro que pede tudo",c:[1],tag:"dados",x:e=>'O cadastro de um aplicativo de promoções pede CPF, data de nascimento, renda, endereço completo e foto do documento só para o usuário ver os cupons. O cliente diz: "Quanto mais dados, melhor. Depois a gente usa em outras campanhas."',lei:"A LGPD manda coletar só o que é necessário para a finalidade informada (princípios da finalidade, da adequação e da necessidade, art. 6º, I a III) e informar com clareza para que os dados serão usados (art. 9º). Usar depois para outra finalidade, que o titular não esperava, exige nova base legal. Dado desnecessário também é risco: se vazar, a responsabilidade é de quem o coletou.",o:[o("Manter todos os campos: o cliente pediu",{c:-5,a:-1},'Duas semanas depois, o cadastro apareceu em uma reclamação: "Por que pedem foto do meu documento só para ver cupom?". A equipe teve de justificar campos que nunca precisou usar.'),o("Pedir só o necessário (nome, e-mail e aceite dos termos e da política de privacidade), explicar para que serão usados e por quanto tempo serão guardados",{a:4,c:3,e:-2},"O cadastro ficou mais curto, e as instalações concluídas subiram 35%. O cliente se convenceu de que dado a mais é risco a mais, e não vantagem.",{peca:"Cadastro com o mínimo de dados"}),o("Manter os campos, mas guardar tudo em um banco com senha forte",{c:-2,a:1},"A senha ajuda a proteger, mas não resolve o excesso: coletar o que não precisa continua errado, e a coleta já tinha sido feita.")]},iadados:{t:"O código no chat",c:[2],tag:"dados",x:e=>"Para ganhar tempo, você pensa em colar, no chat de uma ferramenta pública de inteligência artificial, um trecho do sistema do cliente com a senha do banco, a lista de clientes de teste (que são dados reais, com nome e telefone) e o erro que você não consegue resolver.",lei:"O que você cola em uma ferramenta de IA pode ser armazenado e processado fora do seu controle. Código, credenciais e dados de clientes costumam estar protegidos por contrato de sigilo, e dados pessoais seguem a LGPD: só se compartilham com base legal e finalidade, e com medidas de segurança (Lei 13.709/2018, arts. 6º, 7º e 46). Use ferramentas autorizadas pela empresa, remova segredos e dados pessoais e revise sempre o resultado: a responsabilidade pelo código que você entrega é sua.",o:[o("Colar tudo: é só um chat",{c:-6,e:-2},"Semanas depois, o cliente descobriu que trechos do sistema dele apareciam em respostas de uma ferramenta pública. Não houve prova de vazamento, mas ele quis rever o contrato com a equipe."),o("Não usar IA: é arriscado demais",{a:-2,e:-4},"Você fez tudo na mão e entregou no último minuto. Segurança é importante, mas o risco se resolve com regras de uso, não com a recusa da ferramenta."),o("Usar a ferramenta autorizada pela empresa (ou tirar senhas e dados pessoais do trecho antes de colar) e revisar tudo o que a IA devolver",{a:4,c:3,e:-1},"Você achou o erro em vinte minutos, sem expor o cliente, e ainda corrigiu uma sugestão da IA que apontava uma função que não existe.")]},iacodigo:{t:"O código da IA",c:[2],tag:"autor",x:e=>'A ferramenta de IA gerou uma função inteira que resolve o problema, mas com comentários e nomes de variáveis muito específicos, como se tivesse sido copiada de algum repositório. Um colega diz: "Foi a IA que escreveu, então é livre."',lei:"Código gerado por IA pode reproduzir trechos de projetos existentes, inclusive de licenças que exigem aviso de autoria ou a abertura do código derivado (Lei 9.609/1998, art. 2º; licenças de software livre). Os termos da ferramenta dizem se o resultado pode ser usado comercialmente e quem responde por ele. Boas práticas: entender e testar cada trecho, conferir a origem quando houver semelhança e avisar o cliente do apoio de IA, se o contrato pedir.",o:[o("Usar assim: é só uma função",{c:-4,e:-2},"Meses depois, uma auditoria de licenças do cliente encontrou o trecho quase idêntico em um projeto com licença GPL. O módulo teve de ser reescrito."),o("Usar e apagar os comentários para ninguém perceber",{c:-5,a:-1},"Mudar comentários não muda a origem do código. A auditoria achou o trecho do mesmo jeito, e o esforço de esconder pesou mais do que o uso."),o("Entender a função, reescrever com a sua solução, cobrir com testes, conferir a origem se houver semelhança e avisar o cliente do apoio de IA",{a:4,c:4,e:-3},"Você entendeu a lógica, achou um caso de borda que a IA deixou passar e entregou o módulo com testes. O cliente gostou da transparência.",{peca:"Módulo revisado, com apoio de IA declarado"})]},dadosteste:{t:"A base de produção no seu notebook",c:[1],tag:"dados",x:e=>'Para reproduzir um erro, um colega sugere copiar o banco de produção, com nomes, CPFs e telefones de 12 mil clientes, para o seu notebook e para o ambiente de testes. "É mais rápido do que inventar dados."',lei:"Dados pessoais só devem ser tratados para a finalidade informada e com medidas de segurança proporcionais (LGPD, arts. 6º e 46). Copiar a base de produção para um notebook ou para um ambiente de testes sem proteção aumenta o risco de vazamento, e quem perde o computador responde por isso. A prática correta é usar dados fictícios ou anonimizados (art. 5º, XI, e art. 12), com acesso restrito e registro de quem acessa.",o:[o("Copiar tudo: é só por hoje",{c:-5,e:-2},'Dois meses depois, o notebook foi roubado de dentro de um carro, com a base completa. A empresa teve de avaliar o incidente e avisar os clientes, e o "jeito mais rápido" saiu o mais caro.'),o("Gerar dados fictícios ou anonimizados que reproduzam o erro e testar com eles",{a:4,c:3,e:-3},"Você escreveu um script que embaralha nomes e CPFs e mantém os casos estranhos que causavam o erro. Levou uma tarde e virou a regra do time.",{peca:"Gerador de dados anonimizados para testes"}),o("Copiar só uma parte, sem os CPFs",{c:-2,a:1},"Reduzir o volume ajuda, mas nome e telefone seguem sendo dados pessoais, e a cópia continuou desprotegida no seu notebook. O risco diminuiu, mas não acabou.")]},icones:{t:"Os ícones da interface",c:[1],tag:"autor",x:e=>'Você precisa de ícones e de uma fonte tipográfica para o aplicativo. Uma busca mostra um pacote bonito, de um site de design, com a observação "uso pessoal". O prazo é curto.',lei:"Fontes, ícones, imagens e sons têm licença própria, e muitas permitem só uso pessoal, sem fins comerciais. Em projeto de cliente, é preciso licença comercial ou material de licença livre, guardando o comprovante e o aviso de autoria exigido (Lei 9.610/1998, arts. 7º e 29). Usar sem licença pode gerar notificação, indenização e a troca do material com o aplicativo já publicado.",o:[o("Usar o pacote: ninguém vai conferir",{c:-5,e:-2},"Depois que o aplicativo foi publicado, o designer do pacote enviou uma notificação ao cliente. Foi preciso trocar todos os ícones em uma nova versão, às pressas."),o("Usar um pacote de licença livre ou comprar a licença comercial, guardando o comprovante e o aviso de autoria",{a:3,c:3,e:-2},'Você achou um pacote com licença livre, que exigia só o crédito, e colocou o aviso na tela "Sobre". O aplicativo saiu sem risco.'),o("Desenhar os ícones por conta própria, copiando o estilo do pacote o mais fiel possível",{c:-2,a:1,e:-3},"Estilo não é protegido, mas copiar os desenhos é. Os seus ícones ficaram parecidos demais, e o autor do pacote reclamou.")]},rosto:{t:"A página de depoimentos",c:[1],tag:"autor",x:e=>'O cliente, uma academia, quer uma página "Nossos alunos" com fotos e frases tiradas das redes sociais dos próprios alunos, sem perguntar a eles. "Eles postaram publicamente."',lei:"Mesmo quando a foto foi publicada pela própria pessoa, usá-la em publicidade exige autorização dela (Constituição, art. 5º, X; Código Civil, art. 20). Se alguém reclamar, a indenização independe de prova de prejuízo (Súmula 403 do STJ). A LGPD também se aplica a foto e nome (arts. 6º e 7º). O caminho é pedir autorização por escrito para esse uso, com prazo e um jeito de pedir a retirada.",o:[o("Montar a página: eles postaram publicamente",{c:-5,e:-2},"Dois alunos reclamaram, e um deles pediu indenização pelo uso da imagem sem autorização. A academia retirou a página."),o("Pedir autorização por escrito a cada pessoa, com prazo de uso e como pedir a retirada, e publicar só as de quem aceitou",{c:4,a:3,e:-2},"Doze alunos aceitaram, e o formulário de retirada ficou no rodapé. A página saiu com menos rostos, mas sem nenhum risco.",{peca:"Página de depoimentos, com autorização"}),o("Cortar os rostos e deixar só o primeiro nome e a frase",{c:-2,a:1},"Em uma academia pequena, a frase e o primeiro nome ainda identificam a pessoa, e o texto continua sendo de quem o escreveu.")]},portfolio:{t:"O GitHub como portfólio",c:[1],tag:"autor",x:e=>'Você quer mostrar, no seu GitHub público, o sistema que fez para um cliente, mas o contrato tem uma cláusula de confidencialidade e fala em "cessão dos direitos" sobre o código. Um recrutador pediu o seu portfólio até sexta.',lei:"Quem cria um programa tem o direito de ser reconhecido como autor (Lei 9.609/1998, art. 2º, § 1º), mas o que se pode fazer com o código depende do que foi combinado: contratos de desenvolvimento costumam ceder o código ao cliente e prever confidencialidade. O caminho é pedir ao cliente uma autorização por escrito, dizendo o que vai aparecer (por exemplo, uma versão sem dados reais, sem segredos e sem regras de negócio), ou mostrar um projeto próprio.",o:[o("Publicar o repositório inteiro: você é o autor",{c:-5,s:1},'O cliente viu o seu GitHub e escreveu: "Isso está coberto pelo sigilo. Retire, por favor." Para piorar, o repositório tinha o endereço de um servidor de testes.'),o("Pedir ao cliente uma autorização por escrito e publicar só uma versão limpa, sem dados reais, segredos nem regras de negócio",{c:3,s:4,a:1},'O cliente respondeu em um dia: "Pode mostrar, só tira os dados e as chaves." O portfólio ficou com o trabalho e com a autorização anexada.',{peca:"Vitrine de projeto de cliente, com autorização"}),o("Publicar com outro nome de cliente e as mesmas telas",{c:-3,s:1},"As telas continuavam iguais e reconhecíveis. O cliente notou, e a mentira sobre o nome pesou mais do que o uso em si.")]},sorteio:{t:"A roleta do aplicativo",c:[0],tag:"cons",x:e=>'Uma rede de lojas quer um recurso no aplicativo: "gire a roleta e concorra a uma moto". Começa na sexta, e o cliente diz que o regulamento será "simples".',lei:"A promoção em que se distribuem prêmios por sorteio, vale-brinde ou concurso, a título de propaganda, depende de autorização prévia do governo federal (Lei 5.768/1971; hoje, pela Secretaria de Prêmios e Apostas do Ministério da Fazenda, no Sistema de Controle de Promoção Comercial, o SCPC). A análise leva em média cerca de 15 dias. Fazer a promoção sem autorização pode gerar multa e a suspensão da ação. Quem programa a roleta precisa saber disso, porque a lógica do sorteio faz parte da promoção.",o:[o("Avisar que sorteio com prêmio exige autorização prévia, ajudar a pedi-la com antecedência e ajustar o calendário de entrega",{c:4,a:3,e:-3},"A roleta entrou no ar duas semanas depois, com o número da autorização no regulamento. O cliente se queixou do atraso e depois agradeceu a segurança."),o("Programar e subir na sexta e regularizar depois",{c:-6,e:-2},"A fiscalização notificou o cliente por promoção sem autorização, e a ação foi suspensa no meio. Os participantes ficaram sem resposta, e a equipe ficou com o desgaste."),o('Chamar de "escolha aleatória" em vez de "sorteio"',{c:-4,a:-1},"Mudar o nome não muda a natureza da promoção. A fiscalização olha para o que a ação é, não para como é chamada.")]},reviews:{t:"Trinta avaliações de cinco estrelas",c:[2],tag:"cons",x:e=>'O dono de um aplicativo recém-lançado pede que você escreva, com contas diferentes, 30 avaliações de cinco estrelas na loja de aplicativos, "para a nota subir logo". "Todo mundo faz."',lei:"Avaliações falsas induzem o consumidor a erro e são publicidade enganosa (CDC, art. 37, § 1º). Fazer afirmação falsa ou enganosa sobre as características de um serviço é crime (CDC, art. 66). A loja de aplicativos também pode remover as avaliações e punir a conta. O caminho honesto é pedir a usuários reais que avaliem.",o:[o("Criar as contas e escrever as 30 avaliações",{grave:1,c:-10},"A loja detectou o padrão e removeu todas as avaliações, e um concorrente denunciou o aplicativo. Fazer afirmação falsa sobre a qualidade de um serviço é crime, e o caso ficou registrado como incidente grave no seu nome."),o('Escrever só cinco, "para começar"',{c:-5,a:-1},"Cinco avaliações falsas também são falsas. A loja notou a repetição da linguagem e cortou o alcance do aplicativo."),o("Recusar e propor pedir a avaliação ao usuário depois de uma tarefa concluída com sucesso, e responder a todos os comentários",{c:4,a:3,e:-2},"Com o pedido de avaliação no momento certo, em um mês o aplicativo tinha 120 avaliações reais e nota 4,5.",{peca:"Pedido de avaliação no momento certo"})]},milagre:{t:"Zero erros, 100% no ar",c:[1],tag:"cons",x:e=>clt(e)?'O diretor comercial da empresa quer colocar na proposta do sistema de uma rede de clínicas: "Garantia de zero erros e de 100% de disponibilidade, 24 horas por dia, para sempre." Ele pede que você assine a parte técnica.':'Você está escrevendo a proposta de um sistema para uma rede de clínicas, e o cliente pede: "Coloque garantia de zero erros e de 100% de disponibilidade, 24 horas por dia, para sempre."',lei:"O que se promete em proposta ou anúncio obriga quem prometeu: o CDC trata a oferta como vinculante (arts. 30 e 35) e proíbe a publicidade enganosa (art. 37, § 1º), e, mesmo em contratos entre empresas, a proposta obriga o proponente (Código Civil, art. 427). Por isso, propostas de software usam metas mensuráveis: disponibilidade (por exemplo, 99,5% ao mês), tempo de resposta, prazo de correção por gravidade e o que acontece se a meta não for cumprida.",o:[o("Assinar: proposta é assim mesmo",{c:-5,e:-2},"Na primeira queda de 40 minutos, o cliente citou a proposta e pediu o desconto de um mês. Uma promessa impossível virou prova contra a empresa."),o("Propor metas mensuráveis: disponibilidade de 99,5% ao mês, prazos de correção por gravidade e o que acontece quando a meta não for cumprida",{a:4,c:4,e:-2},"A proposta ficou menos vistosa e mais honesta. O cliente comparou com outras e escolheu a que dizia claramente o que seria entregue.",{peca:"Proposta com metas de serviço mensuráveis"}),o('Assinar, mas colocar "salvo imprevistos" em letras pequenas',{c:-3,a:-1},"A ressalva não desfaz a promessa principal. Na primeira queda, o cliente leu só a frase em destaque.")]},acessivel:{t:"O formulário que o leitor de tela não lê",c:[0],tag:"acess",x:e=>'O site de um cliente tem botões que só funcionam com o mouse, campos sem rótulo, texto cinza claro sobre fundo branco e imagens sem descrição. Um usuário cego escreve: "Não consigo comprar nada: o leitor de tela só diz botão, botão, botão."',lei:"A Lei Brasileira de Inclusão exige que os sites mantidos por empresas com sede ou representação comercial no país sejam acessíveis à pessoa com deficiência (Lei 13.146/2015, art. 63). Na prática: navegação pelo teclado, rótulos nos campos, contraste suficiente, texto alternativo nas imagens e legendas em vídeos, seguindo as diretrizes internacionais (WCAG). Testar com leitor de tela faz parte da entrega. Acessibilidade também ajuda quem está no celular, ao sol ou com conexão ruim.",o:[o("Corrigir: tornar tudo navegável pelo teclado, rotular os campos, aumentar o contraste, descrever as imagens e testar com um leitor de tela",{a:4,c:4,e:-3},"O site ficou melhor para todo mundo. O usuário respondeu agradecendo e contou que ia indicar a loja.",{peca:"Interface acessível, testada com leitor de tela"}),o("Responder que a próxima versão será acessível",{c:-4},"O usuário compartilhou a resposta nas redes. O cliente perdeu a confiança dele e de outros, e a equipe foi cobrada na reunião."),o('Colocar só um botão de "alto contraste" no topo',{c:-1,a:1},"O botão ajudou um pouco, mas os botões continuaram sem teclado e os campos, sem rótulo. Acessibilidade vai além do contraste.")]},cookies:{t:"O banner que não deixa recusar",c:[2],tag:"dados",x:e=>'O cliente quer um banner de cookies com um botão grande "Aceitar tudo", sem opção de recusar, e com as caixas de rastreamento já marcadas dentro das configurações. "Senão cai a conversão dos anúncios."',lei:"Quando o consentimento é a base legal, ele deve ser livre, informado e inequívoco, para finalidades determinadas (LGPD, arts. 5º, XII, e 8º). Caixas já marcadas e um botão de recusar escondido enfraquecem o consentimento. O guia da ANPD sobre cookies recomenda separar os cookies necessários dos de análise e de publicidade, informar com clareza e deixar o titular escolher.",o:[o("Fazer como o cliente pediu",{c:-5,e:-2},"Um usuário denunciou o site à ANPD, e o cliente teve de refazer o banner e explicar a coleta, sem poder usar como antes os dados já coletados."),o('Manter o "Aceitar tudo" e colocar um "Recusar" em letra minúscula, cinza claro',{c:-3,a:-1},"Existir a opção não basta se ela foi feita para não ser vista: o consentimento continua viciado."),o('Fazer um banner com "Aceitar" e "Recusar" de mesmo destaque, cookies necessários separados dos de análise e de publicidade (desmarcados por padrão) e um link para a política',{a:4,c:4,e:-3},"A taxa de aceite caiu, mas os dados que ficaram eram legítimos. O cliente, depois de ver o relatório, passou a tratar a privacidade como diferencial.",{peca:"Banner de consentimento transparente"})]},backup:{t:"O backup que nunca foi restaurado",c:[2],tag:"dados",x:e=>"O servidor de uma clínica faz backup todas as noites. Ninguém nunca testou restaurar. Um disco falha, e você descobre que os últimos backups estão corrompidos. Só os de três semanas atrás estão inteiros.",lei:"A LGPD exige medidas de segurança para proteger os dados pessoais de acessos não autorizados e de situações acidentais ou ilícitas de destruição, perda e alteração (Lei 13.709/2018, art. 46). Backup só vale se a restauração for testada. A regra 3-2-1 ajuda: três cópias, em dois tipos de mídia, uma delas fora do local.",o:[o("Restaurar a cópia mais antiga e não contar nada à clínica",{c:-6,e:-3},'Três semanas de atendimentos sumiram, e a clínica só percebeu quando pacientes disseram que "já tinham marcado". A confiança foi para o chão.'),o('Avisar a clínica, restaurar o possível e deixar o backup como está: "foi azar"',{c:-2,a:-1,e:-2},"A clínica agradeceu a franqueza, mas o mesmo risco continuou lá. Dois meses depois, outro disco falhou."),o("Avisar a clínica na hora, restaurar o que for possível, recuperar o restante pelos registros em papel e criar um backup com cópias em locais diferentes e teste mensal de restauração",{a:5,c:4,e:-5},"A clínica refez os agendamentos perdidos com os registros em papel. Depois, o novo backup, com teste mensal, virou parte do contrato de manutenção.",{peca:"Rotina de backup com teste de restauração"})]},pentest:{t:"Só para ver o tamanho do estrago",c:[1],tag:"dados",x:e=>'Você nota que o site de uma escola, onde estuda o seu primo, mostra a ficha de outro aluno se você trocar o número na barra de endereço. Um colega diz: "Testa com mais uns números para ver o tamanho do estrago, e aí a gente conta pra escola."',lei:"Acessar dados de terceiros sem autorização, ultrapassando os limites do sistema, pode configurar crime de invasão de dispositivo informático (Código Penal, art. 154-A, incluído pela Lei 12.737/2012), a depender do caso. Testar a segurança de um sistema só é legítimo com autorização de quem o controla. Quem encontra uma falha deve evitar acessar dados de terceiros, anotar o mínimo para comprovar e avisar o responsável pelo canal oficial.",o:[o("Testar com mais números para medir o estrago",{grave:1,c:-8},"Ao abrir dezenas de fichas de alunos, você deixou rastros nos registros. A escola acionou a polícia, e o caso ficou registrado como incidente grave no seu nome. A boa intenção não apaga o acesso indevido."),o("Parar no primeiro caso, não acessar mais nenhuma ficha, anotar o que viu (sem copiar dados) e avisar a escola pelo canal oficial, sugerindo a correção",{a:3,c:4,e:-2},"A escola agradeceu, corrigiu a falha em dois dias e comunicou os responsáveis. Você aprendeu que existe um jeito certo de relatar uma vulnerabilidade.",{peca:"Relato responsável de vulnerabilidade"}),o("Ignorar: não é problema seu",{c:-1,e:1},"A falha ficou lá. Meses depois, saiu uma reportagem sobre vazamento de dados de alunos, e você sabia que podia ter ajudado a evitar.")]},scraping:{t:"A lista que está na internet",c:[1],tag:"dados",x:e=>'O cliente quer que você escreva um programa que colete, de perfis públicos de uma rede social, nome, foto, cidade e telefone de 50 mil pessoas para uma campanha de vendas. "Está tudo público, não tem problema."',lei:"Dado pessoal tornado manifestamente público continua sendo dado pessoal: o tratamento exige finalidade, adequação e base legal e deve respeitar os direitos e as expectativas do titular (LGPD, arts. 6º e 7º, §§ 3º e 4º). Além disso, os termos de uso das plataformas costumam proibir a coleta automática (raspagem). Dados de contato coletados assim não podem ser usados para qualquer finalidade.",o:[o("Fazer o programa: é público",{c:-5,e:-2},"A rede bloqueou a conta do cliente, e pessoas da lista perguntaram, em mensagens, como ele tinha conseguido o número delas. Houve reclamação à ANPD."),o("Explicar o risco, propor outros caminhos (formulário com consentimento, parceria com quem já tem a base com autorização, anúncios pela própria plataforma) e recusar a raspagem",{a:4,c:4,e:-3},"O cliente reclamou, mas acabou aceitando o formulário com consentimento. A lista foi menor, e as pessoas que entraram queriam receber as mensagens."),o("Fazer o programa, mas coletando só o e-mail público e deixando o telefone de fora",{c:-2,a:1},"Reduzir os dados ajuda, mas a coleta continua sem finalidade clara nem base legal, e a plataforma continua proibindo.")]},cliente:{t:"O cliente que sumiu",d:1,q:e=>!clt(e),x:e=>'Uma empresa deve R$ 1.800 do último projeto. O financeiro responde só "estamos organizando os pagamentos". Faz 45 dias.',lei:"Quem presta serviço tem direito de cobrar o que combinou, e o contrato (ou ao menos as mensagens, a ordem de serviço e a nota fiscal) é a sua prova. Antes de ir à Justiça, há caminhos mais simples: notificação por escrito, acordo de parcelamento e protesto.",o:[o("Mandar uma notificação por escrito, com valor, prazo e as provas do serviço, e oferecer parcelar",{s:2,c:2,d:900,e:-3},"Em dez dias, o financeiro respondeu e parcelou em duas vezes. Você recebeu R$ 900 neste mês."),o("Ligar todos os dias até pagarem",{e:-6,c:-2,d:300},'Pagaram R$ 300 para você parar de ligar e disseram que o resto "vem quando vier". A empresa nunca mais te chamou.'),o("Esquecer a dívida e procurar clientes novos",{e:2,s:-2},'Você perdeu R$ 1.800 e ganhou tempo. Meses depois, a empresa contou a conhecidos que "nem foi cobrada".')]},revisoes:{t:"Só mais uma tela",d:1,q:e=>!clt(e),x:e=>'Um cliente pede a sexta tela nova do sistema, e o contrato previa cinco. Cada tela nova toma uma tarde sua. Ele diz: "É só uma telinha, igual às outras."',nota:'Contratos de desenvolvimento devem delimitar o escopo e prever como entram as mudanças (o chamado controle de mudanças), com valor para o que sai do combinado. Sem isso, o cliente não sabe quanto custa pedir "só mais uma", e o desenvolvedor acaba trabalhando de graça.',o:[o("Fazer a tela sem cobrar, para manter o cliente",{e:-6,c:1,s:1},"O cliente adorou e pediu a sétima na semana seguinte."),o("Fazer a tela e cobrar o extra, avisando que, daqui para a frente, vale a tabela de mudanças do contrato",{d:200,c:2,s:-1,e:-3},"O cliente reclamou um pouco, pagou os R$ 200 e passou a ser mais objetivo nos pedidos."),o('Encerrar o contrato: "Já fiz tudo o que combinamos"',{e:3,s:-3,c:-1},"Você ficou livre, mas o cliente falou mal de você para dois conhecidos.")]},sono:{t:"Deploy de madrugada",d:1,x:e=>'Faz semanas que você sobe versões à meia-noite, "para não atrapalhar os usuários", e depois fica olhando os painéis até as 2h. Às 8h, você tem a reunião diária.',o:[o("Combinar uma janela de deploy em horário de baixo movimento, dentro do expediente, com plano de volta (rollback) pronto",{e:9,s:-2},'Nas primeiras semanas, um cliente reclamou de uma versão que saiu "no meio do dia". Depois, passou a acordar descansado e a pensar melhor.'),o("Continuar subindo de madrugada",{e:-8,s:3},"Ninguém espera uma versão sua à meia-noite. Você, por outro lado, já não lembra a última noite inteira de sono.")]},curso:{t:"Curso de nuvem",d:1,x:e=>"Abriu uma turma de 40 horas sobre computação em nuvem e implantação contínua, com certificação, por R$ 480 (ou 4 × R$ 120).",o:[o("Fazer o curso completo, parcelado",{a:6,c:2,e:-5,parcela:{n:"Curso de nuvem",v:120,q:4}},"Você passou cinco sábados aprendendo a subir um serviço na nuvem e a automatizar a entrega. Na semana seguinte, usou isso em um projeto e economizou duas horas."),o("Fazer só os módulos gratuitos da plataforma",{a:3,e:-2},"Mais barato e mais flexível, mas sem a certificação nem a prática com as ferramentas."),o("Deixar passar e descansar",{e:4},"Você dormiu melhor neste mês. A turma fechou as inscrições.")]},proprio:{t:"Seu próprio aplicativo",d:1,x:e=>"Você teve uma ideia: um aplicativo de agendamento para barbearias e salões do bairro, com mensalidade baixa. Ninguém na região faz algo assim.",nota:"Quem monta um produto próprio assume o risco: custo de servidor, suporte, preço, captação de clientes e a privacidade dos dados dos usuários (a LGPD vale desde o primeiro cadastro). A vantagem é construir uma marca e uma base de clientes que são suas.",o:[{l:"Lançar este ano, testando com três salões do bairro",f:e=>rng(e)<.6?{flag:"proprio",s:6,a:4,e:-6,d:300,peca:"Aplicativo de agendamento para salões",r:"Em dois meses, oito salões assinaram o plano mensal. Uma associação de comerciantes pediu uma proposta para o ano seguinte."}:{flag:"proprio",a:5,s:2,e:-6,d:-150,peca:"Aplicativo de agendamento para salões",r:"Só dois salões assinaram, e vários pediram preço menor. O prejuízo foi pequeno, mas você aprendeu muito sobre precificar, vender e dizer não a pedido de desconto."}},o("Propor a ideia a uma empresa parceira, como sociedade",{s:4,a:3,d:150},"A empresa topou e ficou com parte da receita. Menos risco, menos ganho, e a marca do aplicativo é dela."),o("Guardar a ideia para quando tiver mais experiência",{e:3},"Você descansou. Em dezembro, viu um aplicativo de outra cidade anunciando algo parecido.")]},agenda:{t:"Dois prazos para o mesmo dia",d:1,x:e=>"Duas entregas na sexta: a correção de um cliente fixo, pequeno e parceiro, e a primeira versão de um projeto de um cliente novo e grande, que paga bem.",o:[{l:"Priorizar o cliente novo e pedir mais dois dias ao cliente fixo",f:e=>Object.assign({s:3,c:-1,r:"O cliente novo gostou da entrega e indicou outro projeto. O cliente fixo aceitou o novo prazo, mas deixou claro que preferia ter sido avisado antes."},FL(e,{d:300}))},o("Entregar os dois no limite, virando a noite",{c:-4,e:-9},"Você entregou, mas deixou passar um erro de validação em um deles. Os dois perceberam."),o("Manter o cliente fixo e propor ao novo uma entrega na semana seguinte",{c:3,s:2},"O cliente fixo valorizou, e o novo aceitou esperar, impressionado com a franqueza.")]},notebook:{t:"O notebook que trava",d:1,q:e=>!clt(e),x:e=>"O seu notebook trava toda vez que você sobe o ambiente de testes e abre o emulador do celular. Um modelo novo custa R$ 3.600 à vista ou 12 × R$ 360. Um técnico faz limpeza e troca de memória por R$ 350.",o:[o("Consertar com o técnico",{d:-350,a:1},"O notebook melhorou, mas ainda trava com o emulador. Dá para trabalhar, com paciência."),o("Parcelar o novo em 12 vezes",{parcela:{n:"Notebook novo",v:360,q:12},a:3,e:2},"São R$ 4.320 no total, R$ 720 a mais do que à vista, e a parcela vai pesar nos meses fracos. Em troca, o trabalho flui."),o("Aguentar mais um pouco",{e:-5,c:-2},"O ambiente travou perto do prazo, e você refez o trabalho à noite. A economia saiu cara.")]}},SELOS=[["Ano completo","Chegar a dezembro trabalhando com tecnologia",e=>!e.over],["Sem incidente grave","Passar o ano sem nenhum incidente grave registrado",e=>!e.grave],["Sabe as regras","Acertar todas as situações que têm resposta certa",e=>e.lei.n>0&&e.lei.ok===e.lei.n],["Dados protegidos","Acertar todas as situações de dados pessoais e segurança",e=>!!e.flags.ok_dados&&!e.flags.x_dados],["Código em dia","Acertar todas as situações de direitos autorais, licenças e imagem",e=>!!e.flags.ok_autor&&!e.flags.x_autor],["Produto honesto","Acertar todas as situações de consumidor e publicidade",e=>!!e.flags.ok_cons&&!e.flags.x_cons],["Repositório de verdade","Terminar o ano com 10 entregas ou mais no repositório",e=>e.pecas.length>=10],["Meta batida","Juntar o valor da meta até dezembro",e=>e.reserva>=e.meta.v],["Sem dever nada","Passar o ano sem dívida e sem parcela",e=>!e.flags.deveu&&!e.flags.parcelou],["Fôlego","Completar o ano sem deixar a Energia cair abaixo de 25",e=>!e.flags.exausto&&!e.over],["Cliente de confiança","Terminar com Confiança em 80 ou mais",e=>e.st.c>=80],["Técnica de sobra","Terminar com Técnica em 80 ou mais",e=>e.st.a>=80]];function calcNota(e){const a=e.me trabalho. Algumas têm resposta certa, pela lei e pela ética da profissão. Outras são dilemas, em que toda opção tem um custo.</li><li>As boas decisões viram entregas no repositório do ano. A Qualidade do código é a dívida técnica ao contrário: quando ela cai, tudo demora mais. Entre uma escolha e outra, a vida acontece: imprevistos e boas surpresas que você não controla.</li><li>No fim você recebe uma nota de 0 a 100 e os selos que conquistou.</li></ul>'+(CFG.form?'<div class="acesso"><p><strong>Docente:</strong> registre aqui cada turma em que aplicou o jogo.</p><a class="op" style="width:auto;text-decoration:none" href="'+esc(CFG.form)+'" target="_blank" rel="noopener"><span>Registrar aplicação</span></a></div>':"")+'<details><summary>Para quem está dando a aula</summary><div class="dentro"><p><strong>Registro de aplicações.</strong> A cada turma em que aplicar o jogo, use o botão “Registrar aplicação” desta capa: informe data, unidade, curso, turma e número de estudantes. Nenhum dado dos estudantes é coletado. Compartilhe sempre o link oficial; não copie nem hospede o jogo em outro endereço.</p><p><strong>Como usar.</strong> Cada estudante joga no próprio celular. As vidas são diferentes de propósito: quem tirou um filho pequeno, clientes pequenos e só R$ 200 na conta joga um ano mais apertado do que quem mora com a família, atende clientes grandes e começa com R$ 2.500. No fim, peçam que comparem o resultado, quanto receberam, as entregas do repositório e o que escreveram nas quatro pausas.</p><p><strong>Para a conversa depois.</strong> O que dependia de escolha e o que dependia do sorteio? O que mudou entre o empregado e o freelancer, nas contas e nos riscos? Por que programação não cabe no MEI, e o que isso muda para quem trabalha por conta própria? Qual regra sobre dados pessoais, licenças de software, direitos do consumidor ou acessibilidade você não conhecia? Que situação do jogo apareceu em um projeto real, no estágio ou em um trabalho do curso? A opção de
