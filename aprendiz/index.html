<style>
/* Layout: uma coluna de celular; cartão de ponto fixo no topo (12 furos, um por mês), cena única embaixo. */
:root{
  --papel:#E9EDF5; --cartao:#FBFCFE; --tinta:#14213D; --tinta2:#4C5A7A; --linha:#C5CEDF;
  --azul:#1B3F8B; --sobre-azul:#FFFFFF; --carimbo:#BE2540; --marca:#FFD84A; --sobre-marca:#14213D;
  --bom:#1C7748; --ruim:#B3261E; --trilho:#D8DEEA;
  --f-tit:"Bricolage Grotesque","Arial Narrow",system-ui,sans-serif;
  --f-txt:"Instrument Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,"SFMono-Regular",Menlo,monospace;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --papel:#0B1220; --cartao:#141E33; --tinta:#E8EDF8; --tinta2:#9BA9C8; --linha:#2B3A5A;
  --azul:#8FB0FF; --sobre-azul:#0B1220; --carimbo:#FF7389; --marca:#FFD84A; --sobre-marca:#14213D;
  --bom:#62D69E; --ruim:#FF8A80; --trilho:#22304D; color-scheme:dark } }
:root[data-theme="dark"]{
  --papel:#0B1220; --cartao:#141E33; --tinta:#E8EDF8; --tinta2:#9BA9C8; --linha:#2B3A5A;
  --azul:#8FB0FF; --sobre-azul:#0B1220; --carimbo:#FF7389; --marca:#FFD84A; --sobre-marca:#14213D;
  --bom:#62D69E; --ruim:#FF8A80; --trilho:#22304D; color-scheme:dark }

*{box-sizing:border-box}
body{background:var(--papel);color:var(--tinta);font-family:var(--f-txt);font-size:16px;line-height:1.5;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0 40px}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--papel)}
.col{max-width:520px;margin:0 auto;display:flex;flex-direction:column;gap:16px}
h1,h2,h3{font-family:var(--f-tit);text-wrap:balance;margin:0;line-height:1.05;letter-spacing:-.01em}
p{margin:0}
button{font:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:3px solid var(--marca);outline-offset:2px}
.rot{font-family:var(--f-mono);font-size:11px;letter-spacing:.09em;text-transform:uppercase;color:var(--tinta2)}

/* ---------- cartão de ponto (HUD) ---------- */
.hud{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--papel);padding-block:10px 8px;
  display:flex;flex-direction:column;gap:8px;border-bottom:1px dashed var(--linha)}
.ponto{display:grid;grid-template-columns:repeat(12,1fr);gap:3px}
.furo{display:flex;flex-direction:column;align-items:center;gap:3px;font-family:var(--f-mono);font-size:10px;color:var(--tinta2);padding:3px 0;border-radius:3px}
.furo i{width:9px;height:9px;border-radius:50%;border:1.5px solid var(--linha);display:block}
.furo.foi i{background:var(--azul);border-color:var(--azul)}
.furo.agora{background:var(--marca);color:var(--sobre-marca);font-weight:600}
.furo.agora i{border-color:var(--sobre-marca)}
.medidores{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
.med{display:flex;flex-direction:column;gap:3px;min-width:0}
.med b{font-family:var(--f-mono);font-weight:500;font-size:10px;letter-spacing:.04em;text-transform:uppercase;color:var(--tinta2);display:flex;justify-content:space-between;gap:4px}
.med b span{color:var(--tinta);font-variant-numeric:tabular-nums}
.barra{height:6px;background:var(--trilho);border-radius:1px;overflow:hidden}
.barra u{display:block;height:100%;background:var(--azul);transition:width .5s ease}
.med.baixo .barra u{background:var(--carimbo)}
.med.baixo b span{color:var(--carimbo)}
.grana{display:flex;flex-wrap:wrap;gap:4px 14px;align-items:baseline;font-family:var(--f-mono);font-size:12px;color:var(--tinta2);font-variant-numeric:tabular-nums}
.grana strong{color:var(--tinta);font-weight:600}
.grana .deve strong{color:var(--ruim)}
.grana button{margin-left:auto;background:none;border:0;padding:2px 0;font-family:var(--f-mono);font-size:11px;color:var(--tinta2);text-decoration:underline;text-underline-offset:3px}

/* ---------- cena ---------- */
.cena{display:flex;flex-direction:column;gap:14px;padding-top:6px;animation:entra .28s ease both}
@keyframes entra{from{opacity:.4;transform:translateY(6px)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion:reduce){.cena{animation:none}.barra u{transition:none}}
.cena h2{font-size:clamp(28px,8vw,36px);font-weight:800}
.cena .texto{display:flex;flex-direction:column;gap:10px;max-width:60ch}
.ops{display:flex;flex-direction:column;gap:8px;margin-top:4px}
.op{display:grid;grid-template-columns:auto 1fr;gap:12px;align-items:start;text-align:left;width:100%;
  background:var(--cartao);border:1.5px solid var(--linha);border-radius:4px;padding:13px 14px;font-weight:500;line-height:1.35}
.op kbd{font-family:var(--f-mono);font-size:12px;font-weight:600;color:var(--azul);padding-top:2px}
.op small{display:block;font-weight:400;font-size:13px;color:var(--tinta2);margin-top:2px}
.op:hover{border-color:var(--azul)}
.op:active{transform:translateY(1px)}
.op.ir{background:var(--azul);border-color:var(--azul);color:var(--sobre-azul);font-weight:600;grid-template-columns:1fr;text-align:center}
.fichas{display:flex;flex-wrap:wrap;gap:6px}
.ficha{font-family:var(--f-mono);font-size:12px;padding:3px 8px;border:1px solid var(--linha);border-radius:2px;font-variant-numeric:tabular-nums}
.ficha.mais{color:var(--bom);border-color:currentColor}
.ficha.menos{color:var(--ruim);border-color:currentColor}
.lei{border-top:1px dashed var(--linha);padding-top:12px;display:flex;flex-direction:column;gap:6px;font-size:14.5px}
.lei em{font-style:normal;align-self:flex-start;background:var(--marca);color:var(--sobre-marca);font-family:var(--f-mono);font-size:11px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;padding:1px 6px}
.carimbo{align-self:flex-start;font-family:var(--f-tit);font-weight:800;font-size:17px;letter-spacing:.06em;text-transform:uppercase;color:var(--carimbo);

.carimbo.az{color:var(--azul);border-color:var(--azul)}

/* holerite */
.hol{background:var(--cartao);border:1.5px solid var(--linha);border-radius:4px;padding:14px;font-family:var(--f-mono);font-size:13px;display:flex;flex-direction:column;gap:5px;font-variant-numeric:tabular-nums}
.hol .cab{font-size:11px;letter-spacing:.09em;text-transform:uppercase;color:var(--tinta2);padding-bottom:4px}
.hol .l{display:flex;justify-content:space-between;gap:10px}
.hol .l span:first-child{min-width:0}
.hol .l span:last-child{white-space:nowrap}
.hol .tot{border-top:1.5px solid var(--tinta);padding-top:6px;margin-top:3px;font-weight:600}
.hol .obs{color:var(--tinta2);font-size:12px;padding-top:4px;font-family:var(--f-txt)}
.neg{color:var(--ruim)}
.ficha-p{display:grid;grid-template-columns:auto 1fr;gap:7px 14px;font-size:15px}
.ficha-p dt{font-family:var(--f-mono);font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--tinta2);padding-top:3px}
.ficha-p dd{margin:0}
ul.plano{margin:0;padding-left:18px;display:flex;flex-direction:column;gap:5px}
textarea,input[type=text]{font:inherit;color:var(--tinta);background:var(--cartao);border:1.5px solid var(--linha);border-radius:4px;padding:11px 12px;width:100%}
textarea{min-height:110px;resize:vertical}
.meta-b{display:flex;flex-direction:column;gap:4px;font-family:var(--f-mono);font-size:12px;color:var(--tinta2)}
.col2{display:flex;flex-direction:column;gap:10px}
.colega{border-top:1px dashed var(--linha);padding-top:10px;display:flex;flex-direction:column;gap:2px;font-size:14.5px}
.colega b{font-family:var(--f-tit);font-size:17px}
blockquote{margin:0;padding:0 0 0 12px;border-left:3px solid var(--marca);font-size:15px}

label{font-weight:600;font-size:14px;display:flex;flex-direction:column;gap:6px}
.carimbo.peq{font-size:13px;border-width:2px;padding:3px 9px 2px;transform:rotate(-2deg)}
.nota{font-family:var(--f-tit);font-weight:800;font-size:84px;line-height:.9;letter-spacing:-.03em;font-variant-numeric:tabular-nums}

.rod{margin-top:36px;padding-top:14px;border-top:1.5px dashed var(--linha);font-family:var(--f-mono);font-size:11.5px;line-height:1.55;color:var(--tinta2)}
.rod b{color:var(--azul)}
.rod a{color:var(--azul)}
.bloq{padding-top:40px;display:flex;flex-direction:column;gap:14px}
.bloq a{color:var(--azul);font-weight:700;word-break:break-all}
.acesso{display:flex;gap:10px;align-items:center;justify-content:space-between;flex-wrap:wrap;border:1.5px dashed var(--linha);border-radius:6px;padding:12px 14px}
.acesso p{font-size:15px;min-width:0;flex:1 1 220px}
a.op{color:inherit;text-decoration:none}
