<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style><title>Um Ano pelas Áreas</title>

<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Zilla+Slab:wght@500;600;700&family=Public+Sans:wght@400;500;600;700&family=Courier+Prime:wght@400;700&display=swap">
<style>
/* Layout: uma coluna de celular; no topo, as abas de pasta do rodízio (4 áreas, 3 meses cada) e os medidores em células; embaixo, uma cena por vez. Identidade: escritório. Cinza-pedra, grafite-azulado, laranja de carimbo, serifa de planilha e fonte de máquina de escrever nos números. */
:root{
  --papel:#EEEDE8; --cartao:#FAFAF7; --tinta:#1F2328; --tinta2:#5A6068; --linha:#D2D2CB;
  --placa:#394557; --sobre-placa:#FFFFFF; --marca:#E8590C; --sobre-marca:#1F2328; --carimbo:#B9470A;
  --bom:#2E7D32; --ruim:#B3261E; --trilho:#DEDDD5;
  --f-tit:"Zilla Slab","Rockwell","Roboto Slab",Georgia,serif;
  --f-txt:"Public Sans","Segoe UI",system-ui,-apple-system,"Helvetica Neue",sans-serif;
  --f-mono:"Courier Prime","Courier New",Courier,monospace;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --papel:#14161A; --cartao:#1D2025; --tinta:#ECEDEF; --tinta2:#A3A8B0; --linha:#353A42;
  --placa:#A9BCD6; --sobre-placa:#14161A; --marca:#FF8A3D; --sobre-marca:#14161A; --carimbo:#FF8A3D;
  --bom:#7BD88F; --ruim:#FF8A80; --trilho:#2A2E34; color-scheme:dark } }
:root[data-theme="dark"]{
  --papel:#14161A; --cartao:#1D2025; --tinta:#ECEDEF; --tinta2:#A3A8B0; --linha:#353A42;
  --placa:#A9BCD6; --sobre-placa:#14161A; --marca:#FF8A3D; --sobre-marca:#14161A; --carimbo:#FF8A3D;
  --bom:#7BD88F; --ruim:#FF8A80; --trilho:#2A2E34; color-scheme:dark }

*{box-sizing:border-box}
body{background:var(--papel);color:var(--tinta);font-family:var(--f-txt);font-size:17px;line-height:1.5;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0 40px}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--papel)}
.col{max-width:520px;margin:0 auto;display:flex;flex-direction:column;gap:16px}
h1,h2,h3{font-family:var(--f-tit);text-wrap:balance;margin:0;line-height:1.08;letter-spacing:-.005em}
p{margin:0}
button{font:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:3px solid var(--marca);outline-offset:2px}
.rot{font-family:var(--f-mono);font-size:11.5px;font-weight:600;letter-spacing:.14em;text-transform:uppercase;color:var(--tinta2)}

/* ---------- abas de pasta do rodízio (HUD) ---------- */
.hud{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--papel);padding-block:10px 8px;
  display:flex;flex-direction:column;gap:9px;border-bottom:1px solid var(--linha)}
.abas{display:grid;grid-template-columns:repeat(4,1fr);gap:4px;align-items:end}
.aba{display:flex;flex-direction:column;gap:2px;min-width:0;padding:5px 3px 4px;border:1.5px solid var(--linha);border-bottom:0;border-radius:7px 7px 0 0;background:var(--trilho);color:var(--tinta2)}
.aba b{font-family:var(--f-mono);font-size:9.5px;font-weight:700;letter-spacing:.04em;text-transform:uppercase;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;padding-inline:3px}
.tres{display:grid;grid-template-columns:repeat(3,1fr);font-family:var(--f-mono);font-size:10.5px;font-weight:700}
.tres span{text-align:center;padding:1px 0;border-radius:3px}
.aba.foi{background:var(--placa);border-color:var(--placa);color:var(--sobre-placa)}
.aba.agora{background:var(--cartao);border-color:var(--tinta);color:var(--tinta);box-shadow:0 2px 0 var(--cartao)}
.aba .tres span.agora{background:var(--marca);color:var(--sobre-marca)}
.aba .tres span.pend{opacity:.55}
.aba.agora .tres span.foi{text-decoration:line-through;text-decoration-thickness:1.5px}
.medidores{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
.med{display:flex;flex-direction:column;gap:3px;min-width:0}
.med b{font-family:var(--f-mono);font-weight:600;font-size:10px;letter-spacing:.04em;text-transform:uppercase;color:var(--tinta2);display:flex;justify-content:space-between;gap:3px}
.med b span{color:var(--tinta);font-variant-numeric:tabular-nums;letter-spacing:0}
.barra{height:6px;background:repeating-linear-gradient(90deg,var(--trilho) 0 7px,transparent 7px 9px);position:relative}
.barra u{display:block;height:6px;background:repeating-linear-gradient(90deg,var(--placa) 0 7px,transparent 7px 9px);transition:width .5s ease}
.med.baixo .barra u{background:repeating-linear-gradient(90deg,var(--ruim) 0 7px,transparent 7px 9px)}
.med.baixo b span{color:var(--ruim)}
.grana{display:flex;flex-wrap:wrap;gap:4px 14px;align-items:baseline;font-family:var(--f-mono);font-size:13px;color:var(--tinta2);font-variant-numeric:tabular-nums}
.grana strong{color:var(--tinta);font-weight:700}
.grana .deve strong{color:var(--ruim)}
.grana button{margin-left:auto;background:none;border:0;padding:2px 0;font-family:var(--f-mono);font-size:12px;color:var(--tinta2);text-decoration:underline;text-underline-offset:3px}

/* ---------- cena ---------- */
.cena{display:flex;flex-direction:column;gap:14px;padding-top:6px;animation:entra .28s ease both}
@keyframes entra{from{opacity:.4;transform:translateY(6px)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion:reduce){.cena{animation:none}.barra u{transition:none}}
.cena h2{font-size:clamp(28px,8vw,36px);font-weight:700}
.cena .texto{display:flex;flex-direction:column;gap:10px;max-width:60ch}
.ops{display:flex;flex-direction:column;gap:8px;margin-top:4px}
.op{display:grid;grid-template-columns:auto 1fr;gap:12px;align-items:start;text-align:left;width:100%;
  background:var(--cartao);border:1.5px solid var(--linha);border-radius:5px;padding:13px 14px;font-weight:500;line-height:1.35}
.op kbd{font-family:var(--f-mono);font-style:normal;font-size:20px;font-weight:700;line-height:1.1;color:var(--carimbo);padding-top:0}
.op small{display:block;font-weight:400;font-size:14px;color:var(--tinta2);margin-top:2px}
a.op{color:inherit;text-decoration:none}
.op:hover{border-color:var(--placa)}
.op:active{transform:translateY(1px)}
.op.ir{background:var(--placa);border-color:var(--placa);color:var(--sobre-placa);font-weight:600;grid-template-columns:1fr;text-align:center;letter-spacing:.02em}
.fichas{display:flex;flex-wrap:wrap;gap:6px}
.ficha{font-family:var(--f-mono);font-size:12.5px;font-weight:500;padding:3px 9px;border:1px solid var(--linha);border-radius:99px;font-variant-numeric:tabular-nums}
.ficha.mais{color:var(--bom);border-color:currentColor}
.ficha.menos{color:var(--ruim);border-color:currentColor}
.lei{border-top:2px dashed var(--linha);padding-top:12px;display:flex;flex-direction:column;gap:6px;font-size:15.5px}
.lei em{font-style:normal;align-self:flex-start;background:var(--marca);color:var(--sobre-marca);font-family:var(--f-mono);font-size:11px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;padding:2px 8px;border-radius:2px}
/* carimbo de escritório: moldura dupla, levemente torto */
.placa{align-self:flex-start;font-family:var(--f-tit);font-weight:700;font-size:16px;letter-spacing:.08em;text-transform:uppercase;
  color:var(--carimbo);border:4px double var(--carimbo);border-radius:4px;padding:5px 14px 4px;transform:rotate(-2deg)}
.placa.mal{color:var(--ruim);border-color:var(--ruim);background:transparent}
.placa.peq{font-size:12.5px;padding:3px 10px 2px;border-width:3px}

.hol{background:var(--cartao);border:1.5px solid var(--linha);border-radius:5px;padding:14px;font-family:var(--f-mono);font-size:13.5px;display:flex;flex-direction:column;gap:5px;font-variant-numeric:tabular-nums}
.hol .cab{font-size:11.5px;font-weight:600;letter-spacing:.14em;text-transform:uppercase;color:var(--tinta2);padding-bottom:4px}
.hol .l{display:flex;justify-content:space-between;gap:10px}
.hol .l span:first-child{min-width:0}
.hol .l span:last-child{white-space:nowrap}
.hol .tot{border-top:1.5px solid var(--tinta);padding-top:6px;margin-top:3px;font-weight:700}
.hol .obs{color:var(--tinta2);font-size:14.5px;padding-top:4px;font-family:var(--f-txt)}
.neg{color:var(--ruim)}
.ficha-p{display:grid;grid-template-columns:1fr;gap:0;font-size:16px;margin:0}
.ficha-p dt{font-family:var(--f-mono);font-size:11.5px;font-weight:600;letter-spacing:.14em;text-transform:uppercase;color:var(--tinta2);padding-top:4px}
.ficha-p dd{margin:0 0 9px}
.cracha{background:var(--cartao);border:1.5px solid var(--tinta);border-radius:10px;overflow:hidden;display:flex;flex-direction:column;box-shadow:4px 4px 0 var(--linha)}
.cracha::before{content:"";align-self:center;width:54px;height:9px;margin:9px 0 8px;border-radius:99px;background:var(--papel);border:1.5px solid var(--tinta)}
.cracha .topo{background:var(--placa);color:var(--sobre-placa);padding:9px 14px;font-family:var(--f-mono);font-size:11.5px;font-weight:600;letter-spacing:.14em;text-transform:uppercase;display:flex;justify-content:space-between;gap:8px;border-bottom:2px dashed color-mix(in srgb,var(--sobre-placa) 55%,transparent)}
.cracha .corpo{padding:14px}
ul.plano{margin:0;padding-left:18px;display:flex;flex-direction:column;gap:5px}
textarea,input[type=text]{font:inherit;color:var(--tinta);background:var(--cartao);border:1.5px solid var(--linha);border-radius:4px;padding:11px 12px;width:100%}
textarea{min-height:110px;resize:vertical}
.col2{display:flex;flex-direction:column;gap:10px}
.colega{border-top:2px dashed var(--linha);padding-top:10px;display:flex;flex-direction:column;gap:2px;font-size:15.5px}
.colega b{font-family:var(--f-tit);font-size:19px}
blockquote{margin:0;padding:0 0 0 12px;border-left:3px solid var(--carimbo);font-size:16px}
blockquote cite{display:block;font-style:normal;font-size:13px;color:var(--tinta2)}
.peca{display:flex;gap:10px;align-items:baseline;border-top:2px dashed var(--linha);padding:8px 0;font-size:16px}
.peca i{font-style:normal;font-family:var(--f-mono);font-weight:700;font-size:13px;color:var(--carimbo);min-width:3.2em}
.temp{display:inline-block;font-family:var(--f-mono);font-size:11px;font-weight:600;letter-spacing:.12em;text-transform:uppercase;border:1.5px solid currentColor;border-radius:99px;padding:1px 9px;align-self:flex-start}
.temp.alta{color:var(--bom)} .temp.media{color:var(--tinta2)} .temp.baixa{color:var(--ruim)}

.capa{padding-top:28px;display:flex;flex-direction:column;gap:18px}
.capa h1{font-size:clamp(42px,13vw,72px);font-weight:700;line-height:1;letter-spacing:-.02em}
.capa h1 span{background:linear-gradient(transparent 56%,color-mix(in srgb,var(--marca) 55%,transparent) 56% 92%,transparent 92%);padding:0 .06em}
.capa .lead{font-size:19px;max-width:34ch}
details{border-top:2px dashed var(--linha);padding-top:12px;font-size:15.5px}
details summary{cursor:pointer;font-weight:600}
details .dentro{display:flex;flex-direction:column;gap:10px;padding-top:10px;color:var(--tinta2)}
details .dentro strong{color:var(--tinta)}
label{font-weight:600;font-size:15px;display:flex;flex-direction:column;gap:6px}
.nota{font-family:var(--f-tit);font-weight:700;font-size:88px;line-height:.9;letter-spacing:-.03em;font-variant-numeric:lining-nums tabular-nums}
.nota small{font-family:var(--f-mono);font-style:normal;font-weight:600;font-size:13px;letter-spacing:.12em;text-transform:uppercase;color:var(--tinta2)}
.selos{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.selo{border:1.5px dashed var(--linha);border-radius:5px;padding:9px 10px;font-size:13.5px;line-height:1.35;color:var(--tinta2);min-width:0}
.selo b{display:block;font-family:var(--f-tit);font-size:16px;line-height:1.15;margin-bottom:3px}
.selo.tem{border-style:solid;border-color:var(--placa);background:var(--cartao);color:var(--tinta)}
.selo.tem b{color:var(--placa)}

/* créditos e bloqueio */
.rod{margin-top:36px;padding-top:14px;border-top:2px dashed var(--linha);font-family:var(--f-mono);font-size:12px;line-height:1.55;color:var(--tinta2)}
.rod b,.rod a{color:var(--placa)}
.bloq{padding-top:40px;display:flex;flex-direction:column;gap:14px}
.bloq a{color:var(--placa);font-weight:700;word-break:break-all}
.acesso{display:flex;gap:10px;align-items:center;justify-content:space-between;flex-wrap:wrap;border:1.5px dashed var(--linha);border-radius:4px;padding:12px 14px}
.acesso p{font-size:15px;min-width:0;flex:1 1 220px}
</style></head><body>

<div class="col">
  <header class="hud" id="hud" hidden>
    <div class="abas" id="ponto" aria-label="Áreas e meses do ano"></div>
    <div class="medidores" id="meds"></div>
    <div class="grana" id="grana"></div>
  </header>
  <main id="palco"></main>
</div>

<script>const IMP=.06,CONTADOR=150,INSSPL=178,MES=["Janeiro","Fevereiro","Março","Abril","Maio","Junho","Julho","Agosto","Setembro","Outubro","Novembro","Dezembro"],SAZ=[1.15,.9,1.1,1.05,.95,1,.85,.9,1,1,1.1,1.2],AREAS=["Pessoal (RH)","Financeiro","Compras e logística","Comercial e marketing"],AREAS_C=["Pessoal","Finanças","Compras","Comercial"],AREA=a=>Math.floor(a/3),PAUSAS={2:"Você terminou o trimestre de pessoal. O que mais te surpreendeu sobre direitos e deveres no trabalho, no jogo, no estágio ou no curso?",5:"Você terminou o trimestre de finanças. Qual decisão envolvendo dinheiro foi mais difícil: a que a lei resolvia ou a que dependia só de você?",8:"Você terminou o trimestre de compras e logística. Em que momento ficou mais difícil conciliar prazo, custo e segurança?",11:"Você terminou o ano. Em qual área da empresa quer atuar daqui a cinco anos? E que recado deixaria para quem começa a trabalhar amanhã?"},NOMES_ST={a:"Técnica",c:"Confiança",e:"Energia",s:"Visão"},FASES=[{ida:[19,22],t:"Primeiro emprego depois do curso, e mora com a família, ajudando nas contas de casa",casa:800,st:{e:8,s:-2}},{ida:[23,27],t:"Fez estágio em um escritório durante o curso e divide um apartamento com uma amiga",casa:1300,st:{a:5,s:3}},{ida:[28,34],t:"Faz serviços administrativos para conhecidos há anos e tem um filho pequeno",casa:1500,st:{s:6,e:-6}},{ida:[38,46],t:"Mudou de carreira depois de 15 anos no comércio",casa:1400,st:{c:8,a:-2,s:-2}}],ESP=[{n:"Perfil analítico",h:"gosta de números, controles e planilhas bem fechadas",st:{a:4}},{n:"Perfil de relacionamento",h:"gosta de lidar com pessoas, clientes e fornecedores",st:{c:4}},{n:"Perfil de organização",h:"gosta de processos, prazos e rotinas bem desenhadas",st:{s:4}}],PORTES=[{n:"Pequenas: comércios, escritórios e clínicas",m:.88,d:1.1,sal:1700},{n:"Médias: indústrias, redes de lojas e escolas da região",m:1,d:1,sal:1900},{n:"Grandes: cooperativas, indústrias e instituições",m:1.18,d:.92,sal:2200}],CAPITAIS=[200,1e3,2500],METAS=[{n:"Equipamento de trabalho",v:1500,h:"Notebook, impressora multifuncional e uma boa cadeira"},{n:"Reserva de emergência",v:3e3,h:"Para os meses vazios não virarem dívida"},{n:"Cursos e certificações",v:2400,h:"Excel avançado, departamento pessoal, inglês e o começo de uma graduação"},{n:"Escritório próprio",v:6e3,h:"Sala, sistema, contador e meses de fôlego para abrir o seu escritório de serviços administrativos. A meta mais alta"}],FOCOS=[{l:"Estudar como as áreas da empresa se conectam",h:"Sobe a Visão",fx:{s:8,c:2,e:-3},m:1},{l:"Treinar rotinas, planilhas e sistemas",h:"Sobe a Técnica",fx:{a:8,c:1,e:-2},m:.9},{l:"Aceitar toda tarefa que aparecer",h:"Mais serviços, menos energia",fx:{e:-8,c:-1},m:1.35},{l:"Descansar e cuidar de você",h:"Sobe a Energia, menos serviços",fx:{e:16},m:.75}],INTRO=["Janeiro. Você começa o trimestre de pessoal: admissões, ponto, férias e folha. As rotinas do ano que passou fecham, e as do ano novo abrem.","Fevereiro. Carnaval e poucos dias úteis: o ponto e a folha apertam, e a empresa abre vagas para o começo do ano.","Março. Fim do trimestre de pessoal. O processo seletivo, as férias e as rescisões se acumulam na sua mesa.","Abril. Você muda de mesa: começa o trimestre do financeiro. Contas a pagar, contas a receber e fluxo de caixa.","Maio. O financeiro fecha o mês, e os fornecedores cobram. O Dia das Mães puxa o caixa.","Junho. Fim do semestre. A diretoria pede o balanço dos custos e quer cortar despesas.","Julho. Você muda de mesa de novo: compras e logística. Cotações, estoque, entregas e transportadoras. As férias escolares aumentam a demanda.","Agosto. Os pedidos de fim de ano começam a ser feitos com antecedência, e o estoque aperta.","Setembro. O armazém está cheio, e as entregas da primavera chegam. As transportadoras pedem prazo.","Outubro. Última mesa do ano: comercial e marketing. Atendimento, propostas, campanhas e pós-venda.","Novembro. Black Friday. A empresa quer vender mais, e o atendimento recebe o dobro de mensagens.","Dezembro. Natal, balanço do ano e confraternização. O 13º, as férias coletivas e as metas do ano que vem."];function r2(a){return Math.round(100*a)/100}function brl(a){const e=a<0;let o=Math.round(100*Math.abs(a));return(e?"−":"")+"R$ "+String(Math.floor(o/100)).replace(/\B(?=(\d{3})+(?!\d))/g,".")+","+String(o%100).padStart(2,"0")}function rng(a){a.r=a.r+1831565813|0;let e=a.r;return e=Math.imul(e^e>>>15,1|e),e^=e+Math.imul(e^e>>>7,61|e),((e^e>>>14)>>>0)/4294967296}function F(a){return FASES[a.p.fase]}const clt=a=>0===a.p.v,FL=(a,e)=>clt(a)?{}:e,E=(a,e,o)=>clt(a)?e:o;function novo(a,e){const o={seed:0|a,r:0|a,nome:e||"",m:0,f:"perfil",st:{},conta:0,reserva:0,divida:0,parc:[],meta:null,grave:0,flags:{},reflex:[],over:null,hist:[],lei:{ok:0,n:0},poup:0,avis:{},prazo:null,conv:null,fat:0,das:0,dias:0,mdias:0,pecas:[]};for(let a=0;a<5;a++)rng(o);const r=Math.floor(4*rng(o)),s=FASES[r],i=s.ida[0]+Math.floor(rng(o)*(s.ida[1]-s.ida[0]+1)),t=rng(o)<.5?0:1,n=rng(o),d=n<.35?0:n<.8?1:2,c=Math.floor(3*rng(o)),m=rng(o),u=CAPITAIS[m<.4?0:m<.8?1:2];o.p={fase:r,idade:i,v:t,porte:d,esp:c,cap:u,casa:s.casa,mei:0,desc:0,seg:0,niver:1+Math.floor(10*rng(o))},o.conta=u,o.st={a:30+Math.floor(11*rng(o)),c:28+Math.floor(11*rng(o)),e:62+Math.floor(13*rng(o)),s:24+Math.floor(11*rng(o))};for(const a in s.st)o.st[a]=Math.max(5,Math.min(100,o.st[a]+s.st[a]));for(const a in ESP[c].st)o.st[a]=Math.min(100,o.st[a]+ESP[c].st[a]);const p=Object.keys(ALEA);for(let a=p.length-1;a>0;a--){const e=Math.floor(rng(o)*(a+1));[p[a],p[e]]=[p[e],p[a]]}t&&(p.splice(p.indexOf("mei"),1),p.splice(1,0,"mei")),o.pool=p;const l=Object.keys(VIDA);for(let a=l.length-1;a>0;a--){const e=Math.floor(rng(o)*(a+1));[l[a],l[e]]=[l[e],l[a]]}return o.vp=l,o}function pagar(a,e){if(a.conta=r2(a.conta-e),a.conta<0){const e=-a.conta;a.conta=0;const o=Math.min(e,a.reserva);a.reserva=r2(a.reserva-o);const r=r2(e-o);r>0&&(a.divida=r2(a.divida+r),a.flags.deveu=1)}}function verificar(a){if(!a.over)if(a.grave>=2)a.over="cancel o registro, e explicar ao gestor que isso evita multa e processo",{c:3,a:4,e:-3,peca:"Checklist de admissão"},"O exame saiu na terça, o registro foi feito no mesmo dia, e o vendedor começou na quarta. O gestor reclamou do atraso e depois pediu o checklist para as próximas contratações."),o("Registrar na segunda, mas deixar o exame médico para depois",{c:-3,a:1},"O registro protege o empregado, mas o exame admissional também é obrigatório antes do início. A empresa teve de refazer o procedimento depois de uma notificação.")]},{t:"O ponto que sobrou",c:[2],x:a=>E(a,'O gerente fecha a folha e diz: "As horas extras de ontem estouraram o orçamento. Apaga do sistema de ponto e a gente compensa depois."','O dono de uma loja que você atende diz, ao fechar a folha: "As horas extras de ontem estouraram o orçamento. Apaga do ponto e a gente compensa depois."'),lei:"O registro da jornada é obrigatório para empresas com mais de 20 empregados (CLT, art. 74, § 2º), e as horas extras devem ser pagas com adicional de pelo menos 50% (Constituição, art. 7º, XVI; CLT, art. 59). Apagar ou alterar horas trabalhadas esconde uma dívida e pode gerar autuação, indenização e, a depender do caso, responsabilização de quem alterou o registro. O que se faz é registrar como foi e discutir a compensação.",o:[o("Apagar as horas do sistema",{c:-5,e:-2},"Dois meses depois, o empregado entrou com ação e levou as mensagens de WhatsApp com as horas. O registro apagado entrou como prova contra a empresa, e o seu nome apareceu no processo."),o("Apagar só metade das horas, para o custo caber",{c:-3,a:-1},"Apagar metade continua sendo apagar. O empregado conferiu o holerite e viu a diferença."),o("Registrar as horas como foram, mostrar o custo ao gestor e propor compensação em banco de horas, conforme acordo, ou revisão da escala",{c:4,a:3,e:-3,peca:"Procedimento de registro e compensação de horas"},"O gestor não gostou do custo, mas aceitou o banco de horas. Os empregados viram que o ponto era respeitado, e a rotina ficou mais previsível.")]},{t:"O anúncio da vaga",c:[1],x:a=>E(a,'O gerente pede que você publique o anúncio de uma vaga de auxiliar de vendas: "Mulheres, até 28 anos, boa aparência." Ele diz que "é o perfil que a loja quer".','Uma loja pede que você publique o anúncio de uma vaga de auxiliar de vendas: "Mulheres, até 28 anos, boa aparência." A dona diz que "é o perfil que a loja quer".'),lei:'A Constituição proíbe diferença de critério de admissão por sexo, idade, cor ou estado civil (art. 7º, XXX), e a Lei 9.029/1995 proíbe práticas discriminatórias na admissão (art. 1º), com indenização para quem foi prejudicado. O anúncio deve descrever as exigências do cargo: experiência, habilidades, disponibilidade, escolaridade. "Boa aparência" e limite de idade, sem relação com a função, também são critérios discriminatórios.',o:[o("Publicar como pedido: a decisão é do gestor",{c:-5,e:-2},"Uma candidata de 35 anos, com experiência, tirou print do anúncio e o levou ao sindicato. A empresa foi notificada, e o anúncio saiu do ar."),o("Reescrever o anúncio com os requisitos do cargo (experiência, habilidades, disponibilidade), sem sexo, idade ou aparência, e explicar o motivo ao gestor",{c:4,a:3,e:-2,peca:"Modelo de anúncio de vaga sem discriminação"},"O anúncio recebeu 80 currículos, mais variados do que o gestor esperava. A empresa escolheu pela entrevista, e o modelo virou padrão."),o('Publicar só com "boa aparência" e limite de idade, sem citar o sexo',{c:-3,a:-1},"Retirar uma palavra não resolve: idade e aparência sem relação com a função continuam sendo critérios discriminatórios.")]},{t:"O boleto que trocou de banco",c:[2],tag:"dados",x:a=>E(a,'Um e-mail, que parece ser do fornecedor de embalagens, diz: "Atualizamos nossos dados bancários. Pague o boleto de R$ 18.400 de sexta na nova conta." O endereço do e-mail difere em uma letra do de sempre. Seu gerente diz: "Paga logo, senão atrasa."','Um e-mail, que parece ser de um fornecedor da empresa que você atende, diz: "Atualizamos nossos dados bancários. Pague o boleto de R$ 18.400 de sexta na nova conta." O endereço do e-mail difere em uma letra do de sempre. A dona diz: "Paga logo, senão atrasa."'),lei:'A fraude por e-mail falso, conhecida como "golpe do falso fornecedor", configura estelionato (Código Penal, art. 171), e as empresas devem adotar medidas de segurança da informação (LGPD, art. 46, no que envolve dados pessoais). A regra de controle interno é simples: mudança de dados bancários só vale depois de confirmada por um canal já conhecido, como o telefone do cadastro, com a conferência de uma segunda pessoa.',o:[o("Pagar o boleto na nova conta",{c:-6,e:-3},"O dinheiro foi para a conta de um golpista, e o fornecedor de verdade cobrou o boleto original. A empresa pagou duas vezes, e o setor financeiro ficou sob suspeita."),o("Responder ao e-mail pedindo confirmação",{c:-3,a:-1},"Quem respondeu foi o golpista, que confirmou tudo com muita simpatia. Confirmar pelo mesmo canal suspeito não resolve."),o("Não pagar, confirmar por telefone, usando o número do cadastro, com o segundo responsável, avisar o TI e registrar a tentativa de golpe",{a:4,c:4,e:-3,peca:"Regra de dupla conferência de dados bancários"},"O fornecedor confirmou que não tinha mudado de conta. O TI bloqueou o remetente, e a empresa criou a regra da dupla conferência. O boleto original foi pago no prazo.")]},{t:"Pagar sem nota",c:[1],x:a=>'Um fornecedor de material de escritório oferece 10% de desconto se o pagamento for feito "sem nota". '+E(a,'O gerente comenta: "É dinheiro economizado. Vamos fechar."','A dona da loja comenta: "É dinheiro economizado. Fecha."'),lei:"O fornecedor tem o dever de emitir nota fiscal, e deixar de fazê-lo é crime contra a ordem tributária (Lei 8.137/1990, art. 1º, V). Para quem compra, a compra sem nota não comprova a despesa, não dá garantia e pode gerar autuação e perda de dedução fiscal. O desconto pode ser negociado, mas com nota.",o:[o("Aceitar o desconto sem nota",{c:-4,e:-1},"Seis meses depois, a impressora comprada sem nota estragou, e não havia como acionar a garantia. A despesa também não entrou na contabilidade."),o("Exigir a nota fiscal e negociar o desconto à vista por escrito",{a:3,c:3,e:-1},"O fornecedor reclamou, mas deu 5% de desconto com nota. Você guardou a nota e a proposta, e a contabilidade agradeceu."),o("Aceitar e pedir apenas um recibo simples",{c:-2,a:1},"O recibo ajuda, mas não substitui a nota fiscal. A despesa ficou sem o documento correto.")]},{t:"Cortar sem desmontar",d:1,x:a=>E(a,"A diretoria avisa que o custo do semestre estourou 12% e pede propostas de corte até sexta. Você prepara o material do financeiro.","Uma empresa que você atende avisa que o custo do semestre estourou 12% e pede propostas de corte até sexta. Você prepara o material do financeiro."),nota:"Um corte bem feito começa separando o que é fixo (aluguel, folha, contratos) do que é variável (viagens, horas extras, compras), olhando o impacto no caixa e no clima da equipe. Renegociar com fornecedores e rever prioridades costuma doer menos que demitir. Mudanças em salário e benefícios dependem da lei e de acordo, e não podem ser impostas só pela empresa (CLT, art. 468).",o:[o("Cortar o treinamento da equipe e congelar contratações",{c:-1,a:-2,e:-4},"O caixa melhorou, mas a equipe ficou sem treinamento, e as vagas abertas sobrecarregaram quem ficou. A rotatividade subiu no semestre seguinte."),o("Renegociar contratos de fornecedores, rever a rotina de compras e adiar viagens e compras não urgentes",{a:4,c:3,s:3,e:-4},"Em duas semanas, três contratos foram renegociados e dois, cancelados. A economia chegou a 9%, sem afetar a equipe nem os benefícios."),o("Cortar as horas extras e as viagens e esperar o próximo trimestre",{c:-1,s:1,e:-3},"A economia foi de 4%. A meta ficou pela metade, e a diretoria voltou a pedir cortes em setembro.")]},{t:"A viagem do fornecedor",c:[2],x:a=>'Você coordena uma cotação de R$ 120 mil em equipamentos. Um dos fornecedores te oferece um fim de semana em um resort, "para conversar com calma", e deixa claro que espera ser lembrado. '+E(a,"O seu gerente nem sabe.","O cliente nem sabe."),lei:"Receber vantagem pessoal de um fornecedor para favorecê-lo é ato de improbidade e pode justificar a demissão por justa causa (CLT, art. 482, a), além de prejudicar a empresa, que pode pagar mais caro. As empresas sérias exigem pelo menos três cotações, registro por escrito dos critérios e declaração de conflito de interesses. Em compras públicas, a Lei 12.846/2013 pune as empresas que oferecem vantagens indevidas.",o:[o("Aceitar a viagem: é só um fim de semana, e o preço dele é competitivo",{grave:1,c:-10,e:-2},"O concorrente perdeu a cotação, desconfiou e denunciou ao canal de conduta. A viagem apareceu nas redes, e o caso ficou registrado como incidente grave no seu nome."),o("Aceitar a viagem e não contar a ninguém",{c:-5,a:-1},"O fornecedor mudou de tom nas negociações seguintes, e o preço dele subiu. Você ficou na posição de quem deve um favor."),o("Recusar, comunicar ao gestor ou ao canal de conduta e manter a cotação com três propostas, com os critérios registrados por escrito",{c:4,a:4,e:-2,peca:"Cotação com três propostas e critérios registrados"},"O fornecedor recuou, a cotação seguiu com critérios claros, e a empresa fechou um contrato 8% mais barato que o previsto.")]},{t:"A entrega que não chega",c:[1],tag:"cons",x:a=>"Uma cliente comprou uma estante com entrega prometida em 7 dias. Faz 20, e a transportadora não responde. "+E(a,'O gerente diz: "Manda uma mensagem pedindo mais uns dias, sem falar do atraso."','O dono da loja diz: "Manda uma mensagem pedindo mais uns dias, sem falar do atraso."'),lei:"A oferta obriga o fornecedor, que deve cumprir o prazo anunciado. Se não cumprir, o consumidor pode exigir o cumprimento, aceitar outro produto equivalente ou desfazer a compra, com restituição imediata do que pagou (CDC, arts. 30 e 35). O consumidor também tem direito à informação clara sobre o que está acontecendo (art. 6º, III).",o:[o("Pedir mais dias sem explicar o atraso",{c:-4,e:-2},"A cliente percebeu, registrou a reclamação no Procon e postou a conversa. A empresa foi obrigada a devolver o valor, e o atendimento ficou desgastado."),o("Informar o atraso com a data real e oferecer três opções: aguardar, trocar por produto equivalente ou cancelar com devolução integral",{a:3,c:4,e:-3,peca:"Modelo de resposta a atraso de entrega"},"A cliente escolheu esperar mais três dias, e a estante chegou. Ela elogiou a franqueza e voltou a comprar no mês seguinte."),o("Deixar a conversa parada até a transportadora responder",{c:-3,a:-1},"Sem resposta por dez dias, a cliente cancelou o pedido e pediu o dinheiro de volta pelo cartão, com contestação.")]},{t:"A caixa de 40 quilos",c:[1],x:a=>"No armazém, um colega levanta caixas de 40 kg sozinho para ganhar tempo, e outro opera a empilhadeira sem ter feito o curso. "+E(a,'O supervisor diz: "Precisa entregar hoje, depois a gente vê isso."','O dono da empresa diz: "Precisa entregar hoje, depois a gente vê isso."'),lei:"A empresa deve cumprir e fazer cumprir as normas de segurança e medicina do trabalho (CLT, art. 157). A NR-11 exige que o operador de empilhadeira seja treinado, habilitado e autorizado, e a NR-17 trata da ergonomia, incluindo o transporte manual de cargas. Um acidente nessas condições pode gerar indenização, responsabilização da empresa e de quem autorizou, além de risco de vida para o trabalhador.",o:[o("Seguir: o prazo manda",{c:-5,e:-2},"Duas semanas depois, o colega que levantava as caixas teve uma lesão na coluna. A empresa foi autuada, e a falta de treinamento apareceu no relatório."),o("Interromper o uso da empilhadeira até o curso, organizar o transporte com carrinho e em dupla e avisar o supervisor e a área de segurança do trabalho",{a:4,c:4,e:-4,peca:"Procedimento de movimentação segura de cargas"},"A entrega atrasou meio dia, mas ninguém se machucou. O curso foi marcado para a semana seguinte, e o procedimento passou a valer para todos os turnos."),o("Pedir ao colega que tome cuidado e siga o trabalho",{c:-3,a:-1},"Cuidado não substitui treinamento e equipamento. O risco continuou lá, e a mesma cena se repetiu no turno da noite.")]},{t:"A lista dos clientes antigos",c:[0],tag:"dados",x:a=>'O comercial quer mandar, por WhatsApp, uma promoção de Black Friday para 3 mil clientes que compraram há cinco anos. Também pedem para incluir os contatos de quem pediu orçamento e não comprou. "É só aproveitar o cadastro."',lei:"A LGPD exige que o uso dos dados pessoais tenha uma finalidade e uma base legal compatíveis com o motivo da coleta (Lei 13.709/2018, arts. 6º e 7º), que o titular seja informado (art. 9º) e que possa pedir para sair da lista (art. 18). Contatos coletados há muito tempo, para outra finalidade, pedem cuidado redobrado: o melhor é enviar só a quem aceitou receber comunicações e deixar a opção de sair em toda mensagem.",o:[o("Verificar a base legal, separar quem aceitou receber comunicações, remover quem pediu para sair e incluir a opção de sair em toda mensagem",{a:5,c:4,e:-3,peca:"Regra de uso da base de contatos para campanhas"},"A lista caiu para 1.100 contatos, mas a resposta à promoção foi três vezes maior do que a do ano anterior. A empresa passou a registrar o aceite no cadastro."),o("Disparar para todos: o cadastro é da empresa",{c:-6,a:-1,e:-2},'Vários clientes responderam: "Como vocês conseguiram o meu número?". Um deles registrou reclamação na ANPD, e a empresa culpou o comercial.'),o("Disparar só por e-mail, para todos",{c:-3,a:1},"Mudar de canal não muda a base legal. Os clientes continuaram recebendo mensagens que não esperavam.")]},{t:"O cancelamento que nunca acaba",c:[2],tag:"cons",x:a=>'Um cliente quer cancelar uma assinatura anual. A política da empresa diz: "Só cancela por carta registrada, e a multa é de 50% do valor restante." O atendimento avisa que estão perdendo muitos clientes por isso.',lei:"Cláusulas que colocam o consumidor em desvantagem exagerada, como obstáculos ao cancelamento e multas desproporcionais, podem ser consideradas abusivas (CDC, art. 51). Para os serviços regulados pelo governo federal, o Decreto 13.135/2026 sobre o atendimento ao consumidor (SAC), que substituiu o Decreto 11.034/2022, determina que o cancelamento possa ser pedido pelos mesmos meios usados na contratação, sem exigir outro canal, e produza efeito imediato (art. 20). Reter o cliente com burocracia piora a reputação e gera ações.",o:[o("Manter a regra: está no contrato",{c:-4,e:-2},"O cliente foi ao Procon, e a empresa teve de cancelar sem multa. A história foi parar em uma reportagem local sobre cancelamentos difíceis."),o("Pedir que o cliente ligue de novo na semana que vem",{c:-3,a:-1},"Sem solução, o cliente voltou a ligar três vezes e acabou registrando reclamação formal."),o("Permitir o cancelamento pelo mesmo canal da contratação, com efeito imediato, e propor ao jurídico rever a multa e a cláusula",{a:4,c:4,e:-3,peca:"Fluxo de cancelamento pelo mesmo canal da contratação"},"O cancelamento saiu em um dia. Com a multa revisada, a empresa perdeu menos clientes e passou a receber elogios no atendimento.")]},{t:"A foto da confraternização",c:[1],tag:"autor",x:a=>'No fim do ano, a empresa fez uma confraternização, e a assessoria quer publicar no Instagram e em um vídeo do ano as fotos de todos os colaboradores, incluindo a equipe de atendimento e uma estagiária de 17 anos. "Todo mundo estava feliz."',lei:"A imagem de uma pessoa é um direito dela, e usar o rosto em divulgação da empresa exige autorização, de preferência por escrito (Constituição, art. 5º, X; Código Civil, art. 20). Se alguém reclamar, a indenização independe de prova de prejuízo (Súmula 403 do STJ). Para menores de 18 anos, a autorização é dada pelos responsáveis. A LGPD também se aplica a foto e nome (arts. 6º e 7º).",o:[o("Publicar tudo: foi um evento da empresa",{c:-5,e:-2},"Duas colaboradoras pediram a retirada, e a estagiária contou que a mãe não tinha sido avisada. A empresa apagou as fotos e se explicou."),o("Pedir autorização por escrito a cada pessoa, com o responsável assinando no caso da estagiária, e publicar só as fotos de quem aceitou",{c:4,a:3,e:-2,peca:"Termo de autorização de uso de imagem de colaboradores"},"Trinta e duas pessoas aceitaram, e o responsável assinou pela estagiária. O vídeo saiu com menos rostos, mas sem nenhum risco."),o("Publicar só as fotos de quem não reclamou",{c:-3,a:-1},"Não reclamar não é autorizar. Quem não viu o aviso também não podia reclamar, e a estagiária continuou exposta sem autorização.")]}],emp=a=>clt(a)?"a empresa":"a empresa que você atende",ALEA={mei:{t:"Só com nota fiscal",d:1,q:a=>!clt(a)&&!a.p.mei,x:a=>"Uma empresa da região quer fechar um pacote de quatro rotinas administrativas por mês com você, mas só contrata fornecedor que emite nota fiscal. Hoje você trabalha só com o CPF.",nota:'Quem presta serviço por conta própria e quer emitir nota precisa de CNPJ. O MEI, que paga um valor fixo por mês, só vale para as ocupações da lista oficial, e a maior parte dos serviços administrativos (como assistente ou auxiliar administrativo) não consta nela; entre as que constam, há por exemplo o digitador independente. Confira a sua atividade no Portal do Empreendedor antes de abrir. Se ela não constar, o caminho usual é uma microempresa (ME) no Simples Nacional, que exige contador, paga imposto sobre o faturamento (a alíquota depende do anexo e do "fator R"; no jogo, usamos 6%) e o INSS do pró-labore. Em troca, você emite nota, atende empresas e contribui para a aposentadoria.',o:[{l:"Abrir uma ME no Simples Nacional, com contador, esta semana",f:a=>(a.p.mei=1,{s:6,c:2,e:-3,r:"Com a ajuda de um contador, a empresa saiu em poucos dias. A partir de agora, saem todo mês o contador, o INSS do pró-labore e o imposto sobre o que você fatura, com trabalho ou sem. Em troca, mais empresas podem te contratar."})},o("Continuar com CPF e procurar clientes que aceitem recibo",{e:2,s:-3},"Sem custo fixo, mas com menos portas abertas. Algumas empresas nem respondem quando você diz que não emite nota."),o("Abrir como MEI em uma atividade diferente da que você faz, só para emitir nota",{c:-6,s:-2},"Registrar uma atividade diferente da que você de fato exerce não resolve: a nota saiu com uma descrição que não bate com o serviço, a empresa estranhou e desistiu. Quem exerce atividade fora da lista corre o risco de ser desenquadrado do MEI.")]},pj:{t:"Contrato de PJ com horário",c:[2],q:a=>!clt(a),x:a=>'Uma empresa quer te contratar como PJ para um "trabalho fixo" de assistente administrativo: entrar às 9h, sair às 18h, seguir a chefia direta da gerente e não atender mais ninguém. O pagamento é de R$ 2.800 por mês, sem 13º, sem férias e sem FGTS. Você precisaria abrir uma empresa para emitir a nota.',lei:'A contratação de autônomo é legítima quando cumpridas as formalidades legais, mesmo com exclusividade (CLT, art. 442-B). Mas só vale se houver autonomia de fato: com horário fixo, chefia direta, ordens pessoais e habitualidade, o contrato pode ser reconhecido como emprego, mesmo que o papel diga "PJ" (CLT, arts. 3º e 9º). A orientação dos tribunais sobre esse tema muda com frequência: confira sempre a versão vigente.',o:[o('Aceitar: o valor parece bom, e os direitos você "resolve depois"',{d:300,e:-5,c:-2},"O valor parecia bom no primeiro mês, mas na conta não entram 13º, férias nem FGTS, e a empresa pode encerrar o contrato a qualquer momento, sem direito a nada. Você ficou sem folga, sem reserva e sem cobertura."),o("Recusar na hora e encerrar a conversa",{e:2,s:-2},"Sem reunião, sem proposta e sem relação. A empresa procurou outra pessoa, e você ficou sem a oportunidade e sem saber como ela podia ter sido ajustada."),o("Propor duas saídas: ser registrada como empregada ou fechar um contrato de serviço por rotina, com escopo, prazo e liberdade de horário",{c:3,a:2,e:-2},"A empresa preferiu o contrato por rotina, com prazo e liberdade de horário. Ficou claro o que cada um devia, e você manteve o direito de atender outros clientes.")]},ferias:{t:"As férias que ninguém marca",ar:0,c:[1],x:a=>'Uma empregada está há 22 meses sem férias, e o gestor pede que você "empurre" por mais seis meses: "Ela nem pediu."',lei:"O empregado tem direito a 30 dias de férias a cada 12 meses de trabalho, e a empresa deve concedê-las nos 12 meses seguintes (CLT, arts. 129 e 134), avisando com pelo menos 30 dias de antecedência (art. 135). Férias concedidas depois do prazo devem ser pagas em dobro (art. 137). Vender parte das férias é permitido só até um terço, por escolha do empregado (art. 143).",o:[o("Empurrar: ela não pediu",{c:-4,e:-1},"Quatro meses depois, o prazo venceu. A empresa teve de pagar as férias em dobro, e a empregada pediu demissão sem explicar."),o("Programar as férias dentro do prazo, avisar a empregada com 30 dias de antecedência e planejar a cobertura da área",{c:4,a:3,e:-3,peca:"Controle de vencimento de férias"},"A empregada tirou as férias em março, a cobertura foi combinada com a equipe, e a área funcionou normalmente. O controle de vencimentos virou rotina do pessoal."),o("Pagar as férias em dinheiro, sem a empregada se afastar",{c:-3,a:-1},"O abono permite vender só um terço das férias, e por vontade do empregado. Pagar tudo sem descanso não cumpre a lei.")]},rescisao:{t:"A rescisão que atrasa",ar:0,c:[2],x:a=>"Um empregado pediu demissão. "+E(a,"O gerente","O dono da loja que você atende")+' diz: "Paga a rescisão quando o caixa melhorar, no mês que vem."',lei:"As verbas da rescisão (saldo de salário, férias proporcionais, 13º proporcional e as demais que couberem) devem ser pagas em até 10 dias contados do término do contrato (CLT, art. 477, § 6º). O atraso gera multa equivalente a um salário do empregado (art. 477, § 8º). O que se faz é calcular as verbas na hora e discutir o parcelamento só se o empregado concordar.",o:[o("Esperar o mês que vem: o caixa manda",{c:-4,e:-2},"O empregado procurou o sindicato. A empresa pagou as verbas com a multa do atraso, e o gerente culpou o pessoal."),o("Pagar só o saldo de salário agora e o resto depois",{c:-3,a:-1},"Pagar parte não encerra a obrigação. As verbas restantes passaram do prazo, e a multa foi aplicada do mesmo jeito."),o("Calcular as verbas, pagar dentro de 10 dias e avisar o gestor do prazo e da multa por atraso",{a:4,c:3,e:-3,peca:"Calendário de prazos de rescisão"},"O gestor reclamou do desembolso, mas o pagamento saiu no prazo. O empregado agradeceu, e a empresa evitou a multa.")]},atestado:{t:"O atestado no mural",ar:0,c:[1],tag:"dados",x:a=>E(a,"O gerente","O dono da loja que você atende")+' pede que você cole no mural do corredor a lista de quem apresentou atestado no mês, "com o motivo, para ninguém dizer que faltou à toa."',lei:"Informações sobre saúde são dados pessoais sensíveis e têm proteção reforçada (LGPD, arts. 5º, II, e 11). O atestado serve para justificar a ausência, e o motivo médico é sigiloso: a empresa deve guardar o documento com acesso restrito ao pessoal e ao médico do trabalho, e registrar apenas a ausência justificada. Expor o motivo pode gerar indenização por dano moral.",o:[o("Colar a lista completa, com motivos",{c:-6,e:-2},"Uma empregada, cujo atestado era de tratamento sigiloso, descobriu a exposição no mural. A empresa foi processada por dano moral, e o episódio saiu do mural para o sindicato."),o("Guardar os atestados com acesso restrito ao pessoal, registrar só a ausência justificada e explicar ao gestor que o motivo é dado de saúde, protegido por lei",{a:4,c:4,e:-2,peca:"Regra de sigilo de atestados"},"O gestor aceitou ver só o número de faltas por equipe. O pessoal passou a guardar os atestados em uma pasta com acesso restrito, e as empregadas notaram a diferença."),o("Colar só nomes e datas, sem os motivos",{c:-2,a:1},"Sem motivo, a exposição é menor, mas a lista continua expondo quem faltou, sem necessidade, e quem leu passou a fazer suposições.")]},assedio:{t:"A reunião que humilha",ar:0,c:[1],x:a=>'Na reunião da equipe, o gerente diz a um assistente, na frente de todos: "Se você não aguenta o ritmo, devia vender doce na porta da escola." O assistente sorri sem graça, e ninguém diz nada.',lei:"Humilhações repetidas no trabalho podem configurar assédio moral, que dá direito a indenização por dano moral (Constituição, art. 5º, V e X; Código Civil, arts. 186 e 927; CLT, art. 223-B). Quem presencia pode apoiar a vítima, registrar o que viu e usar os canais da empresa, como RH, ouvidoria e sindicato, ou procurar o Ministério Público do Trabalho. Cobrar resultado é legítimo; humilhar a pessoa, não.",o:[o("Ficar quieto: não é com você, e o gerente decide a sua avaliação",{e:-3,c:-2},"Você saiu da reunião com um nó no estômago. Dois dias depois, o assistente pediu demissão sem explicar o motivo."),o("Procurar o assistente depois da reunião, perguntar como ele está e oferecer ajuda para registrar o ocorrido, com datas e testemunhas, no RH, na ouvidoria ou no sindicato",{c:3,s:2,e:-3},"Ele agradeceu e registrou a queixa. O RH conversou com o gerente, e a empresa passou a ter um canal de denúncia. Você ficou conhecida como alguém em quem se pode confiar."),o("Responder na hora, na frente de todos, defendendo o assistente e criticando o gerente",{c:-3,e:-2,s:1},"Você disse o que sentia, mas a reunião virou uma discussão entre vocês dois, e o problema do assistente ficou em segundo plano.")]},gravida:{t:"A gestante na lista",ar:0,c:[1],x:a=>'Uma empregada conta ao RH que está grávida, de dois meses, no mesmo dia em que o gerente decide cortar duas vagas. Ele diz: "Põe ela na lista. A gente acerta e pronto."',lei:"A empregada gestante tem estabilidade no emprego desde a confirmação da gravidez até cinco meses depois do parto, e a dispensa arbitrária ou sem justa causa é proibida (Ato das Disposições Constitucionais Transitórias, art. 10, II, b). O TST entende que o desconhecimento da gravidez pelo empregador não afasta o direito (Súmula 244). Se ela for dispensada, pode pedir reintegração ou indenização.",o:[o("Colocar o nome dela na lista: o gerente decidiu",{c:-5,e:-2},"A empregada procurou o sindicato, e a Justiça determinou a reintegração, com os salários do período. A empresa pagou duas vezes, e o corte de pessoal perdeu o sentido."),o("Tirar o nome da lista, explicar ao gerente a estabilidade da gestante e propor outros cortes ou a redução de custos em outras áreas",{c:4,a:3,e:-3,peca:"Checklist de dispensa: estabilidades"},"O gerente reclamou, mas aceitou ajustar a lista. O pessoal passou a conferir, antes de qualquer desligamento, se havia estabilidade (gestante, acidente de trabalho, representante da CIPA)."),o("Incluir e oferecer três meses de salário para ela concordar",{c:-3,a:-1},"A estabilidade é um direito garantido por lei, e um valor menor não a substitui. A empregada recusou e procurou a Justiça.")]},estagio:{t:"O estagiário que fecha o escritório",ar:0,c:[2],x:a=>"Na empresa"+E(a,""," que você atende")+', o estagiário de 17 anos, aluno de um curso técnico, trabalha oito horas por dia, de segunda a sábado, abre e fecha o escritório sozinho e cobre a licença de um empregado. Ele pergunta a você: "Isso é normal?"',lei:"O estágio é um ato educativo, e não um emprego barato: exige termo de compromisso, supervisor, seguro contra acidentes, jornada compatível com a escola, de no máximo 6 horas por dia e 30 por semana para a educação profissional de nível médio e o ensino superior, e recesso (Lei 11.788/2008, arts. 3º, 9º, 10 e 13). Quando as regras não são cumpridas, o estágio pode ser reconhecido como emprego (art. 15). Para quem tem menos de 18 anos, valem também as regras de proteção ao adolescente (Constituição, art. 7º, XXXIII).",o:[o("Dizer que é assim mesmo: todo mundo começou assim",{c:-3,e:-1},"Ele continuou na mesma rotina até o fim do semestre. Faltou à prova final por cansaço e perdeu o semestre."),o("Não se meter: não é problema seu",{c:-1,e:1},"Você evitou o desconforto, e ele continuou sozinho. Em novembro, desistiu do estágio e da área."),o("Mostrar a ele as regras do estágio, sugerir que converse com a escola e dizer à gestão o que as regras exigem de jornada, supervisão e termo de compromisso",{a:2,c:4,e:-3},"A gestão se assustou, ajustou a jornada para 6 horas e designou uma supervisora. O estagiário passou a aprender de verdade, e a empresa evitou uma ação trabalhista.")]},folhavazou:{t:"A folha no grupo geral",ar:0,c:[0],tag:"dados",x:a=>'Ao enviar o resumo da folha, um colega manda a planilha completa, com nome, CPF, salário, pensão alimentícia e atestados de 85 empregados, para o grupo "Geral" de WhatsApp da empresa. Você percebe dois minutos depois.',lei:"A LGPD exige medidas de segurança para proteger os dados pessoais (art. 46) e, se houve acesso indevido que possa causar risco ou dano relevante aos titulares, o controlador deve avaliar a comunicação à ANPD e aos titulares (art. 48; Resolução CD/ANPD 15/2024). O primeiro passo é conter: apagar a mensagem para todos, pedir que quem abriu apague a cópia e avisar o responsável. A empresa decide, com o encarregado ou o jurídico, quem precisa ser avisado.",o:[o("Apagar a mensagem para todos, pedir que quem abriu apague a cópia, avisar o responsável e, com o encarregado de dados ou o jurídico, avaliar a comunicação aos titulares",{a:4,c:4,e:-4,peca:"Roteiro de resposta a vazamento de dados"},"Doze pessoas já tinham aberto o arquivo, mas todas apagaram e confirmaram. A empresa avisou os titulares e criou um roteiro de resposta. A rapidez fez diferença."),o("Apagar a mensagem e não contar a ninguém",{c:-5,a:-1,e:-2},"Alguém tinha tirado print, e o arquivo apareceu em uma conversa de fora da empresa. Os empregados nunca foram avisados, e a empresa teve de se explicar pela omissão."),o("Avisar no grupo para ninguém abrir o arquivo",{c:-2,a:1},"O aviso chamou a atenção para o arquivo, e mais gente abriu. A mensagem original continuou lá, com os dados expostos.")]},caixa2:{t:"O dono e o caixa da empresa",ar:1,c:[2],x:a=>E(a,"O dono","O dono da empresa que você atende")+' pede: "Paga a escola dos meus filhos com o dinheiro da empresa e lança como material de escritório, que é mais fácil."',lei:"A empresa e o dono são pessoas diferentes, e misturar as contas é um problema: pode levar à desconsideração da personalidade jurídica, em que o patrimônio pessoal do sócio responde pelas dívidas (Código Civil, art. 50). Lançar despesa pessoal como despesa da empresa pode configurar falsidade e crime contra a ordem tributária (Código Penal, art. 299; Lei 8.137/1990, art. 1º), a depender do caso. O caminho legal é registrar como retirada do sócio (pró-labore ou distribuição de lucros, conforme o caso), com orientação do contador.",o:[o("Lançar como material de escritório, como pedido",{grave:1,c:-10},"A fiscalização encontrou a despesa na auditoria, e o contador, que tinha assinado o balanço, afastou-se do caso. O lançamento era falso, e o caso ficou registrado como incidente grave no seu nome."),o('Lançar como "adiantamento" e acertar depois, sem registro',{c:-5,a:-1},"Sem registro, o adiantamento nunca foi acertado, e a contabilidade ficou com uma conta que não fechava. O contador pediu para esclarecer a origem."),o("Registrar como retirada do sócio, conforme a orientação do contador, e explicar ao dono a separação entre as contas da empresa e as pessoais",{a:4,c:4,e:-3,peca:"Regra de separação entre contas da empresa e pessoais"},"O dono resmungou, mas entendeu. O contador definiu o pró-labore e a distribuição de lucros, e as contas passaram a bater no fim do mês.")]},cobranca:{t:"A cobrança que humilha",ar:1,c:[1],tag:"cons",x:a=>E(a,"O gerente","O dono da loja que você atende")+' sugere, para cobrar uma cliente atrasada: "Liga todo dia às 7h e manda a lista de devedores pelo grupo da empresa, para ela sentir vergonha."',lei:"Na cobrança de débitos, o consumidor inadimplente não pode ser exposto a ridículo, nem submetido a constrangimento ou ameaça (CDC, art. 42), e a infração é crime (art. 71). Expor o nome de devedores em grupo também viola a LGPD (arts. 6º e 46). O caminho é cobrar por canal e horário razoáveis, com valor, prazo e opção de parcelamento por escrito.",o:[o("Fazer como pedido: ela deve",{c:-5,e:-2},"A cliente gravou as ligações e levou as mensagens ao Procon. A empresa foi multada, e a cobrança acabou sendo feita por advogado, a um custo maior."),o("Cobrar por canal e horário razoáveis, com valor e prazo por escrito, oferecer parcelamento e não expor o nome dela",{a:3,c:3,e:-2},"A cliente respondeu em dois dias e fechou o parcelamento em três vezes. A empresa recebeu sem desgaste e manteve a cliente."),o("Cobrar só por uma mensagem pública no perfil da empresa",{c:-4,a:-1},"Expor a cliente em público é o que a lei proíbe. A mensagem foi apagada, e ela registrou reclamação.")]},planilha:{t:'O programa "crackeado"',ar:1,c:[2],tag:"autor",x:a=>'O contador sugere usar uma versão "crackeada" de um programa de planilhas e de gestão financeira, "que é igual e não paga licença". A empresa'+E(a,""," que você atende")+" tem 8 computadores.",lei:"O programa de computador é protegido por lei, e o uso depende de licença (Lei 9.609/1998, art. 9º). Violar os direitos do autor de um programa, como usar cópias sem licença, é crime, com pena de detenção ou multa, e a pena aumenta quando há reprodução para vender (art. 12). Além disso, programas piratas costumam trazer vírus e deixam a empresa sem suporte. O caminho é comprar a licença ou usar alternativas livres ou gratuitas, com licença adequada.",o:[o("Instalar nos 8 computadores",{c:-5,e:-2},"Seis meses depois, uma denúncia anônima levou a uma fiscalização. A empresa teve de pagar as licenças e uma indenização, e um vírus já tinha comprometido dois computadores."),o("Instalar em só 2 computadores, para testar",{c:-3,a:-1},"Dois computadores sem licença continuam sendo uso sem licença. Os dados financeiros ficaram nos computadores mais expostos."),o("Levantar os programas essenciais, comprar a licença ou usar alternativas livres ou gratuitas com licença adequada, e guardar os comprovantes",{a:4,c:3,s:2,e:-2,peca:"Inventário de programas e licenças"},"O levantamento mostrou que só dois programas eram essenciais. A empresa comprou as licenças, adotou uma alternativa livre para o resto e guardou os comprovantes.")]},boletos:{t:"Dois boletos e um caixa",ar:1,d:1,x:a=>"Vencem amanhã um boleto de R$ 8 mil de um fornecedor importante e o imposto do mês, de R$ 6 mil. O caixa tem R$ 9 mil, e o dinheiro de um cliente só entra na semana que vem.",nota:"Tributo pago com atraso gera multa e juros, e em alguns casos restrições para a empresa. O atraso com um fornecedor gera juros previstos em contrato e abala a relação. Em caso de aperto, vale priorizar, negociar por escrito antes do vencimento e antecipar recebimentos, em vez de deixar vencer sem avisar.",o:[o("Pagar o fornecedor e deixar o imposto atrasar uns dias",{c:-1,a:-1,e:-2},"O fornecedor ficou satisfeito, mas o imposto saiu com multa e juros. A diretoria perguntou por que um custo evitável foi pago."),o("Pagar o imposto e negociar, por escrito, 10 dias com o fornecedor",{a:3,c:2,e:-3},"O fornecedor aceitou o novo prazo, com juros pequenos. Você aprendeu que negociar antes do vencimento custa menos do que atrasar sem avisar."),o("Pedir à diretoria um adiantamento de um cliente e pagar os dois",{s:3,c:1,e:-4},"O cliente aceitou antecipar com um pequeno desconto, e os dois boletos foram pagos no dia. Ficou um desconto a mais no custo do mês.")]},cunhado:{t:"O fornecedor da família",ar:2,c:[1],x:a=>"A empresa"+E(a,""," que você atende")+" precisa contratar uma transportadora. A melhor proposta está empatada com a da transportadora do cunhado "+E(a,"do seu gerente","do dono")+', que diz: "Fecha com a do meu cunhado. Depois eu resolvo."',lei:"Ter interesse pessoal em uma contratação da empresa é conflito de interesses. Favorecer um parente sem critério pode ser ato de improbidade e justificar demissão por justa causa (CLT, art. 482, a), e prejudica a empresa, que pode pagar mais caro ou receber pior serviço. O caminho é registrar a relação, comparar as propostas com os mesmos critérios e levar a decisão a mais de uma pessoa.",o:[o("Fechar com a do cunhado: a decisão é dele",{c:-4,e:-2},"O serviço foi mais caro do que a proposta concorrente. Quando um colega comparou os valores, o parentesco veio à tona, e você estava no meio do processo."),o("Registrar o parentesco, manter a comparação técnica com os mesmos critérios para todos e levar a decisão a mais de uma pessoa",{a:4,c:4,e:-2,peca:"Declaração de conflito de interesses em compras"},"A comparação mostrou que a outra proposta era 6% melhor. A decisão foi tomada em comitê, e o gestor, vendo o registro, não reclamou."),o("Fechar com a do cunhado e não registrar o parentesco",{c:-5,a:-1},"Esconder o parentesco piorou a situação: quando veio à tona, o ocultamento pareceu favorecimento deliberado.")]},devolucao:{t:"O liquidificador de dez dias",ar:2,c:[1],tag:"cons",x:a=>'Uma cliente comprou um liquidificador que parou de funcionar em 10 dias. A loja diz que "a troca só vale em 7 dias". Ela veio com a nota e muita paciência.',lei:"Quando o produto tem vício (defeito de qualidade), o fornecedor tem 30 dias para consertá-lo. Se não conseguir, o consumidor pode escolher entre a troca por outro produto, a devolução do dinheiro ou o abatimento do preço (CDC, art. 18). O prazo de 7 dias vale para o arrependimento de compra feita fora da loja (art. 49), e não para defeito.",o:[o("Negar a troca: já passou o prazo",{c:-4,e:-2},"A cliente registrou reclamação no Procon, e a loja teve de devolver o valor, com a fama de não cumprir o que a lei garante."),o("Encaminhar o aparelho à assistência técnica (até 30 dias para consertar) e, se não for resolvido, oferecer troca, devolução do valor ou abatimento, à escolha dela",{a:3,c:4,e:-2},"O conserto saiu em duas semanas. A cliente, que esperava briga, elogiou o atendimento e voltou a comprar."),o("Oferecer um vale-compra de 50% do valor",{c:-3,a:-1},"Um vale parcial não substitui o direito de escolher entre a troca, a devolução e o abatimento. A cliente recusou e foi ao Procon.")]},validade:{t:"A etiqueta de validade",ar:2,c:[2],tag:"cons",x:a=>'Chega ao depósito um lote de alimentos que vence em 10 dias. O encarregado propõe: "Troca a etiqueta de validade, e a gente vende até acabar."',lei:"Produtos com prazo de validade vencido são impróprios para consumo (CDC, art. 18, § 6º, I), e vender mercadoria imprópria é crime (Lei 8.137/1990, art. 7º, IX). Alterar a data da etiqueta é fraude e coloca a saúde do consumidor em risco. Produtos perto do vencimento podem ser vendidos com desconto, desde que a validade seja informada com clareza.",o:[o("Trocar a etiqueta e vender até acabar",{grave:1,c:-10},"Um cliente passou mal, e a vigilância sanitária encontrou o lote com a data adulterada. O estabelecimento foi autuado, e o caso ficou registrado como incidente grave no seu nome."),o("Vender sem desconto, no lugar de sempre, torcendo para sair antes",{c:-2,a:-1},"Parte do lote venceu na prateleira, e o desperdício foi maior do que o desconto teria sido."),o("Manter a etiqueta original, vender com desconto e a validade bem visível e retirar e descartar com registro o que vencer",{a:4,c:3,e:-2,peca:"Procedimento de produtos próximos do vencimento"},"Com o desconto e o aviso, 90% do lote saiu antes do vencimento. O restante foi descartado com registro, e o procedimento passou a valer para todos os lotes.")]},estoque:{t:"O lote com 20% de desconto",ar:2,d:1,x:a=>"O fornecedor oferece 20% de desconto na compra de um lote para seis meses. O caixa está apertado, e o espaço no armazém dá para três meses.",nota:"Comprar em volume reduz o preço da unidade, mas aumenta o capital parado, o custo de armazenagem e o risco de perda. Um bom comprador compara o desconto com o custo do dinheiro e do espaço, e negocia entrega parcelada, em vez de aceitar tudo de uma vez.",o:[o("Comprar o lote inteiro e aproveitar o desconto",{c:-1,a:1,e:-3},"O desconto foi ótimo, mas o caixa ficou apertado, e metade do lote ficou nos corredores por meses. Parte do material saiu de linha antes do uso."),o("Negociar um lote para três meses, com 12% de desconto e entrega parcelada",{a:3,c:2,s:2,e:-3},"O fornecedor aceitou. O desconto foi menor, mas o caixa ficou saudável, e o armazém não ficou lotado."),o("Não comprar e manter a compra mensal",{s:-1,e:1},"Você manteve o caixa, mas perdeu a chance de economizar. Dois meses depois, o preço subiu 8%.")]},propaganda:{t:"O melhor preço da cidade",ar:3,c:[1],tag:"cons",x:a=>'A campanha de outubro diz: "O melhor preço da cidade, garantido!" Ninguém comparou preços. '+E(a,"O gerente","O dono")+' diz: "É só slogan."',lei:'O anunciante deve manter os dados que sustentam a mensagem que divulga (CDC, art. 36, parágrafo único), e a publicidade enganosa, que induz o consumidor a erro, é proibida (art. 37, § 1º). Afirmações absolutas ("o melhor", "garantido") e comparações com concorrentes precisam de prova. Dizer exatamente o que é verdade, com a data da pesquisa, é o caminho seguro.',o:[o("Usar o slogan: todo mundo usa",{c:-5,e:-2},"Um concorrente comprovou preços menores em vários itens e denunciou o anúncio ao CONAR. A empresa teve de retirar a campanha e publicar a correção."),o('Pesquisar os preços em dez lojas, anunciar só o que dá para provar ("10 itens com preço menor que o de dois concorrentes, pesquisa de 3 de outubro") e guardar a pesquisa',{a:4,c:4,s:2,e:-3,peca:"Pesquisa de preços para campanhas"},"A campanha ficou mais específica e mais crível. A pesquisa ficou arquivada, e a empresa passou a atualizá-la a cada trimestre."),o('Usar o slogan com um asterisco: "conforme critérios da empresa"',{c:-3,a:-1},"O asterisco não corrige a mensagem principal, que é a única que quem passa pelo anúncio lê.")]},influenciador:{t:"O elogio espontâneo",ar:3,c:[1],tag:"cons",x:a=>'A empresa deu um kit de produtos a uma influenciadora local e quer que ela poste "um elogio espontâneo", sem aviso de parceria. O gestor diz: "Se avisar que ganhou, perde a graça."',lei:"A publicidade deve ser identificada como tal, de forma fácil e imediata (CDC, art. 36), e o Código do CONAR trata da identificação de publicidade feita por influenciadores. Receber produto ou dinheiro para divulgar e apresentar a divulgação como opinião própria engana o público. Parcerias podem ser mostradas, desde que a relação comercial fique clara desde o começo.",o:[o("Deixar a influenciadora postar sem aviso",{c:-5,e:-2},"Um seguidor perguntou nos comentários se era publicidade, e outro denunciou ao CONAR. A empresa e a influenciadora ficaram com a fama de enganar o público."),o('Combinar com a influenciadora uma identificação clara no início do post ("publicidade" ou "parceria paga") e usar a ferramenta de parceria da rede',{c:4,a:3,e:-2,peca:"Regra de identificação de publicidade com influenciadores"},"A publicação teve um alcance parecido, e ninguém reclamou. A empresa passou a pedir a identificação em todos os contratos."),o('Pedir que ela escreva "#publi" no fim do texto, entre outras hashtags',{c:-3,a:-1},"Escondida entre vinte hashtags, a identificação não é clara nem imediata. O público não viu, e a denúncia veio do mesmo jeito.")]},sorteio:{t:"Concorra a R$ 2 mil em compras",ar:3,c:[0],tag:"cons",x:a=>'A empresa quer um sorteio no Instagram: "comente, marque três amigas e concorra a R$ 2 mil em compras". Começa na sexta, e o gestor diz que o regulamento será "simples".',lei:"A promoção em que se distribuem prêmios por sorteio, vale-brinde ou concurso, a título de propaganda, depende de autorização prévia do governo federal (Lei 5.768/1971; hoje, pela Secretaria de Prêmios e Apostas do Ministério da Fazenda, no Sistema de Controle de Promoção Comercial, o SCPC). A análise leva em média cerca de 15 dias. Fazer a promoção sem autorização pode gerar multa e a suspensão da ação.",o:[o("Avisar que sorteio com prêmio exige autorização prévia, ajudar a pedi-la com antecedência e ajustar o calendário da ação",{c:4,a:3,e:-3},"O sorteio entrou no ar duas semanas depois, com o número da autorização no regulamento. O gestor se queixou do atraso e depois agradeceu a segurança."),o("Subir na sexta e regularizar depois",{c:-6,e:-2},"A fiscalização notificou a empresa por promoção sem autorização, e a ação foi suspensa no meio. Os participantes ficaram sem resposta, e a equipe ficou com o desgaste."),o('Chamar de "escolha aleatória" em vez de "sorteio"',{c:-4,a:-1},"Mudar o nome não muda a natureza da promoção. A fiscalização olha para o que a ação é, não para como é chamada.")]},depoimentos:{t:"Depoimentos que ninguém deu",ar:3,c:[2],tag:"cons",x:a=>"Para a página da campanha, "+E(a,"o gestor","o dono")+' pede que você escreva depoimentos de clientes, com nome e foto de banco de imagens: "Mariana, 34 anos: economizei 30% nas compras do mês." "Todo mundo faz."',lei:"Depoimentos inventados induzem o consumidor a erro e são publicidade enganosa (CDC, art. 37, § 1º). Fazer afirmação falsa ou enganosa sobre as características de um produto ou serviço é crime (CDC, art. 66). A plataforma também pode retirar a página e punir a conta. O caminho honesto é pedir o depoimento a clientes reais, com autorização para usar o nome e a foto.",o:[o("Escrever os depoimentos e escolher as fotos",{grave:1,c:-10},'Uma cliente reconheceu a foto de banco usada como "Mariana" em outro site, e a denúncia chegou ao Procon. Afirmar algo falso sobre um produto é crime, e o caso ficou registrado como incidente grave no seu nome.'),o('Escrever só três, "para começar"',{c:-5,a:-1},"Três depoimentos falsos também são falsos. A página foi denunciada e perdeu a credibilidade."),o("Recusar e propor pedir o depoimento a clientes reais depois de uma compra, com autorização para o uso do nome e da foto, e responder a todos os comentários",{c:4,a:3,e:-2,peca:"Rotina de coleta de depoimentos reais"},"Com o pedido no momento certo, em um mês a empresa tinha quarenta depoimentos reais. Eram menos bonitos, mas ninguém duvidou deles.")]},fotobanco:{t:"As fotos sem marca d'água",ar:3,c:[1],tag:"autor",x:a=>'O site novo da empresa vai usar fotos achadas em uma busca de imagens, "porque estavam sem marca d\'água". O prazo é de dois dias.',lei:"Fotografias são obras protegidas (Lei 9.610/1998, art. 7º, VII), e reproduzi-las exige autorização do fotógrafo ou de quem detém os direitos, com o crédito (arts. 29 e 79). A ausência de marca d'água não significa que a imagem seja livre. Bancos de imagem pagos ou gratuitos informam a licença, e imagens de pessoas podem exigir ainda a autorização de quem aparece.",o:[o("Usar as fotos: estavam sem marca d'água",{c:-5,e:-2},"Um mês depois, o fotógrafo notificou a empresa e pediu indenização. O site foi alterado às pressas, com as fotos trocadas."),o("Usar um banco de imagens com licença comercial (ou fotos próprias) e guardar o comprovante da licença",{a:3,c:3,e:-2,peca:"Banco de imagens licenciadas"},"O site saiu com imagens licenciadas, e a empresa guardou os comprovantes. A equipe passou a consultar o banco antes de procurar na internet."),o('Usar as fotos e escrever "fonte: internet" no rodapé',{c:-3,a:-1},"Citar a fonte não substitui a autorização. A notificação veio do mesmo jeito.")]},musica:{t:"Trinta segundos de música",ar:3,c:[1],tag:"autor",x:a=>'O vídeo institucional da empresa usa uma música famosa de fundo, "só 30 segundos". Vai para o site, as redes e uma tela da recepção.',lei:"As músicas têm autores e produtores protegidos (Lei 9.610/1998), e o uso em vídeo exige licença. Ser um trecho curto não dispensa a autorização, e a execução pública, como na tela da recepção, pode ainda exigir pagamento de direitos (arts. 29, 68 e 99). As plataformas oferecem bibliotecas de músicas licenciadas.",o:[o("Usar a música: são só 30 segundos",{c:-4,e:-2},"O vídeo foi bloqueado na rede social por uso de música sem licença, e a empresa recebeu uma cobrança da gravadora."),o("Trocar por uma música de biblioteca licenciada, guardar a licença e verificar a regra de execução pública para a tela da recepção",{a:4,c:3,e:-2,peca:"Biblioteca de músicas licenciadas"},"O vídeo ficou no ar sem bloqueio, e a licença foi arquivada. A empresa passou a pedir a licença em todo material de vídeo."),o("Diminuir o volume da música para ninguém notar",{c:-2,a:-1},"O volume não muda o fato do uso. O bloqueio veio do mesmo jeito.")]},acessivel:{t:"O botão que o leitor de tela não lê",ar:3,c:[0],tag:"acess",x:a=>'Um cliente cego escreve: "Não consigo fechar pedido no site da empresa: o botão de pagamento não é lido pelo leitor de tela, e o PDF do contrato é só uma imagem." O gestor pergunta se "dá para ignorar".',lei:"A Lei Brasileira de Inclusão exige que os sites mantidos por empresas com sede ou representação comercial no país sejam acessíveis à pessoa com deficiência (Lei 13.146/2015, art. 63). Na prática: navegação pelo teclado, rótulos nos botões e campos, contraste suficiente, texto alternativo nas imagens e documentos em formato que o leitor de tela consiga ler, seguindo as diretrizes internacionais (WCAG). Acessibilidade também ajuda quem está no celular ou com conexão ruim.",o:[o("Corrigir: rotular o botão, garantir a navegação pelo teclado, publicar o contrato em texto e testar com um leitor de tela",{a:4,c:4,e:-3,peca:"Site acessível, testado com leitor de tela"},"O site ficou melhor para todo mundo. O cliente fechou o pedido e agradeceu, contando que ia indicar a empresa."),o("Responder que a próxima versão do site será acessível",{c:-4},"O cliente compartilhou a resposta nas redes. A empresa perdeu a confiança dele e de outros, e a equipe foi cobrada na reunião."),o('Colocar só um botão de "alto contraste" no topo',{c:-1,a:1},"O botão ajudou um pouco, mas o botão de pagamento continuou sem rótulo, e o contrato, ilegível. Acessibilidade vai além do contraste.")]},iadados:{t:"A planilha no chat",c:[2],tag:"dados",x:a=>"Para ganhar tempo, você pensa em colar, no chat de uma ferramenta pública de inteligência artificial, a planilha de empregados (nome, CPF, salário e atestados) e pedir que ela monte o resumo da folha.",lei:"O que você cola em uma ferramenta de IA pode ser armazenado e processado fora do seu controle. Dados de empregados, inclusive de saúde, seguem a LGPD: só se compartilham com base legal, finalidade e medidas de segurança (Lei 13.709/2018, arts. 6º, 7º, 11 e 46). Use ferramentas autorizadas pela empresa, tire os dados pessoais (ou use só totais) e revise sempre o resultado: a responsabilidade pelo que sai é sua.",o:[o("Colar tudo: é só um chat",{c:-6,e:-2},"Semanas depois, a empresa descobriu que dados de empregados tinham sido enviados a uma ferramenta pública. Não houve prova de vazamento, mas a diretoria quis rever o contrato com o pessoal."),o("Não usar IA: é arriscado demais",{a:-2,e:-4},"Você montou o resumo à mão, e a folha saiu no último minuto. Segurança é importante, mas o risco se resolve com regras de uso, não com a recusa da ferramenta."),o("Usar só os totais por departamento (sem nome, CPF ou atestados), em uma ferramenta autorizada, e conferir cada número",{a:4,c:3,e:-1},"O resumo saiu em quinze minutos, sem expor nenhum empregado. Você ainda corrigiu um total que a IA tinha somado errado.")]},cliente:{t:"A empresa que não paga",d:1,q:a=>!clt(a),x:a=>'Uma empresa deve R$ 1.500 do último serviço. O financeiro responde só "estamos organizando os pagamentos". Faz 45 dias.',lei:"Quem presta serviço tem direito de cobrar o que combinou, e o contrato (ou ao menos as mensagens, a ordem de serviço e a nota fiscal) é a sua prova. Antes de ir à Justiça, há caminhos mais simples: notificação por escrito, acordo de parcelamento e protesto.",o:[o("Mandar uma notificação por escrito, com valor, prazo e as provas do serviço, e oferecer parcelar",{s:2,c:2,d:750,e:-3},"Em dez dias, o financeiro respondeu e parcelou em duas vezes. Você recebeu R$ 750 neste mês."),o("Ir à empresa todos os dias até pagarem",{e:-6,c:-2,d:250},'Pagaram R$ 250 para você parar de aparecer e disseram que o resto "vem quando vier". A empresa nunca mais te chamou.'),o("Esquecer a dívida e procurar clientes novos",{e:2,s:-2},'Você perdeu R$ 1.500 e ganhou tempo. Meses depois, a empresa contou a conhecidos que "nem foi cobrada".')]},curso:{t:"Curso de Excel e rotinas de pessoal",d:1,x:a=>"Abriu uma turma de 40 horas de Excel avançado e rotinas de departamento pessoal, com certificado, por R$ 480 (ou 4 × R$ 120).",o:[o("Fazer o curso completo, parcelado",{a:6,s:2,c:2,e:-5,parcela:{n:"Curso de Excel e rotinas de pessoal",v:120,q:4}},"Você passou cinco sábados aprendendo tabelas dinâmicas, fórmulas de folha e o básico de eSocial. Na semana seguinte, usou isso e economizou duas horas por dia."),o("Fazer só os módulos gratuitos da plataforma",{a:3,e:-2},"Mais barato e mais flexível, mas sem o certificado nem a prática com as ferramentas."),o("Deixar passar e descansar",{e:4},"Você dormiu melhor neste mês. A turma fechou as inscrições.")]},proprio:{t:"Seu próprio escritório de serviços",d:1,x:a=>"Você teve uma ideia: um escritório de serviços administrativos para pequenos comércios e profissionais liberais do bairro, com mensalidade fixa por pacote (contas a pagar, notas, folha e atendimento). Ninguém na região faz algo assim.",nota:"Quem monta um negócio próprio assume o risco: custo de sistema e de espaço, preço do pacote, captação de clientes, nota fiscal, contador e a privacidade dos dados dos clientes (a LGPD vale desde o primeiro cadastro). A vantagem é construir uma marca e uma carteira de clientes que são suas.",o:[{l:"Lançar este ano, testando com três clientes do bairro",f:a=>rng(a)<.6?{flag:"proprio",s:6,a:4,e:-6,d:300,peca:"Pacote de serviços administrativos próprio",r:"Em dois meses, oito comércios assinaram o pacote mensal. Uma associação de comerciantes pediu uma proposta para o ano seguinte."}:{flag:"proprio",a:5,s:2,e:-6,d:-150,peca:"Pacote de serviços administrativos próprio",r:"Só dois comércios assinaram, e vários pediram preço menor. O prejuízo foi pequeno, mas você aprendeu muito sobre precificar, vender e dizer não a pedido de desconto."}},o("Propor a ideia a um escritório de contabilidade, como sociedade",{s:4,a:3,d:150},"O escritório topou e ficou com parte da receita. Menos risco, menos ganho, e a marca do pacote é dele."),o("Guardar a ideia para quando tiver mais experiência",{e:3},"Você descansou. Em dezembro, viu um escritório de outra cidade anunciando algo parecido.")]},notebook:{t:"O notebook que trava",d:1,q:a=>!clt(a),x:a=>"O seu notebook trava toda vez que você abre uma planilha pesada com o sistema de folha ao mesmo tempo. Um modelo novo custa R$ 3.600 à vista ou 12 × R$ 360. Um técnico faz limpeza e troca de memória por R$ 350.",o:[o("Consertar com o técnico",{d:-350,a:1},"O notebook melhorou, mas ainda trava com as planilhas maiores. Dá para trabalhar, com paciência."),o("Parcelar o novo em 12 vezes",{parcela:{n:"Notebook novo",v:360,q:12},a:3,e:2},"São R$ 4.320 no total, R$ 720 a mais do que à vista, e a parcela vai pesar nos meses fracos. Em troca, o trabalho flui."),o("Aguentar mais um pouco",{e:-5,c:-2},"A planilha travou perto do prazo da folha, e você refez o trabalho à noite. A economia saiu cara.")]}},SELOS=[["Ano completo","Chegar a dezembro trabalhando na área administrativa",a=>!a.over],["Sem incidente grave","Passar o ano sem nenhum incidente grave registrado",a=>!a.grave],["Sabe as regras","Acertar todas as situações que têm resposta certa",a=>a.lei.n>0&&a.lei.ok===a.lei.n],["Dados protegidos","Acertar todas as situações de dados pessoais e segurança",a=>!!a.flags.ok_dados&&!a.flags.x_dados],["Direitos respeitados","Acertar todas as situações de direitos autorais, imagem e licenças",a=>!!a.flags.ok_autor&&!a.flags.x_autor],["Consumidor respeitado","Acertar todas as situações de consumidor e publicidade",a=>!!a.flags.ok_cons&&!a.flags.x_con
