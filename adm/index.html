in("")+"</ul>":"")+botoes(e)}case"vida":{const a=G.vd;return'<span class="rot">'+o+" · A vida acontece</span><h2>"+esc(a.t)+"</h2>"+ps(a.r)+(a.d.length?fichas(a.d):"")+(a.lei?'<div class="lei"><em>Na lei</em><span>'+esc(a.lei)+"</span></div>":"")+'<p class="rot">Aqui não havia escolha</p>'+botoes(e)}case"conv":{const a=G.cv,r=G.prazo;return'<span class="rot">'+o+' · Conversa de mentoria</span><h2>Uma conversa com a Dona Sônia</h2><div class="placa mal">Sinal de alerta</div>'+ps({c:'A Dona Sônia, gerente administrativa há 20 anos e professora convidada do seu curso, te chama para um café. "Ouvi de dois gestores que você anda escorregando nos prazos e nos detalhes. Confiança demora para fazer e pouco para perder."',s:'A Dona Sônia, gerente administrativa há 20 anos e professora convidada do seu curso, te chama para um café. "Faz semanas que você só olha para a sua mesa e não pergunta o que acontece nas outras áreas. Quem não enxerga a empresa inteira não consegue melhorar nada."',a:'A Dona Sônia, gerente administrativa há 20 anos e professora convidada do seu curso, te chama para um café. "Uma colega foi cobrir um serviço seu e achou a planilha confusa e cheia de erro: fórmula quebrada, lançamento duplicado, conferência pulada. Técnica se treina."'}[a]+"\n"+(r?"Ela te ajuda a montar um plano. "+NOMES_ST[a]+" volta para 20, e o combinado é terminar "+MES[r.ate].toLowerCase()+" com esse medidor em 20 ou mais. Se não der, talvez seja hora de dar uma pausa na carreira.":"O ano está acabando. Ela pede que você leve a conversa para o planejamento do ano que vem."))+'<div class="lei"><em>Vale saber</em><span>'+(clt(G)?"Mesmo com chefia, quem começa na empresa precisa de mentores de fora da própria área: colegas experientes, associações e professores ajudam a ver o que o dia a dia esconde.":"Quem presta serviço por conta própria não tem gerente para avisar quando algo vai mal. Colegas experientes, associações e professores da área fazem esse papel.")+"</span></div>"+botoes(e)}case"fim":return fim()}return""}function capa(){const a=carregar();return'<div class="capa"><span class="rot">Jogo de simulação · Técnico em Administração</span><h1>Um ano pelas <span>áreas</span> da empresa</h1><p class="lead">Você acaba de receber o diploma de técnico em administração e vive o primeiro ano de trabalho, em uma cidade do estado de São Paulo. Vínculo, porte das empresas, perfil, capital e experiência são sorteados. As escolhas são suas.</p><div class="abas" aria-hidden="true">'+abas()+'</div><label for="apelido">Seu apelido no jogo (opcional)<input type="text" id="apelido" maxlength="20" autocomplete="off" placeholder="Apelido"></label><div class="ops"><button class="op ir" data-x="novo">Sortear minha vida</button>'+(a&&"fim"!==a.f?'<button class="op" data-x="continuar"><kbd></kbd><span>Continuar de onde parei<small>'+esc(MES[a.m])+", mês "+(a.m+1)+" de 12</small></span></button>":"")+'</div><ul class="plano"><li>Dura de 20 a 30 minutos.</li><li>Você pode cair como empregado, em um programa de rodízio por áreas com carteira assinada, ou como prestador de serviços administrativos, cobrando por serviço. As regras, as contas e os riscos mudam de um para o outro.</li><li>A cada trimestre, você muda de mesa: pessoal (RH), financeiro, compras e logística, comercial e marketing. Em cada mês, você decide onde colocar a sua força, vê quantos serviços fechou e escolhe o que fazer com o que sobrou.</li><li>Cada mês traz uma situação de trabalho. Algumas têm resposta certa, pela lei e pela ética da profissão. Outras são dilemas, em que toda opção tem um custo.</li><li>As boas decisões viram procedimentos no manual do ano. A Visão é o que você entende da empresa inteira: quando ela cai, você só enxerga a sua mesa. Entre uma escolha e outra, a vida acontece: imprevistos e boas surpresas que você não controla.</li><li>No fim você recebe uma nota de 0 a 100 e os selos que conquistou.</li></ul>'+(CFG.form?'<div class="acesso"><p><strong>Docente:</strong> registre aqui cada turma em que aplicou o jogo.</p><a class="op" style="width:auto;text-decoration:none" href="'+esc(CFG.form)+'" target="_blank" rel="noopener"><span>Registrar aplicação</span></a></div>':"")+'<details><summary>Para quem está dando a aula</summary><div class="dentro"><p><strong>Registro de aplicações.</strong> A cada turma em que aplicar o jogo, use o botão “Registrar aplicação” desta capa: informe data, unidade, curso, turma e número de estudantes. Nenhum dado dos estudantes é coletado. Compartilhe sempre o link oficial; não copie nem hospede o jogo em outro endereço.</p><p><strong>Como usar.</strong> Cada estudante joga no próprio celular. As vidas são diferentes de propósito: quem tirou um filho pequeno, empresas pequenas e só R$ 200 na conta joga um ano mais apertado do que quem mora com a família, atende empresas grandes e começa com R$ 2.500. No fim, peçam que comparem o resultado, quanto receberam, os procedimentos do manual e o que escreveram nas quatro pausas, uma por área.</p><p><strong>Para a conversa depois.</strong> O que dependia de escolha e o que dependia do sorteio? O que mudou entre o empregado e o prestador de serviços, nas contas e nos riscos? Quais atividades administrativas cabem no MEI e quais exigem uma microempresa? Onde termina o dinheiro da empresa e começa o do dono? Que dado de empregado ou de cliente você guardaria com acesso restrito? Qual regra sobre publicidade, direitos autorais ou consumidor você não conhecia? Que situação do jogo apareceu em um estágio ou em um trabalho do curso? A opção de cada situação aparece com uma letra, para facilitar perguntas como "quem escolheu B?".</p><p><strong>Base legal.</strong> CLT (arts. 3º, 9º, 29, 41, 59, 74, 129, 134, 135, 137, 143, 157, 168, 223-B, 442-B, 468, 477 e 482); Constituição (arts. 5º e 7º) e ADCT, art. 10, II, b; Súmula 244 do TST e Súmula 403 do STJ; Lei 9.029/1995 (práticas discriminatórias na admissão); Lei 11.788/2008 (estágio); NR-7, NR-11 e NR-17; Código Civil (arts. 20, 50, 186 e 927); Código Penal (arts. 171 e 299) e Lei 8.137/1990 (arts. 1º e 7º); Lei 12.846/2013 (Lei Anticorrupção); Lei 9.609/1998 (programas de computador) e Lei 9.610/1998 (direitos autorais); Código de Defesa do Consumidor (arts. 18, 30, 35 a 37, 42, 49, 51, 66 e 71), Decreto 13.135/2026 (SAC, que substituiu o Decreto 11.034/2022) e Código do CONAR; Lei 5.768/1971 (promoções com distribuição de prêmios); Lei 13.709/2018, LGPD (arts. 5º a 7º, 11, 46 e 48) e Resolução CD/ANPD 15/2024; Lei 13.146/2015 (art. 63, acessibilidade); LC 123/2006 (Simples Nacional e MEI). As regras refletem a legislação consultada em 2026. Confira sempre a versão vigente.</p><p><strong>Simplificações do jogo.</strong> Salários, valores por serviço e custos são ilustrativos, porque variam muito por cidade, função e empresa. O salário do empregado é líquido; o 13º foi dividido em duas parcelas iguais, em novembro e dezembro. Para o prestador de serviços, o valor base de um serviço é de R$ 480, com acréscimo para boa confiança dos clientes. A empresa aberta dele é uma ME no Simples Nacional, com imposto de 6% sobre o faturado, contador de R$ 150 por mês e INSS de pró-labore de R$ 178; na vida real, a alíquota depende do anexo e do fator R, e a maior parte dos serviços administrativos não consta na lista do MEI (consta, por exemplo, o digitador independente): confira a sua no Portal do Empreendedor. O rodízio por áreas, em trimestres, é uma simplificação: na vida real, cada empresa organiza o seu. A reserva rende 0,5% ao mês e a dívida cresce 8% ao mês. As sanções reais dependem de processo e de fiscalização; no jogo, o primeiro incidente grave registrado funciona como advertência e o segundo encerra a carreira.</p><p><strong>Escolhas e recompensas.</strong> Situações de lei e de ética têm resposta certa, e o jogo carimba o acerto ou o erro. Situações de dinheiro, mercado e convivência são dilemas, marcados como tal. A nota soma Técnica (20), Confiança (20), Visão (10), Energia (10), regras
