<style>
/* Portal de jogos. Mural de fichas: cada jogo é uma ficha com a cor do seu próprio jogo. Para incluir um novo jogo, acrescente um item em JOGOS (no final do script). */
:root{

@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){

*{box-sizing:border-box}
body{background:var(--papel);color:var(--tinta);font-family:var(--f-txt);font-size:17px;line-height:1.5;-webkit-text-size-adjust:100%;

.ficha p{font-size:16.5px;color:var(--tinta)}

.jogar:hover{filter:brightness(1.08)}
.jogar:active{transform:translateY(1px)}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]) .ficha{--sobre-c:#14110D} }

.breve{font-size:15px;color:var(--tinta2);border:1.5px dashed var(--linha);border-radius:8px;padding:12px 14px}

.aula{display:flex;flex-direction:column;gap:12px}
.aula ol{margin:0;padding-left:1.2em;display:flex;flex-direction:column;gap:8px}
.aula li{max-width:60ch}
.acesso{display:flex;gap:10px;align-items:center;justify-content:space-between;flex-wrap:wrap;border:1.5px dashed var(--linha);border-radius:6px;padding:12px 14px}

.rod{margin-top:14px;padding-top:14px;border-top:1.5px dashed var(--linha);font-family:var(--f-mono);font-size:11.5px;line-height:1.55;color:var(--tinta2)}

.bloq{padding-top:40px;display:flex;flex-direction:column;gap:14px}
.bloq a{color:var(--tinta);font-weight:700;word-break:break-all}
</style></head><body>

+'"><span class="curso">'+esc(o.curso)+"</span><h3>"+esc(o.titulo)+"</h3><p>"+esc(o.texto)+'</p><ul class="chips">'+o.chips.map(o=>"<li>"+esc(o)+"</li>").join("")+'</ul><a class="jogar" href="'+esc(o.pasta)+'/">Jogar</a></li>'}function tela(){return'<header><span class="rot">Senac Franca · Jogos de simulação</span><h1 style="margin-top:12px">Escolha o <span>jogo</span> da aula</h1></header><p class="lead">Cada jogo simula o primeiro ano de uma profissão, com decisões, sorteios e a lei do ofício. Cada estudante joga no próprio celular.</p><ul class="fichas">'+JOGOS.map(ficha).join("")+'</ul><p class="breve">Novos jogos serão incluídos aqui, à medida que forem criados.</p><section class="aula"><h2>Para quem está dando a aula</h2><ol><li><strong>Escolha o jogo</strong> da turma e passe o link desta página ou o do próprio jogo. Não envie arquivo: o link oficial é o único endereço autorizado.</li><li><strong>Cada estudante joga sozinho</strong>, em 20 a 30 minutos. As vidas são sorteadas de propósito, então compare resultados no fim.</li><li><strong>Conduza a conversa depois:</strong> o que dependeu de escolha e o que dependeu do sorteio? Qual regra da profissão você não conhecia?</li></ol>'+(CFG.form?'<div class="acesso"><p><strong>Docente:</strong> registre cada turma em que aplicou um jogo.</p><a href="'+esc(CFG.form)+'" target="_blank" rel="noopener">Registrar aplicação</a></div>':"")+'<p style="font-size:15px;color:var(--tinta2)">Nenhum dado dos estudantes é coletado. O progresso de cada partida fica apenas no celular de quem joga.</p></section>'+credito()}!function(){const o=document.getElementById("raiz");if(oficialOk()){try{console.info("Jogos de simulação · "+CFG.autor+" · "+ASSINATURA+" · Todos os direitos reservados.")}catch(o){}o.innerHTML=tela()}else o.innerHTML=bloqueio()}();</script>
